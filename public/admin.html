<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>L-LIVE — სტატიის დამატება</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f6f4;
      color: #111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e1e8e4;
      padding: 22px 18px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .logo {
      font-weight: 950;
      line-height: .95;
      letter-spacing: -1.5px;
    }

    .logo-main {
      display: block;
      color: #42966c;
      font-size: 36px;
    }

    .logo-sub {
      display: block;
      margin-top: 5px;
      color: #111;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .back-button {
      padding: 11px 15px;

      border: 2px solid #dce7e1;
      border-radius: 14px;

      background: #fff;

      font-weight: 800;
    }

    .back-button:hover {
      background: #42966c;
      color: #fff;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 35px 18px 70px;
    }

    .heading {
      margin-bottom: 25px;
    }

    .heading-label {
      color: #42966c;
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 14px;
    }

    .heading h1 {
      margin: 7px 0;

      font-size: 42px;
      line-height: 1.1;

      letter-spacing: -1px;
    }

    .heading p {
      margin: 0;

      color: #69736e;
      font-size: 16px;
    }

    .form {
      background: #fff;

      border-radius: 24px;

      padding: 28px;

      box-shadow:
        0 8px 35px rgba(20, 50, 35, .06);
    }

    .field {
      margin-bottom: 22px;
    }

    .field label {
      display: block;

      margin-bottom: 8px;

      font-weight: 900;
      font-size: 15px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;

      border: 2px solid #e1e8e4;
      border-radius: 14px;

      background: #fafcfb;

      padding: 15px;

      outline: none;

      color: #111;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #42966c;
      background: #fff;
    }

    .field textarea {
      min-height: 260px;

      resize: vertical;

      line-height: 1.65;
    }

    .file-box {
      border: 2px dashed #cddbd3;

      border-radius: 17px;

      padding: 22px;

      text-align: center;

      background: #fafcfb;
    }

    .file-box input {
      border: 0;
      background: transparent;
      padding: 0;
    }

    .preview {
      margin-top: 15px;

      width: 100%;
      min-height: 180px;

      border-radius: 16px;

      border: 1px solid #e1e8e4;

      background: #eef3f0;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      color: #7c8580;
    }

    .preview img {
      width: 100%;
      max-height: 420px;

      object-fit: cover;

      display: block;
    }

    .publish {
      width: 100%;

      border: 0;

      border-radius: 15px;

      padding: 17px;

      background: #42966c;
      color: #fff;

      font-size: 18px;
      font-weight: 900;

      cursor: pointer;
    }

    .publish:hover {
      background: #347b58;
    }

    .publish:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      margin-top: 16px;

      padding: 14px;

      border-radius: 12px;

      text-align: center;

      font-weight: 800;

      display: none;
    }

    .message.success {
      display: block;

      background: #e5f5eb;
      color: #28734d;
    }

    .message.error {
      display: block;

      background: #fde9e9;
      color: #a52d2d;
    }

    .published-section {
      margin-top: 45px;
    }

    .published-section h2 {
      font-size: 28px;
      margin-bottom: 18px;
    }

    .article-list {
      display: grid;
      gap: 12px;
    }

    .article-item {
      background: #fff;

      border-radius: 18px;

      padding: 12px;

      display: flex;
      align-items: center;

      gap: 14px;
    }

    .article-item img {
      width: 90px;
      height: 70px;

      object-fit: cover;

      border-radius: 11px;
    }

    .article-item-info {
      flex: 1;
      min-width: 0;
    }

    .article-item-title {
      font-weight: 900;

      line-height: 1.3;

      margin-bottom: 5px;
    }

    .article-item-category {
      color: #42966c;

      font-size: 13px;

      font-weight: 800;
    }

    .delete {
      border: 0;

      background: #fbe7e7;
      color: #ad3030;

      border-radius: 10px;

      padding: 10px 13px;

      font-weight: 800;

      cursor: pointer;
    }

    .delete:hover {
      background: #ad3030;
      color: #fff;
    }

    .empty {
      background: #fff;

      border-radius: 18px;

      padding: 35px 20px;

      text-align: center;

      color: #7c8580;
    }

    @media (max-width: 600px) {

      header {
        padding: 18px 15px;
      }

      .logo-main {
        font-size: 30px;
      }

      .logo-sub {
        font-size: 12px;
      }

      .back-button {
        padding: 9px 11px;
        font-size: 13px;
      }

      main {
        padding: 28px 15px 60px;
      }

      .heading h1 {
        font-size: 34px;
      }

      .form {
        padding: 20px;
        border-radius: 20px;
      }

      .article-item {
        align-items: flex-start;
      }

      .article-item img {
        width: 70px;
        height: 58px;
      }

      .delete {
        padding: 8px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <a href="/" class="logo">

      <span class="logo-main">
        L-LIVE
      </span>

      <span class="logo-sub">
        SPORT NEWS
      </span>

    </a>

    <a
      href="/"
      class="back-button"
    >
      ← გაზეთი
    </a>

  </div>

</header>


<main>

  <section class="heading">

    <div class="heading-label">
      L-LIVE ADMIN
    </div>

    <h1>
      ახალი სტატია
    </h1>

    <p>
      დაამატე სათაური, ინფორმაცია, კატეგორია და სურათი.
    </p>

  </section>


  <form
    id="articleForm"
    class="form"
  >

    <div class="field">

      <label for="title">
        სტატიის სათაური
      </label>

      <input
        id="title"
        name="title"
        type="text"
        placeholder="შეიყვანე სტატიის სათაური"
        autocomplete="off"
        required
      >

    </div>


    <div class="field">

      <label for="category">
        კატეგორია
      </label>

      <select
        id="category"
        name="category"
      >

        <option value="ფეხბურთი">
          ⚽ ფეხბურთი
        </option>

        <option value="კალათბურთი">
          🏀 კალათბურთი
        </option>

        <option value="რაგბი">
          🏉 რაგბი
        </option>

        <option value="სხვა">
          სხვა
        </option>

      </select>

    </div>


    <div class="field">

      <label for="content">
        სტატიის ინფორმაცია
      </label>

      <textarea
        id="content"
        name="content"
        placeholder="დაწერე სტატიის სრული ინფორმაცია..."
        required
      ></textarea>

    </div>


    <div class="field">

      <label for="image">
        სტატიის სურათი
      </label>

      <div class="file-box">

        <input
          id="image"
          name="image"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
          required
        >

      </div>


      <div
        id="preview"
        class="preview"
      >
        სურათის წინასწარი ნახვა
      </div>

    </div>


    <button
      id="publishButton"
      type="submit"
      class="publish"
    >
      📰 სტატიის გამოქვეყნება
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </form>


  <section class="published-section">

    <h2>
      გამოქვეყნებული სტატიები
    </h2>

    <div
      id="articleList"
      class="article-list"
    >
      <div class="empty">
        სტატიები იტვირთება...
      </div>
    </div>

  </section>

</main>


<script>

const form =
  document.getElementById("articleForm");

const imageInput =
  document.getElementById("image");

const preview =
  document.getElementById("preview");

const message =
  document.getElementById("message");

const publishButton =
  document.getElementById("publishButton");

const articleList =
  document.getElementById("articleList");


/*
========================================
IMAGE PREVIEW
========================================
*/

imageInput.addEventListener(
  "change",
  function () {

    const file =
      this.files[0];

    if (!file) {

      preview.innerHTML =
        "სურათის წინასწარი ნახვა";

      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function (event) {

        preview.innerHTML = `
          <img
            src="${event.target.result}"
            alt="სურათის წინასწარი ნახვა"
          >
        `;

      };


    reader.readAsDataURL(file);

  }
);


/*
========================================
MESSAGE
========================================
*/

function showMessage(
  text,
  type
) {

  message.textContent = text;

  message.className =
    "message " + type;

}


/*
========================================
ADD ARTICLE
========================================
*/

form.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();


    const title =
      document
        .getElementById("title")
        .value
        .trim();


    const content =
      document
        .getElementById("content")
        .value
        .trim();


    const category =
      document
        .getElementById("category")
        .value;


    const image =
      imageInput.files[0];


    if (!title) {

      showMessage(
        "შეიყვანე სტატიის სათაური.",
        "error"
      );

      return;
    }


    if (!content) {

      showMessage(
        "შეიყვანე სტატიის ინფორმაცია.",
        "error"
      );

      return;
    }


    if (!image) {

      showMessage(
        "აირჩიე სტატიის სურათი.",
        "error"
      );

      return;
    }


    publishButton.disabled = true;

    publishButton.textContent =
      "⏳ ქვეყნდება...";


    const formData =
      new FormData();


    formData.append(
      "title",
      title
    );


    formData.append(
      "content",
      content
    );


    formData.append(
      "category",
      category
    );


    formData.append(
      "image",
      image
    );


    try {

      const response =
        await fetch(
          "/api/articles",
          {
            method: "POST",
            body: formData
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "სტატიის დამატება ვერ მოხერხდა."
        );

      }


      showMessage(
        "სტატია წარმატებით გამოქვეყნდა! 📰",
        "success"
      );


      form.reset();


      preview.innerHTML =
        "სურათის წინასწარი ნახვა";


      await loadArticles();


    } catch (error) {

      console.error(error);


      showMessage(
        error.message ||
        "სერვერთან დაკავშირება ვერ მოხერხდა.",
        "error"
      );

    } finally {

      publishButton.disabled = false;

      publishButton.textContent =
        "📰 სტატიის გამოქვეყნება";

    }

  }
);


/*
========================================
LOAD ARTICLES
========================================
*/

async function loadArticles() {

  try {

    const response =
      await fetch("/api/articles");


    if (!response.ok) {
      throw new Error();
    }


    const articles =
      await response.json();


    if (
      !Array.isArray(articles) ||
      articles.length === 0
    ) {

      articleList.innerHTML = `
        <div class="empty">
          ჯერ არცერთი სტატია არ გამოქვეყნებულა.
        </div>
      `;

      return;
    }


    articleList.innerHTML =
      articles
        .map(article => {

          return `

            <div class="article-item">

              <img
                src="${escapeHtml(article.image)}"
                alt=""
              >


              <div class="article-item-info">

                <div class="article-item-title">
                  ${escapeHtml(article.title)}
                </div>

                <div class="article-item-category">
                  ${escapeHtml(article.category)}
                </div>

              </div>


              <button
                class="delete"
                onclick="deleteArticle('${article.id}')"
              >
                წაშლა
              </button>

            </div>

          `;

        })
        .join("");


  } catch (error) {

    articleList.innerHTML = `
      <div class="empty">
        სტატიების ჩატვირთვა ვერ მოხერხდა.
      </div>
    `;

  }

}


/*
========================================
DELETE ARTICLE
========================================
*/

async function deleteArticle(id) {

  const confirmed =
    window.confirm(
      "ნამდვილად გინდა ამ სტატიის წაშლა?"
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/articles/" + id,
        {
          method: "DELETE"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "სტატიის წაშლა ვერ მოხერხდა."
      );

    }


    showMessage(
      "სტატია წაიშალა.",
      "success"
    );


    await loadArticles();


  } catch (error) {

    showMessage(
      error.message ||
      "სტატიის წაშლა ვერ მოხერხდა.",
      "error"
    );

  }

}


/*
========================================
HTML ESCAPE
========================================
*/

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/*
========================================
START
========================================
*/

loadArticles();

</script>

</body>
</html>
