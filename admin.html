<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>L-LIVE — სტატიის დამატება</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f6f4;
      color: #111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .page {
      max-width: 900px;
      margin: auto;
      padding: 25px 18px 60px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .logo {
      text-decoration: none;
      color: #42966c;
      font-size: 38px;
      font-weight: 950;
      letter-spacing: -2px;
    }

    .back {
      text-decoration: none;
      background: #fff;
      border: 2px solid #dce7e1;
      border-radius: 14px;
      padding: 11px 15px;
      color: #111;
      font-weight: 800;
    }

    .card {
      background: #fff;
      border-radius: 25px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(20, 50, 35, .06);
      border: 1px solid #e1e8e4;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #727b76;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 900;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 2px solid #dfe7e2;
      border-radius: 14px;
      padding: 14px;
      outline: none;
      background: #fbfcfb;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #42966c;
    }

    textarea {
      min-height: 240px;
      resize: vertical;
      line-height: 1.6;
    }

    .login-box {
      max-width: 500px;
      margin: 50px auto;
    }

    .hidden {
      display: none;
    }

    .primary {
      width: 100%;
      margin-top: 25px;
      border: 0;
      border-radius: 15px;
      padding: 15px;
      background: #42966c;
      color: white;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary {
      border: 2px solid #dce7e1;
      background: #fff;
      border-radius: 13px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .message {
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      display: none;
      white-space: pre-wrap;
    }

    .message.error {
      display: block;
      background: #ffe9e9;
      color: #a52222;
    }

    .message.success {
      display: block;
      background: #e4f5eb;
      color: #247149;
    }

    .preview {
      margin-top: 12px;
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 15px;
      display: none;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .articles {
      margin-top: 30px;
      display: grid;
      gap: 15px;
    }

    .article-item {
      background: #f7faf8;
      border: 1px solid #e0e8e3;
      border-radius: 17px;
      padding: 16px;
    }

    .article-item h3 {
      margin: 0 0 8px;
    }

    .article-meta {
      color: #78827d;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .delete {
      border: 0;
      background: #c83c3c;
      color: white;
      border-radius: 10px;
      padding: 9px 13px;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .page {
        padding: 18px 14px 50px;
      }

      .card {
        padding: 20px;
        border-radius: 20px;
      }

      h1 {
        font-size: 28px;
      }

      .logo {
        font-size: 31px;
      }

      .top {
        align-items: flex-start;
      }

      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="top">
    <a href="/" class="logo">L-LIVE</a>

    <a href="/" class="back">
      ← მთავარი
    </a>
  </div>


  <!-- LOGIN -->

  <section id="loginSection" class="card login-box">

    <h1>ადმინისტრატორი</h1>

    <p class="subtitle">
      შედი ადმინისტრატორის პაროლით.
    </p>

    <label for="password">
      პაროლი
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="შეიყვანე ადმინისტრატორის პაროლი"
    >

    <button
      id="loginButton"
      class="primary"
      type="button"
    >
      შესვლა
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </section>


  <!-- ADMIN -->

  <section
    id="adminSection"
    class="card hidden"
  >

    <div class="admin-header">

      <div>
        <h1>ახალი სტატია</h1>

        <p class="subtitle">
          დაამატე ახალი სპორტული ამბავი L-LIVE-ზე.
        </p>
      </div>

      <button
        id="logoutButton"
        class="secondary"
        type="button"
      >
        გამოსვლა
      </button>

    </div>


    <form id="articleForm">

      <label for="title">
        სათაური
      </label>

      <input
        id="title"
        name="title"
        type="text"
        maxlength="180"
        required
        placeholder="მაგ: საქართველოს ნაკრებმა მნიშვნელოვანი გამარჯვება მოიპოვა"
      >


      <label for="category">
        კატეგორია
      </label>

      <select
        id="category"
        name="category"
        required
      >
        <option value="ფეხბურთი">
          ⚽ ფეხბურთი
        </option>

        <option value="კალათბურთი">
          🏀 კალათბურთი
        </option>

        <option value="რაგბი">
          🏉 რაგბი
        </option>

        <option value="სხვა">
          სხვა
        </option>
      </select>


      <label for="text">
        სტატიის ტექსტი
      </label>

      <textarea
        id="text"
        name="text"
        maxlength="50000"
        required
        placeholder="დაწერე სტატიის სრული ინფორმაცია..."
      ></textarea>


      <label for="image">
        სტატიის ფოტო
      </label>

      <input
        id="image"
        name="image"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/gif"
        required
      >

      <img
        id="preview"
        class="preview"
        alt="ფოტოს წინასწარი ნახვა"
      >


      <button
        id="publishButton"
        class="primary"
        type="submit"
      >
        სტატიის გამოქვეყნება
      </button>

    </form>


    <div
      id="articleMessage"
      class="message"
    ></div>


    <div class="articles">

      <h2>
        გამოქვეყნებული სტატიები
      </h2>

      <div id="articleList">
        იტვირთება...
      </div>

    </div>

  </section>

</div>


<script>

  const loginSection =
    document.getElementById("loginSection");

  const adminSection =
    document.getElementById("adminSection");

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const passwordInput =
    document.getElementById("password");

  const loginMessage =
    document.getElementById("loginMessage");

  const articleMessage =
    document.getElementById("articleMessage");

  const articleForm =
    document.getElementById("articleForm");

  const publishButton =
    document.getElementById("publishButton");

  const imageInput =
    document.getElementById("image");

  const preview =
    document.getElementById("preview");

  const articleList =
    document.getElementById("articleList");


  function showMessage(element, text, type) {

    element.textContent = text;

    element.className =
      "message " + type;

  }


  function clearMessage(element) {

    element.textContent = "";

    element.className =
      "message";

  }


  async function checkAdmin() {

    try {

      const response =
        await fetch("/api/me", {
          credentials: "same-origin"
        });

      const data =
        await response.json();

      if (data.admin) {

        showAdmin();

      } else {

        showLogin();

      }

    } catch {

      showLogin();

    }

  }


  function showLogin() {

    loginSection.classList.remove("hidden");

    adminSection.classList.add("hidden");

  }


  function showAdmin() {

    loginSection.classList.add("hidden");

    adminSection.classList.remove("hidden");

    loadArticles();

  }


  loginButton.addEventListener(
    "click",
    async () => {

      clearMessage(loginMessage);

      const password =
        passwordInput.value;

      if (!password) {

        showMessage(
          loginMessage,
          "შეიყვანე პაროლი.",
          "error"
        );

        return;

      }

      loginButton.disabled = true;

      loginButton.textContent =
        "მიმდინარეობს...";


      try {

        const response =
          await fetch(
            "/api/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              credentials:
                "same-origin",

              body: JSON.stringify({
                password
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.ok) {

          throw new Error(
            data.error ||
            "შესვლა ვერ მოხერხდა."
          );

        }


        passwordInput.value = "";

        showAdmin();


      } catch (error) {

        showMessage(
          loginMessage,
          error.message ||
            "შესვლა ვერ მოხერხდა.",
          "error"
        );

      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "შესვლა";

      }

    }
  );


  logoutButton.addEventListener(
    "click",
    async () => {

      try {

        await fetch(
          "/api/logout",
          {
            method: "POST",
            credentials: "same-origin"
          }
        );

      } finally {

        showLogin();

      }

    }
  );


  imageInput.addEventListener(
    "change",
    () => {

      const file =
        imageInput.files[0];

      if (!file) {

        preview.style.display =
          "none";

        preview.removeAttribute(
          "src"
        );

        return;

      }

      const url =
        URL.createObjectURL(file);

      preview.src = url;

      preview.style.display =
        "block";

    }
  );


  articleForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearMessage(articleMessage);

      const file =
        imageInput.files[0];

      if (!file) {

        showMessage(
          articleMessage,
          "სტატიის ფოტო აუცილებელია.",
          "error"
        );

        return;

      }


      publishButton.disabled =
        true;

      publishButton.textContent =
        "იტვირთება...";


      try {

        const formData =
          new FormData(
            articleForm
          );


        const response =
          await fetch(
            "/api/articles",
            {
              method: "POST",
              body: formData,
              credentials: "same-origin"
            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.ok) {

          throw new Error(
            data.error ||
            "სტატიის დამატება ვერ მოხერხდა."
          );

        }


        articleForm.reset();

        preview.style.display =
          "none";

        preview.removeAttribute(
          "src"
        );


        showMessage(
          articleMessage,
          "სტატია წარმატებით გამოქვეყნდა.",
          "success"
        );


        await loadArticles();


      } catch (error) {

        showMessage(
          articleMessage,
          error.message ||
            "სტატიის დამატება ვერ მოხერხდა.",
          "error"
        );

      } finally {

        publishButton.disabled =
          false;

        publishButton.textContent =
          "სტატიის გამოქვეყნება";

      }

    }
  );


  async function loadArticles() {

    try {

      const response =
        await fetch(
          "/api/articles",
          {
            credentials:
              "same-origin"
          }
        );


      const data =
        await response.json();


      if (!response.ok || !data.ok) {

        throw new Error(
          data.error ||
          "სტატიების ჩატვირთვა ვერ მოხერხდა."
        );

      }


      renderArticles(
        data.articles || []
      );


    } catch (error) {

      articleList.innerHTML = `
        <div class="article-item">
          ${escapeHtml(
            error.message ||
            "სტატიების ჩატვირთვა ვერ მოხერხდა."
          )}
        </div>
      `;

    }

  }


  function renderArticles(articles) {

    if (!articles.length) {

      articleList.innerHTML = `
        <div class="article-item">
          ჯერ არცერთი სტატია არ არის გამოქვეყნებული.
        </div>
      `;

      return;

    }


    articleList.innerHTML =
      articles.map(article => {

        const date =
          new Date(
            article.createdAt
          ).toLocaleDateString(
            "ka-GE"
          );


        return `
          <div class="article-item">

            <h3>
              ${escapeHtml(
                article.title
              )}
            </h3>

            <div class="article-meta">
              ${escapeHtml(
                article.category
              )}
              ·
              ${escapeHtml(date)}
            </div>

            <button
              class="delete"
              type="button"
              onclick="deleteArticle('${escapeHtml(article.id)}')"
            >
              სტატიის წაშლა
            </button>

          </div>
        `;

      }).join("");

  }


  window.deleteArticle =
    async function(id) {

      const confirmed =
        window.confirm(
          "ნამდვილად გინდა ამ სტატიის წაშლა?"
        );

      if (!confirmed) {
        return;
      }


      try {

        const response =
          await fetch(
            "/api/articles/" +
              encodeURIComponent(id),
            {
              method: "DELETE",
              credentials:
                "same-origin"
            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.ok) {

          throw new Error(
            data.error ||
            "სტატიის წაშლა ვერ მოხერხდა."
          );

        }


        await loadArticles();


      } catch (error) {

        showMessage(
          articleMessage,
          error.message ||
            "სტატიის წაშლა ვერ მოხერხდა.",
          "error"
        );

      }

    };


  function escapeHtml(value) {

    return String(value)
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  checkAdmin();

</script>

</body>
</html>
