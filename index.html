<!DOCTYPE html>
<html lang="ka">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>L-LIVE — WORLD SPORT</title>

  <style>

    :root {
      --green: #0b8f62;
      --green-dark: #066744;
      --black: #111111;
      --white: #ffffff;
      --bg: #f3f5f4;
      --muted: #707975;
      --border: #e2e7e4;
      --red: #e53935;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--black);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      max-width: 1200px;
      margin: auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      font-size: 30px;
      font-weight: 1000;
      letter-spacing: -1.5px;
      white-space: nowrap;
      color: var(--green-dark);
    }

    .logo span {
      color: var(--black);
      font-weight: 800;
    }

    .search {
      flex: 1;
      max-width: 560px;
      margin-left: auto;
    }

    .search input {
      width: 100%;
      padding: 11px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: #fafcfb;
    }

    .search input:focus {
      border-color: var(--green);
    }

    .admin {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-weight: 850;
      white-space: nowrap;
    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    nav {
      background: var(--black);
      color: #fff;
    }

    .nav-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-inner::-webkit-scrollbar {
      display: none;
    }

    .nav button {
      border: 0;
      background: transparent;
      color: #fff;
      padding: 12px 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .nav button.active {
      background: var(--green);
    }


    /* =====================================================
       MAIN
    ===================================================== */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px 18px 60px;
    }


    /* =====================================================
       BREAKING
    ===================================================== */

    .breaking {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--red);
      color: #fff;
      border-radius: 11px;
      padding: 10px 13px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .breaking strong {
      white-space: nowrap;
    }

    .breaking a {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    /* =====================================================
       SECTION
    ===================================================== */

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 25px 0 13px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 24px;
    }

    .section-title small {
      color: var(--muted);
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(270px, 1fr);
      gap: 14px;
    }

    .hero-main {
      position: relative;
      min-height: 410px;
      overflow: hidden;
      border-radius: 18px;
      background: #18221f;
      color: #fff;
    }

    .hero-main img {
      width: 100%;
      height: 410px;
      object-fit: cover;
      display: block;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          transparent 25%,
          rgba(0,0,0,.88)
        );
    }

    .hero-content {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 25px;
    }

    .tag {
      display: inline-block;
      background: var(--green);
      color: #fff;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 950;
    }

    .hero-content h1 {
      margin: 10px 0 8px;
      font-size: clamp(27px, 4vw, 43px);
      line-height: 1.05;
    }

    .hero-content p {
      margin: 0;
      line-height: 1.5;
      opacity: .92;
    }


    /* =====================================================
       SIDE NEWS
    ===================================================== */

    .side-news {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .side-card {
      display: grid;
      grid-template-columns: 120px 1fr;
      min-height: 126px;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .side-card img {
      width: 120px;
      height: 126px;
      object-fit: cover;
    }

    .side-content {
      padding: 11px;
    }

    .side-content h3 {
      margin: 6px 0;
      font-size: 15px;
      line-height: 1.25;
    }


    /* =====================================================
       META
    ===================================================== */

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .category {
      color: var(--green-dark);
      font-weight: 900;
    }


    /* =====================================================
       ARTICLE GRID
    ===================================================== */

    .article-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .article-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 15px;
      transition:
        transform .15s,
        box-shadow .15s;
    }

    .article-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .article-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }

    .article-body {
      padding: 13px;
    }

    .article-body h3 {
      margin: 8px 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .article-body p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }


    /* =====================================================
       ARTICLE PAGE
    ===================================================== */

    .article-page {
      max-width: 900px;
      margin: auto;
    }

    .article-page .main-image {
      width: 100%;
      max-height: 560px;
      object-fit: cover;
      border-radius: 18px;
    }

    .article-page h1 {
      margin: 15px 0 10px;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.05;
    }

    .article-excerpt {
      margin-top: 15px;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.55;
    }

    .article-content {
      margin-top: 24px;
      font-size: 17px;
      line-height: 1.85;
      white-space: pre-wrap;
    }

    .source-box {
      margin-top: 25px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--muted);
      background: #fff;
    }


    /* =====================================================
       ADMIN
    ===================================================== */

    .admin-page {
      max-width: 1000px;
      margin: auto;
    }

    .admin-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      font-weight: 900;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    .field textarea {
      min-height: 190px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 900;
    }

    .btn-green {
      background: var(--green);
      color: #fff;
    }

    .btn-dark {
      background: var(--black);
      color: #fff;
    }

    .btn-red {
      background: var(--red);
      color: #fff;
    }

    .btn-light {
      background: #eef2f0;
      color: var(--black);
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .admin-article {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      padding: 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .admin-article img {
      width: 100px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }


    /* =====================================================
       EMPTY
    ===================================================== */

    .empty {
      padding: 50px 20px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--muted);
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    footer {
      padding: 32px 18px;
      background: var(--black);
      color: #cfd6d3;
      text-align: center;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 820px) {

      .header-top {
        flex-wrap: wrap;
      }

      .search {
        order: 3;
        flex-basis: 100%;
        max-width: none;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .article-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    @media (max-width: 560px) {

      .header-top {
        padding: 11px 13px;
      }

      .logo {
        font-size: 25px;
      }

      main {
        padding:
          14px 12px 45px;
      }

      .article-grid {
        grid-template-columns: 1fr;
      }

      .hero-main,
      .hero-main img {
        min-height: 330px;
        height: 330px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .admin-article {
        grid-template-columns: 70px 1fr;
      }

      .admin-article img {
        width: 70px;
        height: 60px;
      }

      .admin-article .actions {
        grid-column: 1 / -1;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-top">

    <a
      href="#/"
      class="logo"
    >
      L-LIVE <span>WORLD SPORT</span>
    </a>


    <div class="search">

      <input
        id="searchInput"
        type="search"
        placeholder="მოძებნე სპორტული ამბავი..."
      >

    </div>


    <a
      href="#/admin"
      class="admin"
    >
      🔐 Admin
    </a>

  </div>


  <nav>

    <div class="nav-inner">

      <button
        class="active"
        data-category="all"
      >
        მთავარი
      </button>

      <button
        data-category="latest"
      >
        🔥 ბოლო ამბები
      </button>

      <button
        data-category="football"
      >
        ⚽ ფეხბურთი
      </button>

      <button
        data-category="basketball"
      >
        🏀 კალათბურთი
      </button>

      <button
        data-category="tennis"
      >
        🎾 ჩოგბურთი
      </button>

      <button
        data-category="rugby"
      >
        🏉 რაგბი
      </button>

      <button
        data-category="motorsport"
      >
        🏎️ ავტოსპორტი
      </button>

      <button
        data-category="other"
      >
        🏆 სხვა
      </button>

    </div>

  </nav>

</header>


<main id="app">

  <div class="empty">
    იტვირთება...
  </div>

</main>


<footer>

  <strong>
    L-LIVE
  </strong>

  <div style="margin-top:6px">
    WORLD SPORT
  </div>

  <div
    style="margin-top:10px;font-size:12px"
  >
    სპორტული ონლაინ გაზეთი
  </div>

</footer>


<script>

  const state = {
    articles: [],
    category: "all",
    editingId: null,
    admin: false
  };


  const categories = {
    football: "⚽ ფეხბურთი",
    basketball: "🏀 კალათბურთი",
    tennis: "🎾 ჩოგბურთი",
    rugby: "🏉 რაგბი",
    motorsport: "🏎️ ავტოსპორტი",
    combat: "🥊 საბრძოლო სპორტი",
    other: "🏆 სხვა სპორტი"
  };


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function formatDate(value) {

    if (!value) {
      return "";
    }

    try {

      return new Date(value)
        .toLocaleString(
          "ka-GE",
          {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          }
        );

    } catch {

      return "";

    }

  }


  function imageFor(article) {

    if (
      article &&
      article.image &&
      (
        article.image.startsWith("http://") ||
        article.image.startsWith("https://")
      )
    ) {

      return article.image;

    }

    return (
      "https://placehold.co/1200x700/10201a/ffffff?text=" +
      encodeURIComponent(
        article?.title || "L-LIVE"
      )
    );

  }


  async function request(
    url,
    options = {}
  ) {

    const response =
      await fetch(
        url,
        options
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "მოთხოვნა ვერ შესრულდა"
      );

    }


    return data;

  }


  async function loadArticles() {

    try {

      const data =
        await request(
          "/api/articles"
        );


      state.articles =
        Array.isArray(
          data.articles
        )
          ? data.articles
          : [];


      render();

    } catch (error) {

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="empty">

          <h2>
            მონაცემების ჩატვირთვა ვერ მოხერხდა
          </h2>

          <p>
            ${escapeHtml(
              error.message
            )}
          </p>

        </div>

      `;

    }

  }


  function categoryName(id) {

    return (
      categories[id] ||
      "🏆 სპორტი"
    );

  }


  function articleCard(article) {

    return `

      <a
        class="article-card"
        href="#/article/${encodeURIComponent(article.id)}"
      >

        <img
          src="${escapeHtml(imageFor(article))}"
          alt=""
          onerror="this.style.display='none'"
        >

        <div class="article-body">

          <div class="meta">

            <span class="category">
              ${escapeHtml(
                categoryName(article.category)
              )}
            </span>

            <span>
              ${escapeHtml(
                formatDate(article.publishedAt)
              )}
            </span>

          </div>

          <h3>
            ${escapeHtml(article.title)}
          </h3>

          <p>
            ${escapeHtml(
              article.excerpt ||
              String(article.content || "")
                .slice(0, 160)
            )}
          </p>

        </div>

      </a>

    `;

  }


  function renderHome() {

    const all =
      state.articles;


    let articles =
      [...all];


    if (
      state.category !== "all" &&
      state.category !== "latest"
    ) {

      articles =
        articles.filter(
          article =>
            article.category ===
            state.category
        );

    }


    const featured =
      all.find(
        article =>
          article.featured
      ) ||
      all[0];


    const breaking =
      all.find(
        article =>
          article.breaking
      );


    const side =
      all
        .filter(
          article =>
            !featured ||
            article.id !==
              featured.id
        )
        .slice(0, 3);


    const cards =
      articles
        .filter(
          article =>
            !featured ||
            article.id !==
              featured.id
        )
        .slice(0, 12);


    document.getElementById(
      "app"
    ).innerHTML = `

      <div>

        ${
          breaking
            ? `

              <div class="breaking">

                <strong>
                  BREAKING
                </strong>

                <a
                  href="#/article/${encodeURIComponent(
                    breaking.id
                  )}"
                >
                  ${escapeHtml(
                    breaking.title
                  )}
                </a>

              </div>

            `
            : ""
        }


        ${
          featured
            ? `

              <div class="hero">

                <a
                  class="hero-main"
                  href="#/article/${encodeURIComponent(
                    featured.id
                  )}"
                >

                  <img
                    src="${escapeHtml(
                      imageFor(featured)
                    )}"
                    alt=""
                    onerror="this.style.display='none'"
                  >

                  <div class="hero-overlay"></div>

                  <div class="hero-content">

                    <span class="tag">
                      ${escapeHtml(
                        categoryName(
                          featured.category
                        )
                      )}
                    </span>

                    <h1>
                      ${escapeHtml(
                        featured.title
                      )}
                    </h1>

                    <p>
                      ${escapeHtml(
                        featured.excerpt ||
                        String(
                          featured.content || ""
                        ).slice(0, 200)
                      )}
                    </p>

                  </div>

                </a>


                <div class="side-news">

                  ${
                    side.length
                      ? side
                          .map(
                            article => `

                              <a
                                class="side-card"
                                href="#/article/${encodeURIComponent(
                                  article.id
                                )}"
                              >

                                <img
                                  src="${escapeHtml(
                                    imageFor(article)
                                  )}"
                                  alt=""
                                >

                                <div class="side-content">

                                  <div class="meta">

                                    <span class="category">
                                      ${escapeHtml(
                                        categoryName(
                                          article.category
                                        )
                                      )}
                                    </span>

                                    <span>
                                      ${escapeHtml(
                                        formatDate(
                                          article.publishedAt
                                        )
                                      )}
                                    </span>

                                  </div>

                                  <h3>
                                    ${escapeHtml(
                                      article.title
                                    )}
                                  </h3>

                                </div>

                              </a>

                            `
                          )
                          .join("")
                      : `

                        <div class="empty">
                          ახალი ამბები მალე დაემატება.
                        </div>

                      `
                  }

                </div>

              </div>

            `
            : `

              <div class="empty">

                <h2>
                  L-LIVE — WORLD SPORT
                </h2>

                <p>
                  ჯერ არცერთი სტატია არ არის გამოქვეყნებული.
                </p>

              </div>

            `
        }


        <div class="section-title">

          <h2>
            📰 ბოლო ამბები
          </h2>

          <small>
            ${articles.length} სტატია
          </small>

        </div>


        <div class="article-grid">

          ${
            cards.length
              ? cards
                  .map(articleCard)
                  .join("")
              : `

                <div
                  class="empty"
                  style="grid-column:1/-1"
                >

                  ამ კატეგორიაში სტატია ჯერ არ არის.

                </div>

              `
          }

        </div>

      </div>

    `;

  }


  function renderArticle(id) {

    const article =
      state.articles.find(
        item =>
          item.id === id
      );


    if (!article) {

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="empty">

          <h2>
            სტატია ვერ მოიძებნა
          </h2>

          <a
            href="#/"
            class="btn btn-green"
          >
            ← მთავარზე დაბრუნება
          </a>

        </div>

      `;

      return;

    }


    document.getElementById(
      "app"
    ).innerHTML = `

      <article class="article-page">

        <div class="actions">

          <a
            href="#/"
            class="btn btn-light"
          >
            ← უკან
          </a>

        </div>


        <div style="margin-top:15px">

          <span class="tag">
            ${escapeHtml(
              categoryName(
                article.category
              )
            )}
          </span>

        </div>


        <h1>
          ${escapeHtml(
            article.title
          )}
        </h1>


        <div class="meta">

          <span>
            ${escapeHtml(
              formatDate(
                article.publishedAt
              )
            )}
          </span>

          ${
            article.source
              ? `
                <span>
                  წყარო:
                  ${escapeHtml(
                    article.source
                  )}
                </span>
              `
              : ""
          }

        </div>


        <img
          class="main-image"
          style="margin-top:15px"
          src="${escapeHtml(
            imageFor(article)
          )}"
          alt=""
        >


        ${
          article.excerpt
            ? `

              <div class="article-excerpt">

                ${escapeHtml(
                  article.excerpt
                )}

              </div>

            `
            : ""
        }


        <div class="article-content">

          ${escapeHtml(
            article.content
          )}

        </div>


        ${
          article.source
            ? `

              <div class="source-box">

                წყარო:
                <strong>
                  ${escapeHtml(
                    article.source
                  )}
                </strong>

              </div>

            `
            : ""
        }

      </article>

    `;

  }


  function renderLogin() {

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="admin-page">

        <div class="section-title">

          <h2>
            🔐 L-LIVE Admin
          </h2>

        </div>


        <div class="admin-box">

          <h3>
            ადმინისტრატორის შესვლა
          </h3>

          <p>
            აქედან შეგიძლია დაამატო და მართო სტატიები.
          </p>


          <div class="field">

            <label>
              პაროლი
            </label>

            <input
              id="adminPassword"
              type="password"
              placeholder="შეიყვანე პაროლი"
            >

          </div>


          <div
            id="loginError"
            style="color:#c62828;margin-top:10px"
          ></div>


          <div class="actions">

            <button
              class="btn btn-green"
              onclick="loginAdmin()"
            >
              შესვლა
            </button>

            <a
              href="#/"
              class="btn btn-light"
            >
              ← მთავარი
            </a>

          </div>

        </div>

      </div>

    `;

  }


  function renderAdmin() {

    if (!state.admin) {

      renderLogin();

      return;

    }


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="admin-page">

        <div class="section-title">

          <h2>
            🔐 L-LIVE Admin
          </h2>

          <button
            class="btn btn-dark"
            onclick="logoutAdmin()"
          >
            გასვლა
          </button>

        </div>


        <div class="admin-box">

          <h2>
            ${state.editingId
              ? "სტატიის რედაქტირება"
              : "ახალი სტატიის დამატება"}
          </h2>


          <form
            onsubmit="saveArticle(event)"
          >

            <div class="form-grid">


              <div class="field full">

                <label>
                  სათაური *
                </label>

                <input
                  id="title"
                  required
                  placeholder="სტატიის სათაური"
                >

              </div>


              <div class="field">

                <label>
                  სპორტი
                </label>

                <select id="category">

                  <option value="football">
                    ⚽ ფეხბურთი
                  </option>

                  <option value="basketball">
                    🏀 კალათბურთი
                  </option>

                  <option value="tennis">
                    🎾 ჩოგბურთი
                  </option>

                  <option value="rugby">
                    🏉 რაგბი
                  </option>

                  <option value="motorsport">
                    🏎️ ავტოსპორტი
                  </option>

                  <option value="combat">
                    🥊 საბრძოლო სპორტი
                  </option>

                  <option value="other">
                    🏆 სხვა სპორტი
                  </option>

                </select>

              </div>


              <div class="field">

                <label>
                  წყარო
                </label>

                <input
                  id="source"
                  placeholder="მაგ: Reuters"
                >

              </div>


              <div class="field full">

                <label>
                  ფოტოს URL
                </label>

                <input
                  id="image"
                  placeholder="https://..."
                >

              </div>


              <div class="field full">

                <label>
                  მოკლე აღწერა
                </label>

                <textarea
                  id="excerpt"
                  style="min-height:100px"
                  placeholder="სტატიის მოკლე შესავალი..."
                ></textarea>

              </div>


              <div class="field full">

                <label>
                  სრული სტატია *
                </label>

                <textarea
                  id="content"
                  required
                  placeholder="დაწერე სტატიის სრული ტექსტი..."
                ></textarea>

              </div>


              <div class="field full">

                <div class="checks">

                  <label>
                    <input
                      id="breaking"
                      type="checkbox"
                    >
                    🔥 Breaking News
                  </label>


                  <label>
                    <input
                      id="featured"
                      type="checkbox"
                    >
                    ⭐ მთავარი ამბავი
                  </label>

                </div>

              </div>

            </div>


            <div class="actions">

              <button
                type="submit"
                class="btn btn-green"
              >
                ${
                  state.editingId
                    ? "შენახვა"
                    : "გამოქვეყნება"
                }
              </button>


              <button
                type="button"
                class="btn btn-light"
                onclick="clearForm()"
              >
                გასუფთავება
              </button>

            </div>

          </form>

        </div>


        <div class="section-title">

          <h2>
            გამოქვეყნებული სტატიები
          </h2>

        </div>


        <div>

          ${
            state.articles.length
              ? state.articles
                  .map(
                    article => `

                      <div class="admin-article">

                        <img
                          src="${escapeHtml(
                            imageFor(article)
                          )}"
                          alt=""
                        >

                        <div>

                          <h3>
                            ${escapeHtml(
                              article.title
                            )}
                          </h3>

                          <div class="meta">

                            <span>
                              ${escapeHtml(
                                categoryName(
                                  article.category
                                )
                              )}
                            </span>

                            <span>
                              ${escapeHtml(
                                formatDate(
                                  article.publishedAt
                                )
                              )}
                            </span>

                          </div>

                        </div>


                        <div class="actions">

                          <button
                            class="btn btn-light"
                            onclick="editArticle('${escapeHtml(
                              article.id
                            )}')"
                          >
                            ✏️
                          </button>

                          <button
                            class="btn btn-red"
                            onclick="deleteArticle('${escapeHtml(
                              article.id
                            )}')"
                          >
                            🗑️
                          </button>

                        </div>

                      </div>

                    `
                  )
                  .join("")
              : `

                <div class="empty">

                  ჯერ არცერთი სტატია არ არის.

                </div>

              `
          }

        </div>

      </div>

    `;


    if (state.editingId) {

      const article =
        state.articles.find(
          item =>
            item.id ===
            state.editingId
        );


      if (article) {

        document.getElementById(
          "title"
        ).value =
          article.title || "";


        document.getElementById(
          "category"
        ).value =
          article.category || "other";


        document.getElementById(
          "source"
        ).value =
          article.source || "";


        document.getElementById(
          "image"
        ).value =
          article.image || "";


        document.getElementById(
          "excerpt"
        ).value =
          article.excerpt || "";


        document.getElementById(
          "content"
        ).value =
          article.content || "";


        document.getElementById(
          "breaking"
        ).checked =
          Boolean(
            article.breaking
          );


        document.getElementById(
          "featured"
        ).checked =
          Boolean(
            article.featured
          );

      }

    }

  }


  function loginAdmin() {

    const password =
      document.getElementById(
        "adminPassword"
      ).value;


    if (
      password !==
      "llive2026"
    ) {

      document.getElementById(
        "loginError"
      ).textContent =
        "პაროლი არასწორია.";

      return;

    }


    state.admin = true;

    renderAdmin();

  }


  function logoutAdmin() {

    state.admin = false;
    state.editingId = null;

    location.hash = "#/";

  }


  function clearForm() {

    state.editingId = null;

    renderAdmin();

  }


  async function saveArticle(event) {

    event.preventDefault();


    const payload = {

      title:
        document.getElementById(
          "title"
        ).value,

      category:
        document.getElementById(
          "category"
        ).value,

      source:
        document.getElementById(
          "source"
        ).value,

      image:
        document.getElementById(
          "image"
        ).value,

      excerpt:
        document.getElementById(
          "excerpt"
        ).value,

      content:
        document.getElementById(
          "content"
        ).value,

      breaking:
        document.getElementById(
          "breaking"
        ).checked,

      featured:
        document.getElementById(
          "featured"
        ).checked

    };


    try {

      await request(

        state.editingId
          ? "/api/articles/" +
            encodeURIComponent(
              state.editingId
            )
          : "/api/articles",

        {

          method:
            state.editingId
              ? "PUT"
              : "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


      state.editingId = null;


      await loadArticles();


      renderAdmin();


      alert(
        "სტატია წარმატებით შეინახა."
      );


    } catch (error) {

      alert(
        error.message
      );

    }

  }


  function editArticle(id) {

    const article =
      state.articles.find(
        item =>
          item.id === id
      );


    if (!article) {
      return;
    }


    state.editingId = id;

    renderAdmin();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  async function deleteArticle(id) {

    const ok =
      confirm(
        "ნამდვილად გინდა ამ სტატიის წაშლა?"
      );


    if (!ok) {
      return;
    }


    try {

      await request(
        "/api/articles/" +
        encodeURIComponent(id),
        {
          method: "DELETE"
        }
      );


      await loadArticles();


      if (state.admin) {
        renderAdmin();
      }

    } catch (error) {

      alert(
        error.message
      );

    }

  }


  async function searchArticles(query) {

    if (!query) {

      renderHome();

      return;

    }


    try {

      const data =
        await request(
          "/api/search?q=" +
          encodeURIComponent(query)
        );


      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="section-title">

          <h2>
            🔎 ძებნა
          </h2>

          <small>
            ${data.count} შედეგი
          </small>

        </div>


        <div class="article-grid">

          ${
            data.articles.length
              ? data.articles
                  .map(articleCard)
                  .join("")
              : `

                <div
                  class="empty"
                  style="grid-column:1/-1"
                >

                  ძებნის შედეგად სტატია ვერ მოიძებნა.

                </div>

              `
          }

        </div>

      `;

    } catch (error) {

      alert(
        error.message
      );

    }

  }


  function router() {

    const hash =
      location.hash || "#/";


    if (
      hash.startsWith(
        "#/article/"
      )
    ) {

      const id =
        decodeURIComponent(
          hash.substring(
            "#/article/".length
          )
        );


      renderArticle(id);

      return;

    }


    if (
      hash === "#/admin"
    ) {

      renderAdmin();

      return;

    }


    renderHome();

  }


  document
    .querySelectorAll(
      "[data-category]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            state.category =
              button.dataset.category;


            document
              .querySelectorAll(
                "[data-category]"
              )
              .forEach(
                item => {

                  item.classList.toggle(
                    "active",
                    item === button
                  );

                }
              );


            location.hash = "#/";

            renderHome();

          }
        );

      }
    );


  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          searchArticles(
            event.target.value.trim()
          );

        }

      }
    );


  window.addEventListener(
    "hashchange",
    router
  );


  loadArticles();

</script>


</body>
</html>
