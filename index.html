<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>L-LIVE — სპორტის ცოცხალი შედეგები</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Arial, sans-serif;
      background: #0b1018;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #111a28, #0b111b);
      padding: 22px 16px 18px;
      border-bottom: 1px solid #263243;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #39a0ff;
    }

    .subtitle {
      color: #8d99aa;
      margin-top: 4px;
      font-size: 14px;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: #8d99aa;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #32d583;
      border-radius: 50%;
      box-shadow: 0 0 10px #32d583;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 18px 14px 50px;
    }

    .hero {
      background: linear-gradient(135deg, #14243a, #101927);
      border: 1px solid #263b55;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 24px;
      margin-bottom: 7px;
    }

    .hero p {
      color: #9ca9ba;
      line-height: 1.5;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
    }

    .filter {
      flex: 0 0 auto;
      border: 1px solid #293647;
      background: #121a26;
      color: #aeb8c7;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
    }

    .filter.active {
      background: #1677ff;
      border-color: #1677ff;
      color: white;
      font-weight: 700;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 2px 10px;
    }

    .section-title h2 {
      font-size: 20px;
    }

    .count {
      color: #8290a3;
      font-size: 13px;
    }

    .matches {
      display: grid;
      gap: 12px;
    }

    .match {
      background: #121923;
      border: 1px solid #253142;
      border-radius: 18px;
      padding: 16px;
      cursor: pointer;
      transition: .2s;
    }

    .match:hover {
      border-color: #398fff;
      transform: translateY(-1px);
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .competition {
      color: #8e9bad;
      font-size: 12px;
    }

    .live {
      color: #ff4d67;
      font-size: 12px;
      font-weight: 800;
      background: rgba(255, 77, 103, .12);
      padding: 5px 8px;
      border-radius: 8px;
    }

    .upcoming {
      color: #55a7ff;
      font-size: 12px;
      font-weight: 700;
    }

    .finished {
      color: #52d18a;
      font-size: 12px;
      font-weight: 700;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 70px 1fr;
      align-items: center;
      gap: 10px;
    }

    .team {
      font-size: 17px;
      font-weight: 700;
    }

    .team.away {
      text-align: right;
    }

    .score {
      text-align: center;
      font-size: 23px;
      font-weight: 900;
    }

    .time {
      text-align: center;
      font-size: 13px;
      color: #8d99aa;
      margin-top: 4px;
    }

    .date-row {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #202b39;
      color: #8794a6;
      font-size: 12px;
      text-align: center;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      background: #111923;
      border: 1px solid #243040;
      border-radius: 18px;
      color: #8996a8;
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #8c99aa;
    }

    .error {
      background: #28151a;
      border: 1px solid #5b2730;
      color: #ff9baa;
      padding: 18px;
      border-radius: 15px;
      line-height: 1.5;
    }

    .source {
      margin-top: 10px;
      font-size: 11px;
      color: #657386;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 650px;
      background: #111923;
      border: 1px solid #2a384a;
      border-radius: 24px 24px 0 0;
      padding: 22px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .close {
      float: right;
      border: 0;
      background: #222d3b;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .modal h2 {
      font-size: 25px;
      margin: 10px 45px 6px 0;
    }

    .modal-sub {
      color: #8d99aa;
      margin-bottom: 25px;
    }

    .big-score {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      font-size: 38px;
      font-weight: 900;
      margin: 25px 0;
    }

    .big-team {
      width: 40%;
      text-align: center;
      font-size: 16px;
    }

    .big-number {
      min-width: 80px;
      text-align: center;
    }

    .info {
      background: #18222f;
      border-radius: 14px;
      padding: 15px;
      margin-top: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      color: #aab5c4;
    }

    .info-row strong {
      color: white;
    }

    .refresh {
      border: 1px solid #2c4057;
      background: #142235;
      color: #76b8ff;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
    }

    @media (min-width: 700px) {
      .matches {
        grid-template-columns: 1fr 1fr;
      }

      .modal-bg {
        align-items: center;
      }

      .modal {
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      L-<span>LIVE</span> ⚽
    </div>

    <div class="subtitle">
      ქართული სპორტის ცოცხალი შედეგები
    </div>

    <div class="status-line">
      <div class="status-dot"></div>
      <span id="connectionText">მონაცემები იტვირთება...</span>
    </div>

  </div>
</header>

<main>

  <section class="hero">
    <h1>მატჩები და შედეგები</h1>

    <p>
      მიმდინარე, მომავალი და დასრულებული მატჩები
      ერთ სივრცეში.
    </p>
  </section>

  <div class="filters">

    <button class="filter active" data-filter="all">
      ყველა
    </button>

    <button class="filter" data-filter="live">
      🔴 LIVE
    </button>

    <button class="filter" data-filter="upcoming">
      მომავალი
    </button>

    <button class="filter" data-filter="finished">
      დასრულებული
    </button>

  </div>

  <div class="section-title">

    <h2 id="sectionTitle">
      ყველა მატჩი
    </h2>

    <div style="display:flex;align-items:center;gap:8px">

      <span class="count" id="matchCount">
        0 მატჩი
      </span>

      <button class="refresh" onclick="loadMatches()">
        ↻ განახლება
      </button>

    </div>

  </div>

  <div id="content">

    <div class="loading">
      მატჩების ჩატვირთვა...
    </div>

  </div>

</main>


<!-- MATCH DETAIL -->

<div class="modal-bg" id="modalBg">

  <div class="modal">

    <button class="close" onclick="closeModal()">
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<script>

  let allMatches = [];
  let currentFilter = "all";


  /* --------------------------------
     თარიღი
  -------------------------------- */

  function formatDate(dateString) {

    if (!dateString) {
      return "";
    }

    const parts = dateString.split("-");

    if (parts.length !== 3) {
      return dateString;
    }

    const months = [
      "იანვარი",
      "თებერვალი",
      "მარტი",
      "აპრილი",
      "მაისი",
      "ივნისი",
      "ივლისი",
      "აგვისტო",
      "სექტემბერი",
      "ოქტომბერი",
      "ნოემბერი",
      "დეკემბერი"
    ];

    const month = Number(parts[1]) - 1;

    return `${Number(parts[2])} ${months[month]} ${parts[0]}`;
  }


  /* --------------------------------
     სტატუსი
  -------------------------------- */

  function statusHTML(match) {

    if (match.status === "live") {

      return `
        <span class="live">
          🔴 LIVE
        </span>
      `;

    }

    if (match.status === "finished") {

      return `
        <span class="finished">
          დასრულდა
        </span>
      `;

    }

    if (match.status === "postponed") {

      return `
        <span style="color:#ffc857">
          გადადებულია
        </span>
      `;

    }

    return `
      <span class="upcoming">
        მომავალი
      </span>
    `;
  }


  /* --------------------------------
     ფილტრი
  -------------------------------- */

  function filteredMatches() {

    if (currentFilter === "all") {
      return allMatches;
    }

    return allMatches.filter(
      match => match.status === currentFilter
    );
  }


  /* --------------------------------
     მატჩის ბარათი
  -------------------------------- */

  function createMatchCard(match) {

    let score = "—";

    if (
      match.homeScore !== undefined &&
      match.awayScore !== undefined
    ) {

      score =
        `${match.homeScore} : ${match.awayScore}`;

    }

    if (match.status === "live") {

      score =
        `${match.homeScore ?? 0} : ${match.awayScore ?? 0}`;

    }

    return `
      <div
        class="match"
        onclick="openMatch('${escapeHTML(match.id)}')"
      >

        <div class="match-top">

          <div class="competition">
            ${escapeHTML(match.competition || "ფეხბურთი")}
          </div>

          ${statusHTML(match)}

        </div>


        <div class="teams">

          <div class="team">
            ${escapeHTML(match.home || "მასპინძელი")}
          </div>

          <div>
            <div class="score">
              ${score}
            </div>

            <div class="time">
              ${match.kickoff || ""}
            </div>
          </div>

          <div class="team away">
            ${escapeHTML(match.away || "სტუმარი")}
          </div>

        </div>


        <div class="date-row">
          ${formatDate(match.date)}
        </div>


        <div class="source">
          წყარო: ${escapeHTML(match.source || "L-LIVE")}
        </div>

      </div>
    `;
  }


  /* --------------------------------
     მთავარი render
  -------------------------------- */

  function render() {

    const content =
      document.getElementById("content");

    const list =
      filteredMatches();

    document.getElementById("matchCount").textContent =
      `${list.length} მატჩი`;


    if (currentFilter === "live") {

      document.getElementById("sectionTitle").textContent =
        "🔴 LIVE მატჩები";

    } else if (currentFilter === "upcoming") {

      document.getElementById("sectionTitle").textContent =
        "მომავალი მატჩები";

    } else if (currentFilter === "finished") {

      document.getElementById("sectionTitle").textContent =
        "დასრულებული მატჩები";

    } else {

      document.getElementById("sectionTitle").textContent =
        "ყველა მატჩი";

    }


    if (!list.length) {

      content.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ⚽
          </div>

          <div>
            ამ კატეგორიაში მატჩები ჯერ არ არის
          </div>

        </div>

      `;

      return;
    }


    content.innerHTML = `

      <div class="matches">

        ${list.map(createMatchCard).join("")}

      </div>

    `;
  }


  /* --------------------------------
     API
  -------------------------------- */

  async function loadMatches() {

    const connection =
      document.getElementById("connectionText");

    try {

      connection.textContent =
        "მონაცემების განახლება...";


      const response =
        await fetch(
          "/api/matches?time=" + Date.now(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "API error: " + response.status
        );

      }


      const data =
        await response.json();


      if (!Array.isArray(data)) {

        throw new Error(
          "API-მ სია არ დააბრუნა"
        );

      }


      allMatches = data;


      connection.textContent =
        `განახლებულია • ${allMatches.length} მატჩი`;


      render();


    } catch (error) {

      console.error(
        "L-LIVE API ERROR:",
        error
      );


      connection.textContent =
        "მონაცემების ჩატვირთვა ვერ მოხერხდა";


      document.getElementById("content").innerHTML = `

        <div class="error">

          <strong>
            ⚠️ მონაცემებთან დაკავშირების პრობლემა
          </strong>

          <br><br>

          სერვერი მუშაობს, მაგრამ მატჩების
          მონაცემები ამ მომენტში ვერ ჩაიტვირთა.

          <br><br>

          დააჭირე
          <strong>↻ განახლება</strong>-ს
          ხელახლა საცდელად.

        </div>

      `;

    }

  }


  /* --------------------------------
     დეტალები
  -------------------------------- */

  function openMatch(id) {

    const match =
      allMatches.find(
        item => item.id === id
      );


    if (!match) {
      return;
    }


    let score = "—";

    if (
      match.homeScore !== undefined &&
      match.awayScore !== undefined
    ) {

      score =
        `${match.homeScore} : ${match.awayScore}`;

    }


    document.getElementById("modalContent").innerHTML = `

      <div class="competition">
        ${escapeHTML(match.competition || "ფეხბურთი")}
      </div>

      <h2>
        ${escapeHTML(match.home || "")}
        —
        ${escapeHTML(match.away || "")}
      </h2>

      <div class="modal-sub">
        ${statusText(match)}
      </div>


      <div class="big-score">

        <div class="big-team">
          ${escapeHTML(match.home || "")}
        </div>

        <div class="big-number">
          ${score}
        </div>

        <div class="big-team">
          ${escapeHTML(match.away || "")}
        </div>

      </div>


      <div class="info">

        <div class="info-row">
          <span>თარიღი</span>
          <strong>
            ${formatDate(match.date)}
          </strong>
        </div>

        <div class="info-row">
          <span>დაწყება</span>
          <strong>
            ${match.kickoff || "დრო მითითებული არ არის"}
          </strong>
        </div>

        <div class="info-row">
          <span>სპორტი</span>
          <strong>
            ${escapeHTML(match.sport || "football")}
          </strong>
        </div>

        <div class="info-row">
          <span>წყარო</span>
          <strong>
            ${escapeHTML(match.source || "L-LIVE")}
          </strong>
        </div>

      </div>

      ${
        match.sourceUrl
          ? `
            <div style="margin-top:15px">

              <a
                href="${escapeAttribute(match.sourceUrl)}"
                target="_blank"
                rel="noopener noreferrer"
                style="
                  display:block;
                  text-align:center;
                  background:#1677ff;
                  color:white;
                  padding:13px;
                  border-radius:12px;
                  text-decoration:none;
                  font-weight:700;
                "
              >
                ოფიციალურ წყაროზე გადასვლა
              </a>

            </div>
          `
          : ""
      }

    `;


    document
      .getElementById("modalBg")
      .classList.add("show");

  }


  function statusText(match) {

    if (match.status === "live") {
      return "🔴 მატჩი მიმდინარეობს";
    }

    if (match.status === "finished") {
      return "მატჩი დასრულებულია";
    }

    if (match.status === "postponed") {
      return "მატჩი გადადებულია";
    }

    return `${formatDate(match.date)} • ${match.kickoff || "დრო უცნობია"}`;
  }


  function closeModal() {

    document
      .getElementById("modalBg")
      .classList.remove("show");

  }


  document
    .getElementById("modalBg")
    .addEventListener(
      "click",
      function(event) {

        if (event.target === this) {
          closeModal();
        }

      }
    );


  /* --------------------------------
     ფილტრები
  -------------------------------- */

  document
    .querySelectorAll(".filter")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(".filter")
            .forEach(
              item => item.classList.remove("active")
            );


          this.classList.add("active");


          currentFilter =
            this.dataset.filter;


          render();

        }
      );

    });


  /* --------------------------------
     უსაფრთხო ტექსტი
  -------------------------------- */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return String(value ?? "")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* --------------------------------
     პირველი ჩატვირთვა
  -------------------------------- */

  loadMatches();


  /* --------------------------------
     ავტომატური განახლება
     ყოველ 60 წამში
  -------------------------------- */

  setInterval(
    loadMatches,
    60000
  );

</script>

</body>
</html>
