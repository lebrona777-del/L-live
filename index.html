<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L-LIVE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#06171d;
  color:#f4f7f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.app{
  max-width:980px;
  margin:auto;
  min-height:100vh;
  background:#06171d;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:#04131a;
  padding:42px 18px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #102d35;
}

.logo{
  font-size:34px;
  font-weight:950;
  letter-spacing:-2px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#102d35;
  color:#fff;
  font-size:20px;
}

/* SPORTS */

.sports{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:12px;
  background:#071d25;
  border-bottom:1px solid #12343d;
}

.sport{
  flex:0 0 auto;
  padding:12px 18px;
  border-radius:25px;
  background:#102f38;
  color:#dce5e8;
  font-weight:850;
}

.sport.active{
  background:#e90046;
  color:white;
}

/* TABS */

.tabs{
  display:flex;
  gap:4px;
  overflow-x:auto;
  background:#04131a;
  border-bottom:1px solid #102d35;
}

.tab{
  flex:1 0 auto;
  min-width:105px;
  padding:17px 13px;
  background:transparent;
  color:#c9d2d5;
  font-weight:850;
  position:relative;
}

.tab.active{
  color:#e90046;
}

.tab.active:after{
  content:"";
  position:absolute;
  left:14px;
  right:14px;
  bottom:0;
  height:4px;
  background:#e90046;
  border-radius:5px 5px 0 0;
}

/* MAIN */

main{
  padding:18px 12px 110px;
}

.section-title{
  font-size:26px;
  font-weight:950;
  margin:8px 5px 4px;
}

.section-subtitle{
  color:#91a1a7;
  margin:0 5px 18px;
}

/* MATCH CARD */

.match{
  background:#071e26;
  border:1px solid #153842;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:12px;
}

.match-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 15px;
  background:#092731;
  color:#aab9bd;
  font-size:13px;
  font-weight:800;
}

.live-badge{
  background:#e90046;
  color:white;
  border-radius:15px;
  padding:5px 10px;
  font-weight:950;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{opacity:.55}
}

.match-body{
  padding:20px 12px;
  display:grid;
  grid-template-columns:1fr 95px 1fr;
  align-items:center;
  gap:7px;
}

.team{
  text-align:center;
  font-size:17px;
  font-weight:850;
}

.team-logo{
  width:58px;
  height:58px;
  object-fit:contain;
  display:block;
  margin:0 auto 7px;
  background:#fff;
  border-radius:14px;
  padding:5px;
}

.score-box{
  text-align:center;
}

.score{
  font-size:31px;
  font-weight:950;
}

.match-minute{
  color:#e90046;
  font-weight:900;
  margin-top:4px;
}

.match-time{
  color:#b9c4c7;
  font-size:14px;
  margin-top:5px;
}

.match-footer{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid #153842;
}

.match-action{
  flex:1;
  padding:12px;
  border-radius:13px;
  background:#102f38;
  color:#fff;
  font-weight:850;
}

.match-action.primary{
  background:#e90046;
}

/* EMPTY */

.empty,
.loading,
.error{
  background:#071e26;
  border:1px solid #153842;
  border-radius:20px;
  padding:30px 18px;
  text-align:center;
  color:#aebabe;
}

/* DETAIL */

.detail{
  display:none;
}

.detail.show{
  display:block;
}

.detail-back{
  width:100%;
  padding:14px;
  background:#102f38;
  color:#fff;
  border-radius:14px;
  margin-bottom:12px;
  text-align:left;
  font-weight:850;
}

.detail-hero{
  background:#071e26;
  border:1px solid #153842;
  border-radius:22px;
  overflow:hidden;
}

.detail-competition{
  text-align:center;
  padding:14px;
  background:#092731;
  color:#bdc8cb;
  font-size:14px;
  font-weight:800;
}

.detail-date{
  text-align:center;
  color:#9eafb3;
  padding:15px 0 3px;
}

.detail-teams{
  display:grid;
  grid-template-columns:1fr 120px 1fr;
  align-items:center;
  padding:12px 10px 25px;
}

.detail-team{
  text-align:center;
  font-size:19px;
  font-weight:900;
}

.detail-logo{
  width:92px;
  height:92px;
  background:#fff;
  border-radius:18px;
  object-fit:contain;
  padding:8px;
  display:block;
  margin:0 auto 9px;
}

.detail-score{
  text-align:center;
}

.big-score{
  font-size:48px;
  font-weight:950;
  color:#e90046;
}

.big-minute{
  color:#e90046;
  font-weight:900;
  margin-top:2px;
}

.detail-tabs{
  display:flex;
  overflow-x:auto;
  background:#04131a;
  margin-top:12px;
  border-bottom:1px solid #153842;
}

.detail-tab{
  flex:1 0 auto;
  min-width:120px;
  padding:17px 12px;
  background:transparent;
  color:#c4ced1;
  font-weight:850;
}

.detail-tab.active{
  color:#e90046;
  border-bottom:4px solid #e90046;
}

.detail-content{
  background:#06171d;
  padding-top:10px;
}

/* EVENT */

.event-list{
  background:#071e26;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #153842;
}

.event{
  display:grid;
  grid-template-columns:55px 42px 1fr;
  align-items:center;
  padding:14px 12px;
  border-bottom:1px solid #12343d;
}

.event:last-child{
  border-bottom:0;
}

.event-minute{
  font-weight:900;
  color:#aab7ba;
}

.event-icon{
  font-size:22px;
  text-align:center;
}

.event-text{
  font-weight:750;
}

/* STATS */

.stat-card{
  background:#071e26;
  border:1px solid #153842;
  border-radius:18px;
  padding:18px 14px;
  margin-bottom:10px;
}

.stat-head{
  display:grid;
  grid-template-columns:50px 1fr 50px;
  text-align:center;
  font-weight:900;
  margin-bottom:9px;
}

.stat-name{
  color:#e6ecee;
}

.stat-bar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.bar{
  height:9px;
  background:#153b45;
  border-radius:10px;
  overflow:hidden;
}

.bar.home div{
  height:100%;
  background:#e90046;
  float:right;
}

.bar.away div{
  height:100%;
  background:#e7ebed;
}

/* LINEUPS */

.formation{
  background:#06313a;
  border:1px solid #214952;
  border-radius:18px;
  padding:10px;
  overflow:hidden;
}

.pitch{
  position:relative;
  min-height:650px;
  border:3px solid #dce5e6;
  border-radius:5px;
  background:
    linear-gradient(
      to bottom,
      transparent 49.7%,
      #dce5e6 50%,
      transparent 50.3%
    );
}

.pitch:before{
  content:"";
  position:absolute;
  width:145px;
  height:70px;
  border:3px solid #dce5e6;
  border-top:0;
  left:50%;
  top:0;
  transform:translateX(-50%);
}

.pitch:after{
  content:"";
  position:absolute;
  width:145px;
  height:70px;
  border:3px solid #dce5e6;
  border-bottom:0;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
}

.player{
  position:absolute;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90px;
}

.player-photo{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#233940;
  border:2px solid #fff;
}

.player-name{
  display:inline-block;
  margin-top:2px;
  padding:3px 6px;
  background:#031219;
  border-radius:6px;
  font-size:11px;
  font-weight:850;
  white-space:nowrap;
}

/* H2H / FORM */

.result-row{
  display:grid;
  grid-template-columns:65px 1fr 60px;
  align-items:center;
  padding:14px 10px;
  background:#071e26;
  border-bottom:1px solid #153842;
}

.result-date{
  color:#91a1a6;
  font-size:12px;
}

.result-teams{
  line-height:1.7;
}

.result-score{
  text-align:right;
  font-weight:950;
}

.form-chip{
  display:inline-flex;
  min-width:30px;
  height:30px;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  margin-right:4px;
  color:#fff;
  font-weight:900;
}

.form-W{
  background:#16884d;
}

.form-D{
  background:#d99000;
}

.form-L{
  background:#d72c35;
}

/* FAVORITE */

.favorite{
  color:#9ca9ad;
}

.favorite.active{
  color:#ffd43b;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  background:#04131a;
  border-top:1px solid #153842;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:80;
}

.bottom-item{
  background:transparent;
  color:#8e9ca0;
  font-size:12px;
  font-weight:850;
}

.bottom-item.active{
  color:#e90046;
}

.bottom-icon{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

/* CHAMPIONS */

.champ-card{
  background:#071e26;
  border:1px solid #153842;
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
}

.champ-card h2{
  margin:0 0 13px;
}

.champ-button{
  width:100%;
  text-align:left;
  padding:15px;
  border-radius:13px;
  margin-bottom:8px;
  background:#102f38;
  color:#fff;
  font-weight:850;
}

/* RESPONSIVE */

@media(max-width:600px){

  .header{
    padding-top:34px;
  }

  .logo{
    font-size:30px;
  }

  .detail-teams{
    grid-template-columns:1fr 95px 1fr;
  }

  .detail-team{
    font-size:16px;
  }

  .detail-logo{
    width:76px;
    height:76px;
  }

  .big-score{
    font-size:40px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">L-LIVE</div>

  <div class="header-actions">

    <button
      class="header-btn"
      id="refreshBtn"
      onclick="manualRefresh()"
      title="განახლება"
    >↻</button>

    <button
      class="header-btn"
      onclick="showFavorites()"
      title="ფავორიტები"
    >★</button>

  </div>

</header>


<!-- SPORTS -->

<div class="sports">

  <button
    class="sport active"
    onclick="selectSport('football',this)"
  >
    ⚽ ფეხბურთი
  </button>

  <button
    class="sport"
    onclick="selectSport('basketball',this)"
  >
    🏀 კალათბურთი
  </button>

  <button
    class="sport"
    onclick="selectSport('rugby',this)"
  >
    🏉 რაგბი
  </button>

</div>


<!-- MAIN TABS -->

<div class="tabs">

  <button
    class="tab active"
    onclick="selectTab('live',this)"
  >
    🔴 LIVE
  </button>

  <button
    class="tab"
    onclick="selectTab('today',this)"
  >
    დღეს
  </button>

  <button
    class="tab"
    onclick="selectTab('upcoming',this)"
  >
    მომავალი
  </button>

  <button
    class="tab"
    onclick="selectTab('finished',this)"
  >
    შედეგები
  </button>

  <button
    class="tab"
    onclick="showChampionships()"
  >
    🏆 ჩემპიონატები
  </button>

</div>


<main>

  <!-- LIST -->

  <section id="listView">

    <div class="section-title" id="pageTitle">
      LIVE მატჩები
    </div>

    <div
      class="section-subtitle"
      id="pageSubtitle"
    >
      ქართული ფეხბურთი
    </div>

    <div id="matches">

      <div class="loading">
        მატჩებს ვტვირთავთ...
      </div>

    </div>

  </section>


  <!-- DETAIL -->

  <section
    class="detail"
    id="detailView"
  >

    <button
      class="detail-back"
      onclick="closeDetail()"
    >
      ← მატჩებზე დაბრუნება
    </button>

    <div id="detailContainer"></div>

  </section>

</main>


<!-- BOTTOM -->

<nav class="bottom">

  <button
    class="bottom-item active"
    id="bottomHome"
    onclick="goHome()"
  >
    <span class="bottom-icon">⌂</span>
    მთავარი
  </button>

  <button
    class="bottom-item"
    id="bottomLive"
    onclick="bottomLive()"
  >
    <span class="bottom-icon">●</span>
    LIVE
  </button>

  <button
    class="bottom-item"
    onclick="showFavorites()"
  >
    <span class="bottom-icon">★</span>
    ფავორიტები
  </button>

  <button
    class="bottom-item"
    onclick="showChampionships()"
  >
    <span class="bottom-icon">🏆</span>
    ლიგები
  </button>

</nav>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let currentSport = "football";
let currentTab = "live";

let matches = [];

let currentMatch = null;

let detailTab = "events";

let favorites =
  JSON.parse(
    localStorage.getItem("l_live_favorites") || "[]"
  );


/* =====================================================
   API
===================================================== */

async function loadMatches(){

  const box =
    document.getElementById("matches");

  try{

    const response =
      await fetch(
        "/api/matches?time=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error("API");
    }

    const data =
      await response.json();

    matches =
      Array.isArray(data.matches)
        ? data.matches
        : [];

    renderList();

    /*
      თუ დეტალური გვერდი გახსნილია,
      ისიც განვაახლოთ.
    */

    if(currentMatch){

      const updated =
        matches.find(
          m =>
            String(m.id) ===
            String(currentMatch.id)
        );

      if(updated){

        currentMatch = updated;

        renderDetail();

      }

    }

  }catch(error){

    console.error(error);

    if(!matches.length){

      box.innerHTML = `
        <div class="error">
          მატჩების ჩატვირთვა ვერ მოხერხდა.
          <br><br>
          დააჭირე ↻-ს ხელახლა საცდელად.
        </div>
      `;

    }

  }

}


/* =====================================================
   MANUAL REFRESH
===================================================== */

async function manualRefresh(){

  const btn =
    document.getElementById("refreshBtn");

  btn.textContent = "…";

  await loadMatches();

  btn.textContent = "↻";

}


/* =====================================================
   SPORT
===================================================== */

function selectSport(
  sport,
  button
){

  currentSport = sport;

  document
    .querySelectorAll(".sport")
    .forEach(
      b => b.classList.remove("active")
    );

  button.classList.add("active");

  closeDetail();

  renderList();

}


/* =====================================================
   TAB
===================================================== */

function selectTab(
  tab,
  button
){

  currentTab = tab;

  document
    .querySelectorAll(".tab")
    .forEach(
      b => b.classList.remove("active")
    );

  button.classList.add("active");

  closeDetail();

  renderList();

}


/* =====================================================
   FILTER
===================================================== */

function filteredMatches(){

  let list =
    matches.filter(
      m =>
        m.sport === currentSport
    );


  if(currentTab === "live"){

    return list.filter(
      m =>
        m.status === "LIVE"
    );

  }


  if(currentTab === "today"){

    const t = today();

    return list.filter(
      m =>
        m.date === t
    );

  }


  if(currentTab === "upcoming"){

    return list.filter(
      m =>
        m.status === "SCHEDULED"
    );

  }


  if(currentTab === "finished"){

    return list.filter(
      m =>
        m.status === "FINISHED"
    );

  }


  return list;

}


/* =====================================================
   LIST RENDER
===================================================== */

function renderList(){

  const listView =
    document.getElementById("listView");

  const detailView =
    document.getElementById("detailView");

  listView.style.display = "block";
  detailView.classList.remove("show");


  const box =
    document.getElementById("matches");


  const list =
    filteredMatches();


  const titles = {

    live:"LIVE მატჩები",

    today:"დღევანდელი მატჩები",

    upcoming:"მომავალი მატჩები",

    finished:"შედეგები"

  };


  document.getElementById("pageTitle")
    .textContent =
    titles[currentTab] || "მატჩები";


  document.getElementById("pageSubtitle")
    .textContent =
    currentSport === "football"
      ? "ქართული ფეხბურთი"
      : currentSport === "basketball"
        ? "ქართული კალათბურთი"
        : "ქართული რაგბი";


  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        ამ განყოფილებაში მატჩები ჯერ არ არის.
      </div>
    `;

    return;

  }


  box.innerHTML =
    list.map(
      renderMatch
    ).join("");

}


/* =====================================================
   MATCH CARD
===================================================== */

function renderMatch(m){

  const live =
    m.status === "LIVE";

  const favorite =
    isFavorite(m.id);


  const homeScore =
    m.score?.home ??
    "-";


  const awayScore =
    m.score?.away ??
    "-";


  let statusText = "";

  if(live){

    statusText =
      m.minute
        ? `${m.minute}'`
        : "LIVE";

  }else if(
    m.status === "SCHEDULED"
  ){

    statusText =
      m.time || "მომავალი";

  }else{

    statusText =
      "დასრულდა";

  }


  return `

    <article class="match">

      <div class="match-top">

        <span>
          ${safe(
            m.competition ||
            "საქართველო"
          )}
        </span>

        ${
          live
            ? `<span class="live-badge">
                ● LIVE
              </span>`
            : `<span>${safe(statusText)}</span>`
        }

      </div>


      <div class="match-body">

        <div class="team">

          ${teamLogo(m.homeLogo)}

          <div>
            ${safe(m.home || "")}
          </div>

        </div>


        <div class="score-box">

          <div class="score">
            ${homeScore} : ${awayScore}
          </div>

          <div
            class="${
              live
                ? "match-minute"
                : "match-time"
            }"
          >
            ${safe(statusText)}
          </div>

        </div>


        <div class="team">

          ${teamLogo(m.awayLogo)}

          <div>
            ${safe(m.away || "")}
          </div>

        </div>

      </div>


      <div class="match-footer">

        <button
          class="match-action primary"
          onclick="openDetail('${safeAttr(m.id)}')"
        >
          მატჩის დეტალები
        </button>

        <button
          class="match-action"
          onclick="toggleFavorite('${safeAttr(m.id)}')"
        >
          <span class="${
            favorite
              ? "favorite active"
              : "favorite"
          }">
            ★
          </span>
        </button>

      </div>

    </article>

  `;

}


/* =====================================================
   DETAIL
===================================================== */

async function openDetail(id){

  let match =
    matches.find(
      m =>
        String(m.id) ===
        String(id)
    );


  if(!match){
    return;
  }


  currentMatch = match;

  detailTab = "events";


  document.getElementById("listView")
    .style.display = "none";


  document.getElementById("detailView")
    .classList.add("show");


  renderDetail();


  /*
    ცალკე detail API
  */

  try{

    const response =
      await fetch(
        "/api/matches/" +
        encodeURIComponent(id) +
        "?time=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(response.ok){

      const data =
        await response.json();

      if(
        data &&
        data.success &&
        data.match
      ){

        currentMatch =
          data.match;

        /*
          მთავარ მასივშიც განვაახლოთ.
        */

        const index =
          matches.findIndex(
            m =>
              String(m.id) ===
              String(id)
          );

        if(index >= 0){

          matches[index] =
            currentMatch;

        }

        renderDetail();

      }

    }

  }catch(error){

    console.log(
      "DETAIL API:",
      error.message
    );

  }

}

/* =====================================================
   DETAIL TAB
===================================================== */

function setDetailTab(tab){

  detailTab = tab;

  renderDetail();

}


/* =====================================================
   DETAIL CONTENT
===================================================== */

function renderDetailContent(m){

  if(detailTab === "events"){

    return renderEvents(m);

  }


  if(detailTab === "stats"){

    return renderStats(m);

  }


  if(detailTab === "lineups"){

    return renderLineups(m);

  }


  if(detailTab === "h2h"){

    return renderH2H(m);

  }


  if(detailTab === "form"){

    return renderForm(m);

  }


  return "";

}


/* =====================================================
   EVENTS
===================================================== */

function renderEvents(m){

  const events =
    Array.isArray(m.events)
      ? m.events
      : [];


  if(!events.length){

    return `
      <div class="empty">
        მატჩის მოვლენები ჯერ არ არის
        ხელმისაწვდომი.
      </div>
    `;

  }


  return `

    <div class="event-list">

      ${
        events.map(
          e => `

            <div class="event">

              <div class="event-minute">
                ${safe(
                  e.minute ??
                  e.time ??
                  ""
                )}
              </div>

              <div class="event-icon">
                ${eventIcon(
                  e.type
                )}
              </div>

              <div class="event-text">
                ${safe(
                  e.text ||
                  e.player ||
                  "მოვლენა"
                )}
              </div>

            </div>

          `
        ).join("")
      }

    </div>

  `;

}


/* =====================================================
   STATISTICS
===================================================== */

function renderStats(m){

  const stats =
    Array.isArray(m.statistics)
      ? m.statistics
      : [];


  if(!stats.length){

    return `
      <div class="empty">
        სტატისტიკის მონაცემები ჯერ არ არის
        ხელმისაწვდომი.
      </div>
    `;

  }


  return stats.map(
    stat => {

      const home =
        Number(stat.home ?? 0);

      const away =
        Number(stat.away ?? 0);

      const total =
        home + away || 1;

      const hp =
        Math.round(
          home / total * 100
        );

      const ap =
        Math.round(
          away / total * 100
        );


      return `

        <div class="stat-card">

          <div class="stat-head">

            <span>
              ${home}
            </span>

            <span class="stat-name">
              ${safe(stat.name || "")}
            </span>

            <span>
              ${away}
            </span>

          </div>


          <div class="stat-bar">

            <div class="bar home">
              <div
                style="width:${hp}%"
              ></div>
            </div>

            <div class="bar away">
              <div
                style="width:${ap}%"
              ></div>
            </div>

          </div>

        </div>

      `;

    }
  ).join("");

}


/* =====================================================
   LINEUPS
===================================================== */

function renderLineups(m){

  const home =
    m.lineups?.home || [];

  const away =
    m.lineups?.away || [];


  const homeFormation =
    m.formations?.home || "";


  const awayFormation =
    m.formations?.away || "";


  if(
    !home.length &&
    !away.length
  ){

    return `
      <div class="empty">
        შემადგენლობები ჯერ არ არის
        ხელმისაწვდომი.
      </div>
    `;

  }


  return `

    <div class="formation">

      <div style="
        display:flex;
        justify-content:space-between;
        padding:5px 8px 12px;
        font-weight:900;
      ">

        <span>
          ${safe(homeFormation)}
        </span>

        <span>
          ფორმაცია
        </span>

        <span>
          ${safe(awayFormation)}
        </span>

      </div>


      <div class="pitch">

        ${renderPlayers(
          home,
          "home"
        )}

        ${renderPlayers(
          away,
          "away"
        )}

      </div>

    </div>

  `;

}


function renderPlayers(
  players,
  side
){

  const positions =
    side === "home"

      ? [
          [50,88],
          [18,72],
          [38,72],
          [62,72],
          [82,72],
          [28,53],
          [72,53],
          [18,38],
          [50,38],
          [82,38],
          [50,18]
        ]

      : [
          [50,12],
          [18,28],
          [38,28],
          [62,28],
          [82,28],
          [28,47],
          [72,47],
          [18,62],
          [50,62],
          [82,62],
          [50,82]
        ];


  return players
    .slice(0,11)
    .map(
      (p,i) => {

        const pos =
          positions[i] ||
          [50,50];


        return `

          <div
            class="player"
            style="
              left:${pos[0]}%;
              top:${pos[1]}%;
            "
          >

            ${
              p.photo
                ? `
                  <img
                    class="player-photo"
                    src="${safeAttr(p.photo)}"
                    alt=""
                  >
                `
                : `
                  <div
                    class="player-photo"
                  ></div>
                `
            }

            <div class="player-name">
              ${safe(
                p.number
                  ? p.number + " "
                  : ""
              )}
              ${safe(
                p.name ||
                p.player ||
                ""
              )}
            </div>

          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   H2H
===================================================== */

function renderH2H(m){

  const h2h =
    Array.isArray(m.h2h)
      ? m.h2h
      : [];


  if(!h2h.length){

    return `
      <div class="empty">
        ურთიერთშეხვედრების მონაცემები ჯერ არ არის.
      </div>
    `;

  }


  return `

    <div class="event-list">

      ${
        h2h.map(
          game => `

            <div class="result-row">

              <div class="result-date">
                ${safe(
                  game.date || ""
                )}
              </div>

              <div class="result-teams">

                <div>
                  ${safe(
                    game.home || ""
                  )}
                </div>

                <div>
                  ${safe(
                    game.away || ""
                  )}
                </div>

              </div>

              <div class="result-score">

                ${safe(

                )}

                <br>

                ${safe(

                )}

              </div>

      }

}


/* =====================================================
   FORM
===================================================== */

function renderForm(m){

  const home =
    m.form?.home || [];

  const away =
    m.form?.away || [];


  return `

    <div class="stat-card">

      <h3>
        ბოლო მატჩები:
        ${safe(m.home || "")}
      </h3>

      ${
        renderFormChips(home)
      }

    </div>


    <div class="stat-card">

      <h3>
        ბოლო მატჩები:
        ${safe(m.away || "")}
      </h3>

      ${
        renderFormChips(away)
      }

    </div>

  `;

}


function renderFormChips(form){

  if(!form.length){

    return `
      <div style="color:#8fa0a4">
        მონაცემი ჯერ არ არის.
      </div>
    `;

  }


  return form.map(
    item => {

      const result =
        typeof item === "string"
          ? item
          : item.result;


      const normalized =
        String(result || "")
          .toUpperCase();


      return `
        <span
          class="form-chip form-${safeAttr(
            normalized
          )}"
        >
          ${safe(normalized)}
        </span>
      `;

    }
  ).join("");

}

/* =====================================================
   LEAGUE FILTER
===================================================== */

function selectLeague(name){

  currentSport = "football";

  currentTab = "today";


  document
    .querySelectorAll(".sport")
    .forEach(
      b => b.classList.remove("active")
    );


  document
    .querySelector(".sport")
    ?.classList.add("active");


  /*
    ამ ეტაპზე მხოლოდ ის მატჩები
    ვაჩვენოთ, რომლის competition
    ემთხვევა არჩეულ ლიგას.
  */

  const box =
    document.getElementById("matches");


  const list =
    matches.filter(
      m =>
        m.sport === "football" &&
        normalize(m.competition)
          .includes(
            normalize(name)
          )
    );


  document.getElementById(
    "pageTitle"
  ).textContent =
    name;


  document.getElementById(
    "pageSubtitle"
  ).textContent =
    "მატჩები";


  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        ${safe(name)}
        <br><br>
        ამ ეტაპზე მატჩები ვერ მოიძებნა.
      </div>
    `;

    return;

  }


  box.innerHTML =
    list.map(
      renderMatch
    ).join("");

}


function selectSportFromLeague(sport){

  currentSport = sport;
  currentTab = "today";

  const button =
    [...document.querySelectorAll(".sport")]
      .find(
        b =>
          (sport === "basketball" &&
           b.textContent.includes("კალათბურთი"))
          ||
          (sport === "rugby" &&
           b.textContent.includes("რაგბი"))
      );

  if(button){
    selectSport(
      sport,
      button
    );
  }

}

function isFavorite(id){

  return favorites
    .map(String)
    .includes(String(id));

function toggleFavorite(id){

  const key =
    String(id);


  if(isFavorite(key)){

    favorites =
      favorites.filter(
        x =>
          String(x) !== key
      );

  }else{

    favorites.push(key);

  }


  localStorage.setItem(
    "l_live_favorites",
    JSON.stringify(favorites)
  );


  renderList();

  if(currentMatch){
    renderDetail();
  }

}

/* =====================================================
   EVENT ICON
===================================================== */

function eventIcon(type){

  const t =
    normalize(type);


  if(
    t.includes("goal") ||
    t.includes("გოლი")
  ){
    return "⚽";
  }

  if(
    t.includes("yellow") ||
    t.includes("ყვით")
  ){
    return "🟨";
  }

  if(
    t.includes("red") ||
    t.includes("წით")
  ){
    return "🟥";
  }

  if(
    t.includes("sub") ||
    t.includes("შეც")
  ){
    return "🔄";
  }

  return "•";

}


/* =====================================================
   DATE
===================================================== */

function today(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Tbilisi",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(
      new Date()
    );


  const result = {};

  parts.forEach(
    p => {

      if(p.type !== "literal"){
        result[p.type] = p.value;
      }

    }
  );


  return `${result.year}-${result.month}-${result.day}`;

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(value){

  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g," ");

}


/* =====================================================
   SECURITY
===================================================== */

function safe(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeAttr(value){

  return safe(value)
    .replace(/`/g,"&#096;");

}
