<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>L-LIVE</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Arial, sans-serif;
      background: #f4f6f7;
      color: #171b20;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    /* HEADER */

    .header {
      background: #3d8f52;
      color: white;
      padding: 42px 28px 30px;
      min-height: 150px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .online {
      background: rgba(255,255,255,.17);
      padding: 11px 18px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: 700;
    }

    .online-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      margin-right: 6px;
    }

    /* SPORTS */

    .sports {
      background: white;
      padding: 20px 20px 22px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      border-bottom: 1px solid #ddd;
    }

    .sport {
      flex: 0 0 auto;
      padding: 17px 28px;
      border-radius: 35px;
      background: #eef0f2;
      color: #5b5e62;
      font-size: 20px;
      font-weight: 800;
    }

    .sport.active {
      background: #3d8f52;
      color: white;
    }

    /* NAV */

    .tabs {
      background: white;
      padding: 18px 20px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      flex: 1;
      min-width: 105px;
      padding: 15px 14px;
      border-radius: 18px;
      background: #eef0f2;
      color: #606368;
      font-weight: 800;
      font-size: 18px;
    }

    .tab.active {
      background: #3d8f52;
      color: white;
    }

    /* MAIN */

    main {
      padding: 24px 20px 110px;
      max-width: 900px;
      margin: auto;
    }

    .section-title {
      font-size: 30px;
      font-weight: 900;
      margin: 12px 8px 5px;
    }

    .section-subtitle {
      color: #777;
      font-size: 17px;
      margin: 0 8px 18px;
    }

    .empty {
      background: white;
      border: 1px solid #ddd;
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      color: #888;
      font-size: 20px;
      margin-bottom: 25px;
    }

    /* MATCH CARD */

    .match-card {
      background: white;
      border-radius: 24px;
      border: 1px solid #dedede;
      margin: 0 0 16px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,.04);
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 18px;
      border-bottom: 1px solid #eee;
    }

    .competition {
      color: #777;
      font-size: 14px;
      font-weight: 700;
    }

    .live-badge {
      background: #e53935;
      color: white;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 900;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: .55;
      }
    }

    .match-body {
      padding: 22px 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .team {
      text-align: center;
      font-size: 19px;
      font-weight: 850;
    }

    .team:first-child {
      text-align: right;
    }

    .team:last-child {
      text-align: left;
    }

    .score {
      text-align: center;
      font-size: 29px;
      font-weight: 950;
      min-width: 70px;
    }

    .match-time {
      color: #e53935;
      font-size: 15px;
      font-weight: 800;
      margin-top: 5px;
    }

    .match-footer {
      background: #f8f9f9;
      padding: 12px 18px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    .scheduled .score {
      color: #444;
      font-size: 22px;
    }

    .finished .score {
      color: #555;
    }

    /* LOADING */

    .loading {
      background: white;
      border-radius: 22px;
      padding: 30px;
      text-align: center;
      color: #777;
      font-size: 18px;
    }

    .error {
      background: #fff3f3;
      border: 1px solid #f0b5b5;
      color: #a83232;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }

    /* TABLE */

    .table-box {
      background: white;
      border-radius: 22px;
      overflow-x: auto;
      border: 1px solid #ddd;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th, td {
      padding: 14px 10px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    th {
      background: #f0f2f3;
      color: #697077;
    }

    /* BOTTOM */

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 92px;
      background: white;
      border-top: 1px solid #ddd;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 20;
    }

    .bottom-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #777;
      font-weight: 800;
      font-size: 14px;
      gap: 5px;
    }

    .bottom-item.active {
      color: #3d8f52;
      background: #eff9f2;
      border-radius: 22px;
      margin: 8px;
    }

    .bottom-icon {
      font-size: 25px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .header {
        padding-top: 42px;
      }

      .logo {
        font-size: 40px;
      }

      .online {
        font-size: 15px;
        padding: 9px 14px;
      }

      .sport {
        font-size: 19px;
        padding: 16px 25px;
      }

      .section-title {
        font-size: 28px;
      }

      .team {
        font-size: 17px;
      }

      .score {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      L-LIVE
    </div>

    <div class="online">
      <span class="online-dot"></span>
      ონლაინ
    </div>

  </header>


  <!-- SPORTS -->

  <div class="sports">

    <button class="sport active" onclick="selectSport('football', this)">
      ⚽ ფეხბურთი
    </button>

    <button class="sport" onclick="selectSport('basketball', this)">
      🏀 კალათბურთი
    </button>

    <button class="sport" onclick="selectSport('rugby', this)">
      🏉 რაგბი
    </button>

  </div>


  <!-- TABS -->

  <div class="tabs">

    <button class="tab active" onclick="selectTab('live', this)">
      LIVE
    </button>

    <button class="tab" onclick="selectTab('today', this)">
      დღეს
    </button>

    <button class="tab" onclick="selectTab('upcoming', this)">
      მომავალი
    </button>

    <button class="tab" onclick="selectTab('finished', this)">
      შედეგები
    </button>

    <button class="tab" onclick="selectTab('table', this)">
      ცხრილი
    </button>

  </div>


  <!-- MAIN -->

  <main>

    <div class="section-title">
      ჩემპიონატი
    </div>

    <div class="section-subtitle" id="competitionTitle">
      ქართული ფეხბურთი
    </div>


    <div class="section-title">
      <span id="sectionHeading">LIVE მატჩები</span>
    </div>


    <div id="matches">

      <div class="loading">
        მატჩებს ვტვირთავთ...
      </div>

    </div>


    <!-- TABLE -->

    <div id="tableSection" style="display:none;">

      <div class="section-title">
        სატურნირო ცხრილი
      </div>

      <div class="section-subtitle">
        პოზიციები და ქულები
      </div>

      <div class="table-box">

        <table>

          <thead>

            <tr>
              <th>#</th>
              <th>გუნდი</th>
              <th>თ</th>
              <th>მ</th>
              <th>ფ</th>
              <th>ქ</th>
            </tr>

          </thead>

          <tbody id="tableBody">

            <tr>
              <td colspan="6">
                ცხრილი იტვირთება...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>


  <!-- BOTTOM NAV -->

  <nav class="bottom">

    <div class="bottom-item">
      <div class="bottom-icon">⌂</div>
      მთავარი
    </div>

    <div class="bottom-item active">
      <div class="bottom-icon">●</div>
      LIVE
    </div>

    <div class="bottom-item">
      <div class="bottom-icon">☷</div>
      ცხრილი
    </div>

    <div class="bottom-item">
      <div class="bottom-icon">🏆</div>
      ჩემპიონატები
    </div>

  </nav>


<script>

  let currentSport = "football";
  let currentTab = "live";

  let allMatches = [];


  // ----------------------------------------------------
  // LOAD MATCHES
  // ----------------------------------------------------

  async function loadMatches() {

    const container = document.getElementById("matches");

    try {

      const response = await fetch("/api/matches", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("API error");
      }

      const data = await response.json();

      allMatches = Array.isArray(data.matches)
        ? data.matches
        : [];

      renderMatches();

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="error">
          მატჩების ჩატვირთვა ვერ მოხერხდა.<br>
          გთხოვთ სცადოთ თავიდან.
        </div>
      `;

    }

  }


  // ----------------------------------------------------
  // RENDER
  // ----------------------------------------------------

  function renderMatches() {

    const container = document.getElementById("matches");
    const tableSection = document.getElementById("tableSection");

    if (currentTab === "table") {

      container.style.display = "none";
      tableSection.style.display = "block";

      renderTable();

      return;
    }

    container.style.display = "block";
    tableSection.style.display = "none";


    let matches = allMatches.filter(match => {

      return match.sport === currentSport;

    });


    if (currentTab === "live") {

      matches = matches.filter(match =>
        match.status === "LIVE"
      );

      document.getElementById("sectionHeading").textContent =
        "LIVE მატჩები";

    }


    if (currentTab === "today") {

      matches = matches.filter(match => {

        return match.date === getTodayGeorgia();

      });

      document.getElementById("sectionHeading").textContent =
        "დღევანდელი მატჩები";

    }


    if (currentTab === "upcoming") {

      matches = matches.filter(match =>
        match.status === "SCHEDULED"
      );

      document.getElementById("sectionHeading").textContent =
        "მომავალი მატჩები";

    }


    if (currentTab === "finished") {

      matches = matches.filter(match =>
        match.status === "FINISHED"
      );

      document.getElementById("sectionHeading").textContent =
        "შედეგები";

    }


    if (matches.length === 0) {

      container.innerHTML = `
        <div class="empty">
          ამ განყოფილებაში მატჩები ჯერ არ არის.
        </div>
      `;

      return;
    }


    container.innerHTML =
      matches.map(renderMatch).join("");

  }


  // ----------------------------------------------------
  // MATCH CARD
  // ----------------------------------------------------

  function renderMatch(match) {

    const status = match.status || "SCHEDULED";

    const isLive = status === "LIVE";

    const isFinished = status === "FINISHED";


    const scoreHome =
      match.score && match.score.home != null
        ? match.score.home
        : "-";


    const scoreAway =
      match.score && match.score.away != null
        ? match.score.away
        : "-";


    let statusText = "";

    if (isLive) {

      statusText = match.minute
        ? `${match.minute}'`
        : "LIVE";

    } else if (isFinished) {

      statusText = "დასრულდა";

    } else {

      statusText = match.time || "";

    }


    return `

      <div class="match-card ${status.toLowerCase()}">

        <div class="match-top">

          <div class="competition">
            ${escapeHtml(match.competition || "საქართველო")}
          </div>

          ${
            isLive
              ? `<div class="live-badge">● LIVE</div>`
              : `<div class="competition">${escapeHtml(statusText)}</div>`
          }

        </div>


        <div class="match-body">

          <div class="team">
            ${escapeHtml(match.home || "")}
          </div>


          <div class="score">

            <div>
              ${scoreHome}
              :
              ${scoreAway}
            </div>

            ${
              isLive
                ? `<div class="match-time">${escapeHtml(statusText)}</div>`
                : ""
            }

          </div>


          <div class="team">
            ${escapeHtml(match.away || "")}
          </div>

        </div>


        <div class="match-footer">

          ${
            match.venue
              ? `📍 ${escapeHtml(match.venue)}`
              : ""
          }

          ${
            match.sourceUrl
              ? `
                <br>
                <a
                  href="${escapeAttribute(match.sourceUrl)}"
                  target="_blank"
                  rel="noopener"
                  style="color:#3d8f52;text-decoration:none;font-weight:700;"
                >
                  ოფიციალური წყარო
                </a>
              `
              : ""
          }

        </div>

      </div>

    `;

  }


  // ----------------------------------------------------
  // SPORTS
  // ----------------------------------------------------

  function selectSport(sport, button) {

    currentSport = sport;

    document
      .querySelectorAll(".sport")
      .forEach(el => el.classList.remove("active"));

    button.classList.add("active");


    if (sport === "football") {

      document.getElementById("competitionTitle").textContent =
        "ქართული ფეხბურთი";

    }

    if (sport === "basketball") {

      document.getElementById("competitionTitle").textContent =
        "ქართული კალათბურთი";

    }

    if (sport === "rugby") {

      document.getElementById("competitionTitle").textContent =
        "ქართული რაგბი";

    }


    renderMatches();

  }


  // ----------------------------------------------------
  // TABS
  // ----------------------------------------------------

  function selectTab(tab, button) {

    currentTab = tab;

    document
      .querySelectorAll(".tab")
      .forEach(el => el.classList.remove("active"));

    button.classList.add("active");

    renderMatches();

  }


  // ----------------------------------------------------
  // TABLE
  // ----------------------------------------------------

  function renderTable() {

    const body = document.getElementById("tableBody");

    const teams = [
      "იბერია 1999",
      "დინამო თბილისი",
      "დინამო ბათუმი",
      "დილა გორი",
      "ტორპედო ქუთაისი",
      "რუსთავი",
      "სამგურალი",
      "გაგრა"
    ];

    body.innerHTML = teams.map((team, index) => {

      return `

        <tr>

          <td>${index + 1}</td>

          <td style="font-weight:800;text-align:left;">
            ${team}
          </td>

          <td>0</td>
          <td>0</td>
          <td>0</td>
          <td>0</td>

        </tr>

      `;

    }).join("");

  }


  // ----------------------------------------------------
  // GEORGIAN DATE
  // ----------------------------------------------------

  function getTodayGeorgia() {

    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Tbilisi",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());


    let result = {};

    parts.forEach(p => {

      if (p.type !== "literal") {
        result[p.type] = p.value;
      }

    });


    return `${result.year}-${result.month}-${result.day}`;

  }


  // ----------------------------------------------------
  // SECURITY
  // ----------------------------------------------------

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function escapeAttribute(value) {

    return String(value)
      .replaceAll('"', "&quot;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");

  }


  // ----------------------------------------------------
  // START
  // ----------------------------------------------------

  loadMatches();


  // ავტომატური განახლება ყოველ 30 წამში

  setInterval(() => {

    loadMatches();

  }, 30000);


</script>

</body>
</html>
