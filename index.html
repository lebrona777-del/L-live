<!DOCTYPE html>
<html lang="ka">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    L-LIVE WORLD SPORT
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f1f4f3;
      color: #111;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #dfe5e2;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1250px;
      margin: auto;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1.5px;
      flex: 1;
    }

    .logo span {
      color: #18865e;
    }

    .admin-top {
      border: 1px solid #dce4e0;
      background: #fff;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 800;
    }

    .search-wrap {
      max-width: 1250px;
      margin: auto;
      padding: 0 22px 16px;
    }

    .search {
      width: 100%;
      border: 1px solid #dce4e0;
      border-radius: 18px;
      padding: 16px 20px;
      background: #fafcfb;
      outline: none;
    }

    .search:focus {
      border-color: #149566;
    }

    .categories {
      overflow-x: auto;
      background: #101312;
    }

    .categories-inner {
      max-width: 1250px;
      margin: auto;
      display: flex;
      gap: 4px;
      padding: 4px;
    }

    .category {
      border: 0;
      background: #f1f1f1;
      min-width: 145px;
      padding: 15px 18px;
      border-radius: 12px;
      font-weight: 800;
    }

    .category.active {
      background: #149566;
      color: #fff;
    }

    main {
      max-width: 1250px;
      margin: auto;
      padding: 28px 22px 60px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 20px 0;
    }

    .section-title h2 {
      margin: 0;
    }

    .breaking {
      background: #111;
      color: #fff;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .breaking h1 {
      margin: 12px 0;
      font-size: clamp(26px, 5vw, 48px);
    }

    .breaking img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 14px;
    }

    .tag {
      display: inline-block;
      background: #149566;
      color: #fff;
      padding: 7px 11px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
    }

    .article-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #dfe6e2;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 5px 18px
        rgba(0,0,0,.05);
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #e7ecea;
    }

    .card-body {
      padding: 18px;
    }

    .card h3 {
      margin: 12px 0 8px;
      font-size: 21px;
      line-height: 1.25;
    }

    .meta {
      color: #66716d;
      font-size: 13px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .excerpt {
      color: #555;
      line-height: 1.55;
    }

    .empty {
      background: #fff;
      border: 1px solid #dfe6e2;
      border-radius: 18px;
      padding: 50px 25px;
      text-align: center;
    }

    .article-page {
      max-width: 900px;
      margin: auto;
      background: #fff;
      border: 1px solid #dfe6e2;
      border-radius: 20px;
      padding: 25px;
    }

    .article-page h1 {
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.12;
      margin: 18px 0;
    }

    .main-image {
      width: 100%;
      max-height: 600px;
      object-fit: cover;
      border-radius: 16px;
      background: #e7ecea;
    }

    .article-excerpt {
      font-size: 22px;
      line-height: 1.5;
      font-weight: 700;
      margin: 25px 0;
    }

    .article-content {
      white-space: pre-wrap;
      font-size: 18px;
      line-height: 1.75;
    }

    .source-box {
      margin-top: 25px;
      padding: 15px;
      background: #eef5f1;
      border-radius: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
    }

    .btn-green {
      background: #149566;
      color: #fff;
    }

    .btn-light {
      background: #edf1ef;
      color: #111;
    }

    .btn-red {
      background: #c62828;
      color: #fff;
    }

    .btn-dark {
      background: #111;
      color: #fff;
    }

    .admin-box {
      background: #fff;
      border: 1px solid #dfe6e2;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #d4ddd9;
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      background: #fff;
    }

    .field textarea {
      min-height: 170px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #149566;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 10px 18px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .checks {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .admin-article {
      background: #fff;
      border: 1px solid #dfe6e2;
      border-radius: 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: 100px 1fr auto;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }

    .admin-article img {
      width: 100px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
      background: #e7ecea;
    }

    footer {
      background: #111;
      color: #ddd;
      text-align: center;
      padding: 45px 20px;
    }

    .error-box {
      background: #fff0f0;
      border: 1px solid #e2aaaa;
      color: #a52222;
      border-radius: 15px;
      padding: 20px;
      white-space: pre-wrap;
    }

    @media (max-width: 850px) {

      .article-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

    }

    @media (max-width: 600px) {

      .header-inner {
        padding: 13px 14px;
      }

      .logo {
        font-size: 25px;
      }

      .admin-top {
        padding: 10px 12px;
      }

      .search-wrap {
        padding: 0 14px 12px;
      }

      main {
        padding:
          20px 14px 45px;
      }

      .article-grid {
        grid-template-columns: 1fr;
      }

      .admin-article {
        grid-template-columns:
          75px 1fr;
      }

      .admin-article img {
        width: 75px;
        height: 60px;
      }

      .admin-article .actions {
        grid-column: 1 / -1;
      }

    }

  </style>

</head>

<body>

<header class="header">

  <div class="header-inner">

    <a
      href="#/"
      class="logo"
    >
      <span>L-LIVE</span>
      WORLD SPORT
    </a>

    <a
      href="#/admin"
      class="admin-top"
    >
      🔐 Admin
    </a>

  </div>

  <div class="search-wrap">

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="მოძებნე სპორტული ამბავი..."
    >

  </div>

  <nav class="categories">

    <div
      class="categories-inner"
      id="categories"
    >

      <button
        class="category active"
        data-category="all"
      >
        მთავარი
      </button>

      <button
        class="category"
        data-category="football"
      >
        ⚽ ფეხბურთი
      </button>

      <button
        class="category"
        data-category="basketball"
      >
        🏀 კალათბურთი
      </button>

      <button
        class="category"
        data-category="tennis"
      >
        🎾 ჩოგბურთი
      </button>

      <button
        class="category"
        data-category="rugby"
      >
        🏉 რაგბი
      </button>

      <button
        class="category"
        data-category="motorsport"
      >
        🏎️ ავტოსპორტი
      </button>

      <button
        class="category"
        data-category="combat"
      >
        🥊 საბრძოლო
      </button>

      <button
        class="category"
        data-category="other"
      >
        🏆 სხვა
      </button>

    </div>

  </nav>

</header>

<main id="app">

  <div class="empty">
    იტვირთება...
  </div>

</main>

<footer>

  <h2>L-LIVE</h2>

  <div>
    WORLD SPORT
  </div>

  <p>
    სპორტული ონლაინ გაზეთი
  </p>

</footer>

<script>

  const state = {
    articles: [],
    category: "all",
    admin: false,
    editingId: null
  };

  /* =======================================================
     REQUEST
  ======================================================= */

  async function request(
    url,
    options = {}
  ) {

    const response =
      await fetch(
        url,
        {
          credentials: "same-origin",
          ...options
        }
      );

    const text =
      await response.text();

    let data;

    try {
      data =
        text
          ? JSON.parse(text)
          : {};
    } catch {
      data = {
        ok: false,
        error: text
      };
    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        "მოთხოვნა ვერ შესრულდა."
      );

    }

    return data;

  }

  /* =======================================================
     ESCAPE
  ======================================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

  /* =======================================================
     CATEGORY
  ======================================================= */

  function categoryName(
    id
  ) {

    const names = {
      football: "⚽ ფეხბურთი",
      basketball: "🏀 კალათბურთი",
      tennis: "🎾 ჩოგბურთი",
      rugby: "🏉 რაგბი",
      motorsport: "🏎️ ავტოსპორტი",
      combat: "🥊 საბრძოლო სპორტი",
      other: "🏆 სხვა სპორტი"
    };

    return (
      names[id] ||
      "🏆 სხვა სპორტი"
    );

  }

  /* =======================================================
     DATE
  ======================================================= */

  function formatDate(
    value
  ) {

    if (!value) {
      return "";
    }

    try {

      return new Date(
        value
      ).toLocaleString(
        "ka-GE",
        {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    } catch {

      return "";

    }

  }

  /* =======================================================
     IMAGE
  ======================================================= */

  function imageFor(
    article
  ) {

    if (
      article &&
      article.image
    ) {
      return article.image;
    }

    return (
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="900"
             height="500"
             viewBox="0 0 900 500">
          <rect width="900"
                height="500"
                fill="#dfe8e4"/>
          <text x="450"
                y="245"
                text-anchor="middle"
                font-size="48"
                font-family="Arial"
                fill="#18865e">
            L-LIVE
          </text>
          <text x="450"
                y="300"
                text-anchor="middle"
                font-size="26"
                font-family="Arial"
                fill="#555">
            WORLD SPORT
          </text>
        </svg>
      `)
    );

  }

  /* =======================================================
     LOAD ARTICLES
  ======================================================= */

  async function loadArticles() {

    try {

      const category =
        state.category;

      const url =
        category === "all"
          ? "/api/articles"
          : "/api/articles?category=" +
            encodeURIComponent(
              category
            );

      const data =
        await request(url);

      state.articles =
        Array.isArray(
          data.articles
        )
          ? data.articles
          : [];

      router();

    } catch (error) {

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="error-box">

          <h2>
            მონაცემების ჩატვირთვა ვერ მოხერხდა
          </h2>

          <p>
            ${escapeHtml(
              error.message
            )}
          </p>

          <button
            class="btn btn-green"
            onclick="loadArticles()"
          >
            ხელახლა ცდა
          </button>

        </div>

      `;

    }

  }

  /* =======================================================
     CARD
  ======================================================= */

  function articleCard(
    article
  ) {

    return `

      <a
        class="card"
        href="#/article/${encodeURIComponent(
          article.id
        )}"
      >

        <img
          src="${escapeHtml(
            imageFor(article)
          )}"
          alt=""
          onerror="this.src='${escapeHtml(
            imageFor({})
          )}'"
        >

        <div class="card-body">

          <span class="tag">

            ${escapeHtml(
              categoryName(
                article.category
              )
            )}

          </span>

          <h3>

            ${escapeHtml(
              article.title
            )}

          </h3>

          ${
            article.excerpt
              ? `
                <div class="excerpt">
                  ${escapeHtml(
                    article.excerpt
                  )}
                </div>
              `
              : ""
          }

          <div class="meta">

            <span>
              ${escapeHtml(
                formatDate(
                  article.publishedAt
                )
              )}
            </span>

            ${
              article.source
                ? `
                  <span>
                    ${escapeHtml(
                      article.source
                    )}
                  </span>
                `
                : ""
            }

          </div>

        </div>

      </a>

    `;

  }

  /* =======================================================
     HOME
  ======================================================= */

  function renderHome() {

    const app =
      document.getElementById(
        "app"
      );

    const articles =
      state.articles;

    if (!articles.length) {

      app.innerHTML = `

        <div class="empty">

          <h2>
            L-LIVE WORLD SPORT
          </h2>

          <p>
            ჯერ არცერთი სტატია არ არის გამოქვეყნებული.
          </p>

        </div>

      `;

      return;

    }

    const breaking =
      articles.find(
        article =>
          article.breaking
      );

    const featured =
      articles.find(
        article =>
          article.featured
      );

    const hero =
      breaking ||
      featured;

    const remaining =
      articles.filter(
        article =>
          !hero ||
          article.id !==
          hero.id
      );

    app.innerHTML = `

      ${
        hero
          ? `

            <section class="breaking">

              <span class="tag">
                ${
                  hero.breaking
                    ? "🔥 BREAKING NEWS"
                    : "⭐ მთავარი ამბავი"
                }
              </span>

              <h1>
                ${escapeHtml(
                  hero.title
                )}
              </h1>

              ${
                hero.image
                  ? `
                    <img
                      src="${escapeHtml(
                        hero.image
                      )}"
                      alt=""
                    >
                  `
                  : ""
              }

              ${
                hero.excerpt
                  ? `
                    <p class="excerpt">
                      ${escapeHtml(
                        hero.excerpt
                      )}
                    </p>
                  `
                  : ""
              }

              <a
                class="btn btn-green"
                href="#/article/${encodeURIComponent(
                  hero.id
                )}"
              >
                სტატიის წაკითხვა →
              </a>

            </section>

          `
          : ""
      }

      <div class="section-title">

        <h2>
          📰 ბოლო ამბები
        </h2>

        <small>
          ${articles.length} სტატია
        </small>

      </div>

      <div class="article-grid">

        ${
          remaining.length
            ? remaining
                .map(
                  article =>
                    articleCard(
                      article
                    )
                )
                .join("")
            : `
              <div
                class="empty"
                style="grid-column:1/-1"
              >
                ახალი ამბები მალე დაემატება.
              </div>
            `
        }

      </div>

    `;

  }

  /* =======================================================
     ARTICLE
  ======================================================= */

  function renderArticle(
    id
  ) {

    const article =
      state.articles.find(
        item =>
          item.id === id
      );

    if (!article) {

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="empty">

          <h2>
            სტატია ვერ მოიძებნა
          </h2>

          <a
            href="#/"
            class="btn btn-green"
          >
            ← მთავარზე დაბრუნება
          </a>

        </div>

      `;

      return;

    }

    document.getElementById(
      "app"
    ).innerHTML = `

      <article class="article-page">

        <a
          href="#/"
          class="btn btn-light"
        >
          ← უკან
        </a>

        <div style="margin-top:20px">

          <span class="tag">

            ${escapeHtml(
              categoryName(
                article.category
              )
            )}

          </span>

        </div>

        <h1>

          ${escapeHtml(
            article.title
          )}

        </h1>

        <div class="meta">

          <span>
            ${escapeHtml(
              formatDate(
                article.publishedAt
              )
            )}
          </span>

          ${
            article.source
              ? `
                <span>
                  წყარო:
                  ${escapeHtml(
                    article.source
                  )}
                </span>
              `
              : ""
          }

        </div>

        ${
          article.image
            ? `
              <img
                class="main-image"
                src="${escapeHtml(
                  article.image
                )}"
                alt=""
              >
            `
            : ""
        }

        ${
          article.excerpt
            ? `
              <div class="article-excerpt">

                ${escapeHtml(
                  article.excerpt
                )}

              </div>
            `
            : ""
        }

        <div class="article-content">

          ${escapeHtml(
            article.content
          )}

        </div>

        ${
          article.source
            ? `
              <div class="source-box">

                წყარო:
                <strong>
                  ${escapeHtml(
                    article.source
                  )}
                </strong>

              </div>
            `
            : ""
        }

      </article>

    `;

  }

  /* =======================================================
     ADMIN LOGIN
  ======================================================= */

  function renderLogin() {

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="admin-box">

        <h2>
          🔐 L-LIVE Admin
        </h2>

        <p>
          ადმინისტრატორის შესვლა
        </p>

        <div class="field">

          <label>
            პაროლი
          </label>

          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            placeholder="შეიყვანე Admin პაროლი"
          >

        </div>

        <div
          id="loginError"
          style="
            color:#c62828;
            margin-bottom:12px;
            font-weight:700;
          "
        ></div>

        <div class="actions">

          <button
            id="loginButton"
            class="btn btn-green"
            onclick="loginAdmin()"
          >
            შესვლა
          </button>

          <a
            href="#/"
            class="btn btn-light"
          >
            ← მთავარი
          </a>

        </div>

      </div>

    `;

    const input =
      document.getElementById(
        "adminPassword"
      );

    if (input) {

      input.addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter"
          ) {

            loginAdmin();

          }

        }
      );

      input.focus();

    }

  }

  /* =======================================================
     ADMIN STATUS
  ======================================================= */

  async function checkAdmin() {

    try {

      const data =
        await request(
          "/api/admin/me"
        );

      state.admin =
        Boolean(
          data.admin
        );

    } catch {

      state.admin = false;

    }

  }

  /* =======================================================
     LOGIN
  ======================================================= */

  async function loginAdmin() {

    const input =
      document.getElementById(
        "adminPassword"
      );

    const error =
      document.getElementById(
        "loginError"
      );

    const button =
      document.getElementById(
        "loginButton"
      );

    if (!input) {
      return;
    }

    const password =
      input.value.trim();

    if (!password) {

      error.textContent =
        "შეიყვანე პაროლი.";

      return;

    }

    button.disabled = true;
    button.textContent =
      "მოწმდება...";

    error.textContent = "";

    try {

      await request(
        "/api/admin/login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              password
            })
        }
      );

      state.admin = true;

      state.editingId =
        null;

      renderAdmin();

    } catch (err) {

      error.textContent =
        err.message;

      button.disabled =
        false;

      button.textContent =
        "შესვლა";

    }

  }

  /* =======================================================
     LOGOUT
  ======================================================= */

  async function logoutAdmin() {

    try {

      await request(
        "/api/admin/logout",
        {
          method: "POST"
        }
      );

    } catch {}

    state.admin = false;
    state.editingId =
      null;

    location.hash =
      "#/";

  }

  /* =======================================================
     ADMIN PANEL
  ======================================================= */

  function renderAdmin() {

    if (!state.admin) {

      renderLogin();

      return;

    }

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="section-title">

        <h2>
          🔐 L-LIVE Admin
        </h2>

        <button
          class="btn btn-dark"
          onclick="logoutAdmin()"
        >
          გასვლა
        </button>

      </div>

      <div class="admin-box">

        <h2>

          ${
            state.editingId
              ? "სტატიის რედაქტირება"
              : "ახალი სტატიის დამატება"
          }

        </h2>

        <form
          id="articleForm"
          onsubmit="saveArticle(event)"
        >

          <div class="form-grid">

            <div class="field full">

              <label>
                სათაური *
              </label>

              <input
                id="title"
                required
                placeholder="სტატიის სათაური"
              >

            </div>

            <div class="field">

              <label>
                სპორტი
              </label>

              <select id="category">

                <option value="football">
                  ⚽ ფეხბურთი
                </option>

                <option value="basketball">
                  🏀 კალათბურთი
                </option>

                <option value="tennis">
                  🎾 ჩოგბურთი
                </option>

                <option value="rugby">
                  🏉 რაგბი
                </option>

                <option value="motorsport">
                  🏎️ ავტოსპორტი
                </option>

                <option value="combat">
                  🥊 საბრძოლო სპორტი
                </option>

                <option value="other">
                  🏆 სხვა სპორტი
                </option>

              </select>

            </div>

            <div class="field">

              <label>
                წყარო
              </label>

              <input
                id="source"
                placeholder="მაგ: ოფიციალური წყარო"
              >

            </div>

            <div class="field full">

              <label>
                ფოტოს არჩევა ტელეფონიდან
              </label>

              <input
                id="imageFile"
                type="file"
                accept="image/*"
              >

              <small>
                მაქსიმუმ 6 MB
              </small>

            </div>

            <div class="field full">

              <label>
                ან ფოტოს URL
              </label>

              <input
                id="image"
                placeholder="https://..."
              >

            </div>

            <div class="field full">

              <label>
                მოკლე აღწერა
              </label>

              <textarea
                id="excerpt"
                placeholder="სტატიის მოკლე შესავალი..."
              ></textarea>

            </div>

            <div class="field full">

              <label>
                სრული სტატია *
              </label>

              <textarea
                id="content"
                required
                placeholder="დაწერე სტატიის სრული ტექსტი..."
              ></textarea>

            </div>

            <div class="field full">

              <div class="checks">

                <label>
                  <input
                    id="breaking"
                    type="checkbox"
                  >
                  🔥 Breaking News
                </label>

                <label>
                  <input
                    id="featured"
                    type="checkbox"
                  >
                  ⭐ მთავარი ამბავი
                </label>

              </div>

            </div>

          </div>

          <div class="actions">

            <button
              type="submit"
              class="btn btn-green"
              id="saveButton"
            >

              ${
                state.editingId
                  ? "შენახვა"
                  : "გამოქვეყნება"
              }

            </button>

            <button
              type="button"
              class="btn btn-light"
              onclick="clearForm()"
            >
              გასუფთავება
            </button>

          </div>

        </form>

      </div>

      <div class="section-title">

        <h2>
          გამოქვეყნებული სტატიები
        </h2>

        <small>
          ${state.articles.length}
        </small>

      </div>

      <div>

        ${
          state.articles.length
            ? state.articles
                .map(
                  article => `

                    <div class="admin-article">

                      <img
                        src="${escapeHtml(
                          imageFor(
                            article
                          )
                        )}"
                        alt=""
                      >

                      <div>

                        <h3>
                          ${escapeHtml(
                            article.title
                          )}
                        </h3>

                        <div class="meta">

                          <span>
                            ${escapeHtml(
                              categoryName(
                                article.category
                              )
                            )}
                          </span>

                          <span>
                            ${escapeHtml(
                              formatDate(
                                article.publishedAt
                              )
                            )}
                          </span>

                        </div>

                      </div>

                      <div class="actions">

                        <button
                          class="btn btn-light"
                          onclick="editArticle('${escapeHtml(
                            article.id
                          )}')"
                        >
                          ✏️
                        </button>

                        <button
                          class="btn btn-red"
                          onclick="deleteArticle('${escapeHtml(
                            article.id
                          )}')"
                        >
                          🗑️
                        </button>

                      </div>

                    </div>

                  `
                )
                .join("")
            : `
              <div class="empty">
                ჯერ არცერთი სტატია არ არის.
              </div>
            `
        }

      </div>

    `;

    if (
      state.editingId
    ) {

      const article =
        state.articles.find(
          item =>
            item.id ===
            state.editingId
        );

      if (article) {

        document.getElementById(
          "title"
        ).value =
          article.title || "";

        document.getElementById(
          "category"
        ).value =
          article.category ||
          "other";

        document.getElementById(
          "source"
        ).value =
          article.source || "";

        document.getElementById(
          "image"
        ).value =
          article.image || "";

        document.getElementById(
          "excerpt"
        ).value =
          article.excerpt || "";

        document.getElementById(
          "content"
        ).value =
          article.content || "";

        document.getElementById(
          "breaking"
        ).checked =
          Boolean(
            article.breaking
          );

        document.getElementById(
          "featured"
        ).checked =
          Boolean(
            article.featured
          );

      }

    }

  }

  /* =======================================================
     CLEAR FORM
  ======================================================= */

  function clearForm() {

    state.editingId =
      null;

    renderAdmin();

  }

  /* =======================================================
     SAVE ARTICLE
  ======================================================= */

  async function saveArticle(
    event
  ) {

    event.preventDefault();

    const button =
      document.getElementById(
        "saveButton"
      );

    button.disabled =
      true;

    button.textContent =
      "იტვირთება...";

    try {

      const form =
        new FormData();

      form.append(
        "title",
        document.getElementById(
          "title"
        ).value
      );

      form.append(
        "category",
        document.getElementById(
          "category"
        ).value
      );

      form.append(
        "source",
        document.getElementById(
          "source"
        ).value
      );

      form.append(
        "image",
        document.getElementById(
          "image"
        ).value
      );

      form.append(
        "excerpt",
        document.getElementById(
          "excerpt"
        ).value
      );

      form.append(
        "content",
        document.getElementById(
          "content"
        ).value
      );

      form.append(
        "breaking",
        document.getElementById(
          "breaking"
        ).checked
          ? "true"
          : "false"
      );

      form.append(
        "featured",
        document.getElementById(
          "featured"
        ).checked
          ? "true"
          : "false"
      );

      const file =
        document.getElementById(
          "imageFile"
        ).files[0];

      if (file) {

        form.append(
          "imageFile",
          file
        );

      }

      const url =
        state.editingId
          ? "/api/articles/" +
            encodeURIComponent(
              state.editingId
            )
          : "/api/articles";

      const response =
        await fetch(
          url,
          {
            method:
              state.editingId
                ? "PUT"
                : "POST",

            credentials:
              "same-origin",

            body: form
          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error ||
          "სტატიის შენახვა ვერ მოხერხდა."
        );

      }

      state.editingId =
        null;

      await loadArticles();

      renderAdmin();

      alert(
        "სტატია წარმატებით შეინახა."
      );

    } catch (error) {

      alert(
        error.message
      );

      button.disabled =
        false;

      button.textContent =
        "გამოქვეყნება";

    }

  }

  /* =======================================================
     EDIT
  ======================================================= */

  function editArticle(
    id
  ) {

    const article =
      state.articles.find(
        item =>
          item.id === id
      );

    if (!article) {
      return;
    }

    state.editingId =
      id;

    renderAdmin();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

  /* =======================================================
     DELETE
  ======================================================= */

  async function deleteArticle(
    id
  ) {

    if (
      !confirm(
        "ნამდვილად გინდა ამ სტატიის წაშლა?"
      )
    ) {
      return;
    }

    try {

      await request(
        "/api/articles/" +
        encodeURIComponent(
          id
        ),
        {
          method: "DELETE"
        }
      );

      await loadArticles();

      if (state.admin) {
        renderAdmin();
      }

    } catch (error) {

      alert(
        error.message
      );

    }

  }

  /* =======================================================
     SEARCH
  ======================================================= */

  async function searchArticles(
    query
  ) {

    if (!query) {

      renderHome();

      return;

    }

    try {

      const data =
        await request(
          "/api/search?q=" +
          encodeURIComponent(
            query
          )
        );

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="section-title">

          <h2>
            🔎 ძებნა
          </h2>

          <small>
            ${data.count} შედეგი
          </small>

        </div>

        <div class="article-grid">

          ${
            data.articles.length
              ? data.articles
                  .map(
                    articleCard
                  )
                  .join("")
              : `
                <div
                  class="empty"
                  style="grid-column:1/-1"
                >
                  ძებნის შედეგად სტატია ვერ მოიძებნა.
                </div>
              `
          }

        </div>

      `;

    } catch (error) {

      alert(
        error.message
      );

    }

  }

  /* =======================================================
     ROUTER
  ======================================================= */

  async function router() {

    const hash =
      location.hash ||
      "#/";

    if (
      hash.startsWith(
        "#/article/"
      )
    ) {

      const id =
        decodeURIComponent(
          hash.substring(
            "#/article/"
              .length
          )
        );

      renderArticle(id);

      return;

    }

    if (
      hash ===
      "#/admin"
    ) {

      await checkAdmin();

      renderAdmin();

      return;

    }

    renderHome();

  }

  /* =======================================================
     CATEGORY BUTTONS
  ======================================================= */

  document
    .querySelectorAll(
      "[data-category]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            state.category =
              button.dataset.category;

            document
              .querySelectorAll(
                "[data-category]"
              )
              .forEach(
                item => {

                  item.classList.toggle(
                    "active",
                    item ===
                      button
                  );

                }
              );

            location.hash =
              "#/";

            await loadArticles();

          }
        );

      }
    );

  /* =======================================================
     SEARCH
  ======================================================= */

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          searchArticles(
            event.target.value.trim()
          );

        }

      }
    );

  /* =======================================================
     HASH
  ======================================================= */

  window.addEventListener(
    "hashchange",
    router
  );

  /* =======================================================
     START
  ======================================================= */

  loadArticles();

</script>

</body>
</html>
