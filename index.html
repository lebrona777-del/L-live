<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>L-LIVE</title>

<style>
*{box-sizing:border-box}

:root{
  --green:#087a43;
  --green2:#0a8f50;
  --bg:#f2f4f3;
  --card:#fff;
  --line:#e3e7e5;
  --text:#18221d;
  --muted:#77817b;
  --red:#e53935;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans Georgian",sans-serif;
  font-size:13px;
}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--green);
  color:#fff;
  padding:10px 12px;
}

.header-row{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:.7px;
}

.live{
  font-size:10px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:5px;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff3b30;
}

main{
  max-width:900px;
  margin:auto;
  padding-bottom:65px;
}

/* SPORTS */

.sports{
  background:#fff;
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:7px 9px;
  border-bottom:1px solid var(--line);
}

.sport{
  border:0;
  background:#f1f3f2;
  border-radius:8px;
  padding:7px 12px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.sport.active{
  background:var(--green);
  color:#fff;
}

/* CHAMPIONSHIPS */

.champ-wrap{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:8px 9px;
}

.small-title{
  font-size:11px;
  color:var(--muted);
  font-weight:800;
  margin-bottom:6px;
}

.champions{
  display:flex;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:none;
}

.champions::-webkit-scrollbar,
.sports::-webkit-scrollbar{
  display:none;
}

.champ{
  border:1px solid var(--line);
  background:#fff;
  border-radius:7px;
  padding:6px 9px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.champ.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

/* QUICK NAV */

.quick{
  display:flex;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.quick button{
  flex:1;
  border:0;
  background:#fff;
  padding:9px 3px;
  font-size:11px;
  font-weight:800;
  color:#59635d;
}

.quick button.active{
  color:var(--green);
  border-bottom:2px solid var(--green);
}

/* SECTION */

.section{
  padding:9px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}

.section-title{
  font-size:14px;
  font-weight:900;
}

.source{
  font-size:9px;
  color:var(--muted);
}

/* TEAMS */

.teams{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding-bottom:2px;
}

.team-chip{
  min-width:max-content;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  padding:7px 9px;
  font-size:11px;
  font-weight:700;
}

/* MATCH */

.match{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:9px 10px;
  cursor:pointer;
}

.match:first-child{
  border-radius:9px 9px 0 0;
}

.match:last-child{
  border-radius:0 0 9px 9px;
}

.match-top{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:9px;
  margin-bottom:7px;
}

.match-live{
  color:var(--red);
  font-weight:900;
}

.match-main{
  display:grid;
  grid-template-columns:1fr 54px 1fr;
  align-items:center;
  gap:7px;
}

.club{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
  font-size:12px;
  font-weight:800;
}

.club.away{
  justify-content:flex-end;
  text-align:right;
}

.club-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.score{
  text-align:center;
  font-size:17px;
  font-weight:900;
}

.match-time{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}

.mini-logo{
  width:25px;
  height:25px;
  object-fit:contain;
  flex:none;
}

/* STANDINGS */

.standings-box{
  overflow-x:auto;
}

.stand-card{
  background:#fff;
  border-radius:9px;
  overflow:hidden;
  margin-bottom:8px;
}

.group-title{
  padding:8px 9px;
  font-size:11px;
  font-weight:900;
  border-bottom:1px solid var(--line);
}

.table{
  width:100%;
  min-width:600px;
  border-collapse:collapse;
}

.table th{
  background:var(--green);
  color:#fff;
  padding:7px 5px;
  font-size:9px;
  text-align:center;
}

.table td{
  padding:8px 5px;
  border-bottom:1px solid #edf0ee;
  font-size:10px;
  text-align:center;
  white-space:nowrap;
}

.table tr:last-child td{
  border-bottom:0;
}

.table td:nth-child(2){
  text-align:left;
  font-weight:800;
}

.pos{
  font-weight:900;
}

.pts{
  color:var(--green);
  font-weight:900;
}

/* EMPTY / LOADING */

.loading,
.empty{
  background:#fff;
  border-radius:9px;
  padding:14px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-height:88vh;
  overflow:auto;
  background:#fff;
  border-radius:18px 18px 0 0;
  padding:15px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  font-size:16px;
}

.close{
  border:0;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#eef1ef;
  font-size:20px;
}

.event-title{
  margin-top:18px;
  font-weight:900;
  font-size:12px;
}

.event{
  padding:8px 0;
  border-bottom:1px solid var(--line);
  font-size:11px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  height:54px;
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;
}

.bottom button{
  flex:1;
  border:0;
  background:#fff;
  color:#68726c;
  font-size:10px;
  font-weight:800;
}

.bottom button.active{
  color:var(--green);
}

@media(min-width:700px){
  .bottom{
    display:none;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-row">
    <div class="logo">L-LIVE</div>
    <div class="live">
      <span class="live-dot"></span>
      LIVE SPORTS
    </div>
  </div>
</header>

<main>

  <!-- SPORTS -->

  <div class="sports">

    <button class="sport active" data-sport="football">
      ⚽ ფეხბურთი
    </button>

    <button class="sport" data-sport="basketball">
      🏀 კალათბურთი
    </button>

    <button class="sport" data-sport="rugby">
      🏉 რაგბი
    </button>

  </div>


  <!-- CHAMPIONSHIPS -->

  <div class="champ-wrap">

    <div class="small-title">
      ჩემპიონატები
    </div>

    <div id="championships" class="champions">
      <div class="loading">იტვირთება...</div>
    </div>

  </div>


  <!-- QUICK NAV -->

  <div class="quick">

    <button class="quick-btn active" data-tab="live">
      🔴 LIVE
    </button>

    <button class="quick-btn" data-tab="today">
      დღეს
    </button>

    <button class="quick-btn" data-tab="upcoming">
      მომავალი
    </button>

    <button class="quick-btn" data-tab="results">
      შედეგები
    </button>

  </div>


  <!-- TEAMS -->

  <section class="section">

    <div class="section-head">
      <div class="section-title">
        გუნდები
      </div>

      <div class="source">
        L-LIVE
      </div>
    </div>

    <div id="teamsList" class="teams">
      <div class="loading">
        იტვირთება...
      </div>
    </div>

  </section>


  <!-- MATCHES -->

  <section class="section">

    <div class="section-head">
      <div class="section-title">
        მატჩები
      </div>
    </div>

    <div id="matches">
      <div class="loading">
        მატჩები იტვირთება...
      </div>
    </div>

  </section>


  <!-- STANDINGS -->

  <section class="section">

    <div class="section-head">

      <div class="section-title">
        📊 სატურნირო ცხრილი
      </div>

      <div class="source">
        ოფიციალური წყარო
      </div>

    </div>

    <div id="standings" class="standings-box">

      <div class="loading">
        ცხრილი იტვირთება...
      </div>

    </div>

  </section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <button class="active">
    🏠<br>
    მთავარი
  </button>

  <button
    onclick="setTabFromBottom('live')"
  >
    🔴<br>
    LIVE
  </button>

  <button
    onclick="scrollToStandings()"
  >
    📊<br>
    ცხრილი
  </button>

  <button
    onclick="scrollToChampionships()"
  >
    🏆<br>
    ჩემპიონატები
  </button>

</nav>


<!-- MODAL -->

<div id="modal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        მატჩის დეტალები
      </h2>

      <button
        id="closeModal"
        class="close"
      >
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let currentSport = "football";

let currentCompetition =
  "national-league";

let currentTab = "live";

let championshipData = {
  football: [],
  basketball: [],
  rugby: []
};


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function teamName(team){

  if(!team){
    return "—";
  }

  if(typeof team === "string"){
    return team;
  }

  return (
    team.short ||
    team.name ||
    team.teamName ||
    team.title ||
    "—"
  );

}


function teamLogo(team){

  if(
    team &&
    typeof team === "object" &&
    team.logo
  ){

    return `
      <img
        class="mini-logo"
        src="${escapeHTML(team.logo)}"
        alt="${escapeHTML(teamName(team))}"
        onerror="this.style.display='none'"
      >
    `;

  }

  return "";

}


function formatStatus(match){

  const status =
    String(match?.status || "")
      .toLowerCase();

  if(
    status === "live" ||
    status === "in_progress" ||
    status === "playing" ||
    status === "1h" ||
    status === "2h"
  ){

    return `
      <span class="match-live">
        ● LIVE
      </span>
    `;

  }

  if(
    status === "finished" ||
    status === "ft"
  ){

    return "დასრულდა";

  }

  return match?.time || "მალე";

}


/* =====================================================
   API
===================================================== */

async function apiFetch(url){

  const response =
    await fetch(
      url,
      {
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      `API ${response.status}`
    );

  }

  return await response.json();

}


/* =====================================================
   CHAMPIONSHIPS
===================================================== */

async function loadChampionships(){

  const container =
    document.getElementById(
      "championships"
    );

  container.innerHTML =
    `<div class="loading">
      იტვირთება...
    </div>`;

  try{

    const data =
      await apiFetch(
        "/api/championships"
      );

    const list =
      Array.isArray(data)
        ? data
        : [];

    championshipData = {

      football:
        list.filter(
          item =>
            item &&
            item.sport === "football"
        ),

      basketball:
        list.filter(
          item =>
            item &&
            item.sport === "basketball"
        ),

      rugby:
        list.filter(
          item =>
            item &&
            item.sport === "rugby"
        )

    };


    const currentList =
      championshipData[
        currentSport
      ] || [];


    if(currentList.length){

      const exists =
        currentList.some(
          item =>
            item.id ===
            currentCompetition
        );

      if(!exists){

        currentCompetition =
          currentList[0].id;

      }

    }else{

      currentCompetition = "";

    }


    renderChampionships();

  }catch(error){

    console.error(
      "CHAMPIONSHIPS ERROR",
      error
    );

    container.innerHTML =
      `<div class="empty">
        ჩემპიონატები ვერ ჩაიტვირთა.
      </div>`;

  }

}


/* =====================================================
   CHAMPIONSHIP BUTTONS
===================================================== */

function renderChampionships(){

  const container =
    document.getElementById(
      "championships"
    );

  const list =
    championshipData[
      currentSport
    ] || [];


  container.innerHTML = "";


  if(!list.length){

    container.innerHTML =
      `<div class="empty">
        ჩემპიონატები არ არის.
      </div>`;

    return;

  }


  list.forEach(
    competition => {

      const button =
        document.createElement(
          "button"
        );

      button.className = "champ";


      if(
        competition.id ===
        currentCompetition
      ){

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        competition.name ||
        competition.shortName ||
        competition.id;


      button.onclick =
        async () => {

          currentCompetition =
            competition.id;

          renderChampionships();

          await loadTeams();

          await loadMatches();

          await loadStandings();

        };


      container.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   TEAMS
===================================================== */

async function loadTeams(){

  const container =
    document.getElementById(
      "teamsList"
    );

  container.innerHTML =
    `<div class="loading">
      იტვირთება...
    </div>`;


  if(!currentCompetition){

    container.innerHTML =
      `<div class="empty">
        ჩემპიონატი აირჩიე.
      </div>`;

    return;

  }


  try{

    const url =
      `/api/teams?sport=${
        encodeURIComponent(
          currentSport
        )
      }&competition=${
        encodeURIComponent(
          currentCompetition
        )
      }`;


    const data =
      await apiFetch(url);


    const teams =
      Array.isArray(data?.teams)
        ? data.teams
        : [];


    renderTeams(teams);

  }catch(error){

    console.error(
      "TEAMS ERROR",
      error
    );

    container.innerHTML =
      `<div class="empty">
        გუნდები ვერ ჩაიტვირთა.
      </div>`;

  }

}


/* =====================================================
   RENDER TEAMS
===================================================== */

function renderTeams(teams){

  const container =
    document.getElementById(
      "teamsList"
    );

  container.innerHTML = "";


  if(!teams.length){

    container.innerHTML =
      `<div class="empty">
        გუნდები არ არის.
      </div>`;

    return;

  }


  teams.forEach(
    team => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "team-chip";


      item.textContent =
        teamName(team);


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   STANDINGS
===================================================== */

async function loadStandings(){

  const container =
    document.getElementById(
      "standings"
    );

  container.innerHTML =
    `<div class="loading">
      ცხრილი იტვირთება...
    </div>`;


  if(!currentCompetition){

    container.innerHTML =
      `<div class="empty">
        ჩემპიონატი აირჩიე.
      </div>`;

    return;

  }


  try{

    const data =
      await apiFetch(
        "/api/standings?competition=" +
        encodeURIComponent(
          currentCompetition
        )
      );


    const groups =
      Array.isArray(
        data?.groups
      )
        ? data.groups
        : [];


    if(!groups.length){

      container.innerHTML =
        `<div class="empty">
          ამ ჩემპიონატისთვის ცხრილი ჯერ ვერ ჩაიტვირთა.
        </div>`;

      return;

    }


    container.innerHTML = "";


    groups.forEach(
      (rows, groupIndex) => {

        if(
          !Array.isArray(rows) ||
          !rows.length
        ){

          return;

        }


        const card =
          document.createElement(
            "div"
          );

        card.className =
          "stand-card";


        if(groups.length > 1){

          const title =
            document.createElement(
              "div"
            );

          title.className =
            "group-title";

          title.textContent =
            "ჯგუფი " +
            (groupIndex + 1);

          card.appendChild(
            title
          );

        }


        const table =
          document.createElement(
            "table"
          );

        table.className =
          "table";


        table.innerHTML = `

          <thead>

            <tr>
              <th>#</th>
              <th>გუნდი</th>
              <th>თ</th>
              <th>მ</th>
              <th>ფ</th>
              <th>წ</th>
              <th>გატ.</th>
              <th>მიღ.</th>
              <th>±</th>
              <th>ქ</th>
            </tr>

          </thead>

          <tbody></tbody>

        `;


        const tbody =
          table.querySelector(
            "tbody"
          );


        rows.forEach(
          row => {

            const tr =
              document.createElement(
                "tr"
              );


            tr.innerHTML = `

              <td class="pos">
                ${escapeHTML(
                  row.position
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.team
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.played
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.wins
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.draws
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.losses
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.goalsFor
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.goalsAgainst
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.goalDiff
                )}
              </td>

              <td class="pts">
                ${escapeHTML(
                  row.points
                )}
              </td>

            `;


            tbody.appendChild(
              tr
            );

          }
        );


        card.appendChild(
          table
        );


        container.appendChild(
          card
        );

      }
    );


    const source =
      document.createElement(
        "div"
      );

    source.className =
      "source";

    source.style.padding =
      "4px 2px 8px";

    source.textContent =
      "ოფიციალური წყაროდან";


    container.appendChild(
      source
    );


  }catch(error){

    console.error(
      "STANDINGS ERROR",
      error
    );


    container.innerHTML =
      `<div class="empty">
        ცხრილი ვერ ჩაიტვირთა.
      </div>`;

  }

}


/* =====================================================
   MATCHES
===================================================== */

async function loadMatches(){

  const container =
    document.getElementById(
      "matches"
    );

  container.innerHTML =
    `<div class="loading">
      მატჩები იტვირთება...
    </div>`;


  let url = "";


  const query =
    currentCompetition
      ? "&competition=" +
        encodeURIComponent(
          currentCompetition
        )
      : "";


  try{

    if(
      currentTab === "live"
    ){

      url =
        `/api/live?sport=${
          encodeURIComponent(
            currentSport
          )
        }${query}`;

    }else if(
      currentTab === "today"
    ){

      url =
        `/api/matches/today?sport=${
          encodeURIComponent(
            currentSport
          )
        }${query}`;

    }else if(
      currentTab === "upcoming"
    ){

      url =
        `/api/matches/upcoming?sport=${
          encodeURIComponent(
            currentSport
          )
        }${query}`;

    }else{

      url =
        `/api/matches/results?sport=${
          encodeURIComponent(
            currentSport
          )
        }${query}`;

    }


    const data =
      await apiFetch(url);


    const matches =
      Array.isArray(
        data?.matches
      )
        ? data.matches
        : [];


    renderMatches(
      matches
    );


  }catch(error){

    console.error(
      "MATCHES ERROR",
      error
    );


    container.innerHTML =
      `<div class="empty">
        მატჩები ვერ ჩაიტვირთა.
      </div>`;

  }

}


/* =====================================================
   RENDER MATCHES
===================================================== */

function renderMatches(matches){

  const container =
    document.getElementById(
      "matches"
    );

  container.innerHTML = "";


  if(!matches.length){

    container.innerHTML =
      `<div class="empty">
        მატჩები არ არის.
      </div>`;

    return;

  }


  matches.forEach(
    match => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "match";


      const home =
        match.homeTeam ||
        match.home ||
        "";


      const away =
        match.awayTeam ||
        match.away ||
        "";


      let score = "—";


      if(
        match.homeScore !==
          null &&
        match.homeScore !==
          undefined &&
        match.awayScore !==
          null &&
        match.awayScore !==
          undefined
      ){

        score =
          `${match.homeScore} : ${match.awayScore}`;

      }


      card.innerHTML = `

        <div class="match-top">

          <span>
            ${escapeHTML(
              match.competitionName ||
              match.competition ||
              ""
            )}
          </span>

          <span>
            ${formatStatus(match)}
          </span>

        </div>


        <div class="match-main">

          <div class="club">

            ${teamLogo(home)}

            <span class="club-name">
              ${escapeHTML(
                teamName(home)
              )}
            </span>

          </div>


          <div class="score">

            ${escapeHTML(score)}

            ${
              match.time
              ?
              `<div class="match-time">
                ${escapeHTML(
                  match.time
                )}
              </div>`
              :
              ""
            }

          </div>


          <div class="club away">

            <span class="club-name">
              ${escapeHTML(
                teamName(away)
              )}
            </span>

            ${teamLogo(away)}

          </div>

        </div>

      `;


      card.onclick =
        () => openMatch(match);


      container.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   MATCH DETAILS
===================================================== */

function openMatch(match){

  const modal =
    document.getElementById(
      "modal"
    );


  const content =
    document.getElementById(
      "modalContent"
    );


  const home =
    match.homeTeam ||
    match.home ||
    "";


  const away =
    match.awayTeam ||
    match.away ||
    "";


  const events =
    Array.isArray(
      match.events
    )
      ? match.events
      : [];


  let eventsHTML = "";


  if(events.length){

    eventsHTML =
      events
        .map(
          event => `

            <div class="event">

              ${
                event.minute
                ?
                escapeHTML(
                  event.minute
                ) + "' "
                :
                ""
              }

              ${escapeHTML(
                event.type ||
                ""
              )}

              ${
                event.player
                ?
                " — " +
                escapeHTML(
                  event.player
                )
                :
                ""
              }

            </div>

          `
        )
        .join("");

  }else{

    eventsHTML =
      `<div class="event">
        დეტალური მოვლენები ჯერ არ არის.
      </div>`;

  }


  content.innerHTML = `

    <div class="match-main">

      <div class="club">

        ${teamLogo(home)}

        <span class="club-name">
          ${escapeHTML(
            teamName(home)
          )}
        </span>

      </div>


      <div class="score">

        ${match.homeScore ?? "—"}
        :
        ${match.awayScore ?? "—"}

      </div>


      <div class="club away">

        <span class="club-name">
          ${escapeHTML(
            teamName(away)
          )}
        </span>

        ${teamLogo(away)}

      </div>

    </div>


    <div class="event-title">
      ⚽ მოვლენები
    </div>

    ${eventsHTML}


    <div class="event-title">
      🟨 ბარათები
    </div>

    <div class="event">
      დეტალური ინფორმაცია ჯერ არ არის.
    </div>


    <div class="event-title">
      🔄 ცვლილებები
    </div>

    <div class="event">
      დეტალური ინფორმაცია ჯერ არ არის.
    </div>

  `;


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   MODAL
===================================================== */

document
  .getElementById(
    "closeModal"
  )
  .onclick =
  () => {

    document
      .getElementById(
        "modal"
      )
      .classList.remove(
        "show"
      );

  };


document
  .getElementById(
    "modal"
  )
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        event.currentTarget
          .classList.remove(
            "show"
          );

      }

    }
  );


/* =====================================================
   SPORTS
===================================================== */

document
  .querySelectorAll(
    ".sport"
  )
  .forEach(
    button => {

      button.onclick =
        async () => {

          document
            .querySelectorAll(
              ".sport"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentSport =
            button.dataset.sport;


          const list =
            championshipData[
              currentSport
            ] || [];


          currentCompetition =
            list.length
              ? list[0].id
              : "";


          renderChampionships();

          await loadTeams();

          await loadMatches();

          await loadStandings();

        };

    }
  );


/* =====================================================
   TABS
===================================================== */

document
  .querySelectorAll(
    ".quick-btn"
  )
  .forEach(
    button => {

      button.onclick =
        async () => {

          document
            .querySelectorAll(
              ".quick-btn"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentTab =
            button.dataset.tab;


          await loadMatches();

        };

    }
  );


/* =====================================================
   BOTTOM NAV
===================================================== */

function setTabFromBottom(tab){

  currentTab = tab;


  document
    .querySelectorAll(
      ".quick-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.tab === tab
        );

      }
    );


  loadMatches();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function scrollToStandings(){

  document
    .getElementById(
      "standings"
    )
    .scrollIntoView({
      behavior:"smooth"
    });

}


function scrollToChampionships(){

  document
    .getElementById(
      "championships"
    )
    .scrollIntoView({
      behavior:"smooth"
    });

}
