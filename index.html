<html lang="ka">
<head>

<title>L-LIVE — Match Analysis</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f5;color:#10251c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.header{position:sticky;top:0;z-index:50;background:#075b3b;color:#fff;padding:13px 15px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:25px;font-weight:950}
.sub{font-size:10px;opacity:.75;letter-spacing:.7px}
.container{max-width:900px;margin:auto;padding:12px 12px 80px}
.nav{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;position:sticky;top:64px;z-index:30;background:#f3f7f5}
.nav button{background:#fff;border:1px solid #d9e5df;border-radius:12px;padding:10px 13px;white-space:nowrap;font-weight:750;color:#315046}
.nav button.active{background:#075b3b;color:#fff;border-color:#075b3b}
.card{background:#fff;border:1px solid #e0ebe6;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #143d2a0c}
.title{font-size:18px;font-weight:900;margin:6px 0 12px}
.muted{color:#687a72;font-size:12px}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:8px}
.pill{background:#fff;border:1px solid #d8e4df;border-radius:18px;padding:8px 13px;white-space:nowrap}
.pill.active{background:#075b3b;color:#fff}
.match{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;text-align:center;gap:10px}
.team{font-weight:850}
.score{font-size:23px;font-weight:950}
.status{font-size:11px;margin-top:4px}
.live{color:#d51e2c;font-weight:900}
.upcoming{color:#075b3b;font-weight:800}
.finished{color:#63766e}
.open{background:transparent;width:100%;padding:0;text-align:left}
.comp{font-size:12px;color:#63766e;font-weight:750;margin-bottom:10px}
.detail{display:none}
.detail.show{display:block}
.back{background:#e7f0ec;color:#075b3b;border-radius:10px;padding:9px 12px;font-weight:800;margin-bottom:10px}
.hero{background:#075b3b;color:#fff;border-radius:18px;padding:19px}
.hero .match{grid-template-columns:1fr 95px 1fr}
.hero .score{font-size:38px}
.tabs{display:flex;background:#fff;border-radius:12px;overflow:hidden;margin:12px 0}
.tab{flex:1;background:#fff;padding:12px}
.tab.active{color:#075b3b;font-weight:900;border-bottom:3px solid #075b3b}
.event{display:flex;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #edf2ef}
.minute{width:38px;font-weight:900}
.icon{width:28px;text-align:center}
.competition,.teamRow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid #edf1ef}
.badge{width:42px;height:42px;border-radius:11px;background:#e7f0ec;display:grid;place-items:center;font-size:20px}
.grow{flex:1}
.arrow{color:#075b3b;font-weight:900}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:9px 5px;border-bottom:1px solid #edf1ef;text-align:center}
.table th:nth-child(2),.table td:nth-child(2){text-align:left}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{width:100%;padding:11px;border:1px solid #d4e0db;border-radius:10px;margin:4px 0 8px;background:#fff}
.primary{background:#075b3b;color:#fff;border-radius:10px;padding:11px 15px;font-weight:850}
.danger{background:#b51d2a;color:#fff;border-radius:10px;padding:9px 12px}
.smallbtn{padding:8px 10px;border-radius:9px;background:#edf3f0;color:#075b3b;font-weight:750}
.adminbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.login{max-width:420px;margin:35px auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 5px 25px #153c2a18}
.hidden{display:none!important}
.empty{text-align:center;padding:30px;color:#6c7d76}
.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.metric{background:#f5f9f7;border:1px solid #e0ebe6;border-radius:12px;padding:11px;text-align:center}
.metric b{display:block;font-size:22px}
.metric span{font-size:11px;color:#687a72}
.bar{height:10px;background:#e8efec;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:#075b3b;border-radius:99px}
.analysis-note{padding:12px;background:#f5f9f7;border-left:4px solid #075b3b;border-radius:8px;line-height:1.5}
.available{color:#075b3b;font-weight:800}
.unavailable{color:#8a6d3b}
.formline{display:flex;align-items:center;gap:8px;margin:8px 0}
.formdot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e7f0ec;font-weight:900}
.statrow{display:grid;grid-template-columns:1fr 55px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1ef}
.statrow .right{text-align:right}
.center{text-align:center;font-weight:850}
@media(max-width:560px){
.grid{grid-template-columns:1fr}
.match{grid-template-columns:1fr 65px 1fr}
.hero .match{grid-template-columns:1fr 80px 1fr}
.team{font-size:14px}
.metricgrid{grid-template-columns:repeat(2,1fr)}
}
</style>

function esc(v){

return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function teamName(id){

return teams[id]?.name || "უცნობი გუნდი";

}


function compName(id){

return competitions[id]?.name || "ჩემპიონატი";

}


function statusLabel(m){

if(m.status==="live")return "LIVE";
if(m.status==="half")return "ტაიმი";
if(m.status==="finished")return "დასრულებული";
return "მომავალი";

}


function matchDate(m){

if(!m.date)return "";

return `${m.date}${m.time?" • "+m.time:""}`;

}


function hidePages(){

[
"homePage",
"livePage",
"competitionsPage",
"teamsPage",
"resultsPage",
"detailPage",
"competitionDetail",
"teamDetail"
].forEach(id=>$(id).classList.add("hidden"));

}


window.go=(page,btn)=>{

hidePages();

const map={
home:"homePage",
live:"livePage",
competitions:"competitionsPage",
teams:"teamsPage",
results:"resultsPage"
};

$(map[page]).classList.remove("hidden");

document
.querySelectorAll(".nav button")
.forEach(x=>x.classList.remove("active"));

if(btn)btn.classList.add("active");

};


window.setHomeFilter=(f,btn)=>{

homeFilter=f;

document
.querySelectorAll(".filters .pill")
.forEach(x=>x.classList.remove("active"));

function matchCard(id,m){

const home=teamName(m.homeTeamId)||m.home||"მასპინძელი";
const away=teamName(m.awayTeamId)||m.away||"სტუმარი";

return `
<div class="card">
<button class="open" onclick="openMatch('${id}')">

<div class="comp">
${esc(compName(m.competitionId))}
</div>

<div class="match">

<div class="team">
${esc(home)}
</div>

<div>

<div class="score">
${m.status==="upcoming"
?"— : —"
:`${m.homeScore||0} : ${m.awayScore||0}`}
</div>

<div class="status ${m.status==="live"||m.status==="half"
?"live"
:m.status==="finished"
?"finished"
:"upcoming"}">

${esc(statusLabel(m))}

${(m.status==="live"||m.status==="half")&&m.minute
?` • ${m.minute}'`
:""}

</div>

</div>

<div class="team">
${esc(away)}
</div>

</div>

<div class="muted" style="margin-top:9px">
${esc(matchDate(m))}
${m.venue?" • "+esc(m.venue):""}
</div>

</button>
</div>
`;

}


function filterMatches(){

let arr=Object.entries(matches);

const q=($("searchBox")?.value||"").trim().toLowerCase();

if(q){

arr=arr.filter(([id,m])=>{

const text=[
teamName(m.homeTeamId),
teamName(m.awayTeamId),
compName(m.competitionId),
m.home,
m.away,
m.date,
m.time
].join(" ").toLowerCase();

return text.includes(q);

});

}

if(homeFilter!=="all"){

arr=arr.filter(([id,m])=>m.status===homeFilter);

}

return arr;

}


function sortMatches(arr){

return arr.sort((a,b)=>{

const da=`${a[1].date||""} ${a[1].time||""}`;
const db=`${b[1].date||""} ${b[1].time||""}`;

return da.localeCompare(db);

});

}


function renderHome(){

const arr=sortMatches(filterMatches());

$("homeList").innerHTML=arr.length
?arr.map(([id,m])=>matchCard(id,m)).join("")
:`<div class="empty">მატჩები ვერ მოიძებნა.</div>`;

}


function renderLive(){

const arr=Object.entries(matches)
.filter(([id,m])=>m.status==="live"||m.status==="half");

$("liveList").innerHTML=arr.length
?arr.map(([id,m])=>matchCard(id,m)).join("")
:`<div class="empty">ამჟამად LIVE მატჩი არ არის.</div>`;

}


function renderResults(){

const arr=Object.entries(matches)
.filter(([id,m])=>m.status==="finished")
.reverse();

$("resultsList").innerHTML=arr.length
?arr.map(([id,m])=>matchCard(id,m)).join("")
:`<div class="empty">დასრულებული მატჩები ჯერ არ არის.</div>`;

}

const arr=Object.entries(competitions);

$("competitionList").innerHTML=arr.length
?arr.map(([id,c])=>`

<div class="card">

<button class="open"
onclick="openCompetition('${id}')">

<div class="competition">

<div class="badge">
🏆
</div>

<div class="grow">

<b>${esc(c.name)}</b>

<div class="muted">
${esc(c.region||"საქართველო")}
</div>

</div>

<div class="arrow">
→
</div>

</div>

</button>

</div>

`).join("")
:`<div class="empty">ჩემპიონატები ჯერ არ არის.</div>`;

function renderTeams(){

$("teamList").innerHTML=arr.length
?arr.map(([id,t])=>`

<div class="card">

<button class="open"
onclick="openTeam('${id}')">

<div class="teamRow">

<div class="badge">
⚽
</div>

<div class="grow">

<b>${esc(t.name)}</b>

${esc(compName(t.competitionId))}
</div>

<div class="arrow">
→

</div>

</button>

</div>

:`<div class="empty">გუნდები ჯერ არ არის.</div>`;

window.openMatch=id=>{

currentId=id;
tab="events";

hidePages();

$("detailPage").classList.remove("hidden");

renderMatchDetail();

window.closeDetail=()=>{

currentId=null;

hidePages();

$("homePage").classList.remove("hidden");

};


window.setTab=t=>{

tab=t;

renderMatchDetail();

function recentTeamMatches(teamId,currentMatchId){

return Object.entries(matches)
.filter(([id,m])=>
id!==currentMatchId &&
m.status==="finished" &&
(m.homeTeamId===teamId||m.awayTeamId===teamId)
)
.sort((a,b)=>{

const da=`${a[1].date||""} ${a[1].time||""}`;
const db=`${b[1].date||""} ${b[1].time||""}`;

return db.localeCompare(da);

})
.slice(0,5);

}


function resultForTeam(m,teamId){

const hs=Number(m.homeScore||0);
const as=Number(m.awayScore||0);

const home=m.homeTeamId===teamId;

const gf=home?hs:as;
const ga=home?as:hs;

if(gf>ga)return"W";
if(gf<ga)return"L";

return"D";

}


function formHtml(arr){

if(!arr.length)
return `<span class="unavailable">მიუწვდომელია</span>`;

return arr.map(x=>`
<span class="formdot">${x}</span>
`).join("");

}


function h2hMatches(m){

const a=m.homeTeamId;
const b=m.awayTeamId;

if(!a||!b)return[];

return Object.entries(matches)
.filter(([id,x])=>
id!==currentId &&
x.status==="finished" &&
(
(x.homeTeamId===a&&x.awayTeamId===b)||
(x.homeTeamId===b&&x.awayTeamId===a)
)
)
.sort((x,y)=>{

const dx=`${x[1].date||""} ${x[1].time||""}`;
const dy=`${y[1].date||""} ${y[1].time||""}`;

return dy.localeCompare(dx);

})
.slice(0,5);

}


function statValue(stats,keys){

for(const key of keys){

if(stats&&stats[key]!==undefined&&stats[key]!==null){

return stats[key];

}

}

return null;

}


function renderAnalysis(m){

const home=teamName(m.homeTeamId)||m.home||"მასპინძელი";
const away=teamName(m.awayTeamId)||m.away||"სტუმარი";

:Object.values(m.events||{});

const red=events.filter(e=>e.type==="red");

const subs=events.filter(e=>e.type==="sub");

const homeGoals=goals.filter(e=>e.side==="home").length;
const awayGoals=goals.filter(e=>e.side==="away").length;

const homeRecent=recentTeamMatches(m.homeTeamId,currentId)
.map(([id,x])=>resultForTeam(x,m.homeTeamId));

const awayRecent=recentTeamMatches(m.awayTeamId,currentId)
.map(([id,x])=>resultForTeam(x,m.awayTeamId));

const h2h=h2hMatches(m);

const rows=buildStandings(m.competitionId);

const hp=rows.findIndex(x=>x.id===m.homeTeamId);
const ap=rows.findIndex(x=>x.id===m.awayTeamId);

const homePosition=hp>=0?hp+1:null;
const awayPosition=ap>=0?ap+1:null;

const stats=
m.statistics&&typeof m.statistics==="object"
?m.statistics
:{};

const possessionHome=statValue(stats,[
"homePossession",
"possessionHome"
]);

const possessionAway=statValue(stats,[
"awayPossession",
"possessionAway"
]);

let summary="";

if(m.status==="upcoming"){

function buildStandings(compId){

const map={};

Object.entries(teams)
.filter(([id,t])=>t.competitionId===compId)
.forEach(([id,t])=>{

map[id]={
id,
name:t.name,
p:0,
w:0,
d:0,
l:0,
gf:0,
ga:0,
pts:0
};

});


Object.values(matches)
.filter(m=>
m.competitionId===compId &&
m.status==="finished"
)
.forEach(m=>{

if(!map[m.homeTeamId]||!map[m.awayTeamId])return;

const h=map[m.homeTeamId];
const a=map[m.awayTeamId];

const hs=+m.homeScore||0;
const as=+m.awayScore||0;

h.p++;
a.p++;

h.gf+=hs;
h.ga+=as;

a.gf+=as;
a.ga+=hs;

if(hs>as){

h.w++;
a.l++;
h.pts+=3;

}else if(hs<as){

a.w++;
h.l++;
a.pts+=3;

}else{

h.d++;
a.d++;
h.pts++;
a.pts++;

}

});


return Object.values(map).sort((a,b)=>
(b.pts-a.pts)||
((b.gf-b.ga)-(a.gf-a.ga))||
(b.gf-a.gf)
);

}

}

:teamName(m.awayTeamId)
}`

"matches/"+id,
{

events,

[side==="home"
?"homeScore"
:"awayScore"]:
(m[
side==="home"
?"homeScore"
:"awayScore"
]||0)+1,

status:"live"

}
);

};

events.push({

minute:m.minute||0,

text:label

});


await ownerWrite(
"matches/"+id,
{

status:
m.status==="upcoming"
?"live"
:m.status
