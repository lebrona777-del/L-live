<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>L-LIVE</title>

  <style>
    :root {
      --green: #087f4f;
      --green-dark: #045c39;
      --green-light: #e9f8f1;
      --white: #ffffff;
      --bg: #f4f7f6;
      --text: #17221d;
      --muted: #718078;
      --border: #dce6e1;
      --red: #d92d20;
      --orange: #f79009;
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
    }

    /* HEADER */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 21px;
      color: var(--green-dark);
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--green);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 20px;
      box-shadow: var(--shadow);
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    /* NAV */

    .nav {
      max-width: 1100px;
      margin: auto;
      padding: 8px 12px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .nav button {
      flex: 0 0 auto;
      border: 0;
      background: #f0f4f2;
      color: #405049;
      border-radius: 12px;
      padding: 9px 13px;
      font-weight: 700;
      font-size: 13px;
    }

    .nav button.active {
      background: var(--green);
      color: white;
    }

    /* MAIN */

    .main {
      max-width: 1100px;
      margin: auto;
      padding: 18px 14px 90px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .hero {
      background:
        linear-gradient(
          135deg,
          var(--green-dark),
          var(--green)
        );
      color: white;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0 0 7px;
      font-size: 27px;
    }

    .hero p {
      margin: 0;
      opacity: 0.9;
      line-height: 1.5;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 20px 0 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 18px;
    }

    .refresh {
      border: 0;
      background: var(--green-light);
      color: var(--green-dark);
      border-radius: 10px;
      padding: 8px 11px;
      font-weight: 800;
      font-size: 12px;
    }

    /* CARDS */

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .match-card {
      padding: 14px;
      margin-bottom: 10px;
      transition: 0.15s;
    }

    .match-card:active {
      transform: scale(0.99);
    }

    .match-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 13px;
    }

    .competition {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .live-badge {
      background: #ffe8e6;
      color: var(--red);
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 11px;
      font-weight: 900;
    }

    .upcoming-badge {
      background: #eef3f1;
      color: #63716b;
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 11px;
      font-weight: 800;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .team.away {
      justify-content: flex-end;
      text-align: right;
    }

    .team-name {
      font-weight: 800;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
      border-radius: 50%;
      background: #f4f6f5;
      flex: 0 0 auto;
    }

    .score {
      min-width: 52px;
      text-align: center;
      font-weight: 900;
      font-size: 20px;
    }

    .match-time {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .match-actions {
      display: flex;
      gap: 8px;
      margin-top: 13px;
    }

    .match-actions button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 9px;
      font-weight: 800;
      font-size: 12px;
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-secondary {
      background: var(--green-light);
      color: var(--green-dark);
    }

    /* EMPTY / LOADING */

    .loading,
    .empty,
    .error {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px 16px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: var(--red);
    }

    /* SEARCH */

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      padding: 12px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--green);
    }

    .search-box button {
      border: 0;
      background: var(--green);
      color: white;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 900;
    }

    /* ANALYSIS */

    .analysis-header {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .analysis-competition {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
      text-align: center;
    }

    .analysis-teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
    }

    .analysis-team {
      text-align: center;
    }

    .analysis-team img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .analysis-team-name {
      font-weight: 900;
      font-size: 14px;
    }

    .analysis-score {
      font-size: 30px;
      font-weight: 950;
    }

    .analysis-status {
      text-align: center;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .analysis-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .analysis-card h3 {
      margin: 0 0 13px;
      font-size: 16px;
    }

    /* STATS */

    .stat-row {
      margin-bottom: 13px;
    }

    .stat-head {
      display: grid;
      grid-template-columns: 45px 1fr 45px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
    }

    .stat-name {
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }

    .stat-value {
      font-weight: 900;
    }

    .stat-value.away {
      text-align: right;
    }

    .stat-bars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      margin-top: 5px;
    }

    .bar {
      height: 5px;
      background: #e7eeeb;
      overflow: hidden;
    }

    .bar.home {
      border-radius: 5px 0 0 5px;
    }

    .bar.away {
      border-radius: 0 5px 5px 0;
    }

    .bar-fill {
      height: 100%;
      background: var(--green);
    }

    .bar.away .bar-fill {
      margin-left: auto;
    }

    /* EVENTS */

    .event {
      display: grid;
      grid-template-columns: 55px 1fr 55px;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #edf1ef;
    }

    .event:last-child {
      border-bottom: 0;
    }

    .event-minute {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .event-center {
      text-align: center;
      font-weight: 800;
      font-size: 13px;
    }

    .event-side {
      font-size: 11px;
      color: var(--muted);
    }

    /* AI */

    .ai-box {
      background:
        linear-gradient(
          135deg,
          #f1fbf6,
          #ffffff
        );
      border: 1px solid #cde9db;
    }

    .ai-button {
      width: 100%;
      border: 0;
      background: var(--green);
      color: white;
      padding: 12px;
      border-radius: 12px;
      font-weight: 900;
      margin-top: 10px;
    }

    .ai-question {
      width: 100%;
      min-height: 85px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      outline: none;
    }

    .ai-answer {
      margin-top: 13px;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
    }

    /* TABLE */

    .table-wrap {
      overflow-x: auto;
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #edf1ef;
      text-align: center;
      font-size: 12px;
    }

    th {
      color: var(--muted);
      background: #f7f9f8;
    }

    td:first-child,
    th:first-child {
      text-align: left;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 30px 10px;
    }

    /* MOBILE */

    @media (min-width: 760px) {
      .analysis-grid {
        grid-template-columns: 1fr 1fr;
      }

      .analysis-card.full {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="header-inner">

      <div class="brand">
        <div class="logo">L</div>
        <span>L-LIVE</span>
      </div>

      <div class="header-status">
        <span
          class="status-dot"
          id="connectionDot"
        ></span>

        <span id="connectionText">
          ონლაინ
        </span>
      </div>

    </div>

    <nav class="nav">

      <button
        class="active"
        data-page="home"
      >
        მთავარი
      </button>

      <button
        data-page="live"
      >
        🔴 LIVE
      </button>

      <button
        data-page="upcoming"
      >
        მომდევნო
      </button>

      <button
        data-page="finished"
      >
        დასრულებული
      </button>

      <button
        data-page="search"
      >
        ძებნა
      </button>

    </nav>

  </header>

  <!-- MAIN -->

  <main class="main">

    <!-- HOME -->

    <section
      id="page-home"
      class="page active"
    >

      <div class="hero">

        <h1>
          L-LIVE
        </h1>

        <p>
          ფეხბურთის რეალური მატჩები,
          LIVE ანგარიში და Match Analysis
          ერთ სივრცეში.
        </p>

      </div>

      <div class="section-title">

        <h2>
          🔴 ახლა LIVE
        </h2>

        <button
          class="refresh"
          onclick="loadLive()"
        >
          განახლება
        </button>

      </div>

      <div id="homeLive">
        <div class="loading">
          იტვირთება...
        </div>
      </div>

      <div class="section-title">

        <h2>
          📅 მომდევნო მატჩები
        </h2>

      </div>

      <div id="homeUpcoming">
        <div class="loading">
          იტვირთება...
        </div>
      </div>

    </section>

    <!-- LIVE -->

    <section
      id="page-live"
      class="page"
    >

      <div class="section-title">

        <h2>
          🔴 LIVE მატჩები
        </h2>

        <button
          class="refresh"
          onclick="loadLive()"
        >
          განახლება
        </button>

      </div>

      <div id="liveList">
        <div class="loading">
          იტვირთება...
        </div>
      </div>

    </section>

    <!-- UPCOMING -->

    <section
      id="page-upcoming"
      class="page"
    >

      <div class="section-title">

        <h2>
          📅 მომდევნო მატჩები
        </h2>

        <button
          class="refresh"
          onclick="loadFixtures()"
        >
          განახლება
        </button>

      </div>

      <div id="upcomingList">
        <div class="loading">
          იტვირთება...
        </div>
      </div>

    </section>

    <!-- FINISHED -->

    <section
      id="page-finished"
      class="page"
    >

      <div class="section-title">

        <h2>
          🏁 დასრულებული მატჩები
        </h2>

      </div>

      <div id="finishedList">
        <div class="loading">
          იტვირთება...
        </div>
      </div>

    </section>

    <!-- SEARCH -->

    <section
      id="page-search"
      class="page"
    >

      <div class="section-title">

        <h2>
          🔎 ძებნა
        </h2>

      </div>

      <div class="search-box">

        <input
          id="searchInput"
          type="text"
          placeholder="გუნდი ან ლიგა..."
        />

        <button
          onclick="performSearch()"
        >
          ძებნა
        </button>

      </div>

      <div id="searchResults"></div>

    </section>

    <!-- ANALYSIS -->

    <section
      id="page-analysis"
      class="page"
    >

      <div
        id="analysisContainer"
      ></div>

    </section>

  </main>

  <div class="footer">
    L-LIVE • Real football data
  </div>

</div>

<script>
/*
=========================================================
L-LIVE FRONTEND
=========================================================
*/

const state = {
  live: [],
  fixtures: [],
  finished: [],
  currentMatch: null,
  currentAnalysis: null
};

let refreshTimer = null;

/*
=========================================================
API
=========================================================
*/

async function api(
  url,
  options = {}
) {
  const response =
    await fetch(
      url,
      {
        cache: "no-store",
        ...options
      }
    );

  let data;

  try {
    data =
      await response.json();
  } catch {
    throw new Error(
      "სერვერმა JSON ვერ დააბრუნა."
    );
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      `HTTP ${response.status}`
    );
  }

  return data;
}

/*
=========================================================
CONNECTION
=========================================================
*/

function setConnection(
  online
) {
  const dot =
    document.getElementById(
      "connectionDot"
    );

  const text =
    document.getElementById(
      "connectionText"
    );

  if (online) {
    dot.style.background =
      "#22c55e";

    text.textContent =
      "ონლაინ";
  } else {
    dot.style.background =
      "#ef4444";

    text.textContent =
      "შეცდომა";
  }
}

/*
=========================================================
NAVIGATION
=========================================================
*/

document
  .querySelectorAll(
    ".nav button"
  )
  .forEach(button => {
    button.addEventListener(
      "click",
      () => {
        const page =
          button.dataset.page;

        showPage(page);
      }
    );
  });

function showPage(
  page
) {
  document
    .querySelectorAll(
      ".page"
    )
    .forEach(section => {
      section.classList.remove(
        "active"
      );
    });

  const target =
    document.getElementById(
      `page-${page}`
    );

  if (target) {
    target.classList.add(
      "active"
    );
  }

  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.page ===
          page
      );
    });

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/*
=========================================================
FORMATTERS
=========================================================
*/

function escapeHtml(
  value
) {
  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

function logo(
  url,
  name
) {
  if (!url) {
    return `
      <div
        class="team-logo"
        style="
          display:grid;
          place-items:center;
          font-weight:900;
          color:#087f4f;
        "
      >
        ${escapeHtml(
          String(
            name || "?"
          )
            .charAt(0)
            .toUpperCase()
        )}
      </div>
    `;
  }

  return `
    <img
      class="team-logo"
      src="${escapeHtml(
        url
      )}"
      alt=""
      onerror="
        this.style.display='none';
      "
    />
  `;
}

function formatTime(
  value
) {
  if (!value) {
    return "";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return escapeHtml(
      value
    );
  }

  return date.toLocaleString(
    "ka-GE",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function formatMinute(
  match
) {
  if (
    match.liveMinute !==
      null &&
    match.liveMinute !==
      undefined &&
    match.liveMinute !== ""
  ) {
    return `${escapeHtml(
      match.liveMinute
    )}'`;
  }

  if (
    match.statusText
  ) {
    return escapeHtml(
      match.statusText
    );
  }

  return "LIVE";
}

/*
=========================================================
MATCH CARD
=========================================================
*/

function matchCard(
  match
) {
  const live =
    match.status ===
    "live";

  const finished =
    match.status ===
    "finished";

  const homeScore =
    match.homeScore ??
    "-";

  const awayScore =
    match.awayScore ??
    "-";

  const badge =
    live
      ? `
        <span class="live-badge">
          ${formatMinute(
            match
          )}
        </span>
      `
      : finished
      ? `
        <span class="upcoming-badge">
          დასრულდა
        </span>
      `
      : `
        <span class="upcoming-badge">
          ${formatTime(
            match.time
          )}
        </span>
      `;

  const key =
    match.slug ||
    match.id;

  return `
    <article
      class="card match-card"
    >

      <div class="match-top">

        <div class="competition">
          ${escapeHtml(
            match.competition ||
            "Football"
          )}
        </div>

        ${badge}

      </div>

      <div class="teams">

        <div class="team">

          ${logo(
            match.homeLogo,
            match.home
          )}

          <div>
            <div class="team-name">
              ${escapeHtml(
                match.home ||
                "Home"
              )}
            </div>
          </div>

        </div>

        <div>

          <div class="score">
            ${homeScore}
            :
            ${awayScore}
          </div>

          ${
            live
              ? `<div class="match-time">
                  ${formatMinute(
                    match
                  )}
                </div>`
              : ""
          }

        </div>

        <div class="team away">

          <div>
            <div class="team-name">
              ${escapeHtml(
                match.away ||
                "Away"
              )}
            </div>
          </div>

          ${logo(
            match.awayLogo,
            match.away
          )}

        </div>

      </div>

      <div class="match-actions">

        <button
          class="btn-primary"
          onclick="openAnalysis(
            '${escapeJs(
              key
            )}'
          )"
        >
          Match Analysis
        </button>

      </div>

    </article>
  `;
}

function escapeJs(
  value
) {
  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );
}

/*
=========================================================
LIVE
=========================================================
*/

async function loadLive() {
  try {
    const data =
      await api(
        "/api/world-live"
      );

    state.live =
      Array.isArray(
        data.matches
      )
        ? data.matches
        : [];

    setConnection(true);

    const html =
      state.live.length
        ? state.live
            .map(
              matchCard
            )
            .join("")
        : `
          <div class="empty">
            ამ მომენტში LIVE მატჩი
            არ მოიძებნა.
          </div>
        `;

    document.getElementById(
      "liveList"
    ).innerHTML = html;

    document.getElementById(
      "homeLive"
    ).innerHTML = html;

  } catch (error) {
    setConnection(false);

    const html = `
      <div class="error">
        LIVE მონაცემების მიღება
        ვერ მოხერხდა.<br><br>
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

    document.getElementById(
      "liveList"
    ).innerHTML = html;

    document.getElementById(
      "homeLive"
    ).innerHTML = html;
  }
}

/*
=========================================================
FIXTURES
=========================================================
*/

async function loadFixtures() {
  try {
    const today =
      new Date()
        .toISOString()
        .slice(0, 10);

    const data =
      await api(
        `/api/world-fixtures?date=${today}`
      );

    state.fixtures =
      Array.isArray(
        data.matches
      )
        ? data.matches
        : [];

    const upcoming =
      state.fixtures.filter(
        match =>
          match.status !==
          "finished" &&
          match.status !==
          "cancelled"
      );

    const finished =
      state.fixtures.filter(
        match =>
          match.status ===
          "finished"
      );

    state.finished =
      finished;

    document.getElementById(
      "upcomingList"
    ).innerHTML =
      upcoming.length
        ? upcoming
            .map(
              matchCard
            )
            .join("")
        : `
          <div class="empty">
            დღევანდელი მომდევნო
            მატჩები არ მოიძებნა.
          </div>
        `;

    document.getElementById(
      "homeUpcoming"
    ).innerHTML =
      upcoming.length
        ? upcoming
            .slice(0, 5)
            .map(
              matchCard
            )
            .join("")
        : `
          <div class="empty">
            მომდევნო მატჩები
            არ მოიძებნა.
          </div>
        `;

    document.getElementById(
      "finishedList"
    ).innerHTML =
      finished.length
        ? finished
            .map(
              matchCard
            )
            .join("")
        : `
          <div class="empty">
            დასრულებული მატჩები
            არ მოიძებნა.
          </div>
        `;

  } catch (error) {

    const html = `
      <div class="error">
        მატჩების მიღება ვერ მოხერხდა.<br><br>
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

    document.getElementById(
      "upcomingList"
    ).innerHTML = html;

    document.getElementById(
      "homeUpcoming"
    ).innerHTML = html;

    document.getElementById(
      "finishedList"
    ).innerHTML = html;
  }
}

/*
=========================================================
OPEN ANALYSIS
=========================================================
*/

async function openAnalysis(
  key
) {
  showPage(
    "analysis"
  );

  const container =
    document.getElementById(
      "analysisContainer"
    );

  container.innerHTML = `
    <div class="loading">
      მატჩის მონაცემები იტვირთება...
    </div>
  `;

  try {

    let match =
      findMatchByKey(
        key
      );

    if (!match) {

      const data =
        await api(
          `/api/world-match/${encodeURIComponent(
            key
          )}`
        );

      match =
        data.match;
    }

    if (!match) {
      throw new Error(
        "მატჩი ვერ მოიძებნა."
      );
    }

    state.currentMatch =
      match;

    const slug =
      match.slug ||
      match.id;

    const data =
      await api(
        `/api/world-match/${encodeURIComponent(
          slug
        )}`
      );

    state.currentAnalysis =
      data;

    renderAnalysis(
      data
    );

  } catch (error) {

    container.innerHTML = `
      <div class="error">
        Match Analysis-ის ჩატვირთვა
        ვერ მოხერხდა.<br><br>
        ${escapeHtml(
          error.message
        )}
      </div>
    `;
  }
}

/*
=========================================================
FIND MATCH
=========================================================
*/

function findMatchByKey(
  key
) {
  const all = [
    ...state.live,
    ...state.fixtures,
    ...state.finished
  ];

  return (
    all.find(
      match =>
        String(
          match.slug
        ) ===
          String(key) ||
        String(
          match.id
        ) ===
          String(key)
    ) ||
    null
  );
}

/*
=========================================================
RENDER ANALYSIS
=========================================================
*/

function renderAnalysis(
  data
) {
  const match =
    data.match ||
    data.fixture;

  const statistics =
    Array.isArray(
      data.statistics
    )
      ? data.statistics
      : [];

  const events =
    Array.isArray(
      data.events
    )
      ? data.events
      : [];

  const lineups =
    data.lineups;

  const container =
    document.getElementById(
      "analysisContainer"
    );

  container.innerHTML = `
    <div class="analysis-header">

      <div class="analysis-competition">
        ${escapeHtml(
          match.competition ||
          "Football"
        )}
      </div>

      <div class="analysis-teams">

        <div class="analysis-team">

          ${logoLarge(
            match.homeLogo
          )}

          <div class="analysis-team-name">
            ${escapeHtml(
              match.home ||
              "Home"
            )}
          </div>

        </div>

        <div>

          <div class="analysis-score">
            ${
              match.homeScore ??
              "-"
            }
            :
            ${
              match.awayScore ??
              "-"
            }
          </div>

          <div class="analysis-status">
            ${
              match.status ===
              "live"
                ? formatMinute(
                    match
                  )
                : match.status ===
                  "finished"
                ? "დასრულდა"
                : formatTime(
                    match.time
                  )
            }
          </div>

        </div>

        <div class="analysis-team">

          ${logoLarge(
            match.awayLogo
          )}

          <div class="analysis-team-name">
            ${escapeHtml(
              match.away ||
              "Away"
            )}
          </div>

        </div>

      </div>

    </div>

    <div class="analysis-grid">

      <div class="analysis-card">

        <h3>
          📊 სტატისტიკა
        </h3>

        ${
          statistics.length
            ? statistics
                .map(
                  renderStat
                )
                .join("")
            : `
              <div class="empty">
                სტატისტიკა
                მიუწვდომელია.
              </div>
            `
        }

      </div>

      <div class="analysis-card">

        <h3>
          ⚡ მოვლენები
        </h3>

        ${
          events.length
            ? events
                .map(
                  renderEvent
                )
                .join("")
            : `
              <div class="empty">
                მოვლენები
                მიუწვდომელია.
              </div>
            `
        }

      </div>

      <div class="analysis-card full">

        <h3>
          👥 შემადგენლობები
        </h3>

        ${renderLineups(
          lineups
        )}

      </div>

      <div class="analysis-card full ai-box">

        <h3>
          🤖 AI Match Analysis
        </h3>

        <textarea
          id="aiQuestion"
          class="ai-question"
          placeholder="მაგალითად: გააანალიზე მატჩის მიმდინარე მდგომარეობა მხოლოდ არსებული სტატისტიკის მიხედვით."
        ></textarea>

        <button
          class="ai-button"
          onclick="runAIAnalysis()"
        >
          AI ანალიზის გაშვება
        </button>

        <div
          id="aiAnswer"
          class="ai-answer"
        ></div>

      </div>

    </div>
  `;
}

function logoLarge(
  url
) {
  if (!url) {
    return `
      <div
        style="
          width:58px;
          height:58px;
          margin:auto;
          border-radius:50%;
          background:#e9f8f1;
          display:grid;
          place-items:center;
          color:#087f4f;
          font-weight:900;
          font-size:20px;
        "
      >
        ⚽
      </div>
    `;
  }

  return `
    <img
      src="${escapeHtml(
        url
      )}"
      alt=""
      onerror="
        this.style.opacity='0.2';
      "
    />
  `;
}

/*
=========================================================
STAT RENDER
=========================================================
*/

function renderStat(
  stat
) {
  const home =
    Number(
      stat.home
    ) || 0;

  const away =
    Number(
      stat.away
    ) || 0;

  const total =
    home + away;

  let homePercent =
    total > 0
      ? (home / total) *
        100
      : 50;

  let awayPercent =
    total > 0
      ? (away / total) *
        100
      : 50;

  if (
    stat.unit === "%"
  ) {
    homePercent =
      Math.max(
        0,
        Math.min(
          100,
          home
        )
      );

    awayPercent =
      Math.max(
        0,
        Math.min(
          100,
          away
        )
      );
  }

  return `
    <div class="stat-row">

      <div class="stat-head">

        <div class="stat-value">
          ${escapeHtml(
            stat.home
          )}${escapeHtml(
            stat.unit || ""
          )}
        </div>

        <div class="stat-name">
          ${escapeHtml(
            stat.name
          )}
        </div>

        <div class="stat-value away">
          ${escapeHtml(
            stat.away
          )}${escapeHtml(
            stat.unit || ""
          )}
        </div>

      </div>

      <div class="stat-bars">

        <div class="bar home">
          <div
            class="bar-fill"
            style="
              width:${homePercent}%;
            "
          ></div>
        </div>

        <div class="bar away">
          <div
            class="bar-fill"
            style="
              width:${awayPercent}%;
            "
          ></div>
        </div>

      </div>

    </div>
  `;
}

/*
=========================================================
EVENT RENDER
=========================================================
*/

function renderEvent(
  event
) {
  const minute =
    event.minute ??
    event.time ??
    event.elapsed ??
    "";

  const player =
    event.player?.name ??
    event.player_name ??
    event.playerName ??
    event.name ??
    "";

  const type =
    event.type ??
    event.incident_type ??
    event.event ??
    event.kind ??
    "";

  const team =
    event.team?.name ??
    event.team_name ??
    "";

  return `
    <div class="event">

      <div class="event-minute">
        ${
          minute
            ? escapeHtml(
                minute
              ) + "'"
            : "—"
        }
      </div>

      <div class="event-center">
        ${escapeHtml(
          type ||
          "მოვლენა"
        )}
        ${
          player
            ? `<br>
              <span
                style="
                  font-size:11px;
                  color:#718078;
                "
              >
                ${escapeHtml(
                  player
                )}
              </span>`
            : ""
        }
      </div>

      <div class="event-side">
        ${escapeHtml(
          team
        )}
      </div>

    </div>
  `;
}

/*
=========================================================
LINEUPS
=========================================================
*/

function renderLineups(
  lineups
) {
  if (!lineups) {
    return `
      <div class="empty">
        შემადგენლობები
        მიუწვდომელია.
      </div>
    `;
  }

  try {
    const text =
      JSON.stringify(
        lineups,
        null,
        2
      );

    return `
      <pre
        style="
          margin:0;
          white-space:pre-wrap;
          font-size:11px;
          color:#405049;
          max-height:450px;
          overflow:auto;
        "
      >${escapeHtml(
        text
      )}</pre>
    `;
  } catch {
    return `
      <div class="empty">
        შემადგენლობების წაკითხვა
        ვერ მოხერხდა.
      </div>
    `;
  }
}

/*
=========================================================
AI
=========================================================
*/

async function runAIAnalysis() {
  const button =
    document.querySelector(
      ".ai-button"
    );

  const answer =
    document.getElementById(
      "aiAnswer"
    );

  const question =
    document.getElementById(
      "aiQuestion"
    )?.value ||
    "გაანალიზე ეს მატჩი არსებული მონაცემების მიხედვით.";

  if (!state.currentMatch) {
    answer.textContent =
      "მატჩი არჩეული არ არის.";
    return;
  }

  button.disabled = true;

  button.textContent =
    "AI აანალიზებს...";

  answer.textContent =
    "მონაცემები მუშავდება...";

  try {
    const data =
      await api(
        "/api/ai-analysis",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              match:
                state.currentMatch,

              analysis:
                state.currentAnalysis,

              question
            })
        }
      );

    answer.textContent =
      data.answer ||
      "AI პასუხი მიუწვდომელია.";

  } catch (error) {

    answer.textContent =
      `AI შეცდომა: ${error.message}`;

  } finally {

    button.disabled = false;

    button.textContent =
      "AI ანალიზის გაშვება";
  }
}

/*
=========================================================
SEARCH
=========================================================
*/

async function performSearch() {
  const input =
    document.getElementById(
      "searchInput"
    );

  const query =
    input.value.trim();

  const container =
    document.getElementById(
      "searchResults"
    );

  if (!query) {
    container.innerHTML = `
      <div class="empty">
        ჩაწერე გუნდის ან ლიგის სახელი.
      </div>
    `;

    return;
  }

  container.innerHTML = `
    <div class="loading">
      ძებნა...
    </div>
  `;

  try {

    const [
      teams,
      leagues
    ] =
      await Promise.all([
        api(
          `/api/world-team-search?q=${encodeURIComponent(
            query
          )}`
        ),

        api(
          `/api/world-league-search?q=${encodeURIComponent(
            query
          )}`
        )
      ]);

    const teamResults =
      teams.results || [];

    const leagueResults =
      leagues.results || [];

    container.innerHTML = `

      ${
        teamResults.length
          ? `
            <div class="section-title">
              <h2>გუნდები</h2>
            </div>

            ${teamResults
              .map(
                team => `
                  <div
                    class="card match-card"
                    style="
                      display:flex;
                      align-items:center;
                      gap:12px;
                    "
                  >

                    ${logo(
                      team.logo,
                      team.name
                    )}

                    <strong>
                      ${escapeHtml(
                        team.name
                      )}
                    </strong>

                  </div>
                `
              )
              .join("")}
          `
          : ""
      }

      ${
        leagueResults.length
          ? `
            <div class="section-title">
              <h2>ლიგები</h2>
            </div>

            ${leagueResults
              .map(
                league => `
                  <div
                    class="card match-card"
                  >
                    <strong>
                      ${escapeHtml(
                        league.name
                      )}
                    </strong>
                  </div>
                `
              )
              .join("")}
          `
          : ""
      }

      ${
        !teamResults.length &&
        !leagueResults.length
          ? `
            <div class="empty">
              შედეგი ვერ მოიძებნა.
            </div>
          `
          : ""
      }

    `;

  } catch (error) {

    container.innerHTML = `
      <div class="error">
        ძებნა ვერ შესრულდა.<br><br>
        ${escapeHtml(
          error.message
        )}
      </div>
    `;
  }
}

/*
=========================================================
ENTER SEARCH
=========================================================
*/

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "keydown",
    event => {
      if (
        event.key ===
        "Enter"
      ) {
        performSearch();
      }
    }
  );

/*
=========================================================
AUTO REFRESH
=========================================================
*/

function startAutoRefresh() {
  if (refreshTimer) {
    clearInterval(
      refreshTimer
    );
  }

  refreshTimer =
    setInterval(
      async () => {
        await loadLive();
      },
      20000
    );
}

/*
=========================================================
START
=========================================================
*/

async function start() {
  await Promise.all([
    loadLive(),
    loadFixtures()
  ]);

  startAutoRefresh();
}

start();

</script>
