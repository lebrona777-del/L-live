<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06151b">
<title>L-LIVE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#06151b;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  padding-bottom:95px;
}

button{
  font:inherit;
}

button,
.sport,
.tab,
.nav-item,
.close{
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

header{
  padding:28px 20px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:-1px;
}

.header-buttons{
  display:flex;
  gap:10px;
}

.circle{
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:#102d36;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.circle:active{
  transform:scale(.94);
}

.sports{
  display:flex;
  gap:12px;
  padding:0 18px 20px;
  overflow-x:auto;
  scrollbar-width:none;
}

.sports::-webkit-scrollbar{
  display:none;
}

.sport{
  flex:0 0 auto;
  padding:18px 26px;
  border-radius:40px;
  background:#102d36;
  color:#fff;
  font-size:21px;
  font-weight:800;
}

.sport.active{
  background:#df294b;
}

.sport:active{
  transform:scale(.97);
}

.tabs{
  display:flex;
  overflow-x:auto;
  border-top:1px solid #183640;
  border-bottom:1px solid #183640;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:1;
  min-width:110px;
  padding:22px 10px;
  text-align:center;
  color:#aeb9bd;
  font-size:19px;
  font-weight:800;
  border-bottom:4px solid transparent;
}

.tab.active{
  color:#ed3153;
  border-bottom-color:#ed3153;
}

main{
  padding:28px 18px 120px;
  min-height:calc(100vh - 300px);
}

.title{
  font-size:32px;
  font-weight:900;
  margin-bottom:7px;
}

.subtitle{
  color:#89979c;
  font-size:20px;
  margin-bottom:25px;
}

.loading{
  text-align:center;
  padding:45px 20px;
  background:#0b2028;
  border:1px solid #21434e;
  border-radius:22px;
  color:#aeb9bd;
  font-size:18px;
}

.empty{
  text-align:center;
  padding:40px 20px;
  background:#0b2028;
  border:1px solid #21434e;
  border-radius:22px;
  color:#aeb9bd;
  font-size:18px;
  line-height:1.6;
}

.error{
  text-align:center;
  padding:35px 20px;
  background:#281016;
  border:1px solid #7d2639;
  border-radius:22px;
  color:#ffb5c1;
  font-size:18px;
  line-height:1.6;
}

.match-card{
  background:#0b2028;
  border:1px solid #21434e;
  border-radius:22px;
  padding:21px;
  margin-bottom:16px;
}

.match-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.status-live{
  color:#ed3153;
  font-weight:900;
}

.status-finished{
  color:#8fd19e;
  font-weight:900;
}

.status-upcoming{
  color:#f0c674;
  font-weight:900;
}

.minute{
  color:#aeb9bd;
}

.league{
  color:#89979c;
  margin-bottom:20px;
  font-size:15px;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
}

.team{
  text-align:center;
  font-size:19px;
  font-weight:800;
}

.score{
  text-align:center;
  font-size:34px;
  font-weight:900;
  white-space:nowrap;
}

.time{
  color:#89979c;
  font-size:13px;
  font-weight:400;
  margin-top:5px;
}

.details{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#df294b;
  color:#fff;
  font-size:16px;
  font-weight:800;
}

.details:active{
  transform:scale(.98);
}

footer{
  position:fixed;
  z-index:50;
  left:0;
  right:0;
  bottom:0;
  height:92px;
  padding-bottom:env(safe-area-inset-bottom);
  background:#07171e;
  border-top:1px solid #183640;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  min-width:70px;
  text-align:center;
  color:#89979c;
  font-size:13px;
  font-weight:800;
}

.nav-item.active{
  color:#ed3153;
}

.nav-icon{
  font-size:27px;
  line-height:30px;
  margin-bottom:3px;
}

.modal{
  display:none;
  position:fixed;
  z-index:100;
  inset:0;
  background:rgba(0,0,0,.82);
  padding:20px;
  overflow-y:auto;
}

.modal-box{
  max-width:650px;
  margin:35px auto;
  padding:24px;
  background:#0b2028;
  border:1px solid #284954;
  border-radius:24px;
}

.close{
  float:right;
  font-size:34px;
  line-height:30px;
}

.modal-box h2{
  padding-right:35px;
  line-height:1.35;
}

.event{
  padding:12px 0;
  border-bottom:1px solid #21434e;
}

.stat{
  margin:20px 0;
}

.stat-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.bar{
  height:8px;
  background:#203a43;
  border-radius:10px;
  overflow:hidden;
}

.bar-inner{
  height:100%;
  background:#df294b;
}

.league-row{
  background:#0b2028;
  border:1px solid #21434e;
  border-radius:16px;
  padding:18px;
  margin-bottom:12px;
  font-weight:800;
}

.toast{
  position:fixed;
  z-index:200;
  left:20px;
  right:20px;
  bottom:105px;
  padding:14px 18px;
  background:#102d36;
  border:1px solid #31515c;
  border-radius:14px;
  text-align:center;
  display:none;
}
</style>
</head>

<body>

<header>

  <div class="logo">L-LIVE</div>

  <div class="header-buttons">

    <button
      class="circle"
      type="button"
      onclick="refreshCurrent()"
      aria-label="განახლება">
      ↻
    </button>

    <button
      class="circle"
      type="button"
      onclick="showFavorites()"
      aria-label="ფავორიტები">
      ★
    </button>

  </div>

</header>


<!-- SPORTS -->

<div class="sports">

  <div
    class="sport active"
    data-sport="football"
    onclick="selectSport(this,'football')">
    ⚽ ფეხბურთი
  </div>

  <div
    class="sport"
    data-sport="basketball"
    onclick="selectSport(this,'basketball')">
    🏀 კალათბურთი
  </div>

  <div
    class="sport"
    data-sport="rugby"
    onclick="selectSport(this,'rugby')">
    🏉 რაგბი
  </div>

</div>


<!-- TABS -->

<div class="tabs">

  <div
    class="tab active"
    data-section="live"
    onclick="changeSection(this,'live')">
    🔴 LIVE
  </div>

  <div
    class="tab"
    data-section="today"
    onclick="changeSection(this,'today')">
    დღეს
  </div>

  <div
    class="tab"
    data-section="upcoming"
    onclick="changeSection(this,'upcoming')">
    მომავალი
  </div>

  <div
    class="tab"
    data-section="finished"
    onclick="changeSection(this,'finished')">
    შედეგები
  </div>

</div>


<main>

  <div
    class="title"
    id="pageTitle">
    LIVE მატჩები
  </div>

  <div
    class="subtitle"
    id="pageSubtitle">
    ქართული ფეხბურთი
  </div>

  <div id="matches">

    <div class="loading">
      მატჩების ჩატვირთვა...
    </div>

  </div>

</main>


<!-- FOOTER -->

<footer>

  <div
    class="nav-item active"
    id="navHome"
    onclick="goHome()">

    <div class="nav-icon">⌂</div>
    მთავარი

  </div>


  <div
    class="nav-item"
    id="navLive"
    onclick="goLive()">

    <div class="nav-icon">●</div>
    LIVE

  </div>


  <div
    class="nav-item"
    id="navFavorites"
    onclick="showFavorites()">

    <div class="nav-icon">★</div>
    ფავორიტები

  </div>


  <div
    class="nav-item"
    id="navLeagues"
    onclick="showLeagues()">

    <div class="nav-icon">🏆</div>
    ლიგები

  </div>

</footer>


<!-- MODAL -->

<div
  class="modal"
  id="modal"
  onclick="modalOutside(event)">

  <div class="modal-box">

    <span
      class="close"
      onclick="closeModal()">
      ×
    </span>

    <h2 id="modalTitle"></h2>

    <div id="modalContent"></div>

  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

let currentSection = "live";
let currentSport = "football";
let currentMatches = [];


/* =========================================
   SPORT NAME
========================================= */

function getSportName(){

  if(currentSport === "basketball"){
    return "ქართული კალათბურთი";
  }

  if(currentSport === "rugby"){
    return "ქართული რაგბი";
  }

  return "ქართული ფეხბურთი";
}


/* =========================================
   SECTION NAME
========================================= */

function getSectionTitle(){

  if(currentSection === "today"){
    return "დღევანდელი მატჩები";
  }

  if(currentSection === "upcoming"){
    return "მომავალი მატჩები";
  }

  if(currentSection === "finished"){
    return "შედეგები";
  }

  return "LIVE მატჩები";
}


/* =========================================
   API
========================================= */

function getEndpoint(){

  if(currentSection === "live"){
    return "/api/live";
  }

  if(currentSection === "upcoming"){
    return "/api/upcoming";
  }

  if(currentSection === "finished"){
    return "/api/finished";
  }

  return "/api/matches";
}


/* =========================================
   LOAD
========================================= */

async function loadCurrent(){

  const container =
    document.getElementById("matches");

  document.getElementById("pageTitle").textContent =
    getSectionTitle();

  document.getElementById("pageSubtitle").textContent =
    getSportName();

  container.innerHTML =
    '<div class="loading">მატჩების ჩატვირთვა...</div>';

  try{

    const response = await fetch(
      getEndpoint() + "?t=" + Date.now(),
      {
        method:"GET",
        cache:"no-store",
        headers:{
          "Cache-Control":"no-cache"
        }
      }
    );

    if(!response.ok){
      throw new Error("API " + response.status);
    }

    const data = await response.json();

    let matches =
      Array.isArray(data.matches)
      ? data.matches
      : [];


    /* SPORT */

    matches = matches.filter(match => {

      return (
        !match.sport ||
        match.sport === currentSport
      );

    });


    /* TODAY */

    if(currentSection === "today"){

      const today =
        new Date().toLocaleDateString(
          "en-CA",
          {
            timeZone:"Asia/Tbilisi"
          }
        );

      matches = matches.filter(
        match => match.date === today
      );

    }


    currentMatches = matches;

    renderMatches(matches);

  }
  catch(error){

    console.error("L-LIVE:",error);

    container.innerHTML = `
      <div class="error">
        ❌ მონაცემების ჩატვირთვა ვერ მოხერხდა.
        <br><br>
        შეამოწმე ინტერნეტი და დააჭირე ↻ ღილაკს.
      </div>
    `;

  }

}


/* =========================================
   RENDER
========================================= */

function renderMatches(matches){

  const container =
    document.getElementById("matches");

  if(!matches.length){

    container.innerHTML = `
      <div class="empty">
        ამ განყოფილებაში მატჩები ამ მომენტში არ არის.
      </div>
    `;

    return;
  }


  container.innerHTML = "";


  matches.forEach(match => {

    const card =
      document.createElement("div");

    card.className = "match-card";


    let statusClass = "status-live";
    let statusText = "🔴 LIVE";
    let minute = "";


    if(match.status === "finished"){

      statusClass = "status-finished";
      statusText = "დასრულდა";

    }


    if(match.status === "upcoming"){

      statusClass = "status-upcoming";
      statusText = "მომავალი";

    }


    if(
      match.status === "live" &&
      match.minute !== null &&
      match.minute !== undefined
    ){

      minute = match.minute + "'";

    }


    const home =
      match.homeTeam &&
      match.homeTeam.name
      ? match.homeTeam.name
      : "მასპინძელი";


    const away =
      match.awayTeam &&
      match.awayTeam.name
      ? match.awayTeam.name
      : "სტუმარი";


    const homeScore =
      match.score &&
      match.score.home !== undefined
      ? match.score.home
      : 0;


    const awayScore =
      match.score &&
      match.score.away !== undefined
      ? match.score.away
      : 0;


    card.innerHTML = `

      <div class="match-top">

        <div class="${statusClass}">
          ${statusText}
        </div>

        <div class="minute">
          ${minute}
        </div>

      </div>


      <div class="league">
        ${escapeHtml(
          match.championship ||
          "ქართული სპორტი"
        )}
      </div>


      <div class="teams">

        <div class="team">
          ${escapeHtml(home)}
        </div>

        <div class="score">

          ${homeScore} : ${awayScore}

          <div class="time">
            ${escapeHtml(match.time || "")}
          </div>

        </div>

        <div class="team">
          ${escapeHtml(away)}
        </div>

      </div>


      <button
        type="button"
        class="details">

        მატჩის დეტალები

      </button>

    `;


    const detailsButton =
      card.querySelector(".details");


    detailsButton.addEventListener(
      "click",
      function(){

        openMatch(match);

      }
    );


    container.appendChild(card);

  });

}


/* =========================================
   OPEN MATCH
========================================= */

function openMatch(match){

  const home =
    match.homeTeam?.name ||
    "მასპინძელი";

  const away =
    match.awayTeam?.name ||
    "სტუმარი";

  const homeScore =
    match.score?.home ?? 0;

  const awayScore =
    match.score?.away ?? 0;


  document.getElementById(
    "modalTitle"
  ).textContent =
    home +
    " " +
    homeScore +
    " : " +
    awayScore +
    " " +
    away;


  let html = `
    <h3>⚽ მოვლენები</h3>
  `;


  if(
    Array.isArray(match.events) &&
    match.events.length
  ){

    match.events.forEach(event => {

      html += `
        <div class="event">

          ${event.minute ?? ""}'
          —
          ⚽
          ${escapeHtml(
            event.player ||
            event.team ||
            ""
          )}

        </div>
      `;

    });

  }
  else{

    html += `
      <div class="event">
        მოვლენები ჯერ არ არის.
      </div>
    `;

  }


  html += `
    <h3>📊 სტატისტიკა</h3>
  `;


  const stats =
    match.statistics || {};


  addStat(
    "ბურთის ფლობა",
    stats.possession
  );

  addStat(
    "დარტყმები",
    stats.shots
  );

  addStat(
    "ზუსტი დარტყმები",
    stats.shotsOnTarget
  );

  addStat(
    "კუთხურები",
    stats.corners
  );

  addStat(
    "ჯარიმები",
    stats.fouls
  );


  function addStat(name,value){

    if(!value){
      return;
    }


    const homeValue =
      Number(value.home) || 0;

    const awayValue =
      Number(value.away) || 0;

    const total =
      homeValue + awayValue;


    const percent =
      total > 0
      ? (homeValue / total) * 100
      : 50;


    html += `

      <div class="stat">

        <div class="stat-row">

          <span>${homeValue}</span>

          <strong>${name}</strong>

          <span>${awayValue}</span>

        </div>

        <div class="bar">

          <div
            class="bar-inner"
            style="width:${percent}%">
          </div>

        </div>

      </div>

    `;

  }


  document.getElementById(
    "modalContent"
  ).innerHTML = html;


  document.getElementById(
    "modal"
  ).style.display = "block";

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal(){

  document.getElementById(
    "modal"
  ).style.display = "none";

}


function modalOutside(event){

  if(
    event.target ===
    document.getElementById("modal")
  ){

    closeModal();

  }

}


/* =========================================
   SECTION BUTTONS
========================================= */

function changeSection(
  element,
  section
){

  currentSection = section;

  setActiveTabs();

  setFooterActive(
    section === "live"
    ? "navLive"
    : "navHome"
  );

  loadCurrent();

}


/* =========================================
   SPORT BUTTONS
========================================= */

function selectSport(
  element,
  sport
){

  currentSport = sport;

  document
    .querySelectorAll(".sport")
    .forEach(item => {

      item.classList.remove("active");

    });


  element.classList.add("active");

  setFooterActive("navHome");

  loadCurrent();

}


/* =========================================
   REFRESH
========================================= */

function refreshCurrent(){

  loadCurrent();

  showToast("განახლდა ✓");

}


/* =========================================
   HOME
========================================= */

function goHome(){

  currentSection = "live";

  setActiveTabs();

  setFooterActive("navHome");

  loadCurrent();

}


/* =========================================
   LIVE
========================================= */

function goLive(){

  currentSection = "live";

  setActiveTabs();

  setFooterActive("navLive");

  loadCurrent();

}


/* =========================================
   FAVORITES
========================================= */

function showFavorites(){

  setFooterActive("navFavorites");

  document.getElementById(
    "pageTitle"
  ).textContent = "ფავორიტები";

  document.getElementById(
    "pageSubtitle"
  ).textContent =
    "შენი რჩეული გუნდები";


  document.getElementById(
    "matches"
  ).innerHTML = `

    <div class="empty">

      ⭐ ფავორიტი გუნდები ჯერ არ გაქვს.

      <br><br>

      ფავორიტების ფუნქციას შემდეგ ეტაპზე
      გუნდების ბარათებს დავუკავშირებთ.

    </div>

  `;

}


/* =========================================
   LEAGUES
========================================= */

function showLeagues(){

  setFooterActive("navLeagues");

  document.getElementById(
    "pageTitle"
  ).textContent = "ლიგები";

  document.getElementById(
    "pageSubtitle"
  ).textContent =
    "ქართული ჩემპიონატები";


  document.getElementById(
    "matches"
  ).innerHTML = `

    <div class="league-row">
      ⚽ ეროვნული ლიგა
    </div>

    <div class="league-row">
      ⚽ ეროვნული ლიგა 2
    </div>

    <div class="league-row">
      ⚽ ლიგა 3
    </div>

    <div class="league-row">
      ⚽ ლიგა 4
    </div>

    <div class="league-row">
      🏀 ქართული კალათბურთი
    </div>

    <div class="league-row">
      🏉 ქართული რაგბი
    </div>

    <div class="league-row">
      🏆 საქართველოს თასი
    </div>

  `;

}


/* =========================================
   ACTIVE TABS
========================================= */

function setActiveTabs(){

  document
    .querySelectorAll(".tab")
    .forEach(tab => {

      tab.classList.toggle(
        "active",
        tab.dataset.section === currentSection
      );

    });

}


/* =========================================
   ACTIVE FOOTER
========================================= */

function setFooterActive(id){

  document
    .querySelectorAll(".nav-item")
    .forEach(item => {

      item.classList.remove("active");

    });


  const item =
    document.getElementById(id);


  if(item){
    item.classList.add("active");
  }

}


/* =========================================
   TOAST
========================================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.style.display = "block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(
      function(){

        toast.style.display = "none";

      },
      1500
    );

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   INITIAL
========================================= */

loadCurrent();


/* =========================================
   AUTO REFRESH
========================================= */

setInterval(
  function(){

    if(
      currentSection === "live" ||
      currentSection === "today" ||
      currentSection === "upcoming" ||
      currentSection === "finished"
    ){

      loadCurrent();

    }

  },
  30000
);

</script>
