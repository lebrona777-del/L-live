<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075b3b">
<title>L-LIVE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f4f7f6;
  color:#10251c
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#075b3b;
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{font-weight:900;font-size:24px;letter-spacing:.5px}
.sub{font-size:11px;opacity:.75}

.container{
  max-width:850px;
  margin:auto;
  padding:14px
}

.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:10px
}

.pill{
  background:#fff;
  border:1px solid #d9e4df;
  border-radius:20px;
  padding:9px 14px;
  white-space:nowrap
}

.pill.active{
  background:#075b3b;
  color:white
}

.card{
  background:#fff;
  border-radius:16px;
  margin:10px 0;
  padding:14px;
  box-shadow:0 2px 10px #153c2a12;
  border:1px solid #e1ebe7
}

.comp{
  font-size:12px;
  color:#687a72;
  font-weight:700;
  margin-bottom:10px
}

.match{
  display:grid;
  grid-template-columns:1fr 64px 1fr;
  gap:10px;
  align-items:center;
  text-align:center
}

.team{font-weight:800}

.score{
  font-size:22px;
  font-weight:900
}

.status{
  font-size:11px;
  margin-top:4px
}

.live{
  color:#d52222;
  font-weight:900
}

.finished{color:#60736b}

.upcoming{
  color:#075b3b;
  font-weight:800
}

.open{
  width:100%;
  text-align:left;
  background:transparent;
  padding:0
}

.detail{display:none}
.detail.show{display:block}
.hidden{display:none!important}

.back{
  background:#e9f1ee;
  color:#075b3b;
  border-radius:10px;
  padding:9px 12px;
  margin-bottom:12px;
  font-weight:800
}

.hero{
  background:#075b3b;
  color:#fff;
  border-radius:18px;
  padding:20px
}

.hero .match{
  grid-template-columns:1fr 90px 1fr
}

.hero .score{font-size:36px}

.tabs{
  display:flex;
  background:#fff;
  border-radius:12px;
  margin:12px 0;
  overflow:hidden
}

.tab{
  flex:1;
  padding:12px;
  background:#fff
}

.tab.active{
  color:#075b3b;
  font-weight:900;
  border-bottom:3px solid #075b3b
}

.event{
  display:flex;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #edf1ef
}

.icon{
  width:30px;
  text-align:center
}

.minute{
  font-weight:900;
  width:40px
}

.login{
  max-width:420px;
  margin:35px auto;
  background:#fff;
  padding:20px;
  border-radius:18px;
  box-shadow:0 5px 25px #153c2a18
}

.login h2{margin-top:0}

.field{
  width:100%;
  padding:12px;
  border:1px solid #d4e0db;
  border-radius:10px;
  margin:6px 0 10px
}

.primary{
  background:#075b3b;
  color:white;
  border-radius:10px;
  padding:12px 16px;
  font-weight:800
}

.danger{
  background:#b51d2a;
  color:#fff;
  border-radius:10px;
  padding:10px
}

.adminbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.small{
  font-size:12px;
  color:#687a72
}

.empty{
  text-align:center;
  padding:35px;
  color:#687a72
}

@media(max-width:520px){
  .grid{grid-template-columns:1fr}
  .container{padding:10px}
}
</style>
</head>

<body>

<header class="header">
  <div>
    <div class="logo">L-LIVE</div>
    <div class="sub">FOOTBALL LIVE SCORE</div>
  </div>

  <button id="adminBtn" class="pill" onclick="showAdminLogin()">
    🔒 ADMIN
  </button>
</header>

<main class="container">

<section id="publicView">

  <div class="filters">
    <button class="pill active" onclick="setFilter('all',this)">
      ყველა
    </button>

    <button class="pill" onclick="setFilter('live',this)">
      🔴 LIVE
    </button>

    <button class="pill" onclick="setFilter('upcoming',this)">
      მომავალი
    </button>

    <button class="pill" onclick="setFilter('finished',this)">
      დასრულებული
    </button>
  </div>

  <div id="matchList"></div>

</section>

<section id="detailView" class="detail">

  <button class="back" onclick="closeDetail()">
    ← უკან
  </button>

  <div id="detailContent"></div>

</section>

<section id="loginView" class="hidden">

  <div class="login">

    <h2>🔒 Admin შესვლა</h2>

    <p class="small">
      მართვის პანელი მხოლოდ აპის მფლობელისთვისაა.
    </p>

    <input
      id="email"
      class="field"
      type="email"
      placeholder="Email">

    <input
      id="password"
      class="field"
      type="password"
      placeholder="Password">

    <button
      class="primary"
      style="width:100%"
      onclick="login()">
      შესვლა
    </button>

    <p id="loginError" class="small"></p>

  </div>

</section>

<section id="adminView" class="hidden">

  <button class="back" onclick="showPublic()">
    ← LIVE
  </button>

  <div class="card">

    <h3>🔐 ADMIN PANEL</h3>

    <p class="small">
      შესული ხარ როგორც
      <span id="adminEmail"></span>
    </p>

    <button class="danger" onclick="logout()">
      გასვლა
    </button>

  </div>

  <div class="card">

    <h3>➕ ახალი მატჩი</h3>

    <div class="grid">

      <input id="competition" class="field" placeholder="ლიგა / შეჯიბრი">

      <input id="venue" class="field" placeholder="სტადიონი">

      <input id="home" class="field" placeholder="მასპინძელი გუნდი">

      <input id="away" class="field" placeholder="სტუმარი გუნდი">

      <input id="date" class="field" type="date">

      <input id="kickoff" class="field" type="time">

    </div>

    <button class="primary" onclick="createMatch()">
      მატჩის შექმნა
    </button>

  </div>

  <div class="card">

    <h3>მატჩების მართვა</h3>

    <div id="adminMatches"></div>

  </div>

</section>

</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  push,
  set,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyDzCxUHJvIS-TBPJQnDZuuZX7GP_Wt8fHI",

  authDomain:
  "l-live.firebaseapp.com",

  databaseURL:
  "https://l-live-default-rtdb.firebaseio.com",

  projectId:
  "l-live",

  storageBucket:
  "l-live.firebasestorage.app",

  messagingSenderId:
  "1080946597468",

  appId:
  "1:1080946597468:web:17682b7b655f78ef549099",

  measurementId:
  "G-VS20XDM1MJ"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


let matches = {};

let filter = "all";

let currentId = null;

let tab = "events";

let admin = false;


/* უსაფრთხო ტექსტი */

function esc(s){

  return String(s ?? "")
    .replace(/[&<>"']/g, m => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[m]));

}


/* სტატუსი */

function statusText(m){

  if(m.status === "live")
    return "LIVE";

  if(m.status === "finished")
    return "დასრულებული";

  if(m.status === "half")
    return "ტაიმი";

  return (m.date || "") +
    " " +
    (m.kickoff || "");

}


/* რამდენი წამია უკვე გავლილი */

function liveElapsedSeconds(m){

  const saved =
    Number(m.elapsedSeconds || 0);

  if(
    m.status !== "live" ||
    !m.startedAt
  ){
    return saved;
  }

  return saved +
    Math.max(
      0,
      Math.floor(
        (Date.now() -
        Number(m.startedAt)) / 1000
      )
    );

}


/* მიმდინარე წუთი */

function liveMinute(m){

  if(
    m.status !== "live" &&
    m.status !== "half"
  ){
    return Number(m.minute || 0);
  }

  const seconds =
    liveElapsedSeconds(m);

  return Math.max(
    1,
    Math.floor(seconds / 60) + 1
  );

}


function timerText(m){

  const minute =
    liveMinute(m);

  return minute
    ? `${minute}'`
    : "";

}


/* Firebase-ში მიმდინარე წუთის შენახვა */

async function saveLiveMinute(id,m){

  if(
    !admin ||
    m.status !== "live"
  ){
    return;
  }

  const minute =
    liveMinute(m);

  if(
    minute !==
    Number(m.minute || 0)
  ){

    await update(
      ref(db,"matches/" + id),
      {
        minute,
        updatedAt:Date.now()
      }
    );

  }

}


/* ყოველ წამს განახლება */

function refreshLiveTimers(){

  Object.entries(matches)
    .forEach(([id,m]) => {

      if(m.status === "live"){

        saveLiveMinute(
          id,
          m
        ).catch(()=>{});

      }

    });

  render();

  if(currentId)
    renderDetail();

}


/* ტაიმერი */

setInterval(
  refreshLiveTimers,
  1000
);


/* მატჩის ბარათი */

function matchCard(id,m){

  const st =
    m.status || "upcoming";

  let sc =
    `${m.homeScore || 0} : ${m.awayScore || 0}`;

  if(st === "upcoming")
    sc = "— : —";


  return `

  <div class="card">

    <button
      class="open"
      onclick="openDetail('${id}')">

      <div class="comp">

        ${esc(
          m.competition ||
          "Football"
        )}

        ${
          m.venue
          ? " • " + esc(m.venue)
          : ""
        }

      </div>


      <div class="match">

        <div class="team">
          ${esc(m.home || "Home")}
        </div>


        <div>

          <div class="score">
            ${sc}
          </div>

          <div class="status ${st}">

            ${statusText(m)}

            ${
              (st === "live" ||
               st === "half") &&
              liveMinute(m)

              ? ` • ${timerText(m)}`

              : ""
            }

          </div>

        </div>


        <div class="team">
          ${esc(m.away || "Away")}
        </div>

      </div>

    </button>

  </div>

  `;

}


/* მთავარი სია */

function render(){

  const list =
    document.getElementById(
      "matchList"
    );


  let arr =
    Object.entries(matches)
      .filter(([id,m]) =>

        filter === "all" ||

        (
          filter === "live" &&
          (
            m.status === "live" ||
            m.status === "half"
          )
        ) ||

        m.status === filter

      );


  const order = {

    live:0,
    half:0,
    upcoming:1,
    finished:2

  };


  arr.sort((a,b) =>

    (
      order[a[1].status] ?? 3
    ) -

    (
      order[b[1].status] ?? 3
    )

  );


  list.innerHTML =

    arr.length

    ?

    arr
      .map(
        ([id,m]) =>
          matchCard(id,m)
      )
      .join("")

    :

    `
      <div class="empty">
        მატჩები ჯერ არ არის
      </div>
    `;


  renderAdmin();

}


/* Admin */

function renderAdmin(){

  if(!admin)
    return;


  const el =
    document.getElementById(
      "adminMatches"
    );


  const arr =
    Object.entries(matches);


  el.innerHTML =

    arr.length

    ?

    arr.map(([id,m]) => `

      <div class="card">

        <b>
          ${esc(m.home)}
          —
          ${esc(m.away)}
        </b>

        <div class="small">

          ${esc(
            m.competition || ""
          )}

          •

          ${statusText(m)}

          ${
            (
              m.status === "live" ||
              m.status === "half"
            )

            ? ` • ${timerText(m)}`

            : ""
          }

        </div>


        <div class="adminbar">

          <button
            class="primary"
            onclick="startMatch('${id}')">
            ▶ LIVE
          </button>


          <button
            class="pill"
            onclick="changeMinute('${id}',-1)">
            −1
          </button>


          <button
            class="pill"
            onclick="changeMinute('${id}',1)">
            +1
          </button>


          <button
            class="pill"
            onclick="goal('${id}','home')">
            ⚽ Home
          </button>


          <button
            class="pill"
            onclick="goal('${id}','away')">
            ⚽ Away
          </button>


          <button
            class="pill"
            onclick="eventAdd('${id}','yellow')">
            🟨
          </button>


          <button
            class="pill"
            onclick="eventAdd('${id}','red')">
            🟥
          </button>


          <button
            class="pill"
            onclick="eventAdd('${id}','sub')">
            🔄
          </button>


          <button
            class="pill"
            onclick="half('${id}')">
            ⏸ ტაიმი
          </button>


          <button
            class="primary"
            onclick="finish('${id}')">
            🏁 დასრულება
          </button>


          <button
            class="danger"
            onclick="deleteMatch('${id}')">
            წაშლა
          </button>

        </div>

      </div>

    `).join("")

    :

    `
      <div class="empty">
        მატჩები ჯერ არ არის
      </div>
    `;

}


/* Firebase */

onValue(
  ref(db,"matches"),
  snap => {

    matches =
      snap.val() || {};

    render();

    if(currentId)
      renderDetail();

  }
);


/* Login */

onAuthStateChanged(
  auth,
  user => {

    admin = !!user;

    if(user){

      document
        .getElementById(
          "adminEmail"
        )
        .textContent =
        user.email || "";

      showAdmin();

    }

    else{

      admin = false;

    }

  }
);


/* ფილტრი */

window.setFilter =
(f,btn) => {

  filter = f;

  document
    .querySelectorAll(
      ".filters .pill"
    )
    .forEach(x =>
      x.classList.remove(
        "active"
      )
    );

  btn.classList.add("active");

  render();

};


/* Public */

window.showPublic = () => {

  document
    .getElementById("publicView")
    .classList.remove("hidden");

  document
    .getElementById("detailView")
    .classList.add("hidden");

  document
    .getElementById("loginView")
    .classList.add("hidden");

  document
    .getElementById("adminView")
    .classList.add("hidden");

};


/* Admin Login */

window.showAdminLogin = () => {

  if(auth.currentUser){

    showAdmin();

    return;

  }

  document
    .getElementById("publicView")
    .classList.add("hidden");

  document
    .getElementById("detailView")
    .classList.add("hidden");

  document
    .getElementById("loginView")
    .classList.remove("hidden");

  document
    .getElementById("adminView")
    .classList.add("hidden");

};


/* Admin */

window.showAdmin = () => {

  if(!auth.currentUser){

    showAdminLogin();

    return;

  }

  document
    .getElementById("publicView")
    .classList.add("hidden");

  document
    .getElementById("detailView")
    .classList.add("hidden");

  document
    .getElementById("loginView")
    .classList.add("hidden");

  document
    .getElementById("adminView")
    .classList.remove("hidden");

  renderAdmin();

};


/* Login */

window.login = async () => {

  try{

    await signInWithEmailAndPassword(
      auth,
      email.value.trim(),
      password.value
    );

    loginError.textContent = "";

  }

  catch(e){

    loginError.textContent =
      "შესვლა ვერ მოხერხდა. შეამოწმე Email და Password.";

  }

};


/* Logout */

window.logout = () =>
  signOut(auth);


/* Detail */

window.openDetail = id => {

  currentId = id;

  tab = "events";

  document
    .getElementById("publicView")
    .classList.add("hidden");

  document
    .getElementById("detailView")
    .classList.add("show");

  renderDetail();

};


window.closeDetail = () => {

  currentId = null;

  document
    .getElementById("detailView")
    .classList.remove("show");

  document
    .getElementById("publicView")
    .classList.remove("hidden");

};


/* Detail render */

function renderDetail(){

  const m =
    matches[currentId];

  if(!m)
    return;


  const events =
    (m.events || [])
      .slice()
      .sort(
        (a,b) =>
          (a.minute || 0) -
          (b.minute || 0)
      );


  const ev =

    events.length

    ?

    events.map(e => `

      <div class="event">

        <div class="minute">
          ${e.minute || ""}'
        </div>

        <div class="icon">

          ${
            e.type === "goal"
            ? "⚽"
            : e.type === "yellow"
            ? "🟨"
            : e.type === "red"
            ? "🟥"
            : "🔄"
          }

        </div>

        <div>
          ${esc(
            e.text ||
            e.type
          )}
        </div>

      </div>

    `).join("")

    :

    `
      <div class="empty">
        მოვლენები ჯერ არ არის
      </div>
    `;


  const stats = `

    <div class="card">

      <h3>სტატისტიკა</h3>

      <p>
        გოლები:
        ${m.homeScore || 0}
        —
        ${m.awayScore || 0}
      </p>

      <p>
        მიმდინარე წუთი:
        ${liveMinute(m)}'
      </p>

      <p>
        მოვლენები:
        ${events.length}
      </p>

    </div>

  `;


  const lineup = `

    <div class="card">

      <h3>შემადგენლობები</h3>

      <p>
        ${esc(m.home)}
        — შემადგენლობა მოგვიანებით დაემატება
      </p>

      <p>
        ${esc(m.away)}
        — შემადგენლობა მოგვიანებით დაემატება
      </p>

    </div>

  `;


  document
    .getElementById("detailContent")
    .innerHTML = `

      <div class="hero">

        <div class="comp">
          ${esc(
            m.competition ||
            "Football"
          )}
        </div>


        <div class="match">

          <div class="team">
            ${esc(m.home)}
          </div>


          <div>

            <div class="score">

              ${
                m.status === "upcoming"

                ? "— : —"

                :

                `${m.homeScore || 0}
                 :
                 ${m.awayScore || 0}`

              }

            </div>


            <div>

              ${esc(
                statusText(m)
              )}

              ${
                (
                  m.status === "live" ||
                  m.status === "half"
                ) &&
                liveMinute(m)

                ? ` • ${timerText(m)}`

                : ""
              }

            </div>

          </div>


          <div class="team">
            ${esc(m.away)}
          </div>

        </div>

      </div>


      <div class="tabs">

        <button
          class="tab ${
            tab === "events"
            ? "active"
            : ""
          }"
          onclick="setTab('events')">
          მოვლენები
        </button>

        <button
          class="tab ${
            tab === "stats"
            ? "active"
            : ""
          }"
          onclick="setTab('stats')">
          სტატისტიკა
        </button>

        <button
          class="tab ${
            tab === "lineups"
            ? "active"
            : ""
          }"
          onclick="setTab('lineups')">
          შემადგენლობა
        </button>

      </div>


      ${
        tab === "events"

        ? `<div class="card">${ev}</div>`

        : tab === "stats"

        ? stats

        : lineup

      }

    `;

}


window.setTab = t => {

  tab = t;

  renderDetail();

};


/* Firebase update */

async function patch(id,data){

  if(!admin){

    alert(
      "Admin წვდომა საჭიროა"
    );

    return;

  }

  await update(
    ref(db,"matches/" + id),
    {
      ...data,
      updatedAt:Date.now()
    }
  );

}


/* ახალი მატჩი */

window.createMatch = async () => {

  if(!admin)
    return;


  const r =
    push(ref(db,"matches"));


  await set(
    r,
    {

      competition:
        competition.value.trim()
        || "Football",

      venue:
        venue.value.trim(),

      home:
        home.value.trim()
        || "Home",

      away:
        away.value.trim()
        || "Away",

      date:
        date.value,

      kickoff:
        kickoff.value,

      status:
        "upcoming",

      minute:
        0,

      elapsedSeconds:
        0,

      startedAt:
        null,

      homeScore:
        0,

      awayScore:
        0,

      events:
        [],

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()

    }
  );


  document
    .querySelectorAll(
      "#adminView .field"
    )
    .forEach(x =>
      x.value = ""
    );

};


/* START LIVE */

window.startMatch = id => {

  const m =
    matches[id];

  if(!m)
    return;


  if(m.status === "finished"){

    alert(
      "დასრულებული მატჩის თავიდან დაწყება შეუძლებელია."
    );

    return;

  }


  const now =
    Date.now();


  return patch(
    id,
    {

      status:
        "live",

      startedAt:
        now,

      elapsedSeconds:
        Number(
          m.elapsedSeconds || 0
        ),

      minute:
        liveMinute({
          ...m,
          status:"live",
          startedAt:now
        })

    }
  );

};


/* HALF TIME */

window.half = id => {

  const m =
    matches[id];

  if(
    !m ||
    m.status !== "live"
  ){
    return;
  }


  const elapsedSeconds =
    liveElapsedSeconds(m);


  const minute =
    Math.max(
      1,
      Math.floor(
        elapsedSeconds / 60
      ) + 1
    );


  return patch(
    id,
    {

      status:
        "half",

      startedAt:
        null,

      elapsedSeconds,

      minute

    }
  );

};


/* FINISH */

window.finish = id => {

  const m =
    matches[id];

  if(!m)
    return;


  const elapsedSeconds =

    m.status === "live"

    ? liveElapsedSeconds(m)

    : Number(
        m.elapsedSeconds || 0
      );


  const minute =

    m.status === "live"

    ?

    Math.max(
      1,
      Math.floor(
        elapsedSeconds / 60
      ) + 1
    )

    :

    Number(
      m.minute || 0
    );


  return patch(
    id,
    {

      status:
        "finished",

      startedAt:
        null,

      elapsedSeconds,

      minute

    }
  );

};


/* წუთის ხელით შეცვლა */

window.changeMinute =
(id,n) => {

  const m =
    matches[id];

  if(!m)
    return;


  const min =
    Math.max(
      0,
      liveMinute(m) + n
    );


  const elapsedSeconds =
    Math.max(
      0,
      (min - 1) * 60
    );


  patch(
    id,
    {

      minute:min,

      elapsedSeconds,

      startedAt:
        m.status === "live"
        ? Date.now()
        : m.startedAt,

      status:
        m.status === "upcoming"
        ? "live"
        : m.status

    }
  );

};


/* GOAL */

window.goal =
async (id,side) => {

  const m =
    matches[id];

  if(!m)
    return;


  const events =
    [
      ...(m.events || [])
    ];


  const minute =
    liveMinute(m);


  events.push({

    type:
      "goal",

    side,

    minute,

    text:
      `გოლი — ${
        side === "home"
        ? m.home
        : m.away
      }`

  });


  await patch(
    id,
    {

      [
        side === "home"
        ? "homeScore"
        : "awayScore"
      ]:

      (
        m[
          side === "home"
          ? "homeScore"
          : "awayScore"
        ] || 0
      ) + 1,

      events,

      status:
        "live",

      startedAt:
        m.startedAt ||
        Date.now()

    }
  );

};


/* ბარათები / ცვლილება */

window.eventAdd =
async (id,type) => {

  const m =
    matches[id];

  if(!m)
    return;


  const events =
    [
      ...(m.events || [])
    ];


  const labels = {

    yellow:
      "ყვითელი ბარათი",

    red:
      "წითელი ბარათი",

    sub:
      "ცვლილება"

  };


  events.push({

    type,

    minute:
      liveMinute(m),

    text:
      labels[type]

  });


  await patch(
    id,
    {

      events,

      status:
        m.status === "upcoming"
        ? "live"
        : m.status,

      startedAt:
        m.status === "upcoming"
        ? Date.now()
        : m.startedAt

    }
  );

};


/* წაშლა */

window.deleteMatch =
async id => {

  if(
    confirm(
      "ნამდვილად წავშალოთ მატჩი?"
    )
  ){

    await remove(
      ref(
        db,
        "matches/" + id
      )
    );

  }

};

</script>
