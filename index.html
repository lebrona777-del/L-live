<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>L-LIVE — ქართული ფეხბურთი</title>

  <meta
    name="description"
    content="L-LIVE — ქართული ფეხბურთის LIVE, შედეგები, მატჩები და ჩემპიონატები"
  />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f3f6f4;
      color: #101614;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;

      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0 16px;

      background: #0b8f4d;
      color: white;

      box-shadow:
        0 3px 15px rgba(0, 0, 0, 0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 23px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .brand-ball {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background: white;
      color: #0b8f4d;

      font-size: 20px;
    }

    .refresh-button {
      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 50%;

      background: rgba(255,255,255,.16);
      color: white;

      font-size: 21px;
    }

    .refresh-button.loading {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       SEARCH
    ===================================================== */

    .search-wrap {
      padding: 12px 14px 5px;
      background: white;
    }

    .search {
      width: 100%;
      height: 45px;

      border: 1px solid #dce4df;
      border-radius: 13px;

      background: #f6f8f7;

      padding: 0 14px;

      outline: none;
    }

    .search:focus {
      border-color: #0b8f4d;
      background: white;
    }

    /* =====================================================
       NAV
    ===================================================== */

    .tabs {
      display: flex;
      gap: 7px;

      overflow-x: auto;

      padding: 10px 14px;

      background: white;

      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;

      border: 0;

      border-radius: 22px;

      padding: 10px 15px;

      background: #eef3f0;
      color: #405047;

      font-weight: 700;
    }

    .tab.active {
      background: #0b8f4d;
      color: white;
    }

    /* =====================================================
       MAIN
    ===================================================== */

    main {
      width: min(1100px, 100%);
      margin: auto;
      padding: 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: 14px 2px 9px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .count {
      color: #68766e;
      font-size: 13px;
      font-weight: 700;
    }

    /* =====================================================
       STATUS
    ===================================================== */

    .status {
      display: none;

      margin: 8px 0;
      padding: 10px 12px;

      border-radius: 10px;

      background: #fff6db;
      color: #735600;

      font-size: 13px;
    }

    .status.show {
      display: block;
    }

    .error {
      background: #ffe9e9;
      color: #a12626;
    }

    /* =====================================================
       MATCH CARD
    ===================================================== */

    .matches {
      display: grid;
      gap: 9px;
    }

    .match-card {
      background: white;

      border: 1px solid #e1e8e4;
      border-radius: 15px;

      overflow: hidden;

      box-shadow:
        0 2px 8px rgba(0,0,0,.035);
    }

    .match-head {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 9px 12px;

      border-bottom: 1px solid #edf1ef;

      color: #68766e;

      font-size: 12px;
    }

    .league-name {
      font-weight: 800;
      color: #4e5c54;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      color: #d92828;
      font-weight: 900;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e52323;

      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .25;
      }
    }

    .match-body {
      display: grid;
      grid-template-columns: 1fr 82px 1fr;

      align-items: center;

      padding: 16px 12px;
    }

    .team {
      font-weight: 800;
      line-height: 1.25;
    }

    .team.home {
      text-align: right;
    }

    .team.away {
      text-align: left;
    }

    .score-box {
      text-align: center;
    }

    .score {
      font-size: 25px;
      font-weight: 950;
      line-height: 1;
    }

    .score-time {
      margin-top: 6px;

      color: #718078;

      font-size: 12px;
      font-weight: 700;
    }

    .score-time.live {
      color: #d92828;
    }

    .match-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 9px 12px;

      background: #fafcfb;

      border-top: 1px solid #edf1ef;
    }

    .details-btn {
      border: 0;
      background: transparent;
      color: #0b8f4d;
      font-weight: 800;
      padding: 5px 0;
    }

    .star-btn {
      border: 0;
      background: transparent;

      font-size: 21px;

      color: #a4aea8;
    }

    .star-btn.active {
      color: #e7a900;
    }

    /* =====================================================
       EMPTY
    ===================================================== */

    .empty {
      padding: 45px 20px;

      text-align: center;

      color: #78857e;

      background: white;

      border-radius: 15px;
      border: 1px solid #e1e8e4;
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    /* =====================================================
       LEAGUES
    ===================================================== */

    .league-grid {
      display: grid;
      gap: 10px;
    }

    .league-card {
      width: 100%;

      border: 1px solid #dfe8e3;
      border-radius: 15px;

      background: white;

      padding: 16px;

      text-align: left;

      display: flex;
      align-items: center;
      justify-content: space-between;

      box-shadow:
        0 2px 8px rgba(0,0,0,.03);
    }

    .league-card strong {
      display: block;
      margin-bottom: 4px;
    }

    .league-card small {
      color: #78857e;
    }

    .arrow {
      color: #0b8f4d;
      font-size: 22px;
    }

    /* =====================================================
       TABLE
    ===================================================== */

    .table-wrap {
      overflow-x: auto;

      background: white;

      border-radius: 15px;

      border: 1px solid #e1e8e4;
    }

    table {
      width: 100%;
      min-width: 650px;

      border-collapse: collapse;
    }

    th,
    td {
      padding: 11px 9px;

      text-align: center;

      border-bottom: 1px solid #edf1ef;

      font-size: 13px;
    }

    th {
      background: #f5f8f6;
      color: #65736b;
      font-size: 12px;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    td:first-child {
      font-weight: 900;
      color: #0b8f4d;
    }

    /* =====================================================
       MODAL
    ===================================================== */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;

      background: rgba(0,0,0,.52);

      padding: 20px;

      align-items: flex-end;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(650px, 100%);
      max-height: 88vh;

      overflow-y: auto;

      background: white;

      border-radius: 20px 20px 0 0;

      padding: 18px;

      animation: modalUp .22s ease;
    }

    @keyframes modalUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 16px;
    }

    .modal-top h3 {
      margin: 0;
      font-size: 18px;
    }

    .close {
      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 50%;

      background: #eef3f0;

      font-size: 20px;
    }

    .detail-score {
      text-align: center;

      padding: 12px 0 20px;
    }

    .detail-teams {
      display: grid;
      grid-template-columns: 1fr 90px 1fr;
      align-items: center;
    }

    .detail-team {
      font-weight: 900;
    }

    .detail-team:first-child {
      text-align: right;
    }

    .detail-team:last-child {
      text-align: left;
    }

    .detail-big-score {
      font-size: 36px;
      font-weight: 950;
    }

    .detail-section {
      margin-top: 15px;
      padding-top: 14px;

      border-top: 1px solid #edf1ef;
    }

    .detail-section h4 {
      margin: 0 0 10px;
    }

    .detail-row {
      padding: 8px 0;
      color: #536159;
      font-size: 14px;
    }

    /* =====================================================
       BOTTOM NAV
    ===================================================== */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      z-index: 60;

      height: 72px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      background: white;

      border-top: 1px solid #dfe7e2;

      padding-bottom: env(safe-area-inset-bottom);
    }

    .bottom-btn {
      border: 0;
      background: transparent;

      color: #75827b;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;

      font-size: 11px;
      font-weight: 700;
    }

    .bottom-btn span {
      font-size: 21px;
    }

    .bottom-btn.active {
      color: #0b8f4d;
    }

    /* =====================================================
       DESKTOP
    ===================================================== */

    @media (min-width: 700px) {
      .matches {
        grid-template-columns: repeat(2, 1fr);
      }

      .league-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .modal {
        align-items: center;
      }

      .modal-card {
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="topbar">
    <div class="brand">
      <div class="brand-ball">⚽</div>
      <div>L-LIVE</div>
    </div>

    <button
      class="refresh-button"
      id="refreshBtn"
      onclick="refreshAll()"
      aria-label="განახლება"
    >
      ↻
    </button>
  </header>

  <!-- =====================================================
       SEARCH
  ====================================================== -->

  <div class="search-wrap">
    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="მოძებნე გუნდი ან ჩემპიონატი..."
      oninput="handleSearch()"
    />
  </div>

  <!-- =====================================================
       TABS
  ====================================================== -->

  <nav class="tabs">
    <button
      class="tab active"
      data-tab="live"
      onclick="setTab('live')"
    >
      🔴 LIVE
    </button>

    <button
      class="tab"
      data-tab="today"
      onclick="setTab('today')"
    >
      📅 დღეს
    </button>

    <button
      class="tab"
      data-tab="upcoming"
      onclick="setTab('upcoming')"
    >
      ⏭️ მომავალი
    </button>

    <button
      class="tab"
      data-tab="finished"
      onclick="setTab('finished')"
    >
      ✅ დასრულებული
    </button>

    <button
      class="tab"
      data-tab="leagues"
      onclick="setTab('leagues')"
    >
      🏆 ჩემპიონატები
    </button>
  </nav>

  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main>

    <div
      id="status"
      class="status"
    ></div>

    <section id="content"></section>

  </main>

  <!-- =====================================================
       BOTTOM NAV
  ====================================================== -->

  <nav class="bottom-nav">

    <button
      class="bottom-btn active"
      data-bottom="home"
      onclick="setTab('live')"
    >
      <span>🏠</span>
      მთავარი
    </button>

    <button
      class="bottom-btn"
      data-bottom="live"
      onclick="setTab('live')"
    >
      <span>🔴</span>
      LIVE
    </button>

    <button
      class="bottom-btn"
      data-bottom="leagues"
      onclick="setTab('leagues')"
    >
      <span>🏆</span>
      ლიგები
    </button>

    <button
      class="bottom-btn"
      data-bottom="favorites"
      onclick="showFavorites()"
    >
      <span>⭐</span>
      ფავორიტები
    </button>

  </nav>

  <!-- =====================================================
       MATCH MODAL
  ====================================================== -->

  <div
    id="modal"
    class="modal"
    onclick="closeModalOutside(event)"
  >

    <div class="modal-card">

      <div class="modal-top">
        <h3 id="modalTitle">
          მატჩი
        </h3>

        <button
          class="close"
          onclick="closeModal()"
        >
          ×
        </button>
      </div>

      <div id="modalContent"></div>

    </div>

  </div>

  <script>
    /* =====================================================
       STATE
    ===================================================== */

    const state = {
      tab: "live",

      matches: [],

      championships: [],

      currentLeague: null,

      search: "",

      favorites:
        JSON.parse(
          localStorage.getItem(
            "l-live-favorites"
          ) || "[]"
        )
    };

    /* =====================================================
       API
    ===================================================== */

    async function api(
      endpoint
    ) {
      const separator =
        endpoint.includes("?")
          ? "&"
          : "?";

      const response =
        await fetch(
          endpoint +
            separator +
            "_=" +
            Date.now(),
          {
            cache: "no-store"
          }
        );

      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status}`
        );
      }

      return response.json();
    }

    /* =====================================================
       STATUS
    ===================================================== */

    function showStatus(
      message,
      isError = false
    ) {
      const el =
        document.getElementById(
          "status"
        );

      if (!message) {
        el.classList.remove(
          "show"
        );

        return;
      }

      el.textContent =
        message;

      el.classList.toggle(
        "error",
        isError
      );

      el.classList.add(
        "show"
      );
    }

    /* =====================================================
       LOAD CHAMPIONSHIPS
    ===================================================== */

    async function loadChampionships() {
      const data =
        await api(
          "/api/championships"
        );

      state.championships =
        data.championships ||
        [];
    }

    /* =====================================================
       LOAD TAB
    ===================================================== */

    async function loadTab() {
      if (
        state.tab ===
        "leagues"
      ) {
        renderLeagues();
        return;
      }

      let endpoint =
        "/api/live";

      if (
        state.tab ===
        "today"
      ) {
        endpoint =
          "/api/today";
      }

      if (
        state.tab ===
        "upcoming"
      ) {
        endpoint =
          "/api/upcoming";
      }

      if (
        state.tab ===
        "finished"
      ) {
        endpoint =
          "/api/finished";
      }

      try {
        showStatus(
          "მონაცემები ახლდება..."
        );

        const data =
          await api(
            endpoint
          );

        state.matches =
          data.matches ||
          [];

        renderMatches();

        showStatus("");
      } catch (error) {
        console.error(
          error
        );

        showStatus(
          "მონაცემების ჩატვირთვა ვერ მოხერხდა.",
          true
        );
      }
    }

    /* =====================================================
       REFRESH
    ===================================================== */

    async function refreshAll() {
      const button =
        document.getElementById(
          "refreshBtn"
        );

      button.classList.add(
        "loading"
      );

      try {
        await loadChampionships();
        await loadTab();
      } finally {
        button.classList.remove(
          "loading"
        );
      }
    }

    /* =====================================================
       TABS
    ===================================================== */

    async function setTab(tab) {
      state.tab =
        tab;

      state.currentLeague =
        null;

      document
        .querySelectorAll(
          ".tab"
        )
        .forEach(
          button => {
            button.classList.toggle(
              "active",
              button.dataset.tab ===
                tab
            );
          }
        );

      document
        .querySelectorAll(
          ".bottom-btn"
        )
        .forEach(
          button => {
            const target =
              button.dataset.bottom;

            button.classList.toggle(
              "active",
              (
                target ===
                  "leagues" &&
                tab ===
                  "leagues"
              ) ||
              (
                target ===
                  "live" &&
                tab ===
                  "live"
              ) ||
              (
                target ===
                  "home" &&
                tab ===
                  "live"
              )
            );
          }
        );

      await loadTab();
    }

    /* =====================================================
       RENDER MATCHES
    ===================================================== */

    function renderMatches() {
      const content =
        document.getElementById(
          "content"
        );

      let matches =
        [...state.matches];

      if (
        state.search
      ) {
        const query =
          state.search
            .toLowerCase();

        matches =
          matches.filter(
            match =>
              String(
                match.homeTeam
              )
                .toLowerCase()
                .includes(query) ||

              String(
                match.awayTeam
              )
                .toLowerCase()
                .includes(query) ||

              String(
                match.championship
              )
                .toLowerCase()
                .includes(query)
          );
      }

      let title =
        "მატჩები";

      if (
        state.tab ===
        "live"
      ) {
        title =
          "LIVE მატჩები";
      }

      if (
        state.tab ===
        "today"
      ) {
        title =
          "დღის მატჩები";
      }

      if (
        state.tab ===
        "upcoming"
      ) {
        title =
          "მომავალი მატჩები";
      }

      if (
        state.tab ===
        "finished"
      ) {
        title =
          "დასრულებული მატჩები";
      }

      content.innerHTML = `
        <div class="section-title">
          <h2>${title}</h2>
          <span class="count">
            ${matches.length} მატჩი
          </span>
        </div>

        <div class="matches">
          ${
            matches.length
              ? matches
                  .map(
                    renderMatch
                  )
                  .join("")
              : renderEmpty(
                  state.tab ===
                    "live"
                    ? "ამ მომენტში LIVE მატჩი არ არის"
                    : "მატჩები ვერ მოიძებნა"
                )
          }
        </div>
      `;
    }

    /* =====================================================
       MATCH CARD
    ===================================================== */

    function renderMatch(
      match
    ) {
      const favorite =
        state.favorites.includes(
          match.id
        );

      const isLive =
        match.status ===
        "live";

      const score =
        Number.isInteger(
          match.homeScore
        ) &&
        Number.isInteger(
          match.awayScore
        )
          ? `${match.homeScore} : ${match.awayScore}`
          : "— : —";

      let timeText =
        match.time ||
        "";

      if (
        isLive &&
        match.minute
      ) {
        timeText =
          `${match.minute}'`;
      }

      if (
        match.status ===
        "finished"
      ) {
        timeText =
          "დასრულდა";
      }

      if (
        match.status ===
        "upcoming"
      ) {
        timeText =
          match.time ||
          "დაგეგმილი";
      }

      return `
        <article
          class="match-card"
          data-match-id="${escapeHtml(
            match.id
          )}"
        >

          <div class="match-head">

            <span class="league-name">
              ${escapeHtml(
                match.championship ||
                  ""
              )}
            </span>

            ${
              isLive
                ? `
                  <span class="live-badge">
                    <span class="live-dot"></span>
                    LIVE
                  </span>
                `
                : `
                  <span>
                    ${formatDate(
                      match.date
                    )}
                  </span>
                `
            }

          </div>

          <div class="match-body">

            <div class="team home">
              ${escapeHtml(
                match.homeTeam ||
                  "მასპინძელი"
              )}
            </div>

            <div class="score-box">

              <div class="score">
                ${score}
              </div>

              <div
                class="score-time ${
                  isLive
                    ? "live"
                    : ""
                }"
              >
                ${escapeHtml(
                  timeText
                )}
              </div>

            </div>

            <div class="team away">
              ${escapeHtml(
                match.awayTeam ||
                  "სტუმარი"
              )}
            </div>

          </div>

          <div class="match-footer">

            <button
              class="details-btn"
              onclick="openMatch('${escapeJs(
                match.id
              )}')"
            >
              მატჩის დეტალები →
            </button>

            <button
              class="star-btn ${
                favorite
                  ? "active"
                  : ""
              }"
              onclick="toggleFavorite('${escapeJs(
                match.id
              )}')"
              aria-label="ფავორიტი"
            >
              ${
                favorite
                  ? "★"
                  : "☆"
              }
            </button>

          </div>

        </article>
      `;
    }

    /* =====================================================
       EMPTY
    ===================================================== */

    function renderEmpty(
      text
    ) {
      return `
        <div class="empty">
          <div class="empty-icon">
            ⚽
          </div>

          <div>
            ${escapeHtml(
              text
            )}
          </div>
        </div>
      `;
    }

    /* =====================================================
       LEAGUES
    ===================================================== */

    function renderLeagues() {
      const content =
        document.getElementById(
          "content"
        );

      content.innerHTML = `
        <div class="section-title">
          <h2>ქართული ჩემპიონატები</h2>
          <span class="count">
            ${
              state.championships.length
            }
          </span>
        </div>

        <div class="league-grid">

          ${
            state.championships
              .map(
                league => `
                  <button
                    class="league-card"
                    onclick="openLeague('${escapeJs(
                      league.id
                    )}')"
                  >

                    <div>
                      <strong>
                        ${escapeHtml(
                          league.name
                        )}
                      </strong>

                      <small>
                        მატჩები · შედეგები · ცხრილი
                      </small>
                    </div>

                    <div class="arrow">
                      →
                    </div>

                  </button>
                `
              )
              .join("")
          }

        </div>
      `;
    }

    /* =====================================================
       LEAGUE PAGE
    ===================================================== */

    async function openLeague(
      id
    ) {
      try {
        showStatus(
          "ჩემპიონატი იტვირთება..."
        );

        const data =
          await api(
            `/api/championship/${encodeURIComponent(
              id
            )}`
          );

        const league =
          data.championship;

        const matches =
          data.matches ||
          [];

        state.currentLeague =
          league;

        const content =
          document.getElementById(
            "content"
          );

        content.innerHTML = `
          <div class="section-title">
            <h2>
              ${escapeHtml(
                league.name
              )}
            </h2>

            <span class="count">
              ${matches.length} მატჩი
            </span>
          </div>

          <div
            style="
              display:grid;
              grid-template-columns:1fr 1fr;
              gap:8px;
              margin-bottom:12px;
            "
          >

            <button
              class="tab active"
              onclick="showLeagueMatches()"
            >
              ⚽ მატჩები
            </button>

            <button
              class="tab"
              onclick="showLeagueTable('${escapeJs(
                league.id
              )}')"
            >
              📊 ცხრილი
            </button>

          </div>

          <div
            id="leagueMatches"
            class="matches"
          >
            ${
              matches.length
                ? matches
                    .map(
                      renderMatch
                    )
                    .join("")
                : renderEmpty(
                    "ამ ჩემპიონატში მატჩები ვერ მოიძებნა"
                  )
            }
          </div>
        `;

        state.matches =
          matches;

        showStatus("");
      } catch (error) {
        console.error(
          error
        );

        showStatus(
          "ჩემპიონატის ჩატვირთვა ვერ მოხერხდა.",
          true
        );
      }
    }

    /* =====================================================
       LEAGUE MATCHES
    ===================================================== */

    function showLeagueMatches() {
      const box =
        document.getElementById(
          "leagueMatches"
        );

      if (!box) return;

      box.innerHTML =
        state.matches.length
          ? state.matches
              .map(
                renderMatch
              )
              .join("")
          : renderEmpty(
              "მატჩები ვერ მოიძებნა"
            );
    }

    /* =====================================================
       TABLE
    ===================================================== */

    async function showLeagueTable(
      id
    ) {
      try {
        const data =
          await api(
            `/api/table/${encodeURIComponent(
              id
            )}`
          );

        const content =
          document.getElementById(
            "content"
          );

        const table =
          data.table ||
          [];

        content.innerHTML = `
          <div class="section-title">
            <h2>
              ${escapeHtml(
                data.championship.name
              )}
            </h2>
          </div>

          <div class="table-wrap">

            <table>

              <thead>
                <tr>
                  <th>#</th>
                  <th>გუნდი</th>
                  <th>თ</th>
                  <th>მ</th>
                  <th>ფ</th>
                  <th>წ</th>
                  <th>გ</th>
                  <th>გდ</th>
                  <th>ქ</th>
                </tr>
              </thead>

              <tbody>

                ${
                  table.length
                    ? table
                        .map(
                          row => `
                            <tr>
                              <td>
                                ${row.position}
                              </td>

                              <td>
                                ${escapeHtml(
                                  row.team
                                )}
                              </td>

                              <td>
                                ${row.played}
                              </td>

                              <td>
                                ${row.wins}
                              </td>

                              <td>
                                ${row.draws}
                              </td>

                              <td>
                                ${row.losses}
                              </td>

                              <td>
                                ${row.goalsFor}:
                                ${row.goalsAgainst}
                              </td>

                              <td>
                                ${row.goalDifference}
                              </td>

                              <td>
                                <strong>
                                  ${row.points}
                                </strong>
                              </td>
                            </tr>
                          `
                        )
                        .join("")
                    : `
                      <tr>
                        <td
                          colspan="9"
                        >
                          ცხრილის მონაცემები
                          ჯერ არ არის
                        </td>
                      </tr>
                    `
                }

              </tbody>

            </table>

          </div>
        `;
      } catch (error) {
        console.error(
          error
        );

        showStatus(
          "ცხრილის ჩატვირთვა ვერ მოხერხდა.",
          true
        );
      }
    }

    /* =====================================================
       MATCH DETAILS
    ===================================================== */

    async function openMatch(
      id
    ) {
      try {
        showStatus(
          "მატჩის დეტალები იტვირთება..."
        );

        const data =
          await api(
            `/api/matches/${encodeURIComponent(
              id
            )}`
          );

        const match =
          data.match;

        document.getElementById(
          "modalTitle"
        ).textContent =
          match.championship ||
          "მატჩი";

        const score =
          Number.isInteger(
            match.homeScore
          ) &&
          Number.isInteger(
            match.awayScore
          )
            ? `${match.homeScore} : ${match.awayScore}`
            : "— : —";

        document.getElementById(
          "modalContent"
        ).innerHTML = `

          <div class="detail-score">

            <div class="detail-teams">

              <div class="detail-team">
                ${escapeHtml(
                  match.homeTeam
                )}
              </div>

              <div>
                <div class="detail-big-score">
                  ${score}
                </div>

                <div class="score-time">
                  ${
                    match.status ===
                    "finished"
                      ? "დასრულდა"
                      : match.time ||
                        "დაგეგმილი"
                  }
                </div>
              </div>

              <div class="detail-team">
                ${escapeHtml(
                  match.awayTeam
                )}
              </div>

            </div>

          </div>

          <div class="detail-section">

            <h4>📌 მატჩის ინფორმაცია</h4>

            <div class="detail-row">
              ჩემპიონატი:
              <strong>
                ${escapeHtml(
                  match.championship
                )}
              </strong>
            </div>

            <div class="detail-row">
              თარიღი:
              ${formatDate(
                match.date
              )}
            </div>

            <div class="detail-row">
              დრო:
              ${escapeHtml(
                match.time ||
                  "—"
              )}
            </div>

            <div class="detail-row">
              სტადიონი:
              ${escapeHtml(
                match.venue ||
                  "მონაცემი არ არის"
              )}
            </div>

          </div>

          <div class="detail-section">

            <h4>⚽ გოლები</h4>

            ${
              match.goals &&
              match.goals.length
                ? match.goals
                    .map(
                      event => `
                        <div class="detail-row">
                          ${escapeHtml(
                            JSON.stringify(
                              event
                            )
                          )}
                        </div>
                      `
                    )
                    .join("")
                : `
                  <div class="detail-row">
                    გოლების დეტალური მონაცემი
                    ამ წყაროდან არ არის.
                  </div>
                `
            }

          </div>

          <div class="detail-section">

            <h4>🟨 ბარათები</h4>

            ${
              match.cards &&
              match.cards.length
                ? match.cards
                    .map(
                      event => `
                        <div class="detail-row">
                          ${escapeHtml(
                            JSON.stringify(
                              event
                            )
                          )}
                        </div>
                      `
                    )
                    .join("")
                : `
                  <div class="detail-row">
                    ბარათების მონაცემი
                    ამ წყაროდან არ არის.
                  </div>
                `
            }

          </div>

          <div class="detail-section">

            <h4>🔄 ცვლილებები</h4>

            ${
              match.substitutions &&
              match.substitutions.length
                ? match.substitutions
                    .map(
                      event => `
                        <div class="detail-row">
                          ${escapeHtml(
                            JSON.stringify(
                              event
                            )
                          )}
                        </div>
                      `
                    )
                    .join("")
                : `
                  <div class="detail-row">
                    ცვლილებების მონაცემი
                    ამ წყაროდან არ არის.
                  </div>
                `
            }

          </div>

          <div class="detail-section">

            <h4>📊 სტატისტიკა</h4>

            <div class="detail-row">
              ${
                match.statistics
                  ? escapeHtml(
                      JSON.stringify(
                        match.statistics
                      )
                    )
                  : "სტატისტიკის მონაცემი ამ წყაროდან არ არის."
              }
            </div>

          </div>

        `;

        document
          .getElementById(
            "modal"
          )
          .classList.add(
            "show"
          );

        showStatus("");
      } catch (error) {
        console.error(
          error
        );

        showStatus(
          "მატჩის დეტალები ვერ ჩაიტვირთა.",
          true
        );
      }
    }

    /* =====================================================
       MODAL
    ===================================================== */

    function closeModal() {
      document
        .getElementById(
          "modal"
        )
        .classList.remove(
          "show"
        );
    }

    function closeModalOutside(
      event
    ) {
      if (
        event.target.id ===
        "modal"
      ) {
        closeModal();
      }
    }

    /* =====================================================
       FAVORITES
    ===================================================== */

    function toggleFavorite(
      id
    ) {
      const index =
        state.favorites.indexOf(
          id
        );

      if (index === -1) {
        state.favorites.push(
          id
        );
      } else {
        state.favorites.splice(
          index,
          1
        );
      }

      localStorage.setItem(
        "l-live-favorites",
        JSON.stringify(
          state.favorites
        )
      );

      renderMatches();
    }

    async function showFavorites() {
      try {
        const data =
          await api(
            "/api/matches"
          );

        const matches =
          (data.matches ||
            []).filter(
            match =>
              state.favorites.includes(
                match.id
              )
          );

        state.matches =
          matches;

        state.tab =
          "favorites";

        document
          .querySelectorAll(
            ".tab"
          )
          .forEach(
            button =>
              button.classList.remove(
                "active"
              )
          );

        document.getElementById(
          "content"
        ).innerHTML = `

          <div class="section-title">
            <h2>⭐ ფავორიტები</h2>

            <span class="count">
              ${matches.length}
            </span>
          </div>

          <div class="matches">

            ${
              matches.length
                ? matches
                    .map(
                      renderMatch
                    )
                    .join("")
                : renderEmpty(
                    "ფავორიტი მატჩები ჯერ არ გაქვს"
                  )
            }

          </div>
        `;
      } catch (error) {
        console.error(
          error
        );

        showStatus(
          "ფავორიტების ჩატვირთვა ვერ მოხერხდა.",
          true
        );
      }
    }

    /* =====================================================
       SEARCH
    ===================================================== */

    function handleSearch() {
      state.search =
        document.getElementById(
          "searchInput"
        ).value
          .trim()
          .toLowerCase();

      if (
        state.tab ===
        "leagues"
      ) {
        return;
      }

      renderMatches();
    }

    /* =====================================================
       DATE FORMAT
    ===================================================== */

    function formatDate(
      value
    ) {
      if (!value) {
        return "თარიღი არ არის";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "—";
      }

      return date.toLocaleDateString(
        "ka-GE",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );
    }

    /* =====================================================
       ESCAPE
    ===================================================== */

    function escapeHtml(
      value
    ) {
      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }

    function escapeJs(
      value
    ) {
      return String(
        value ?? ""
      )
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        )
        .replace(
          /\n/g,
          "\\n"
        )
        .replace(
          /\r/g,
          "\\r"
        );
    }

    /* =====================================================
       AUTO REFRESH
    ===================================================== */

    setInterval(
      async () => {
        if (
          state.tab ===
          "leagues" ||
          state.tab ===
          "favorites"
        ) {
          return;
        }

        await loadTab();
      },
      15000
    );

    /* =====================================================
       START
    ===================================================== */

    (async function init() {
      try {
        await loadChampionships();
        await loadTab();
      } catch (error) {
        console.error(
          error
        );

        showStatus(
          "L-LIVE-ის ჩატვირთვა ვერ მოხერხდა.",
          true
        );
      }
    })();
  </script>

</body>
</html>
