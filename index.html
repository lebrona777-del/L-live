<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b8f4d">
  <title>L-LIVE</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f4f6f8;
      color: #15191d;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 78px;
    }

    /* HEADER */

    .header {
      background: #078a49;
      color: white;
      padding: 15px 16px 13px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      opacity: .75;
    }

    .status {
      font-size: 11px;
      background: rgba(255,255,255,.16);
      padding: 6px 9px;
      border-radius: 20px;
    }

    /* SPORTS */

    .sports {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 10px 12px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      scrollbar-width: none;
    }

    .sports::-webkit-scrollbar {
      display: none;
    }

    .sport-btn {
      flex: 0 0 auto;
      padding: 8px 13px;
      border-radius: 20px;
      background: #f0f2f4;
      color: #555;
      font-weight: 700;
      font-size: 13px;
    }

    .sport-btn.active {
      background: #078a49;
      color: white;
    }

    /* CHAMPIONSHIPS */

    .championships {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 9px 12px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      scrollbar-width: none;
    }

    .championships::-webkit-scrollbar {
      display: none;
    }

    .champ-btn {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 18px;
      background: #f1f3f5;
      color: #444;
      font-size: 12px;
      font-weight: 700;
    }

    .champ-btn.active {
      background: #15191d;
      color: white;
    }

    /* TABS */

    .tabs {
      display: flex;
      background: white;
      padding: 8px 10px;
      gap: 5px;
      border-bottom: 1px solid #e5e7eb;
    }

    .tab {
      flex: 1;
      padding: 9px 5px;
      border-radius: 9px;
      background: #f1f3f5;
      color: #666;
      font-size: 12px;
      font-weight: 800;
    }

    .tab.active {
      background: #078a49;
      color: white;
    }

    /* CONTENT */

    .content {
      padding: 12px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 900;
      margin: 4px 2px 10px;
    }

    .sub-title {
      font-size: 12px;
      color: #777;
      margin: -5px 2px 10px;
    }

    /* TEAMS */

    .teams {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .teams::-webkit-scrollbar {
      display: none;
    }

    .team-chip {
      flex: 0 0 auto;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    /* MATCH */

    .match-card {
      background: white;
      border-radius: 13px;
      margin-bottom: 8px;
      padding: 11px;
      border: 1px solid #e9ecef;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      color: #8a8f94;
      font-size: 10px;
      margin-bottom: 8px;
    }

    .match-body {
      display: grid;
      grid-template-columns: 1fr 55px 1fr;
      align-items: center;
      gap: 8px;
    }

    .team {
      font-size: 13px;
      font-weight: 800;
    }

    .team.home {
      text-align: right;
    }

    .team.away {
      text-align: left;
    }

    .score {
      text-align: center;
      font-size: 17px;
      font-weight: 900;
    }

    .match-status {
      display: block;
      font-size: 9px;
      margin-top: 3px;
      color: #078a49;
    }

    .empty {
      background: white;
      border-radius: 13px;
      padding: 24px 15px;
      text-align: center;
      color: #777;
      border: 1px solid #e5e7eb;
    }

    /* STANDINGS */

    .standings-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #e2e5e8;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }

    .table-scroll {
      overflow-x: auto;
      width: 100%;
    }

    .standings-table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      font-size: 11px;
    }

    .standings-table th {
      background: #f0f3f5;
      color: #687078;
      font-size: 10px;
      font-weight: 800;
      padding: 9px 6px;
      text-align: center;
      white-space: nowrap;
    }

    .standings-table th.team-head {
      text-align: left;
      padding-left: 10px;
    }

    .standings-table td {
      padding: 10px 6px;
      border-top: 1px solid #edf0f2;
      text-align: center;
      white-space: nowrap;
      font-weight: 600;
    }

    .standings-table td.team-cell {
      text-align: left;
      font-weight: 800;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .position {
      width: 38px;
      font-weight: 900 !important;
    }

    .points {
      font-weight: 900 !important;
    }

    .top-position {
      color: #078a49;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255,255,255,.97);
      border-top: 1px solid #ddd;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
      backdrop-filter: blur(10px);
    }

    .nav-btn {
      background: transparent;
      color: #777;
      padding: 7px 3px;
      font-size: 10px;
      font-weight: 800;
      border-radius: 10px;
    }

    .nav-btn.active {
      color: #078a49;
      background: #eef9f3;
    }

    .nav-icon {
      display: block;
      font-size: 18px;
      margin-bottom: 2px;
    }

    /* ERROR */

    .error {
      background: #fff1f1;
      color: #b42318;
      border: 1px solid #ffd5d2;
      padding: 12px;
      border-radius: 12px;
      font-size: 12px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="header-row">
      <div class="logo">L<span>-</span>LIVE</div>
      <div class="status" id="connectionStatus">● ონლაინ</div>
    </div>
  </header>

  <!-- SPORTS -->

  <div class="sports">
    <button class="sport-btn active" data-sport="football">⚽ ფეხბურთი</button>
    <button class="sport-btn" data-sport="basketball">🏀 კალათბურთი</button>
    <button class="sport-btn" data-sport="rugby">🏉 რაგბი</button>
  </div>

  <!-- CHAMPIONSHIPS -->

  <div class="championships" id="championships">
    <div class="loading">ჩემპიონატები იტვირთება...</div>
  </div>

  <!-- TABS -->

  <div class="tabs">
    <button class="tab active" data-tab="live">LIVE</button>
    <button class="tab" data-tab="today">დღეს</button>
    <button class="tab" data-tab="upcoming">მომავალი</button>
    <button class="tab" data-tab="results">შედეგები</button>
    <button class="tab" data-tab="table">ცხრილი</button>
  </div>

  <main class="content">

    <div id="message"></div>

    <!-- TEAMS -->

    <div class="section-title" id="competitionTitle">
      ეროვნული ლიგა
    </div>

    <div class="sub-title" id="competitionSubTitle">
      საქართველოს ფეხბურთი
    </div>

    <div class="teams" id="teams"></div>

    <!-- MATCHES -->

    <section id="matchesSection">

      <div class="section-title" id="matchesTitle">
        მატჩები
      </div>

      <div id="matches">
        <div class="loading">იტვირთება...</div>
      </div>

    </section>

    <!-- STANDINGS -->

    <section id="standingsSection">

      <div class="section-title">
        სატურნირო ცხრილი
      </div>

      <div class="sub-title" id="standingsSubtitle">
        პოზიციები და ქულები
      </div>

      <div class="standings-card">

        <div class="table-scroll">

          <table class="standings-table">

            <thead>
              <tr>
                <th>#</th>
                <th class="team-head">გუნდი</th>
                <th>თ</th>
                <th>მ</th>
                <th>ფ</th>
                <th>წ</th>
                <th>გატ</th>
                <th>გაშ</th>
                <th>სხვ</th>
                <th>ქ</th>
              </tr>
            </thead>

            <tbody id="standingsBody">
              <tr>
                <td colspan="10" class="loading">
                  ცხრილი იტვირთება...
                </td>
              </tr>
            </tbody>

          </table>

        </div>

      </div>

    </section>

  </main>

</div>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button class="nav-btn active" id="homeNav">
    <span class="nav-icon">⌂</span>
    მთავარი
  </button>

  <button class="nav-btn" id="liveNav">
    <span class="nav-icon">●</span>
    LIVE
  </button>

  <button class="nav-btn" id="tableNav">
    <span class="nav-icon">☷</span>
    ცხრილი
  </button>

  <button class="nav-btn" id="champNav">
    <span class="nav-icon">🏆</span>
    ჩემპიონატები
  </button>

</nav>

<script>
  let currentSport = "football";
  let currentCompetition = "national-league";
  let currentTab = "live";

  let championshipData = {
    football: [],
    basketball: [],
    rugby: []
  };

  /* =====================================================
     HELPERS
     ===================================================== */

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(value) {

    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return date.toLocaleDateString("ka-GE", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });
  }

  function formatTime(value) {

    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    return date.toLocaleTimeString("ka-GE", {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  async function getJson(url) {

    const response = await fetch(url, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    return await response.json();
  }

  /* =====================================================
     CHAMPIONSHIPS
     ===================================================== */

  async function loadChampionships() {

    const container =
      document.getElementById("championships");

    try {

      const data =
        await getJson("/api/championships");

      const list =
        Array.isArray(data)
          ? data
          : (data.championships || []);

      championshipData = {
        football:
          list.filter(
            item =>
              item &&
              item.sport === "football"
          ),

        basketball:
          list.filter(
            item =>
              item &&
              item.sport === "basketball"
          ),

        rugby:
          list.filter(
            item =>
              item &&
              item.sport === "rugby"
          )
      };

      renderChampionships();

    } catch (error) {

      console.error(error);

      container.innerHTML =
        '<div class="error">ჩემპიონატების ჩატვირთვა ვერ მოხერხდა.</div>';
    }
  }

  function renderChampionships() {

    const container =
      document.getElementById("championships");

    const list =
      championshipData[currentSport] || [];

    if (!list.length) {

      container.innerHTML =
        '<div class="loading">ამ სპორტში ჩემპიონატები ჯერ არ არის.</div>';

      return;
    }

    container.innerHTML =
      list.map(item => {

        const active =
          item.id === currentCompetition
            ? "active"
            : "";

        return `
          <button
            class="champ-btn ${active}"
            data-competition="${escapeHtml(item.id)}"
          >
            ${escapeHtml(
              item.shortName ||
              item.name
            )}
          </button>
        `;

      }).join("");

    container
      .querySelectorAll(".champ-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            currentCompetition =
              button.dataset.competition;

            currentTab = "live";

            renderChampionships();
            updateCompetitionTitle();
            loadCurrentView();
          }
        );
      });
  }

  /* =====================================================
     SPORT
     ===================================================== */

  function setupSports() {

    document
      .querySelectorAll(".sport-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            currentSport =
              button.dataset.sport;

            const list =
              championshipData[currentSport] || [];

            if (list.length) {
              currentCompetition =
                list[0].id;
            } else {
              currentCompetition = "";
            }

            document
              .querySelectorAll(".sport-btn")
              .forEach(btn =>
                btn.classList.remove("active")
              );

            button.classList.add("active");

            renderChampionships();
            updateCompetitionTitle();
            loadCurrentView();
          }
        );
      });
  }

  /* =====================================================
     TABS
     ===================================================== */

  function setupTabs() {

    document
      .querySelectorAll(".tab")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            currentTab =
              button.dataset.tab;

            document
              .querySelectorAll(".tab")
              .forEach(tab =>
                tab.classList.remove("active")
              );

            button.classList.add("active");

            updateSections();
            loadCurrentView();
          }
        );
      });
  }

  function updateSections() {

    const matchesSection =
      document.getElementById(
        "matchesSection"
      );

    const standingsSection =
      document.getElementById(
        "standingsSection"
      );

    if (currentTab === "table") {

      matchesSection.style.display =
        "none";

      standingsSection.style.display =
        "block";

    } else {

      matchesSection.style.display =
        "block";

      standingsSection.style.display =
        "block";
    }
  }

  /* =====================================================
     COMPETITION TITLE
     ===================================================== */

  function updateCompetitionTitle() {

    const list =
      championshipData[currentSport] || [];

    const competition =
      list.find(
        item =>
          item.id === currentCompetition
      );

    const title =
      document.getElementById(
        "competitionTitle"
      );

    const subtitle =
      document.getElementById(
        "competitionSubTitle"
      );

    if (!competition) {

      title.textContent =
        "ჩემპიონატი";

      subtitle.textContent =
        "";

      return;
    }

    title.textContent =
      competition.name ||
      competition.shortName ||
      "ჩემპიონატი";

    subtitle.textContent =
      competition.source
        ? "წყარო: " + competition.source
        : "";
  }

  /* =====================================================
     TEAMS
     ===================================================== */

  async function loadTeams() {

    const container =
      document.getElementById("teams");

    if (!currentCompetition) {

      container.innerHTML = "";
      return;
    }

    try {

      const data =
        await getJson(
          "/api/teams?competition=" +
          encodeURIComponent(
            currentCompetition
          )
        );

      const teams =
        data.teams || [];

      container.innerHTML =
        teams.map(team => `
          <div class="team-chip">
            ${escapeHtml(team)}
          </div>
        `).join("");

    } catch (error) {

      console.error(error);

      container.innerHTML = "";
    }
  }

  /* =====================================================
     MATCHES
     ===================================================== */

  async function loadMatches() {

    const container =
      document.getElementById("matches");

    const title =
      document.getElementById("matchesTitle");

    let endpoint = "";

    if (currentTab === "live") {
      endpoint = "/api/live";
      title.textContent = "LIVE მატჩები";
    }

    if (currentTab === "today") {
      endpoint = "/api/matches/today";
      title.textContent = "დღევანდელი მატჩები";
    }

    if (currentTab === "upcoming") {
      endpoint = "/api/matches/upcoming";
      title.textContent = "მომავალი მატჩები";
    }

    if (currentTab === "results") {
      endpoint = "/api/matches/results";
      title.textContent = "დასრულებული მატჩები";
    }

    if (!endpoint) {
      container.innerHTML = "";
      return;
    }

    container.innerHTML =
      '<div class="loading">იტვირთება...</div>';

    try {

      const separator =
        endpoint.includes("?")
          ? "&"
          : "?";

      const url =
        endpoint +
        separator +
        "sport=" +
        encodeURIComponent(currentSport) +
        "&competition=" +
        encodeURIComponent(currentCompetition);

      const data =
        await getJson(url);

      const matches =
        Array.isArray(data)
          ? data
          : (data.matches || []);

      if (!matches.length) {

        container.innerHTML =
          '<div class="empty">ამ განყოფილებაში მატჩები ჯერ არ არის.</div>';

        return;
      }

      container.innerHTML =
        matches.map(renderMatch).join("");

    } catch (error) {

      console.error(error);

      container.innerHTML =
        '<div class="error">მატჩების ჩატვირთვა ვერ მოხერხდა.</div>';
    }
  }

  function renderMatch(match) {

    const home =
      match.homeTeam ||
      match.home ||
      match.team1 ||
      "მასპინძელი";

    const away =
      match.awayTeam ||
      match.away ||
      match.team2 ||
      "სტუმარი";

    const homeScore =
      match.homeScore ??
      match.scoreHome ??
      match.homeGoals ??
      "-";

    const awayScore =
      match.awayScore ??
      match.scoreAway ??
      match.awayGoals ??
      "-";

    const rawDate =
      match.startTime ||
      match.date ||
      match.datetime ||
      "";

    const date =
      formatDate(rawDate);

    const time =
      formatTime(rawDate) ||
      match.time ||
      "";

    const status =
      match.status ||
      "";

    return `
      <div class="match-card">

        <div class="match-top">

          <span>
            ${escapeHtml(date)}
          </span>

          <span>
            ${escapeHtml(time)}
          </span>

        </div>

        <div class="match-body">

          <div class="team home">
            ${escapeHtml(home)}
          </div>

          <div class="score">

            ${escapeHtml(homeScore)}
            :
            ${escapeHtml(awayScore)}

            ${
              status
                ? `<span class="match-status">
                    ${escapeHtml(status)}
                   </span>`
                : ""
            }

          </div>

          <div class="team away">
            ${escapeHtml(away)}
          </div>

        </div>

      </div>
    `;
  }

  /* =====================================================
     STANDINGS
     ===================================================== */

  async function loadStandings() {

    const body =
      document.getElementById(
        "standingsBody"
      );

    const subtitle =
      document.getElementById(
        "standingsSubtitle"
      );

    if (!currentCompetition) {

      body.innerHTML = `
        <tr>
          <td colspan="10" class="loading">
            ჩემპიონატი არჩეული არ არის
          </td>
        </tr>
      `;

      return;
    }

    body.innerHTML = `
      <tr>
        <td colspan="10" class="loading">
          ცხრილი იტვირთება...
        </td>
      </tr>
    `;

    try {

      const data =
        await getJson(
          "/api/standings?competition=" +
          encodeURIComponent(
            currentCompetition
          )
        );

      const groups =
        Array.isArray(data.groups)
          ? data.groups
          : [];

      /*
        ზოგ ჩემპიონატში შეიძლება რამდენიმე
        ჯგუფი იყოს.
      */

      const rows =
        groups.flat();

      if (!rows.length) {

        body.innerHTML = `
          <tr>
            <td colspan="10" class="loading">
              ამ ჩემპიონატისთვის ცხრილი ჯერ არ არის.
            </td>
          </tr>
        `;

        subtitle.textContent =
          "ცხრილის მონაცემები ვერ მოიძებნა";

        return;
      }

      subtitle.textContent =
        "გუნდები და სატურნირო პოზიციები";

      body.innerHTML =
        rows
          .sort(
            (a, b) =>
              Number(a.position || 999) -
              Number(b.position || 999)
          )
          .map(row => {

            const position =
              Number(row.position || 0);

            const positionClass =
              position <= 3
                ? "top-position"
                : "";

            return `
              <tr>

                <td class="position ${positionClass}">
                  ${position}
                </td>

                <td class="team-cell">
                  ${escapeHtml(
                    row.team || "-"
                  )}
                </td>

                <td>
                  ${row.played ?? 0}
                </td>

                <td>
                  ${row.wins ?? 0}
                </td>

                <td>
                  ${row.draws ?? 0}
                </td>

                <td>
                  ${row.losses ?? 0}
                </td>

                <td>
                  ${row.goalsFor ?? 0}
                </td>

                <td>
                  ${row.goalsAgainst ?? 0}
                </td>

                <td>
                  ${row.goalDiff ?? 0}
                </td>

                <td class="points">
                  ${row.points ?? 0}
                </td>

              </tr>
            `;

          })
          .join("");

    } catch (error) {

      console.error(
        "STANDINGS LOAD ERROR:",
        error
      );

      body.innerHTML = `
        <tr>
          <td colspan="10" class="error">
            ცხრილის ჩატვირთვა ვერ მოხერხდა.
          </td>
        </tr>
      `;
    }
  }

  /* =====================================================
     CURRENT VIEW
     ===================================================== */

  async function loadCurrentView() {

    updateSections();

    await Promise.all([
      loadTeams(),
      loadMatches(),
      loadStandings()
    ]);
  }

  /* =====================================================
     BOTTOM NAV
     ===================================================== */

  function setupBottomNav() {

    document
      .getElementById("homeNav")
      .addEventListener("click", () => {

        currentTab = "live";

        document
          .querySelectorAll(".nav-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        document
          .getElementById("homeNav")
          .classList.add("active");

        document
          .querySelectorAll(".tab")
          .forEach(tab =>
            tab.classList.remove("active")
          );

        document
          .querySelector('[data-tab="live"]')
          .classList.add("active");

        loadCurrentView();
      });

    document
      .getElementById("liveNav")
      .addEventListener("click", () => {

        currentTab = "live";

        document
          .querySelectorAll(".nav-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        document
          .getElementById("liveNav")
          .classList.add("active");

        document
          .querySelectorAll(".tab")
          .forEach(tab =>
            tab.classList.remove("active")
          );

        document
          .querySelector('[data-tab="live"]')
          .classList.add("active");

        loadCurrentView();
      });

    document
      .getElementById("tableNav")
      .addEventListener("click", () => {

        currentTab = "table";

        document
          .querySelectorAll(".nav-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        document
          .getElementById("tableNav")
          .classList.add("active");

        document
          .querySelectorAll(".tab")
          .forEach(tab =>
            tab.classList.remove("active")
          );

        document
          .querySelector('[data-tab="table"]')
          .classList.add("active");

        loadCurrentView();
      });

    document
      .getElementById("champNav")
      .addEventListener("click", () => {

        document
          .getElementById("championships")
          .scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
      });
  }

  /* =====================================================
     START
     ===================================================== */

  async function init() {

    try {

      setupSports();
      setupTabs();
      setupBottomNav();

      await loadChampionships();

      /*
        ეროვნული ლიგა იყოს პირველი,
        თუ არსებობს.
      */

      const football =
        championshipData.football || [];

      if (
        football.length &&
        !football.some(
          item =>
            item.id === currentCompetition
        )
      ) {
        currentCompetition =
          football[0].id;
      }

      renderChampionships();
      updateCompetitionTitle();

      await loadCurrentView();

      document.getElementById(
        "connectionStatus"
      ).textContent = "● ონლაინ";

    } catch (error) {

      console.error(error);

      document.getElementById(
        "connectionStatus"
      ).textContent = "● შეცდომა";
    }
  }

  init();
</script>

</body>
