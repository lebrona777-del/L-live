<!DOCTYPE html>
<html lang="ka">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>L-LIVE — ქართული სპორტი</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    Arial,
    "Noto Sans Georgian",
    sans-serif;

  background:#f3f5f7;
  color:#111827;
}

button{
  font:inherit;
  cursor:pointer;
}

header{
  background:#111827;
  color:white;
  padding:16px 20px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1200px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
}

.live-indicator{
  display:flex;
  align-items:center;
  gap:7px;

  font-size:13px;
  color:#d1d5db;
}

.live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ef4444;
}

main{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* SPORTS */

.sports{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:10px;
}

.sport-btn{
  border:none;
  background:white;
  border-radius:12px;
  padding:12px 18px;
  font-weight:700;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.sport-btn.active{
  background:#111827;
  color:white;
}

/* CHAMPIONSHIPS */

.section-title{
  margin:20px 0 10px;
  font-size:18px;
  font-weight:800;
}

.championships{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
}

.championship-btn{
  border:1px solid #d1d5db;
  background:white;
  border-radius:10px;
  padding:9px 13px;
  white-space:nowrap;
  font-size:13px;
}

.championship-btn.active{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
}

/* TEAMS */

.teams-title{
  margin-top:20px;
  margin-bottom:10px;
  font-size:18px;
  font-weight:800;
}

.teams-list{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));

  gap:10px;
}

.team-item{
  background:white;
  border-radius:12px;
  padding:12px;

  display:flex;
  align-items:center;
  gap:10px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.05);
}

.team-item-logo{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:50%;
  flex-shrink:0;
}

.team-placeholder{
  width:42px;
  height:42px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#e5e7eb;
  font-size:20px;
}

.team-name{
  font-weight:700;
  font-size:14px;
}

/* TABS */

.tabs{
  display:flex;
  gap:8px;
  margin:20px 0;
  overflow-x:auto;
}

.tab{
  border:none;
  background:#e5e7eb;
  border-radius:10px;
  padding:10px 15px;
  font-weight:700;
  white-space:nowrap;
}

.tab.active{
  background:#111827;
  color:white;
}

/* MATCHES */

#matches{
  display:grid;
  gap:10px;
}

.match-card{
  background:white;
  border-radius:14px;
  padding:15px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.06);

  cursor:pointer;
}

.match-top{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:12px;

  font-size:12px;
  color:#6b7280;
}

.status-live{
  color:#dc2626;
  font-weight:800;
}

.teams{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:center;
  gap:10px;
}

.team{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.team-logo{
  width:38px;
  height:38px;
  object-fit:contain;
  border-radius:50%;
}

.score{
  text-align:center;
  font-size:24px;
  font-weight:900;
}

.time{
  font-size:13px;
  color:#6b7280;
  margin-top:3px;
}

/* LOADING / EMPTY */

.loading,
.empty{
  background:white;
  border-radius:14px;
  padding:35px 20px;
  text-align:center;
  color:#6b7280;
}

/* MODAL */

.modal{
  display:none;

  position:fixed;
  inset:0;

  background:rgba(0,0,0,.55);

  z-index:1000;

  padding:20px;

  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;

  width:min(600px,100%);
  max-height:90vh;

  overflow:auto;

  border-radius:18px;
  padding:20px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:20px;
}

.close{
  border:none;
  background:#e5e7eb;

  width:36px;
  height:36px;

  border-radius:50%;

  font-size:20px;
}

.event-section{
  margin-top:18px;
}

.event-section h3{
  font-size:15px;
  margin-bottom:8px;
}

.event{
  padding:9px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

/* MOBILE */

@media(max-width:650px){

  main{
    padding:12px;
  }

  .logo{
    font-size:23px;
  }

  .teams{
    grid-template-columns:1fr 55px 1fr;
  }

  .team{
    font-size:13px;
  }

  .team-logo{
    width:32px;
    height:32px;
  }

  .score{
    font-size:21px;
  }

  .teams-list{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<header>

<div class="header-inner">

<div class="logo">
L-LIVE
</div>

<div class="live-indicator">

<span class="live-dot"></span>

LIVE SPORTS

</div>

</div>

</header>


<main>

<!-- SPORTS -->

<div class="sports">

<button
class="sport-btn active"
data-sport="football"
>
⚽ ფეხბურთი
</button>

<button
class="sport-btn"
data-sport="basketball"
>
🏀 კალათბურთი
</button>

<button
class="sport-btn"
data-sport="rugby"
>
🏉 რაგბი
</button>

</div>


<!-- CHAMPIONSHIPS -->

<div class="section-title">
ჩემპიონატები
</div>

<div
id="championships"
class="championships"
></div>


<!-- TEAMS -->

<div class="teams-title">
👥 გუნდები
</div>

<div
id="teamsList"
class="teams-list"
>

<div class="loading">
გუნდები იტვირთება...
</div>

</div>


<!-- TABS -->

<div class="tabs">

<button
class="tab active"
data-tab="live"
>
🔴 LIVE
</button>

<button
class="tab"
data-tab="today"
>
დღეს
</button>

<button
class="tab"
data-tab="upcoming"
>
მომავალი
</button>

<button
class="tab"
data-tab="results"
>
შედეგები
</button>

</div>


<!-- MATCHES -->

<div id="matches">

<div class="loading">
მატჩები იტვირთება...
</div>

</div>

</main>


<!-- MODAL -->

<div
id="modal"
class="modal"
>

<div class="modal-box">

<div class="modal-header">

<h2>
მატჩის დეტალები
</h2>

<button
id="closeModal"
class="close"
>
×
</button>

</div>

<div id="modalContent"></div>

</div>

</div>


<script>

let currentSport =
"football";

let currentCompetition =
"erovnuli-liga";

let currentTab =
"live";

let championshipData = {};


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function teamName(team){

if(!team){
return "—";
}

return (
team.short ||
team.name ||
"—"
);

}


function teamLogo(team){

if(
team &&
team.logo
){

return `
<img
class="team-logo"
src="${escapeHTML(team.logo)}"
alt="${escapeHTML(teamName(team))}"
onerror="this.style.display='none'"
>
`;

}

return "";

}


function formatStatus(match){

if(
[
"live",
"in_progress",
"playing"
].includes(match.status)
){

return `
<span class="status-live">
● LIVE
</span>
`;

}

if(
match.status === "finished"
){

return "დასრულდა";

}

return (
match.time ||
"მალე"
);

}


/* =====================================================
   CHAMPIONSHIPS
===================================================== */

async function loadChampionships(){

try{

const response =
await fetch(
"/api/championships"
);

if(!response.ok){

throw new Error(
"Championship API error"
);

}

championshipData =
await response.json();

renderChampionships();

}catch(error){

console.error(
"CHAMPIONSHIPS ERROR:",
error
);

document.getElementById(
"championships"
).innerHTML = `
<div class="empty">
ჩემპიონატების ჩატვირთვა ვერ მოხერხდა.
</div>
`;

}

}


function renderChampionships(){

const container =
document.getElementById(
"championships"
);

const list =
championshipData[
currentSport
] || [];

container.innerHTML = "";

if(!list.length){

container.innerHTML = `
<div class="empty">
ჩემპიონატები ჯერ არ არის.
</div>
`;

return;

}

list.forEach(
competition => {

const button =
document.createElement(
"button"
);

button.className =
"championship-btn";

if(
competition.id ===
currentCompetition
){

button.classList.add(
"active"
);

}

button.textContent =
competition.name;

button.onclick =
async () => {

currentCompetition =
competition.id;

renderChampionships();

await loadTeams();

await loadMatches();

};

container.appendChild(
button
);

}
);

}


/* =====================================================
   TEAMS
===================================================== */

async function loadTeams(){

const container =
document.getElementById(
"teamsList"
);

container.innerHTML = `
<div class="loading">
გუნდები იტვირთება...
</div>
`;

try{

const url =
`/api/teams?sport=${encodeURIComponent(
currentSport
)}&competition=${encodeURIComponent(
currentCompetition
)}`;

const response =
await fetch(url);

if(!response.ok){

throw new Error(
"Teams API error"
);

}

const data =
await response.json();

const teams =
Array.isArray(data.teams)
? data.teams
: [];

renderTeams(teams);

}catch(error){

console.error(
"TEAMS ERROR:",
error
);

container.innerHTML = `
<div class="empty">
გუნდების ჩატვირთვა ვერ მოხერხდა.
</div>
`;

}

}


function renderTeams(teams){

const container =
document.getElementById(
"teamsList"
);

container.innerHTML = "";

if(!teams.length){

container.innerHTML = `
<div class="empty">
ამ ჩემპიონატში გუნდების სია ჯერ არ არის.
</div>
`;

return;

}

teams.forEach(
team => {

const item =
document.createElement(
"div"
);

item.className =
"team-item";

let logoHTML = "";

if(team.logo){

logoHTML = `
<img
class="team-item-logo"
src="${escapeHTML(team.logo)}"
alt="${escapeHTML(teamName(team))}"
onerror="
this.outerHTML='<div class=&quot;team-placeholder&quot;>⚽</div>'
"
>
`;

}else{

logoHTML = `
<div class="team-placeholder">
⚽
</div>
`;

}

item.innerHTML = `

${logoHTML}

<div class="team-name">
${escapeHTML(
teamName(team)
)}
</div>

`;

container.appendChild(
item
);

}
);

}


/* =====================================================
   MATCHES
===================================================== */

async function loadMatches(){

const container =
document.getElementById(
"matches"
);

container.innerHTML = `
<div class="loading">
მატჩები იტვირთება...
</div>
`;

try{

let url;

if(
currentTab === "live"
){

url =
`/api/live?sport=${encodeURIComponent(
currentSport
)}&competition=${encodeURIComponent(
currentCompetition
)}`;

}
else if(
currentTab === "today"
){

url =
`/api/matches/today?sport=${encodeURIComponent(
currentSport
)}&competition=${encodeURIComponent(
currentCompetition
)}`;

}
else if(
currentTab === "upcoming"
){

url =
`/api/matches/upcoming?sport=${encodeURIComponent(
currentSport
)}&competition=${encodeURIComponent(
currentCompetition
)}`;

}
else{

url =
`/api/matches/results?sport=${encodeURIComponent(
currentSport
)}&competition=${encodeURIComponent(
currentCompetition
)}`;

}

const response =
await fetch(url);

if(!response.ok){

throw new Error(
"Matches API error"
);

}

const data =
await response.json();

renderMatches(
Array.isArray(data.matches)
? data.matches
: []
);

}catch(error){

console.error(
"MATCHES ERROR:",
error
);

container.innerHTML = `
<div class="empty">
მატჩების ჩატვირთვა ვერ მოხერხდა.
</div>
`;

}

}


/* =====================================================
   RENDER MATCHES
===================================================== */

function renderMatches(matches){

const container =
document.getElementById(
"matches"
);

container.innerHTML = "";

if(!matches.length){

container.innerHTML = `
<div class="empty">
ამ განყოფილებაში მატჩები არ არის.
</div>
`;

return;

}

matches.forEach(
match => {

const card =
document.createElement(
"div"
);

card.className =
"match-card";

const home =
teamName(
match.homeTeam
);

const away =
teamName(
match.awayTeam
);

let score = "—";

if(
match.homeScore !== null &&
match.homeScore !== undefined &&
match.awayScore !== null &&
match.awayScore !== undefined
){

score =
`${match.homeScore} : ${match.awayScore}`;

}

card.innerHTML = `

<div class="match-top">

<span>
${escapeHTML(
match.competition || ""
)}
</span>

<span>
${formatStatus(match)}
</span>

</div>


<div class="teams">

<div class="team">

${teamLogo(
match.homeTeam
)}

<span>
${escapeHTML(home)}
</span>

</div>


<div class="score">

${escapeHTML(score)}

${
match.time
?
`
<div class="time">
${escapeHTML(match.time)}
</div>
`
:
""
}

</div>


<div class="team away">

<span>
${escapeHTML(away)}
</span>

${teamLogo(
match.awayTeam
)}

</div>

</div>

`;

card.onclick =
() => {

openMatch(match);

};

container.appendChild(
card
);

}
);

}


/* =====================================================
   MATCH DETAILS
===================================================== */

function openMatch(match){

const modal =
document.getElementById(
"modal"
);

const content =
document.getElementById(
"modalContent"
);

const events =
Array.isArray(match.events)
? match.events
: [];

let eventsHTML = "";

if(events.length){

eventsHTML =
events
.map(
event => `

<div class="event">

${escapeHTML(
event.minute
? event.minute + "' "
: ""
)}

${escapeHTML(
event.type || ""
)}

${
event.player
?
" — " +
escapeHTML(event.player)
:
""
}

</div>

`
)
.join("");

}else{

eventsHTML = `
<div class="event">
დეტალური მოვლენები წყაროში ჯერ არ არის.
</div>
`;

}


content.innerHTML = `

<div class="teams">

<div class="team">

${teamLogo(
match.homeTeam
)}

<span>
${escapeHTML(
teamName(match.homeTeam)
)}
</span>

</div>


<div class="score">

${match.homeScore ?? "—"}
:
${match.awayScore ?? "—"}

</div>


<div class="team away">

<span>
${escapeHTML(
teamName(match.awayTeam)
)}
</span>

${teamLogo(
match.awayTeam
)}

</div>

</div>


<div class="event-section">

<h3>
⚽ მოვლენები
</h3>

${eventsHTML}

</div>


<div class="event-section">

<h3>
🟨 ბარათები
</h3>

<div class="event">
დეტალური ინფორმაცია ჯერ არ არის.
</div>

</div>


<div class="event-section">

<h3>
🔄 ცვლილებები
</h3>

<div class="event">
დეტალური ინფორმაცია ჯერ არ არის.
</div>

</div>

`;

modal.classList.add(
"show"
);

}


/* =====================================================
   MODAL
===================================================== */

document
.getElementById(
"closeModal"
)
.onclick =
() => {

document
.getElementById(
"modal"
)
.classList.remove(
"show"
);

};


document
.getElementById(
"modal"
)
.addEventListener(
"click",
event => {

if(
event.target.id ===
"modal"
){

event.currentTarget
.classList.remove(
"show"
);

}

}
);


/* =====================================================
   SPORTS
===================================================== */

document
.querySelectorAll(
".sport-btn"
)
.forEach(
button => {

button.onclick =
async () => {

document
.querySelectorAll(
".sport-btn"
)
.forEach(
item =>
item.classList.remove(
"active"
)
);

button.classList.add(
"active"
);

currentSport =
button.dataset.sport;

const list =
championshipData[
currentSport
] || [];

currentCompetition =
list.length
? list[0].id
: "";

renderChampionships();

await loadTeams();

await loadMatches();

};

}
);


/* =====================================================
   TABS
===================================================== */

document
.querySelectorAll(
".tab"
)
.forEach(
button => {

button.onclick =
async () => {

document
.querySelectorAll(
".tab"
)
.forEach(
item =>
item.classList.remove(
"active"
)
);

button.classList.add(
"active"
);

currentTab =
button.dataset.tab;

await loadMatches();

};

}
);


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
async () => {

await loadMatches();

},
60000
);


/* =====================================================
   START
===================================================== */

(async function init(){

try{

await loadChampionships();

const list =
championshipData[
currentSport
] || [];

if(list.length){

currentCompetition =
list[0].id;

}

renderChampionships();

await loadTeams();

await loadMatches();

}catch(error){

console.error(
"L-LIVE INIT ERROR:",
error
);

}

})();

</script>

</body>

</html>
