<!DOCTYPE html>
<html lang="ka">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>L-LIVE</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Arial,
    "Noto Sans Georgian",
    sans-serif;
  background:#f3f6f4;
  color:#17211b;
}

button{
  font-family:inherit;
}

header{
  background:#087a43;
  color:white;
  padding:16px 14px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:1px;
}

.live-indicator{
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:7px;
}

.live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff3b30;
  display:inline-block;
}

main{
  max-width:1100px;
  margin:auto;
  padding:18px 14px 50px;
}

.sports{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
}

.sport-btn{
  border:0;
  background:white;
  padding:11px 15px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:
    0 2px 8px rgba(0,0,0,.06);
}

.sport-btn.active{
  background:#087a43;
  color:white;
}

.section-title{
  margin:18px 0 10px;
  font-size:18px;
  font-weight:900;
}

.championships{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.championship-btn{
  border:1px solid #dce5df;
  background:white;
  color:#17211b;
  padding:10px 13px;
  border-radius:11px;
  cursor:pointer;
  font-weight:700;
}

.championship-btn.active{
  background:#087a43;
  color:white;
  border-color:#087a43;
}

.teams-title{
  margin-top:22px;
  margin-bottom:10px;
  font-size:17px;
  font-weight:900;
}

.teams-list{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));
  gap:8px;
}

.team-item{
  background:white;
  border-radius:12px;
  padding:11px;
  display:flex;
  align-items:center;
  gap:9px;
  box-shadow:
    0 2px 7px rgba(0,0,0,.05);
}

.team-placeholder{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#edf3ef;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.team-item-logo{
  width:34px;
  height:34px;
  object-fit:contain;
  flex:none;
}

.team-name{
  font-size:14px;
  font-weight:700;
}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin:22px 0 12px;
}

.tab{
  border:0;
  background:white;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:#087a43;
  color:white;
}

.loading,
.empty{
  background:white;
  border-radius:12px;
  padding:18px;
  text-align:center;
  color:#65716a;
}

.match-card{
  background:white;
  border-radius:15px;
  padding:13px;
  margin-bottom:9px;
  cursor:pointer;
  box-shadow:
    0 2px 8px rgba(0,0,0,.06);
}

.match-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:11px;
  color:#6d7770;
  margin-bottom:12px;
}

.status-live{
  color:#e11d48;
  font-weight:900;
}

.teams{
  display:grid;
  grid-template-columns:
    1fr 80px 1fr;
  align-items:center;
  gap:10px;
}

.team{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  font-weight:700;
}

.team span{
  overflow:hidden;
  text-overflow:ellipsis;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.team-logo{
  width:34px;
  height:34px;
  object-fit:contain;
  flex:none;
}

.score{
  text-align:center;
  font-size:22px;
  font-weight:900;
}

.time{
  margin-top:3px;
  font-size:11px;
  font-weight:600;
  color:#737d77;
}

/* =====================================================
   STANDINGS
===================================================== */

.standings{
  margin-top:10px;
  margin-bottom:22px;
  overflow-x:auto;
}

.standings-card{
  background:white;
  border-radius:15px;
  padding:10px;
  box-shadow:
    0 2px 8px rgba(0,0,0,.05);
  margin-bottom:12px;
}

.standings-group-title{
  font-size:15px;
  font-weight:900;
  margin:4px 2px 10px;
}

.standings-table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}

.standings-table th{
  background:#087a43;
  color:white;
  padding:9px 7px;
  font-size:11px;
  text-align:center;
  white-space:nowrap;
}

.standings-table td{
  padding:10px 7px;
  border-bottom:1px solid #edf0ee;
  font-size:12px;
  text-align:center;
  white-space:nowrap;
}

.standings-table td:nth-child(2){
  text-align:left;
  font-weight:800;
}

.standings-table tr:last-child td{
  border-bottom:0;
}

.position{
  font-weight:900;
}

.points{
  font-weight:900;
  color:#087a43;
}

.standings-source{
  margin-top:8px;
  font-size:11px;
  color:#7a847e;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  padding:18px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.modal-header h2{
  margin:0;
  font-size:20px;
}

.close{
  border:0;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#edf0ee;
  font-size:22px;
  cursor:pointer;
}

.event-section{
  margin-top:20px;
}

.event-section h3{
  font-size:15px;
}

.event{
  padding:9px 0;
  border-bottom:1px solid #edf0ee;
  font-size:13px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

  main{
    padding:12px 10px 40px;
  }

  .logo{
    font-size:23px;
  }

  .teams{
    grid-template-columns:
      1fr 60px 1fr;
  }

  .team{
    font-size:12px;
  }

  .team-logo{
    width:30px;
    height:30px;
  }

  .score{
    font-size:20px;
  }

  .teams-list{
    grid-template-columns:1fr;
  }

  .championships{
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:5px;
  }

  .championship-btn{
    white-space:nowrap;
  }

}

</style>

</head>


<body>

<header>

  <div class="header-inner">

    <div class="logo">
      L-LIVE
    </div>

    <div class="live-indicator">

      <span class="live-dot"></span>

      LIVE SPORTS

    </div>

  </div>

</header>


<main>

  <!-- ===================================================
       SPORTS
  ==================================================== -->

  <div class="sports">

    <button
      class="sport-btn active"
      data-sport="football"
    >
      ⚽ ფეხბურთი
    </button>

    <button
      class="sport-btn"
      data-sport="basketball"
    >
      🏀 კალათბურთი
    </button>

    <button
      class="sport-btn"
      data-sport="rugby"
    >
      🏉 რაგბი
    </button>

  </div>


  <!-- ===================================================
       CHAMPIONSHIPS
  ==================================================== -->

  <div class="section-title">
    🏆 ჩემპიონატები
  </div>

  <div
    id="championships"
    class="championships"
  >

    <div class="loading">
      ჩემპიონატები იტვირთება...
    </div>

  </div>


  <!-- ===================================================
       TEAMS
  ==================================================== -->

  <div class="teams-title">
    👥 გუნდები
  </div>

  <div
    id="teamsList"
    class="teams-list"
  >

    <div class="loading">
      გუნდები იტვირთება...
    </div>

  </div>


  <!-- ===================================================
       STANDINGS
  ==================================================== -->

  <div class="section-title">
    📊 სატურნირო ცხრილი
  </div>

  <div
    id="standings"
    class="standings"
  >

    <div class="loading">
      ცხრილი იტვირთება...
    </div>

  </div>


  <!-- ===================================================
       TABS
  ==================================================== -->

  <div class="tabs">

    <button
      class="tab active"
      data-tab="live"
    >
      🔴 LIVE
    </button>

    <button
      class="tab"
      data-tab="today"
    >
      დღეს
    </button>

    <button
      class="tab"
      data-tab="upcoming"
    >
      მომავალი
    </button>

    <button
      class="tab"
      data-tab="results"
    >
      შედეგები
    </button>

  </div>


  <!-- ===================================================
       MATCHES
  ==================================================== -->

  <div id="matches">

    <div class="loading">
      მატჩები იტვირთება...
    </div>

  </div>

</main>


<!-- =====================================================
     MODAL
===================================================== -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        მატჩის დეტალები
      </h2>

      <button
        id="closeModal"
        class="close"
      >
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let currentSport =
  "football";

let currentCompetition =
  "national-league";

let currentTab =
  "live";

let championshipData = {

  football: [],

  basketball: [],

  rugby: []

};


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function teamName(team){

  if(!team){
    return "—";
  }

  if(typeof team === "string"){
    return team;
  }

  return (
    team.short ||
    team.name ||
    team.teamName ||
    team.title ||
    "—"
  );

}


function teamLogo(team){

  if(
    team &&
    typeof team === "object" &&
    team.logo
  ){

    return `

      <img
        class="team-logo"
        src="${escapeHTML(team.logo)}"
        alt="${escapeHTML(teamName(team))}"
        onerror="this.style.display='none'"
      >

    `;

  }

  return "";

}


function formatStatus(match){

  const status =
    String(match?.status || "")
      .toLowerCase();

  if(
    status === "live" ||
    status === "in_progress" ||
    status === "playing" ||
    status === "1h" ||
    status === "2h"
  ){

    return `
      <span class="status-live">
        ● LIVE
      </span>
    `;

  }

  if(
    status === "finished" ||
    status === "ft"
  ){

    return "დასრულდა";

  }

  return match?.time || "მალე";

}


/* =====================================================
   API
===================================================== */

async function apiFetch(url){

  const response =
    await fetch(
      url,
      {
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      `API ${response.status}`
    );

  }

  return await response.json();

}


/* =====================================================
   CHAMPIONSHIPS
===================================================== */

async function loadChampionships(){

  const container =
    document.getElementById(
      "championships"
    );

  container.innerHTML =
    `<div class="loading">
      ჩემპიონატები იტვირთება...
    </div>`;

  try{

    const data =
      await apiFetch(
        "/api/championships"
      );

    const list =
      Array.isArray(data)
        ? data
        : [];

    championshipData = {

      football:
        list.filter(
          item =>
            item &&
            item.sport === "football"
        ),

      basketball:
        list.filter(
          item =>
            item &&
            item.sport === "basketball"
        ),

      rugby:
        list.filter(
          item =>
            item &&
            item.sport === "rugby"
        )

    };

    const currentList =
      championshipData[
        currentSport
      ] || [];

    if(currentList.length){

      const exists =
        currentList.some(
          item =>
            item.id ===
            currentCompetition
        );

      if(!exists){

        currentCompetition =
          currentList[0].id;

      }

    }else{

      currentCompetition = "";

    }

    renderChampionships();

  }catch(error){

    console.error(
      "CHAMPIONSHIPS ERROR",
      error
    );

    container.innerHTML =
      `<div class="empty">
        ჩემპიონატების ჩატვირთვა ვერ მოხერხდა.
      </div>`;

  }

}


/* =====================================================
   RENDER CHAMPIONSHIPS
===================================================== */

function renderChampionships(){

  const container =
    document.getElementById(
      "championships"
    );

  const list =
    championshipData[
      currentSport
    ] || [];

  container.innerHTML = "";

  if(!list.length){

    container.innerHTML =
      `<div class="empty">
        ამ სპორტში ჩემპიონატები ჯერ არ არის.
      </div>`;

    return;

  }

  list.forEach(
    competition => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "championship-btn";

      if(
        competition.id ===
        currentCompetition
      ){

        button.classList.add(
          "active"
        );

      }

      button.textContent =
        competition.name ||
        competition.shortName ||
        competition.id;

      button.onclick =
        async () => {

          currentCompetition =
            competition.id;

          renderChampionships();

          await loadTeams();

          await loadStandings();

          await loadMatches();

        };

      container.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   TEAMS
===================================================== */

async function loadTeams(){

  const container =
    document.getElementById(
      "teamsList"
    );

  container.innerHTML =
    `<div class="loading">
      გუნდები იტვირთება...
    </div>`;

  if(!currentCompetition){

    container.innerHTML =
      `<div class="empty">
        ჩემპიონატი აირჩიე.
      </div>`;

    return;

  }

  try{

    const url =
      `/api/teams?sport=${
        encodeURIComponent(
          currentSport
        )
      }&competition=${
        encodeURIComponent(
          currentCompetition
        )
      }`;

    const data =
      await apiFetch(url);

    const teams =
      Array.isArray(data?.teams)
        ? data.teams
        : [];

    renderTeams(teams);

  }catch(error){

    console.error(
      "TEAMS ERROR",
      error
    );

    container.innerHTML =
      `<div class="empty">
        გუნდების ჩატვირთვა ვერ მოხერხდა.
      </div>`;

  }

}


/* =====================================================
   RENDER TEAMS
===================================================== */

function renderTeams(teams){

  const container =
    document.getElementById(
      "teamsList"
    );

  container.innerHTML = "";

  if(!teams.length){

    container.innerHTML =
      `<div class="empty">
        ამ ჩემპიონატში გუნდების სია ჯერ არ არის.
      </div>`;

    return;

  }

  teams.forEach(
    team => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "team-item";

      item.innerHTML = `

        <div class="team-placeholder">
          ⚽
        </div>

        <div class="team-name">
          ${escapeHTML(
            teamName(team)
          )}
        </div>

      `;

      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   STANDINGS
===================================================== */

async function loadStandings(){

  const container =
    document.getElementById(
      "standings"
    );

  container.innerHTML =
    `<div class="loading">
      ცხრილი იტვირთება...
    </div>`;

  if(!currentCompetition){

    container.innerHTML =
      `<div class="empty">
        ჩემპიონატი აირჩიე.
      </div>`;

    return;

  }

  try{

    const data =
      await apiFetch(
        "/api/standings?competition=" +
        encodeURIComponent(
          currentCompetition
        )
      );

    const groups =
      Array.isArray(
        data?.groups
      )
        ? data.groups
        : [];

    if(!groups.length){

      container.innerHTML =
        `<div class="empty">
          ამ ჩემპიონატისთვის მიმდინარე ცხრილი ჯერ ვერ ჩაიტვირთა.
        </div>`;

      return;

    }

    container.innerHTML = "";

    groups.forEach(
      (rows, groupIndex) => {

        if(
          !Array.isArray(rows) ||
          !rows.length
        ){

          return;

        }

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "standings-card";

        if(groups.length > 1){

          const title =
            document.createElement(
              "div"
            );

          title.className =
            "standings-group-title";

          title.textContent =
            "ჯგუფი " +
            (groupIndex + 1);

          card.appendChild(
            title
          );

        }

        const table =
          document.createElement(
            "table"
          );

        table.className =
          "standings-table";

        table.innerHTML = `

          <thead>

            <tr>

              <th>#</th>

              <th>გუნდი</th>

              <th>თ</th>

              <th>მ</th>

              <th>ფ</th>

              <th>წ</th>

              <th>გატ.</th>

              <th>მიღ.</th>

              <th>±</th>

              <th>ქ</th>

            </tr>

          </thead>

          <tbody></tbody>

        `;

        const tbody =
          table.querySelector(
            "tbody"
          );

        rows.forEach(
          row => {

            const tr =
              document.createElement(
                "tr"
              );

            tr.innerHTML = `

              <td class="position">
                ${escapeHTML(
                  row.position
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.team
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.played
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.wins
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.draws
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.losses
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.goalsFor
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.goalsAgainst
                )}
              </td>

              <td>
                ${escapeHTML(
                  row.goalDiff
                )}
              </td>

              <td class="points">
                ${escapeHTML(
                  row.points
                )}
              </td>

            `;

            tbody.appendChild(
              tr
            );

          }
        );

        card.appendChild(
          table
        );

        container.appendChild(
          card
        );

      }
    );

    const source =
      document.createElement(
        "div"
      );

    source.className =
      "standings-source";

    source.textContent =
      "ოფიციალური წყაროდან ჩატვირთული მონაცემები";

    container.appendChild(
      source
    );

  }catch(error){

    console.error(
      "STANDINGS ERROR",
      error
    );

    container.innerHTML =
      `<div class="empty">
        ცხრილის ჩატვირთვა ვერ მოხერხდა.
      </div>`;

  }

}


/* =====================================================
   MATCHES
===================================================== */

async function loadMatches(){

  const container =
    document.getElementById(
      "matches"
    );

  container.innerHTML =
    `<div class="loading">
      მატჩები იტვირთება...
    </div>`;

  let url = "";

  const query =
    currentCompetition
      ? "&competition=" +
        encodeURIComponent(
          currentCompetition
        )
      : "";

  try{

    if(
      currentTab === "live"
    ){

      url =
        `/api/live?sport=${
          encodeURIComponent(
            currentSport
          )
        }${query}`;

    }else if(
      currentTab === "today"
    ){

      url =
        `/api/matches/today?sport=${
          encodeURIComponent(
            currentSport
          )
        }${query}`;

    }else if(
      currentTab === "upcoming"
    ){

      url =
        `/api/matches/upcoming?sport=${
          encodeURIComponent(
            currentSport
          )
        }${query}`;

    }else{

      url =
        `/api/matches/results?sport=${
          encodeURIComponent(
            currentSport
          )
        }${query}`;

    }

    const data =
      await apiFetch(url);

    const matches =
      Array.isArray(
        data?.matches
      )
        ? data.matches
        : [];

    renderMatches(
      matches
    );

  }catch(error){

    console.error(
      "MATCHES ERROR",
      error
    );

    container.innerHTML =
      `<div class="empty">
        მატჩების ჩატვირთვა ვერ მოხერხდა.
      </div>`;

  }

}


/* =====================================================
   RENDER MATCHES
===================================================== */

function renderMatches(matches){

  const container =
    document.getElementById(
      "matches"
    );

  container.innerHTML = "";

  if(!matches.length){

    container.innerHTML =
      `<div class="empty">
        ამ განყოფილებაში მატჩები არ არის.
      </div>`;

    return;

  }

  matches.forEach(
    match => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "match-card";

      const home =
        match.homeTeam ||
        match.home ||
        "";

      const away =
        match.awayTeam ||
        match.away ||
        "";

      let score = "—";

      if(
        match.homeScore !== null &&
        match.homeScore !== undefined &&
        match.awayScore !== null &&
        match.awayScore !== undefined
      ){

        score =
          `${match.homeScore} : ${match.awayScore}`;

      }

      card.innerHTML = `

        <div class="match-top">

          <span>
            ${escapeHTML(
              match.competitionName ||
              match.competition ||
              ""
            )}
          </span>

          <span>
            ${formatStatus(
              match
            )}
          </span>

        </div>

        <div class="teams">

          <div class="team">

            ${teamLogo(home)}

            <span>
              ${escapeHTML(
                teamName(home)
              )}
            </span>

          </div>

          <div class="score">

            ${escapeHTML(
              score
            )}

            ${
              match.time
              ?
              `<div class="time">
                ${escapeHTML(
                  match.time
                )}
              </div>`
              :
              ""
            }

          </div>

          <div class="team away">

            <span>
              ${escapeHTML(
                teamName(away)
              )}
            </span>

            ${teamLogo(away)}

          </div>

        </div>

      `;

      card.onclick =
        () => openMatch(
          match
        );

      container.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   MATCH DETAILS
===================================================== */

function openMatch(match){

  const modal =
    document.getElementById(
      "modal"
    );

  const content =
    document.getElementById(
      "modalContent"
    );

  const home =
    match.homeTeam ||
    match.home ||
    "";

  const away =
    match.awayTeam ||
    match.away ||
    "";

  const events =
    Array.isArray(
      match.events
    )
      ? match.events
      : [];

  let eventsHTML = "";

  if(events.length){

    eventsHTML =
      events
        .map(
          event => `

            <div class="event">

              ${
                event.minute
                ?
                escapeHTML(
                  event.minute
                ) + "' "
                :
                ""
              }

              ${escapeHTML(
                event.type ||
                ""
              )}

              ${
                event.player
                ?
                " — " +
                escapeHTML(
                  event.player
                )
                :
                ""
              }

            </div>

          `
        )
        .join("");

  }else{

    eventsHTML =
      `<div class="event">
        დეტალური მოვლენები ჯერ არ არის.
      </div>`;

  }

  content.innerHTML = `

    <div class="teams">

      <div class="team">

        ${teamLogo(home)}

        <span>
          ${escapeHTML(
            teamName(home)
          )}
        </span>

      </div>

      <div class="score">

        ${match.homeScore ?? "—"}
        :
        ${match.awayScore ?? "—"}

      </div>

      <div class="team away">

        <span>
          ${escapeHTML(
            teamName(away)
          )}
        </span>

        ${teamLogo(away)}

      </div>

    </div>

    <div class="event-section">

      <h3>
        ⚽ მოვლენები
      </h3>

      ${eventsHTML}

    </div>

    <div class="event-section">

      <h3>
        🟨 ბარათები
      </h3>

      <div class="event">
        დეტალური ინფორმაცია ჯერ არ არის.
      </div>

    </div>

    <div class="event-section">

      <h3>
        🔄 ცვლილებები
      </h3>

      <div class="event">
        დეტალური ინფორმაცია ჯერ არ არის.
      </div>

    </div>

  `;

  modal.classList.add(
    "show"
  );

}


/* =====================================================
   MODAL
===================================================== */

document
  .getElementById(
    "closeModal"
  )
  .onclick =
  () => {

    document
      .getElementById(
        "modal"
      )
      .classList.remove(
        "show"
      );

  };


document
  .getElementById(
    "modal"
  )
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        event.currentTarget
          .classList.remove(
            "show"
          );

      }

    }
  );


/* =====================================================
   SPORTS
===================================================== */

document
  .querySelectorAll(
    ".sport-btn"
  )
  .forEach(
    button => {

      button.onclick =
        async () => {

          document
            .querySelectorAll(
              ".sport-btn"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          currentSport =
            button.dataset.sport;

          const list =
            championshipData[
              currentSport
            ] || [];

          currentCompetition =
            list.length
              ? list[0].id
              : "";

          renderChampionships();

          await loadTeams();

          await loadStandings();

          await loadMatches();

        };

    }
  );


/* =====================================================
   TABS
===================================================== */

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    button => {

      button.onclick =
        async () => {

          document
            .querySelectorAll(
              ".tab"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          currentTab =
            button.dataset.tab;

          await loadMatches();

        };

    }
  );


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
  async () => {

    try{

      await loadChampionships();

      await loadTeams();

      await loadStandings();

      await loadMatches();

    }catch(error){

      console.error(
        "AUTO REFRESH ERROR",
        error
      );

    }

  },
  60000
);

   INIT
===================================================== */

(async function(){

  try{

    await loadChampionships();

    await loadTeams();

    await loadStandings();

    await loadMatches();

  }catch(error){

    console.error(
      "L-LIVE INIT ERROR",
      error
    );

  }

})();

</script>
