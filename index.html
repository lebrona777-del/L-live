<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L LIVE — Live Football</title>

<style>
:root{
  --bg:#07110d;
  --panel:#0d1b15;
  --green:#20d477;
  --text:#f4fff9;
  --muted:#91a99d;
  --line:#1d3529;
  --red:#ff4d5f;
  --yellow:#ffd33d;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#06100c,#0a1711 55%,#06100c);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer;border:0}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(5,14,10,.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:1100px;
  margin:auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-weight:900;
  font-size:26px;
  letter-spacing:-1px;
}

.logo span{color:var(--green)}

.navBtns{
  display:flex;
  gap:7px;
}

.navBtn{
  background:#102219;
  color:#d9f5e6;
  padding:9px 12px;
  border-radius:10px;
}

.navBtn.active,
.primary{
  background:var(--green);
  color:#04140b;
  font-weight:800;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

.hero{
  padding:20px 4px 8px;
}

.hero h1{
  font-size:30px;
  margin:0 0 6px;
}

.hero p{
  color:var(--muted);
  margin:0;
}

.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:14px 0;
}

.chip{
  white-space:nowrap;
  background:#0e2018;
  color:#bcd5c8;
  padding:9px 13px;
  border-radius:999px;
}

.chip.active{
  background:var(--green);
  color:#04140b;
  font-weight:800;
}

.card{
  background:linear-gradient(145deg,var(--panel),#0a1812);
  border:1px solid var(--line);
  border-radius:16px;
  margin:10px 0;
  overflow:hidden;
  box-shadow:0 8px 25px #0003;
}

.cardHead{
  display:flex;
  justify-content:space-between;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
}

.match{
  padding:16px;
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  text-align:center;
  font-weight:750;
}

.badge{
  width:48px;
  height:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#183126;
  margin:0 auto 7px;
  font-size:22px;
}

.score{
  text-align:center;
  font-size:25px;
  font-weight:900;
}

.status{
  font-size:11px;
  color:var(--green);
  margin-top:3px;
}

.finished{
  color:#91a99d;
}

.live{
  color:var(--red);
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  50%{opacity:.5}
}

.clickable{
  cursor:pointer;
}

.clickable:active{
  transform:scale(.99);
}

.hidden{
  display:none!important;
}

.detailTop{
  padding:14px;
}

.back{
  background:#102219;
  color:#d8f4e4;
  padding:9px 12px;
  border-radius:10px;
  margin-bottom:14px;
}

.competition{
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.detailScore{
  display:grid;
  grid-template-columns:1fr 110px 1fr;
  align-items:center;
  margin:18px 0;
}

.detailTeam{
  text-align:center;
  font-weight:850;
}

.detailBadge{
  width:66px;
  height:66px;
  margin:0 auto 8px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#193529;
  font-size:30px;
}

.bigScore{
  text-align:center;
  font-size:38px;
  font-weight:950;
}

.tabs{
  display:flex;
  overflow:auto;
  border-bottom:1px solid var(--line);
}

.tab{
  background:none;
  color:var(--muted);
  padding:13px 15px;
  white-space:nowrap;
}

.tab.active{
  color:var(--green);
  border-bottom:2px solid var(--green);
}

.timeline{
  padding:16px;
}

.event{
  display:grid;
  grid-template-columns:50px 1fr 50px;
  align-items:center;
  min-height:68px;
  border-bottom:1px solid #173024;
}

.event .min{
  color:var(--muted);
  font-size:12px;
}

.event .ico{
  text-align:center;
  font-size:20px;
}

.event .txt{
  font-size:14px;
}

.event.away .txt{
  text-align:right;
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.admin{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

.admin h2{
  margin-top:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
}

.box h3{
  margin:0 0 12px;
  font-size:16px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.ctl{
  padding:11px 13px;
  border-radius:10px;
  background:#173126;
  color:#eafff3;
}

.ctl.green{
  background:var(--green);
  color:#04140b;
  font-weight:850;
}

.ctl.red{
  background:var(--red);
  color:white;
}

.ctl.yellow{
  background:var(--yellow);
  color:#171000;
}

.ctl:active{
  transform:scale(.97);
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}

input,select{
  width:100%;
  background:#09150f;
  color:white;
  border:1px solid #244133;
  border-radius:10px;
  padding:11px;
  margin-bottom:10px;
  outline:none;
}

.adminScore{
  font-size:38px;
  font-weight:950;
  text-align:center;
  margin:5px 0 12px;
}

.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
  margin-top:12px;
}

.danger{
  border-color:#5c2530;
}

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .match{
    grid-template-columns:1fr 70px 1fr;
  }

  .detailScore{
    grid-template-columns:1fr 90px 1fr;
  }

  .nav{
    padding:11px 12px;
  }

  .logo{
    font-size:23px;
  }
}
</style>
</head>

<body>

<header class="top">

  <div class="nav">

    <div class="logo">
      L <span>LIVE</span>
    </div>

    <div class="navBtns">

      <button
        class="navBtn active"
        id="homeBtn"
        onclick="showPublic()">
        LIVE
      </button>

      <button
        class="navBtn"
        id="adminBtn"
        onclick="showAdmin()">
        ADMIN
      </button>

    </div>

  </div>

</header>


<!-- ================= PUBLIC ================= -->

<main id="public">

  <div id="homeView" class="wrap">

    <section class="hero">

      <h1>საქართველო — LIVE</h1>

      <p>
        მატჩები, ანგარიშები და მოვლენები ერთ სივრცეში
      </p>

    </section>


    <div class="filters">

      <button class="chip active">
        ყველა
      </button>

      <button class="chip">
        LIVE
      </button>

      <button class="chip">
        დასრულებული
      </button>

      <button class="chip">
        დღეს
      </button>

    </div>


    <div id="matchList"></div>

  </div>


  <!-- MATCH DETAIL -->

  <div id="detailView" class="wrap hidden">

    <button
      class="back"
      onclick="closeDetail()">

      ← მატჩებზე დაბრუნება

    </button>

    <div id="detail"></div>

  </div>

</main>


<!-- ================= ADMIN ================= -->

<main id="admin" class="admin hidden">

  <h2>LIVE ADMIN</h2>

  <p class="note">

    აქედან მართავ მატჩს. ცვლილებები მაშინვე აისახება
    LIVE გვერდზე ამ ბრაუზერში.

  </p>


  <div class="grid">


    <!-- MATCH -->

    <section class="box">

      <h3>
        მატჩი
      </h3>

      <label>
        ტურნირი
      </label>

      <input
        id="aComp"
        value="GAFA • თბილისის სუპერლიგა">


      <label>
        მასპინძელი
      </label>

      <input
        id="aHome"
        value="დინამო თბილისი">


      <label>
        სტუმარი
      </label>

      <input
        id="aAway"
        value="ტორპედო ქუთაისი">


      <label>
        სტატუსი
      </label>

      <select id="aStatus">

        <option value="scheduled">
          დაგეგმილი
        </option>

        <option value="live">
          LIVE
        </option>

        <option value="halftime">
          ტაიმი
        </option>

        <option value="finished">
          დასრულებული
        </option>

      </select>


      <div class="row">

        <button
          class="ctl green"
          onclick="saveTeams()">

          მატჩის შენახვა

        </button>


        <button
          class="ctl"
          onclick="resetMatch()">

          დემო მატჩის აღდგენა

        </button>

      </div>

    </section>


    <!-- SCORE -->

    <section class="box">

      <h3>
        ანგარიში / წუთი
      </h3>


      <div class="adminScore">

        <span id="asHome">
          0
        </span>

        :

        <span id="asAway">
          0
        </span>

      </div>


      <div class="row">

        <button
          class="ctl green"
          onclick="setLive()">

          ▶ მატჩის დაწყება

        </button>


        <button
          class="ctl"
          onclick="setHalf()">

          ⏸ ტაიმი

        </button>


        <button
          class="ctl red"
          onclick="finishMatch()">

          ■ დასრულება

        </button>

      </div>


      <div
        class="row"
        style="margin-top:9px">

        <button
          class="ctl"
          onclick="addMinute(1)">

          +1 წთ

        </button>


        <button
          class="ctl"
          onclick="addMinute(5)">

          +5 წთ

        </button>


        <button
          class="ctl"
          onclick="addMinute(-1)">

          −1 წთ

        </button>

      </div>


      <p class="note">

        მიმდინარე წუთი:

        <b id="asMinute">
          0
        </b>'

      </p>

    </section>


    <!-- GOAL -->

    <section class="box">

      <h3>
        ⚽ გოლი
      </h3>


      <div class="row">

        <button
          class="ctl green"
          onclick="goal('home')">

          ⚽ მასპინძელი

        </button>


        <button
          class="ctl green"
          onclick="goal('away')">

          ⚽ სტუმარი

        </button>


        <button
          class="ctl"
          onclick="undoLast()">

          ↩ ბოლო მოვლენის გაუქმება

        </button>

      </div>

    </section>


    <!-- CARDS -->

    <section class="box">

      <h3>
        🟨 ბარათები
      </h3>


      <div class="row">

        <button
          class="ctl yellow"
          onclick="card('home','yellow')">

          🟨 მასპინძელი

        </button>


        <button
          class="ctl yellow"
          onclick="card('away','yellow')">

          🟨 სტუმარი

        </button>


        <button
          class="ctl red"
          onclick="card('home','red')">

          🟥 მასპინძელი

        </button>


        <button
          class="ctl red"
          onclick="card('away','red')">

          🟥 სტუმარი

        </button>

      </div>

    </section>


    <!-- SUBSTITUTION -->

    <section class="box">

      <h3>
        🔄 ცვლილება
      </h3>


      <label>
        გუნდს
      </label>

      <select id="subSide">

        <option value="home">
          მასპინძელი
        </option>

        <option value="away">
          სტუმარი
        </option>

      </select>


      <label>
        შემოვიდა
      </label>

      <input
        id="subIn"
        placeholder="ფეხბურთელის სახელი">


      <label>
        გავიდა
      </label>

      <input
        id="subOut"
        placeholder="ფეხბურთელის სახელი">


      <button
        class="ctl green"
        onclick="substitution()">

        ცვლილების დამატება

      </button>

    </section>


    <!-- EVENTS -->

    <section class="box danger">

      <h3>
        ⚡ LIVE მოვლენები
      </h3>

      <div
        id="adminEvents"
        class="note">
      </div>

    </section>

  </div>

</main>


<script>

const KEY = "llive_match_v2";


const defaultMatch = {

  comp:
    "GAFA • თბილისის სუპერლიგა",

  home:
    "დინამო თბილისი",

  away:
    "ტორპედო ქუთაისი",

  status:
    "scheduled",

  minute:
    0,

  homeScore:
    0,

  awayScore:
    0,

  events:
    []

};


let match =
  JSON.parse(localStorage.getItem(KEY) || "null")
  || structuredClone(defaultMatch);


let currentTab =
  "events";


/* SAVE */

function persist(){

  localStorage.setItem(
    KEY,
    JSON.stringify(match)
  );

  renderAll();

  window.dispatchEvent(
    new Event("llivechange")
  );

}


/* EVENT */

function eventObj(
  type,
  side,
  extra={}
){

  return {

    type,

    side,

    minute:
      match.minute,

    ...extra,

    id:
      Date.now()
      + Math.random()

  };

}


/* GOAL */

function goal(side){

  if(
    match.status === "scheduled"
  ){

    setLive(false);

  }


  if(
    match.status === "finished"
  ){

    return;

  }


  if(side === "home"){

    match.homeScore++;

  }else{

    match.awayScore++;

  }


  match.events.unshift(

    eventObj(
      "goal",
      side
    )

  );


  persist();

}


/* CARD */

function card(
  side,
  type
){

  if(
    match.status === "scheduled"
  ){

    setLive(false);

  }


  if(
    match.status === "finished"
  ){

    return;

  }


  match.events.unshift(

    eventObj(
      type,
      side
    )

  );


  persist();

}


/* SUBSTITUTION */

function substitution(){

  if(
    match.status === "scheduled"
  ){

    setLive(false);

  }


  if(
    match.status === "finished"
  ){

    return;

  }


  const inn =
    document
      .getElementById("subIn")
      .value
      .trim()
    || "ფეხბურთელი";


  const out =
    document
      .getElementById("subOut")
      .value
      .trim()
    || "ფეხბურთელი";


  const side =
    document
      .getElementById("subSide")
      .value;


  match.events.unshift(

    eventObj(
      "sub",
      side,
      {
        inn,
        out
      }
    )

  );


  document
    .getElementById("subIn")
    .value = "";


  document
    .getElementById("subOut")
    .value = "";


  persist();

}


/* MINUTE */

function addMinute(n){

  match.minute =
    Math.max(
      0,
      match.minute + n
    );


  if(
    match.status === "scheduled"
    && n > 0
  ){

    match.status =
      "live";

  }


  persist();

}


/* START */

function setLive(
  save=true
){

  match.status =
    "live";


  if(save){

    persist();

  }else{

    renderAll();

  }

}


/* HALF */

function setHalf(){

  match.status =
    "halftime";

  persist();

}


/* FINISH */

function finishMatch(){

  match.status =
    "finished";

  persist();

}


/* UNDO */

function undoLast(){

  const e =
    match.events.shift();


  if(!e){

    return;

  }


  if(
    e.type === "goal"
  ){

    if(
      e.side === "home"
    ){

      match.homeScore =
        Math.max(
          0,
          match.homeScore - 1
        );

    }else{

      match.awayScore =
        Math.max(
          0,
          match.awayScore - 1
        );

    }

  }


  persist();

}


/* SAVE MATCH */

function saveTeams(){

  match.comp =
    document
      .getElementById("aComp")
      .value
      .trim()
    || defaultMatch.comp;


  match.home =
    document
      .getElementById("aHome")
      .value
      .trim()
    || defaultMatch.home;


  match.away =
    document
      .getElementById("aAway")
      .value
      .trim()
    || defaultMatch.away;


  match.status =
    document
      .getElementById("aStatus")
      .value;


  persist();

}


/* RESET */

function resetMatch(){

  match =
    structuredClone(
      defaultMatch
    );

  persist();

}


/* ESCAPE */

function esc(s){

  return String(s)
    .replace(
      /[&<>"']/g,
      m =>
        ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m])
    );

}


/* BADGE */

function badge(name){

  return esc(
    name
      .slice(0,1)
      .toUpperCase()
  );

}


/* STATUS */

function statusText(){

  if(
    match.status === "live"
  ){

    return "LIVE";

  }


  if(
    match.status === "halftime"
  ){

    return "ტაიმი";

  }


  if(
    match.status === "finished"
  ){

    return "დასრულებული";

  }


  return "დაწყება";

}


/* STATUS CLASS */

function statusClass(){

  if(
    match.status === "live"
  ){

    return "live";

  }


  if(
    match.status === "finished"
  ){

    return "finished";

  }


  return "";

}


/* HOME */

function renderHome(){

  document
    .getElementById("matchList")
    .innerHTML = `

    <div
      class="card clickable"
      onclick="openDetail()">

      <div class="cardHead">

        <span>
          ${esc(match.comp)}
        </span>

        <span>
          ${statusText()}
        </span>

      </div>


      <div class="match">

        <div class="team">

          <div class="badge">

            ${badge(match.home)}

          </div>

          ${esc(match.home)}

        </div>


        <div class="score">

          <div>

            ${match.homeScore}
            :
            ${match.awayScore}

          </div>


          <div
            class="status ${statusClass()}">

            ${
              match.status === "live"
              ? match.minute + "'"
              : match.status === "finished"
              ? "FT"
              : "—"
            }

          </div>

        </div>


        <div class="team">

          <div class="badge">

            ${badge(match.away)}

          </div>

          ${esc(match.away)}

        </div>

      </div>

    </div>

  `;

}


/* ICON */

function icon(e){

  if(
    e.type === "goal"
  ){

    return "⚽";

  }


  if(
    e.type === "yellow"
  ){

    return "🟨";

  }


  if(
    e.type === "red"
  ){

    return "🟥";

  }


  return "🔄";

}


/* EVENT TEXT */

function eventText(e){

  const team =
    e.side === "home"
    ? match.home
    : match.away;


  if(
    e.type === "goal"
  ){

    return `
      <b>გოლი</b>
      — ${esc(team)}
    `;

  }


  if(
    e.type === "yellow"
  ){

    return `
      ყვითელი ბარათი
      — ${esc(team)}
    `;

  }


  if(
    e.type === "red"
  ){

    return `
      წითელი ბარათი
      — ${esc(team)}
    `;

  }


  return `
    ცვლილება
    — ${esc(team)}:
    ${esc(e.out)}
    →
    ${esc(e.inn)}
  `;

}


/* DETAIL */

function renderDetail(){

  const events =
    match.events
      .map(
        e => `

        <div
          class="event ${e.side}">

          <div class="min">

            ${e.minute}'

          </div>

          <div class="txt">

            ${eventText(e)}

          </div>

          <div class="ico">

            ${icon(e)}

          </div>

        </div>

      `
      )
      .join("");


  document
    .getElementById("detail")
    .innerHTML = `

    <div class="card">

      <div class="detailTop">

        <div class="competition">

          ${esc(match.comp)}

        </div>


        <div class="detailScore">


          <div class="detailTeam">

            <div class="detailBadge">

              ${badge(match.home)}

            </div>

            ${esc(match.home)}

          </div>


          <div class="bigScore">

            ${match.homeScore}
            :
            ${match.awayScore}


            <div
              class="status ${statusClass()}">

              ${
                match.status === "live"
                ? match.minute + "' • LIVE"
                : match.status === "halftime"
                ? "ტაიმი"
                : match.status === "finished"
                ? "FT"
                : "დაწყებამდე"
              }

            </div>

          </div>


          <div class="detailTeam">

            <div class="detailBadge">

              ${badge(match.away)}

            </div>

            ${esc(match.away)}

          </div>


        </div>

      </div>


      <div class="tabs">

        <button
          class="tab ${currentTab==="events"?"active":""}"
          onclick="setTab('events')">

          მოვლენები

        </button>


        <button
          class="tab ${currentTab==="stats"?"active":""}"
          onclick="setTab('stats')">

          სტატისტიკა

        </button>


        <button
          class="tab ${currentTab==="lineups"?"active":""}"
          onclick="setTab('lineups')">

          შემადგენლობები

        </button>

      </div>


      <div id="tabContent"></div>

    </div>

  `;


  renderTab();

}


/* TABS */

function setTab(t){

  currentTab =
    t;

  renderDetail();

}


/* TAB CONTENT */

function renderTab(){

  const c =
    document
      .getElementById("tabContent");


  if(!c){

    return;

  }


  /* EVENTS */

  if(
    currentTab === "events"
  ){

    c.innerHTML =
      match.events.length

      ?

      `
      <div class="timeline">

        ${match.events.map(
          e => `

          <div
            class="event ${e.side}">

            <div class="min">

              ${e.minute}'

            </div>

            <div class="txt">

              ${eventText(e)}

            </div>

            <div class="ico">

              ${icon(e)}

            </div>

          </div>

        `
        ).join("")}

      </div>
      `

      :

      `
      <div class="empty">

        მატჩში ჯერ მოვლენები არ არის.

      </div>
      `;

  }


  /* STATS */

  else if(
    currentTab === "stats"
  ){

    const goals =
      match.events.filter(
        e => e.type === "goal"
      ).length;


    const cards =
      match.events.filter(
        e =>
          e.type === "yellow"
          ||
          e.type === "red"
      ).length;


    c.innerHTML = `

      <div class="timeline">

        <div class="event">

          <div>⚽</div>

          <div class="txt">
            გოლები
          </div>

          <div>
            ${goals}
          </div>

        </div>


        <div class="event">

          <div>🟨</div>

          <div class="txt">
            ბარათები
          </div>

          <div>
            ${cards}
          </div>

        </div>


        <div class="event">

          <div>⏱️</div>

          <div class="txt">
            მიმდინარე წუთი
          </div>

          <div>
            ${match.minute}'
          </div>

        </div>

      </div>

    `;

  }


  /* LINEUPS */

  else{

    c.innerHTML = `

      <div class="empty">

        შემადგენლობების მოდული
        შემდეგ ეტაპზე დაემატება.

        <br><br>

        LIVE-ის გოლები, ბარათები,
        ცვლილებები და ანგარიში
        უკვე მუშაობს.

      </div>

    `;

  }

}


/* ADMIN */

function renderAdmin(){

  document
    .getElementById("asHome")
    .textContent =
      match.homeScore;


  document
    .getElementById("asAway")
    .textContent =
      match.awayScore;


  document
    .getElementById("asMinute")
    .textContent =
      match.minute;


  document
    .getElementById("aComp")
    .value =
      match.comp;


  document
    .getElementById("aHome")
    .value =
      match.home;


  document
    .getElementById("aAway")
    .value =
      match.away;


  document
    .getElementById("aStatus")
    .value =
      match.status;


  document
    .getElementById("adminEvents")
    .innerHTML =

    match.events.length

    ?

    match.events
      .map(
        e =>
          `${e.minute}'
           ${icon(e)}
           ${eventText(e)}`
      )
      .join("<br>")

    :

    "მოვლენები ჯერ არ არის.";

}


/* ALL */

function renderAll(){

  renderHome();

  renderDetail();

  renderAdmin();

}


/* OPEN DETAIL */

function openDetail(){

  document
    .getElementById("homeView")
    .classList
    .add("hidden");


  document
    .getElementById("detailView")
    .classList
    .remove("hidden");


  renderDetail();

}


/* CLOSE DETAIL */

function closeDetail(){

  document
    .getElementById("detailView")
    .classList
    .add("hidden");


  document
    .getElementById("homeView")
    .classList
    .remove("hidden");

}


/* PUBLIC */

function showPublic(){

  document
    .getElementById("public")
    .classList
    .remove("hidden");


  document
    .getElementById("admin")
    .classList
    .add("hidden");


  document
    .getElementById("homeBtn")
    .classList
    .add("active");


  document
    .getElementById("adminBtn")
    .classList
    .remove("active");


  closeDetail();

}


/* ADMIN */

function showAdmin(){

  document
    .getElementById("public")
    .classList
    .add("hidden");


  document
    .getElementById("admin")
    .classList
    .remove("hidden");


  document
    .getElementById("adminBtn")
    .classList
    .add("active");


  document
    .getElementById("homeBtn")
    .classList
    .remove("active");


  renderAdmin();

}


/* OTHER TAB / WINDOW */

window.addEventListener(
  "storage",
  e => {

    if(
      e.key === KEY
    ){

      match =
        JSON.parse(
          e.newValue
        );

      renderAll();

    }

  }
);


/* START */

renderAll();

</script>

</body>
</html>
