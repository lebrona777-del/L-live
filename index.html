<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>L-LIVE — ქართული სპორტული გაზეთი</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f3f6f4;
      color: #111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* HEADER */

    header {
      background: #fff;
      border-bottom: 1px solid #e3e8e5;
      padding: 24px 18px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .logo {
      font-weight: 950;
      line-height: .95;
      letter-spacing: -2px;
    }

    .logo-main {
      font-size: 43px;
      color: #42966c;
    }

    .logo-sub {
      display: block;
      margin-top: 5px;

      font-size: 20px;
      letter-spacing: 1px;
      color: #111;
    }

    .admin-button {
      border: 2px solid #dce7e1;
      background: #fff;

      border-radius: 16px;

      padding: 12px 16px;

      font-size: 15px;
      font-weight: 800;

      white-space: nowrap;
    }

    .admin-button:hover {
      background: #42966c;
      color: #fff;
      border-color: #42966c;
    }

    /* SEARCH */

    .search {
      max-width: 1200px;
      margin: 22px auto 0;

      height: 58px;

      display: flex;
      align-items: center;

      gap: 10px;

      padding: 0 18px;

      border: 2px solid #e0e7e3;
      border-radius: 18px;

      background: #fafcfb;
    }

    .search-icon {
      font-size: 23px;
    }

    .search input {
      width: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      font-size: 17px;
      color: #222;
    }

    .search input::placeholder {
      color: #9ca39f;
    }

    /* CATEGORIES */

    .categories {
      max-width: 1200px;

      margin: 20px auto;

      padding: 0 18px;

      display: flex;
      gap: 10px;

      overflow-x: auto;

      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      border: 0;

      background: #fff;

      color: #3186df;

      border-radius: 16px;

      padding: 15px 25px;

      font-size: 17px;
      font-weight: 900;

      white-space: nowrap;

      cursor: pointer;
    }

    .category.active {
      background: #42966c;
      color: #fff;
    }

    /* HERO */

    .hero {
      max-width: 1200px;

      margin: 20px auto 45px;

      padding: 55px 35px;

      border-radius: 28px;

      background:
        linear-gradient(
          135deg,
          #dcefe5,
          #ffffff
        );
    }

    .hero-label {
      color: #42966c;

      font-weight: 900;

      letter-spacing: 2px;

      font-size: 17px;
    }

    .hero h1 {
      margin: 12px 0;

      font-size: clamp(38px, 7vw, 65px);

      line-height: 1.03;

      letter-spacing: -2px;
    }

    .hero p {
      max-width: 650px;

      margin: 0;

      color: #68716c;

      font-size: 18px;

      line-height: 1.6;
    }

    /* NEWS */

    .news {
      max-width: 1200px;

      margin: auto;

      padding: 0 18px 70px;
    }

    .section-label {
      color: #42966c;

      font-weight: 900;

      letter-spacing: 2px;

      font-size: 14px;
    }

    .section-title {
      margin: 5px 0 25px;

      font-size: 35px;

      letter-spacing: -1px;
    }

    .articles {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 22px;
    }

    /* ARTICLE CARD */

    .article {
      background: #fff;

      border: 1px solid #e3e9e5;

      border-radius: 22px;

      overflow: hidden;

      box-shadow:
        0 8px 30px rgba(20, 50, 35, .05);

      transition: .2s;
    }

    .article:hover {
      transform: translateY(-4px);
    }

    .article-image {
      position: relative;

      display: block;

      height: 220px;

      background: #e6ece8;
    }

    .article-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .category-badge {
      position: absolute;

      left: 14px;
      bottom: 14px;

      background: #42966c;

      color: #fff;

      padding: 7px 11px;

      border-radius: 9px;

      font-size: 13px;

      font-weight: 900;
    }

    .article-body {
      padding: 20px;
    }

    .article-date {
      color: #929a96;

      font-size: 13px;

      margin-bottom: 8px;
    }

    .article-title {
      margin: 0 0 10px;

      font-size: 21px;

      line-height: 1.3;
    }

    .article-text {
      margin: 0 0 16px;

      color: #68716c;

      font-size: 15px;

      line-height: 1.6;
    }

    .read-more {
      color: #42966c;

      font-size: 15px;

      font-weight: 900;
    }

    /* EMPTY */

    .empty {
      background: #fff;

      border-radius: 20px;

      padding: 55px 20px;

      text-align: center;

      color: #7d8580;

      grid-column: 1 / -1;
    }

    /* FOOTER */

    footer {
      background: #111;

      color: #fff;

      text-align: center;

      padding: 45px 20px;
    }

    .footer-logo {
      color: #42966c;

      font-size: 34px;

      font-weight: 950;
    }

    footer p {
      color: #a9b0ac;
    }

    footer small {
      color: #777;
    }

    /* MOBILE */

    @media (max-width: 850px) {

      .articles {
        grid-template-columns: 1fr 1fr;
      }

    }

    @media (max-width: 600px) {

      header {
        padding: 20px 15px;
      }

      .logo-main {
        font-size: 34px;
      }

      .logo-sub {
        font-size: 16px;
      }

      .admin-button {
        padding: 10px 12px;
        font-size: 13px;
      }

      .search {
        margin-top: 18px;
      }

      .hero {
        margin: 15px 15px 35px;

        padding: 35px 25px;

        border-radius: 24px;
      }

      .hero h1 {
        font-size: 39px;
      }

      .hero p {
        font-size: 16px;
      }

      .news {
        padding-left: 15px;
        padding-right: 15px;
      }

      .section-title {
        font-size: 30px;
      }

      .articles {
        grid-template-columns: 1fr;
      }

      .article-image {
        height: 235px;
      }

    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="header-inner">

      <a href="/" class="logo">

        <span class="logo-main">
          L-LIVE
        </span>

        <span class="logo-sub">
          SPORT NEWS
        </span>

      </a>

      <a
        href="/admin"
        class="admin-button"
      >
        📰 სტატიის დამატება
      </a>

    </div>


    <div class="search">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="searchInput"
        type="text"
        placeholder="მოძებნე სპორტული ამბავი..."
      >

    </div>

  </header>


  <!-- CATEGORIES -->

  <nav class="categories">

    <button
      class="category active"
      data-category="ყველა"
    >
      ყველა
    </button>

    <button
      class="category"
      data-category="ფეხბურთი"
    >
      ⚽ ფეხბურთი
    </button>

    <button
      class="category"
      data-category="კალათბურთი"
    >
      🏀 კალათბურთი
    </button>

    <button
      class="category"
      data-category="რაგბი"
    >
      🏉 რაგბი
    </button>

    <button
      class="category"
      data-category="სხვა"
    >
      სხვა
    </button>

  </nav>


  <!-- HERO -->

  <section class="hero">

    <div class="hero-label">
      L-LIVE
    </div>

    <h1>
      ქართული სპორტის<br>
      ახალი ამბები
    </h1>

    <p>
      ფეხბურთი, კალათბურთი და რაგბი —
      ყველა მნიშვნელოვანი სპორტული ინფორმაცია
      ერთ სივრცეში.
    </p>

  </section>


  <!-- NEWS -->

  <main class="news">

    <div class="section-label">
      L-LIVE NEWS
    </div>

    <h2 class="section-title">
      ბოლო სტატიები
    </h2>


    <div
      id="articles"
      class="articles"
    >

      <div class="empty">
        სტატიები იტვირთება...
      </div>

    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <div class="footer-logo">
      L-LIVE
    </div>

    <p>
      ქართული სპორტული ონლაინ გაზეთი
    </p>

    <small>
      © 2026 L-LIVE
    </small>

  </footer>


  <script>

    let articles = [];

    let selectedCategory = "ყველა";


    const articlesBox =
      document.getElementById("articles");

    const searchInput =
      document.getElementById("searchInput");


    /* სტატიების წამოღება */

    async function loadArticles() {

      try {

        const response =
          await fetch("/api/articles");

        if (!response.ok) {
          throw new Error();
        }

        articles =
          await response.json();

        renderArticles();

      } catch (error) {

        articlesBox.innerHTML = `
          <div class="empty">
            სტატიების ჩატვირთვა ვერ მოხერხდა.
          </div>
        `;

      }

    }


    /* სტატიების ჩვენება */

    function renderArticles() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      let filtered =
        articles.filter(article => {

          const categoryMatch =
            selectedCategory === "ყველა" ||
            article.category === selectedCategory;


          const searchMatch =
            !search ||

            article.title
              .toLowerCase()
              .includes(search) ||

            article.content
              .toLowerCase()
              .includes(search);


          return categoryMatch && searchMatch;

        });


      if (!filtered.length) {

        articlesBox.innerHTML = `
          <div class="empty">
            ამ კატეგორიაში სტატია ჯერ არ არის.
          </div>
        `;

        return;

      }


      articlesBox.innerHTML =
        filtered.map(article => {

          const date =
            new Date(article.createdAt);


          const formattedDate =
            date.toLocaleDateString(
              "ka-GE",
              {
                day: "2-digit",
                month: "long",
                year: "numeric"
              }
            );


          const shortText =
            article.content.length > 160

              ? article.content.substring(0, 160) + "..."

              : article.content;


          return `

            <article class="article">

              <a
                href="/article/${article.id}"
                class="article-image"
              >

                <img
                  src="${escapeHtml(article.image)}"
                  alt="${escapeHtml(article.title)}"
                >

                <span class="category-badge">
                  ${escapeHtml(article.category)}
                </span>

              </a>


              <div class="article-body">

                <div class="article-date">
                  ${formattedDate}
                </div>


                <h3 class="article-title">

                  <a
                    href="/article/${article.id}"
                  >
                    ${escapeHtml(article.title)}
                  </a>

                </h3>


                <p class="article-text">
                  ${escapeHtml(shortText)}
                </p>


                <a
                  href="/article/${article.id}"
                  class="read-more"
                >
                  სრულად წაკითხვა →
                </a>

              </div>

            </article>

          `;

        }).join("");

    }


    /* კატეგორიები */

    document
      .querySelectorAll(".category")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".category")
              .forEach(item => {
                item.classList.remove("active");
              });


            button.classList.add("active");


            selectedCategory =
              button.dataset.category;


            renderArticles();

          }
        );

      });


    /* ძებნა */

    searchInput.addEventListener(
      "input",
      renderArticles
    );


    /* უსაფრთხო ტექსტი */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* დაწყება */

    loadArticles();

  </script>

</body>
</html>
