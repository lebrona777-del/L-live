<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>L-LIVE 🇬🇪</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f3f5f8;
  color:#17202a;
}

button{
  font:inherit;
}

header{
  background:#111827;
  color:white;
  padding:22px 16px 18px;
}

.header{
  max-width:1000px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:30px;
  font-weight:900;
}

.subtitle{
  margin-top:5px;
  color:#b8c0cc;
  font-size:15px;
}

.sports{
  display:flex;
  gap:9px;
  margin-top:18px;
  overflow-x:auto;
}

.sport{
  border:0;
  border-radius:13px;
  padding:12px 18px;
  background:#273246;
  color:white;
  font-weight:800;
  white-space:nowrap;
}

.sport.active{
  background:#49a957;
}

main{
  max-width:1000px;
  margin:auto;
  padding:18px 12px 80px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-bottom:20px;
}

.tab{
  border:0;
  border-radius:13px;
  background:white;
  color:#3280ee;
  padding:15px 8px;
  font-weight:800;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.tab.active{
  background:#49a957;
  color:white;
}

.status{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.status-title{
  font-size:22px;
  font-weight:900;
}

.updated{
  margin-top:6px;
  color:#7a8492;
}

.loading,
.empty,
.error{
  background:white;
  border-radius:16px;
  padding:30px 18px;
  text-align:center;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.section{
  margin-top:18px;
  border-radius:17px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.section-title{
  padding:14px 17px;
  background:#e5e7eb;
  font-size:20px;
  font-weight:900;
}

.match{
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  gap:10px;
  padding:15px 13px;
  border-bottom:1px solid #e5e7eb;
  cursor:pointer;
}

.match:last-child{
  border-bottom:0;
}

.team{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.team-info{
  min-width:0;
}

.team-name{
  font-weight:850;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.team-short{
  color:#6b7280;
  font-size:12px;
  font-weight:700;
}

.crest{
  width:42px;
  height:42px;
  object-fit:contain;
  flex-shrink:0;
}

.crest-empty{
  width:42px;
  height:42px;
  flex-shrink:0;
}

.center{
  text-align:center;
}

.score{
  font-size:22px;
  font-weight:950;
  white-space:nowrap;
}

.time{
  margin-top:4px;
  font-size:12px;
  font-weight:800;
  color:#6b7280;
}

.live{
  color:#16a34a;
  font-weight:900;
}

.finished{
  color:#6b7280;
}

.modal-backdrop{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.62);
  padding:20px;
}

.modal-backdrop.show{
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:24px 24px 0 0;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#eef0f3;
  font-size:22px;
}

.match-header{
  display:grid;
  grid-template-columns:1fr 110px 1fr;
  align-items:center;
  gap:10px;
  text-align:center;
}

.big-team{
  font-weight:900;
}

.big-crest{
  width:70px;
  height:70px;
  object-fit:contain;
  margin-bottom:7px;
}

.big-score{
  font-size:32px;
  font-weight:950;
}

.event-group{
  margin-top:24px;
}

.event-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:10px;
}

.event{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border-radius:11px;
  background:#f5f6f8;
  margin-bottom:7px;
}

.event-minute{
  min-width:48px;
  font-weight:900;
}

.event-player{
  font-weight:750;
}

.substitution{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.in{
  color:#16a34a;
}

.out{
  color:#dc2626;
}

.no-events{
  color:#7a8492;
  background:#f5f6f8;
  padding:14px;
  border-radius:11px;
}

@media(max-width:600px){

  .logo{
    font-size:27px;
  }

  .match{
    grid-template-columns:1fr 70px 1fr;
  }

  .team-name{
    font-size:14px;
  }

  .crest{
    width:36px;
    height:36px;
  }

  .crest-empty{
    width:36px;
    height:36px;
  }

  .score{
    font-size:19px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="top">
      <div>
        <div class="logo">L-LIVE 🇬🇪</div>
        <div class="subtitle">
          საქართველოს სპორტის LIVE შედეგები
        </div>
      </div>
    </div>

    <div class="sports">

      <button class="sport active" data-sport="football">
        ⚽ ფეხბურთი
      </button>

      <button class="sport" data-sport="basketball">
        🏀 კალათბურთი
      </button>

      <button class="sport" data-sport="rugby">
        🏉 რაგბი
      </button>

    </div>

  </div>
</header>


<main>

  <div class="tabs">

    <button class="tab active" data-tab="live">
      🔴 LIVE
    </button>

    <button class="tab" data-tab="today">
      დღეს
    </button>

    <button class="tab" data-tab="upcoming">
      მომავალი
    </button>

    <button class="tab" data-tab="results">
      დასრულებული
    </button>

  </div>


  <div class="status">

    <div class="status-title" id="pageTitle">
      ⚽ ფეხბურთი — LIVE მატჩები
    </div>

    <div class="updated" id="updated">
      მონაცემები იტვირთება...
    </div>

  </div>


  <div id="content">
    <div class="loading">
      მონაცემები იტვირთება...
    </div>
  </div>

</main>


<!-- MATCH DETAILS -->

<div class="modal-backdrop" id="modal">

  <div class="modal">

    <div class="modal-head">

      <strong>მატჩის დეტალები</strong>

      <button class="close" id="closeModal">
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>

let currentSport = "football";
let currentTab = "live";

let currentMatches = [];


// =====================================================
// API
// =====================================================

async function api(url){

  const response = await fetch(url, {
    headers:{
      "Accept":"application/json"
    }
  });

  if(!response.ok){
    throw new Error("API ERROR " + response.status);
  }

  return await response.json();
}


// =====================================================
// TITLES
// =====================================================

function updateTitle(){

  const sports = {
    football:"⚽ ფეხბურთი",
    basketball:"🏀 კალათბურთი",
    rugby:"🏉 რაგბი"
  };

  const tabs = {
    live:"LIVE მატჩები",
    today:"დღევანდელი მატჩები",
    upcoming:"მომავალი მატჩები",
    results:"დასრულებული მატჩები"
  };

  document.getElementById("pageTitle").textContent =
    `${sports[currentSport]} — ${tabs[currentTab]}`;
}


// =====================================================
// REAL LOGO
// =====================================================

function getLogo(team){

  if(!team){
    return "";
  }

  return (
    team.logo ||
    team.logoUrl ||
    team.crest ||
    team.badge ||
    ""
  );
}


function logoHTML(team){

  const logo = getLogo(team);

  if(!logo){
    // არ ვხატავთ გამოგონილ ლოგოს
    return `<div class="crest-empty"></div>`;
  }

  return `
    <img
      class="crest"
      src="${escapeHTML(logo)}"
      alt=""
      loading="lazy"
      onerror="this.style.display='none'"
    >
  `;
}


// =====================================================
// TEAM DATA
// =====================================================

function teamObject(match, side){

  if(side === "home"){

    if(typeof match.homeTeam === "object"){
      return match.homeTeam;
    }

    return {
      name:match.homeTeam || "მასპინძელი",
      short:
        match.homeShort ||
        match.homeAbbr ||
        match.homeTeamShort ||
        ""
    };
  }

  if(typeof match.awayTeam === "object"){
    return match.awayTeam;
  }

  return {
    name:match.awayTeam || "სტუმარი",
    short:
      match.awayShort ||
      match.awayAbbr ||
      match.awayTeamShort ||
      ""
  };
}


function teamName(team){

  return team?.name || team?.short || "";
}


function teamShort(team){

  return (
    team?.short ||
    team?.abbr ||
    team?.abbreviation ||
    ""
  );
}


// =====================================================
// ESCAPE
// =====================================================

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


// =====================================================
// MATCH CARD
// =====================================================

function renderMatch(match,index){

  const home = teamObject(match,"home");
  const away = teamObject(match,"away");

  const homeName = teamName(home);
  const awayName = teamName(away);

  const homeShort = teamShort(home);
  const awayShort = teamShort(away);

  const homeScore =
    match.homeScore ??
    match.homeGoals ??
    "-";

  const awayScore =
    match.awayScore ??
    match.awayGoals ??
    "-";

  let status = "";

  if(
    match.status === "live" ||
    match.status === "in_progress" ||
    match.status === "in progress"
  ){

    status = `<div class="time live">
      ${escapeHTML(match.minute || match.time || "LIVE")}
    </div>`;

  }else if(
    match.status === "finished" ||
    match.status === "ft"
  ){

    status = `<div class="time finished">
      დასრულდა
    </div>`;

  }else{

    status = `<div class="time">
      ${escapeHTML(match.time || match.date || "")}
    </div>`;
  }


  return `
    <div
      class="match"
      onclick="openMatch(${index})"
    >

      <div class="team">

        ${logoHTML(home)}

        <div class="team-info">

          <div class="team-name">
            ${escapeHTML(homeName)}
          </div>

          ${
            homeShort
            ? `<div class="team-short">
                ${escapeHTML(homeShort)}
              </div>`
            : ""
          }

        </div>

      </div>


      <div class="center">

        <div class="score">
          ${escapeHTML(homeScore)}
          -
          ${escapeHTML(awayScore)}
        </div>

        ${status}

      </div>


      <div class="team away">

        <div class="team-info">

          <div class="team-name">
            ${escapeHTML(awayName)}
          </div>

          ${
            awayShort
            ? `<div class="team-short">
                ${escapeHTML(awayShort)}
              </div>`
            : ""
          }

        </div>

        ${logoHTML(away)}

      </div>

    </div>
  `;
}


// =====================================================
// FOOTBALL LIST
// =====================================================

function renderFootball(matches){

  currentMatches = Array.isArray(matches)
    ? matches
    : [];

  if(currentMatches.length === 0){

    document.getElementById("content").innerHTML = `
      <div class="empty">
        ამ კატეგორიაში მატჩები ჯერ არ არის.
      </div>
    `;

    return;
  }


  let html = `
    <div class="section">

      <div class="section-title">
        ${
          currentTab === "live"
          ? "🔴 LIVE მატჩები"
          : currentTab === "upcoming"
          ? "📅 მომავალი მატჩები"
          : currentTab === "results"
          ? "🏁 დასრულებული მატჩები"
          : "📅 დღევანდელი მატჩები"
        }
      </div>
  `;


  currentMatches.forEach((match,index)=>{

    html += renderMatch(match,index);

  });


  html += `</div>`;


  document.getElementById("content").innerHTML = html;
}


// =====================================================
// OTHER SPORTS
// =====================================================

function renderCompetitions(data){

  if(!Array.isArray(data) || data.length === 0){

    document.getElementById("content").innerHTML = `
      <div class="empty">
        ამ სპორტისთვის მონაცემები ამ მომენტში ვერ მოიძებნა.
      </div>
    `;

    return;
  }


  let html = "";

  data.forEach(item=>{

    html += `
      <div class="section">

        <div class="section-title">
          ${escapeHTML(item.competition || "ჩემპიონატი")}
        </div>

        <div class="empty">
          ${item.available
            ? "მონაცემთა წყარო ხელმისაწვდომია."
            : "მონაცემები მიუწვდომელია."
          }
        </div>

      </div>
    `;

  });


  document.getElementById("content").innerHTML = html;
}


// =====================================================
// MATCH DETAILS
// =====================================================

function openMatch(index){

  const match = currentMatches[index];

  if(!match){
    return;
  }


  const home = teamObject(match,"home");
  const away = teamObject(match,"away");


  const homeScore =
    match.homeScore ??
    match.homeGoals ??
    "-";

  const awayScore =
    match.awayScore ??
    match.awayGoals ??
    "-";


  const events =
    Array.isArray(match.events)
      ? match.events
      : [];


  const goals =
    events.filter(e =>
      ["goal","own_goal","penalty_goal"]
      .includes(String(e.type || "").toLowerCase())
    );


  const yellow =
    events.filter(e =>
      ["yellow","yellow_card"]
      .includes(String(e.type || "").toLowerCase())
    );


  const red =
    events.filter(e =>
      ["red","red_card","second_yellow"]
      .includes(String(e.type || "").toLowerCase())
    );


  const substitutions =
    events.filter(e =>
      ["substitution","sub"]
      .includes(String(e.type || "").toLowerCase())
    );


  let html = `

    <div class="match-header">

      <div class="big-team">

        ${logoHTML(home)}

        <div>
          ${escapeHTML(teamName(home))}
        </div>

      </div>


      <div>

        <div class="big-score">
          ${escapeHTML(homeScore)}
          -
          ${escapeHTML(awayScore)}
        </div>

        <div class="time">
          ${
            match.status === "live"
            ? escapeHTML(match.minute || "LIVE")
            : match.status === "finished"
            ? "დასრულდა"
            : escapeHTML(match.time || "")
          }
        </div>

      </div>


      <div class="big-team">

        ${logoHTML(away)}

        <div>
          ${escapeHTML(teamName(away))}
        </div>

      </div>

    </div>

  `;


  html += eventSection(
    "⚽ გოლები",
    goals,
    "goal"
  );


  html += eventSection(
    "🟨 ყვითელი ბარათები",
    yellow,
    "yellow"
  );


  html += eventSection(
    "🟥 წითელი ბარათები",
    red,
    "red"
  );


  html += eventSection(
    "🔄 შეცვლები",
    substitutions,
    "substitution"
  );


  document.getElementById("modalContent").innerHTML = html;

  document.getElementById("modal").classList.add("show");
}


// =====================================================
// EVENT SECTION
// =====================================================

function eventSection(title,items,type){

  let html = `
    <div class="event-group">

      <div class="event-title">
        ${title}
      </div>
  `;


  if(items.length === 0){

    html += `
      <div class="no-events">
        ინფორმაცია ამ მომენტში არ არის.
      </div>
    `;

  }else{

    items.forEach(event=>{

      const minute =
        event.minute ||
        event.time ||
        "";

      const player =
        event.player ||
        event.playerName ||
        event.name ||
        "ფეხბურთელი";


      if(type === "substitution"){

        const playerIn =
          event.playerIn ||
          event.in ||
          event.subIn ||
          "";

        const playerOut =
          event.playerOut ||
          event.out ||
          event.subOut ||
          "";


        html += `
          <div class="event">

            <div class="event-minute">
              ${escapeHTML(minute)}
            </div>

            <div class="substitution">

              ${
                playerIn
                ? `<div class="in">
                    ↑ ${escapeHTML(playerIn)}
                  </div>`
                : ""
              }

              ${
                playerOut
                ? `<div class="out">
                    ↓ ${escapeHTML(playerOut)}
                  </div>`
                : ""
              }

            </div>

          </div>
        `;

      }else{

        html += `
          <div class="event">

            <div class="event-minute">
              ${escapeHTML(minute)}
            </div>

            <div class="event-player">
              ${escapeHTML(player)}
            </div>

          </div>
        `;
      }

    });

  }


  html += `</div>`;

  return html;
}


// =====================================================
// CLOSE MODAL
// =====================================================

document.getElementById("closeModal")
  .addEventListener("click",()=>{

    document.getElementById("modal")
      .classList.remove("show");

  });


document.getElementById("modal")
  .addEventListener("click",event=>{

    if(event.target.id === "modal"){

      document.getElementById("modal")
        .classList.remove("show");

    }

  });


// =====================================================
// LOAD DATA
// =====================================================

async function loadData(){

  updateTitle();


  document.getElementById("content").innerHTML = `
    <div class="loading">
      მონაცემები იტვირთება...
    </div>
  `;


  try{

    let data;


    if(currentSport === "football"){

      if(currentTab === "live"){

        data = await api("/api/live");

        renderFootball(data.live);

      }

      else if(currentTab === "today"){

        data = await api("/api/matches/today");

        renderFootball(data.matches);

      }

      else if(currentTab === "upcoming"){

        data = await api("/api/matches/upcoming");

        renderFootball(data.matches);

      }

      else{

        data = await api("/api/matches/results");

        renderFootball(data.matches);

      }

    }


    else if(currentSport === "basketball"){

      data = await api("/api/basketball");

      renderCompetitions(data.competitions);

    }


    else if(currentSport === "rugby"){

      data = await api("/api/rugby");

      renderCompetitions(data.competitions);

    }


    document.getElementById("updated").textContent =
      "განახლდა: " +
      new Date().toLocaleTimeString("ka-GE");


  }catch(error){

    console.error(error);

    document.getElementById("content").innerHTML = `
      <div class="error">
        მონაცემების ჩატვირთვა ვერ მოხერხდა.
        <br><br>
        სერვერი ან მონაცემთა წყარო ამ მომენტში მიუწვდომელია.
      </div>
    `;

    document.getElementById("updated").textContent =
      "განახლება ვერ მოხერხდა";

  }

}


// =====================================================
// SPORT BUTTONS
// =====================================================

document.querySelectorAll(".sport")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      document.querySelectorAll(".sport")
        .forEach(x=>x.classList.remove("active"));

      button.classList.add("active");

      currentSport =
        button.dataset.sport;

      loadData();

    });

  });


// =====================================================
// TAB BUTTONS
// =====================================================

document.querySelectorAll(".tab")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      document.querySelectorAll(".tab")
        .forEach(x=>x.classList.remove("active"));

      button.classList.add("active");

      currentTab =
        button.dataset.tab;

      loadData();

    });

  });


// =====================================================
// START
// =====================================================

loadData();


// =====================================================
// AUTO REFRESH
// =====================================================

setInterval(()=>{

  loadData();

},60000);
