<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-LIVE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#edf7f2;
  color:#10251d;
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#006b43,#008f59);
  color:white;
  padding:18px 16px 20px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 4px 20px rgba(0,80,50,.18);
}

.header{
  max-width:1050px;
  margin:auto;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#d9ffe9;
}

.header-icons{
  display:flex;
  gap:10px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:rgba(255,255,255,.14);
  color:white;
  font-size:22px;
}

.tagline{
  margin-top:6px;
  font-size:13px;
  opacity:.85;
}

.livebar{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:13px;
  font-size:13px;
}

.live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#63f39c;
  box-shadow:0 0 12px #63f39c;
}

main{
  max-width:1050px;
  margin:auto;
  padding:15px 12px 95px;
}

.sports{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:2px 0 12px;
}

.sport{
  flex:0 0 auto;
  border:0;
  background:white;
  color:#173128;
  padding:12px 17px;
  border-radius:16px;
  font-size:14px;
  font-weight:700;
  box-shadow:0 3px 14px rgba(0,80,50,.07);
}

.sport.active{
  background:#008b54;
  color:white;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin:4px 0 17px;
}

.filter{
  flex:0 0 auto;
  border:1px solid #d6e7df;
  background:white;
  color:#53685f;
  padding:10px 15px;
  border-radius:13px;
  font-size:13px;
  font-weight:700;
}

.filter.active{
  background:#006f46;
  color:white;
  border-color:#006f46;
}

.date{
  flex:0 0 auto;
  background:white;
  border:1px solid #d6e7df;
  border-radius:13px;
  padding:10px 13px;
  font-weight:700;
}

.league{
  margin-top:18px;
}

.league-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:white;
  padding:14px 15px;
  border-radius:17px 17px 10px 10px;
  margin-bottom:8px;
  box-shadow:0 3px 14px rgba(0,80,50,.06);
}

.league-name{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  font-weight:900;
}

.arrow{
  color:#008b54;
  font-size:24px;
}

.match{
  background:white;
  border-radius:17px;
  margin:8px 0;
  padding:14px 10px;
  display:grid;
  grid-template-columns:1fr 92px 1fr 30px;
  align-items:center;
  gap:6px;
  box-shadow:0 3px 14px rgba(0,80,50,.065);
  border:1px solid rgba(0,120,75,.05);
  cursor:pointer;
}

.team{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.team-name{
  font-size:15px;
  font-weight:800;
  line-height:1.15;
}

.crest{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:contain;
  background:#f1f7f4;
  padding:4px;
  border:1px solid #dcebe4;
  flex:0 0 43px;
}

.crest-fallback{
  width:43px;
  height:43px;
  border-radius:50%;
  background:linear-gradient(135deg,#008b54,#005c3b);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:12px;
  font-weight:900;
  flex:0 0 43px;
}

.center{
  text-align:center;
}

.time{
  font-size:20px;
  font-weight:900;
}

.score{
  font-size:23px;
  font-weight:900;
}

.live{
  display:inline-block;
  color:#fff;
  background:#e92f4d;
  border-radius:8px;
  padding:4px 7px;
  font-size:10px;
  font-weight:900;
  margin-bottom:4px;
}

.finished{
  color:#008b54;
  font-size:10px;
  font-weight:900;
}

.day{
  color:#73877e;
  font-size:11px;
  margin-top:2px;
}

.bell{
  font-size:21px;
  color:#71857c;
}

.empty{
  background:white;
  border-radius:18px;
  padding:45px 20px;
  text-align:center;
  color:#71857c;
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

.loading{
  padding:50px 10px;
  text-align:center;
  color:#6d8178;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:rgba(255,255,255,.96);
  border-top:1px solid #dce9e3;
  display:flex;
  justify-content:center;
  z-index:60;
  backdrop-filter:blur(12px);
}

.nav{
  width:100%;
  max-width:700px;
  display:flex;
  justify-content:space-around;
}

.nav-item{
  flex:1;
  text-align:center;
  padding-top:9px;
  color:#687c73;
  font-size:11px;
  font-weight:700;
}

.nav-icon{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#008b54;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,25,15,.65);
  display:none;
  align-items:flex-end;
  z-index:100;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:650px;
  margin:auto;
  background:white;
  border-radius:25px 25px 0 0;
  padding:22px;
  max-height:88vh;
  overflow:auto;
}

.close{
  float:right;
  border:0;
  background:#edf5f1;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:22px;
}

.big-match{
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  gap:10px;
  margin:28px 0;
}

.big-team{
  text-align:center;
  font-weight:800;
}

.big-score{
  text-align:center;
  font-size:32px;
  font-weight:900;
}

@media(min-width:700px){

  .match{
    grid-template-columns:1fr 120px 1fr 35px;
    padding:17px 20px;
  }

  .team-name{
    font-size:17px;
  }

}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="top">
      <div class="logo">
        L-<span>LIVE</span> ⚽
      </div>

      <div class="header-icons">
        <button class="icon-btn">⌕</button>
        <button class="icon-btn">☰</button>
      </div>
    </div>

    <div class="tagline">
      საქართველოს სპორტის ცოცხალი შედეგები
    </div>

    <div class="livebar">
      <span class="live-dot"></span>
      <span id="connection">მონაცემები იტვირთება...</span>
    </div>

  </div>
</header>


<main>

  <div class="sports">

    <button class="sport active">
      ⚽ ფეხბურთი
    </button>

    <button class="sport">
      🏀 კალათბურთი
    </button>

    <button class="sport">
      ⚽ ქალთა ფეხბურთი
    </button>

  </div>


  <div class="filters">

    <button class="filter active" data-filter="all">
      ყველა
    </button>

    <button class="filter" data-filter="live">
      🔴 LIVE
    </button>

    <button class="filter" data-filter="upcoming">
      მომავალი
    </button>

    <button class="filter" data-filter="finished">
      დასრულებული
    </button>

    <div class="date">
      📅 <span id="today"></span>
    </div>

  </div>


  <div id="content">

    <div class="loading">
      მატჩები იტვირთება...
    </div>

  </div>

</main>


<div class="bottom">

  <div class="nav">

    <div class="nav-item active">
      <span class="nav-icon">⌂</span>
      მთავარი
    </div>

    <div class="nav-item">
      <span class="nav-icon">▣</span>
      კალენდარი
    </div>

    <div class="nav-item">
      <span class="nav-icon">🏆</span>
      ტურნირები
    </div>

    <div class="nav-item">
      <span class="nav-icon">☆</span>
      ფავორიტები
    </div>

    <div class="nav-item">
      <span class="nav-icon">♙</span>
      პროფილი
    </div>

  </div>

</div>


<div class="modal-bg" id="modalBg">

  <div class="modal">

    <button class="close" onclick="closeModal()">
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<script>

let allMatches = [];
let currentFilter = "all";


/* თარიღი */

function getToday(){

  const d = new Date();

  return String(d.getDate()).padStart(2,"0")
    + "."
    + String(d.getMonth()+1).padStart(2,"0")
    + "."
    + d.getFullYear();

}

document.getElementById("today").textContent = getToday();


/* ISO დროიდან თარიღი */

function getDate(match){

  if(match.date){
    return match.date;
  }

  if(match.startTime){

    const d = new Date(match.startTime);

    if(!isNaN(d)){

      return d.toISOString().slice(0,10);

    }

  }

  return "";

}


/* ISO დროიდან საათი */

function getKickoff(match){

  if(match.kickoff){
    return match.kickoff;
  }

  if(match.startTime){

    const d = new Date(match.startTime);

    if(!isNaN(d)){

      return d.toLocaleTimeString(
        "ka-GE",
        {
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        }
      );

    }

  }

  return "--:--";

}


/* თარიღი */

function formatDate(date){

  if(!date) return "";

  const p = date.split("-");

  if(p.length !== 3) return date;

  const months = [
    "იან",
    "თებ",
    "მარ",
    "აპრ",
    "მაი",
    "ივნ",
    "ივლ",
    "აგვ",
    "სექ",
    "ოქტ",
    "ნოე",
    "დეკ"
  ];

  return `${p[2]} ${months[Number(p[1])-1]} ${p[0]}`;

}


/* სახელები */

function getHome(match){
  return match.home || match.homeTeam || "მასპინძელი";
}

function getAway(match){
  return match.away || match.awayTeam || "სტუმარი";
}

function getLeague(match){
  return (
    match.competition ||
    match.league ||
    match.source ||
    "ფეხბურთი"
  );
}


/* ინიციალები */

function initials(name){

  if(!name) return "FC";

  const parts =
    String(name)
      .trim()
      .split(/\s+/);

  if(parts.length === 1){

    return parts[0]
      .slice(0,2)
      .toUpperCase();

  }

  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();

}


/* უსაფრთხო HTML */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return String(value ?? "")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ლოგო */

function teamLogo(team,logo){

  if(logo){

    return `
      <img
        class="crest"
        src="${escapeAttr(logo)}"
        alt="${escapeHTML(team)}"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
      >

      <div
        class="crest-fallback"
        style="display:none"
      >
        ${initials(team)}
      </div>
    `;

  }

  return `
    <div class="crest-fallback">
      ${initials(team)}
    </div>
  `;

}


/* მატჩის ბარათი */

function matchCard(match){

  const home = getHome(match);
  const away = getAway(match);

  const date = getDate(match);
  const kickoff = getKickoff(match);

  let center = "";

  if(match.status === "finished"){

    center = `
      <div class="score">
        ${match.homeScore ?? 0}
        :
        ${match.awayScore ?? 0}
      </div>

      <div class="finished">
        დასრულდა
      </div>
    `;

  }else if(match.status === "live"){

    center = `
      <div class="live">
        🔴 LIVE
      </div>

      <div class="score">
        ${match.homeScore ?? 0}
        :
        ${match.awayScore ?? 0}
      </div>
    `;

  }else{

    center = `
      <div class="time">
        ${kickoff}
      </div>

      <div class="day">
        ${formatDate(date)}
      </div>
    `;

  }


  return `

    <div
      class="match"
      onclick="openMatch('${escapeAttr(match.id)}')"
    >

      <div class="team">

        ${teamLogo(
          home,
          match.homeLogo
        )}

        <div class="team-name">
          ${escapeHTML(home)}
        </div>

      </div>


      <div class="center">
        ${center}
      </div>


      <div class="team away">

        <div class="team-name">
          ${escapeHTML(away)}
        </div>

        ${teamLogo(
          away,
          match.awayLogo
        )}

      </div>


      <div class="bell">
        🔔
      </div>

    </div>

  `;

}


/* ჯგუფირება */

function groupMatches(matches){

  const groups = {};

  matches.forEach(match => {

    const key = getLeague(match);

    if(!groups[key]){
      groups[key] = [];
    }

    groups[key].push(match);

  });

  return groups;

}


/* ეკრანის დახატვა */

function render(){

  const content =
    document.getElementById("content");

  let list = allMatches;


  if(currentFilter !== "all"){

    list =
      allMatches.filter(
        match =>
          match.status === currentFilter
      );

  }


  if(!list.length){

    content.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚽
        </div>

        მატჩები ამ კატეგორიაში ჯერ არ არის.

      </div>

    `;

    return;

  }


  const groups =
    groupMatches(list);


  content.innerHTML =
    Object.entries(groups)
      .map(([league,matches]) => `

        <section class="league">

          <div class="league-title">

            <div class="league-name">
              🇬🇪 ${escapeHTML(league)}
            </div>

            <div class="arrow">
              ›
            </div>

          </div>

          ${matches
            .map(matchCard)
            .join("")}

        </section>

      `)
      .join("");

}


/* API */

async function loadMatches(){

  const connection =
    document.getElementById("connection");

  try{

    connection.textContent =
      "მონაცემების განახლება...";


    const response =
      await fetch(
        "/api/matches?t=" + Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){
      throw new Error(
        "API " + response.status
      );
    }


    const data =
      await response.json();


    /*
      მთავარი გასწორება:

      server.js აბრუნებს:
      {
        success:true,
        matches:[...]
      }

      ძველი index.html კი პირდაპირ
      მასივს ელოდებოდა.
    */

    if(Array.isArray(data)){

      allMatches = data;

    }else if(
      data &&
      Array.isArray(data.matches)
    ){

      allMatches = data.matches;

    }else{

      allMatches = [];

    }


    connection.textContent =
      `LIVE სისტემა • ${allMatches.length} მატჩი`;


    render();

  }catch(error){

    console.error(error);

    connection.textContent =
      "კავშირის პრობლემა";

    document.getElementById("content").innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        მონაცემების ჩატვირთვა ვერ მოხერხდა.

        <br><br>

        განაახლე გვერდი.

      </div>

    `;

  }

}


/* მატჩის გახსნა */

function openMatch(id){

  const match =
    allMatches.find(
      m => m.id === id
    );

  if(!match) return;


  const home = getHome(match);
  const away = getAway(match);

  const date = getDate(match);
  const kickoff = getKickoff(match);


  let score = "—";

  if(
    match.homeScore !== undefined &&
    match.awayScore !== undefined
  ){

    score =
      `${match.homeScore} : ${match.awayScore}`;

  }


  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <h2>
      ${escapeHTML(home)}
      —
      ${escapeHTML(away)}
    </h2>

    <br>

    <div class="big-match">

      <div class="big-team">

        ${teamLogo(
          home,
          match.homeLogo
        )}

        <br>

        ${escapeHTML(home)}

      </div>


      <div class="big-score">
        ${score}
      </div>


      <div class="big-team">

        ${teamLogo(
          away,
          match.awayLogo
        )}

        <br>

        ${escapeHTML(away)}

      </div>

    </div>

    <p>
      🏆 ${escapeHTML(getLeague(match))}
    </p>

    <br>

    <p>
      📅 ${formatDate(date)}
    </p>

    <br>

    <p>
      🕐 ${kickoff}
    </p>

  `;


  document
    .getElementById("modalBg")
    .classList.add("show");

}


function closeModal(){

  document
    .getElementById("modalBg")
    .classList.remove("show");

}


document
  .getElementById("modalBg")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){
        closeModal();
      }

    }
  );


/* ფილტრები */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll(".filter")
          .forEach(
            b => b.classList.remove("active")
          );

        this.classList.add("active");

        currentFilter =
          this.dataset.filter;

        render();

      }
    );

  });


/* ჩატვირთვა */

loadMatches();


/* განახლება ყოველ წუთში */

setInterval(
  loadMatches,
  60000
);

</script>

</body>
</html>
