<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>L LIVE — World Football</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f3f7f4;
      color: #17251c;
    }

    body {
      padding-bottom: 30px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: #079447;
      color: white;
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        18px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .12);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      font-size: 34px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.16);
      border-radius: 30px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #8dffb6;
      box-shadow: 0 0 8px rgba(141,255,182,.8);
    }

    .subtitle {
      margin-top: 9px;
      font-size: 15px;
      line-height: 1.4;
      opacity: .96;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px;
      background: white;
      border-bottom: 1px solid #e4e9e5;
      position: sticky;
      top: 99px;
      z-index: 40;
      scrollbar-width: none;
    }

    .nav::-webkit-scrollbar {
      display: none;
    }

    .nav-btn {
      flex: 0 0 auto;
      border: 0;
      background: #edf2ef;
      color: #405148;
      padding: 11px 16px;
      border-radius: 24px;
      font-weight: 800;
      font-size: 14px;
    }

    .nav-btn.active {
      background: #079447;
      color: white;
    }

    .count {
      margin-left: 3px;
      opacity: .8;
    }

    /* =========================
       MAIN
    ========================= */

    .container {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 16px 12px 30px;
    }

    .toolbar {
      display: flex;
      gap: 9px;
      margin-bottom: 14px;
    }

    .search {
      flex: 1;
      min-width: 0;
      border: 1px solid #dce5df;
      background: white;
      border-radius: 15px;
      padding: 13px 15px;
      outline: none;
      color: #17251c;
      box-shadow: 0 3px 10px rgba(0,0,0,.04);
    }

    .search:focus {
      border-color: #079447;
      box-shadow: 0 0 0 3px rgba(7,148,71,.1);
    }

    .refresh-btn {
      border: 0;
      background: #079447;
      color: white;
      border-radius: 15px;
      padding: 0 17px;
      font-size: 21px;
      font-weight: 900;
    }

    .refresh-btn.loading {
      opacity: .6;
    }

    .info-card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 5px 20px rgba(20,45,28,.06);
      border: 1px solid #e7eee9;
    }

    .info-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .info-text {
      color: #68776e;
      font-size: 13px;
      line-height: 1.4;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 40px 15px;
      color: #64746a;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 4px solid #dce7df;
      border-top-color: #079447;
      margin: 0 auto 12px;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      background: #fff1f1;
      border: 1px solid #ffd1d1;
      color: #9c2828;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      text-align: center;
      background: white;
      border-radius: 18px;
      padding: 40px 20px;
      color: #69776f;
      border: 1px solid #e7eee9;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 900;
      color: #33443a;
      margin-bottom: 5px;
    }

    /* =========================
       LIVE SECTION
    ========================= */

    .live-banner {
      background: #fff1f1;
      color: #d52a2a;
      border: 1px solid #ffd3d3;
      border-radius: 15px;
      padding: 11px 14px;
      margin-bottom: 12px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-pulse {
      width: 9px;
      height: 9px;
      background: #e22b2b;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(226,43,43,.6);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(226,43,43,.55);
      }

      70% {
        box-shadow: 0 0 0 9px rgba(226,43,43,0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(226,43,43,0);
      }
    }

    /* =========================
       LEAGUE
    ========================= */

    .league {
      margin-bottom: 14px;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #e3ebe5;
      box-shadow: 0 5px 20px rgba(20,45,28,.05);
    }

    .league-header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px 14px;
      background: #f8faf8;
      border-bottom: 1px solid #e9eee9;
    }

    .league-logo {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex: 0 0 38px;
    }

    .league-info {
      min-width: 0;
      flex: 1;
    }

    .league-name {
      font-size: 16px;
      font-weight: 900;
      line-height: 1.2;
    }

    .league-country {
      font-size: 12px;
      color: #78867d;
      margin-top: 3px;
    }

    /* =========================
       MATCH
    ========================= */

    .match {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 70px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 90px;
      padding: 15px 12px;
      border-bottom: 1px solid #edf1ee;
      transition: background .15s ease;
    }

    .match:last-child {
      border-bottom: 0;
    }

    .match:active {
      background: #f4f8f5;
    }

    .match-click {
      cursor: pointer;
    }

    /* =========================
       TEAM
    ========================= */

    .team {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .team.home {
      justify-content: flex-end;
      text-align: right;
    }

    .team.away {
      justify-content: flex-start;
      text-align: left;
    }

    .team-logo {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex: 0 0 38px;
    }

    /*
      IMPORTANT:
      Team names can now use multiple lines.
      They are NOT forced into one line.
    */

    .team-name {
      min-width: 0;
      max-width: 100%;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.22;
      overflow-wrap: anywhere;
      word-break: normal;
      white-space: normal;
    }

    .team.home .team-name {
      text-align: right;
    }

    .team.away .team-name {
      text-align: left;
    }

    /* =========================
       SCORE
    ========================= */

    .score-box {
      min-width: 70px;
      text-align: center;
    }

    .score {
      font-size: 19px;
      font-weight: 950;
      line-height: 1.1;
      white-space: nowrap;
    }

    .time {
      color: #69776f;
      font-size: 12px;
      font-weight: 800;
    }

    .live-time {
      color: #e12828;
    }

    .status {
      margin-top: 5px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      color: #7b8880;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #e12828;
    }

    .live-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e12828;
      box-shadow: 0 0 7px rgba(225,40,40,.55);
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: rgba(0,0,0,.58);
      padding: 15px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-card {
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #f5f8f6;
      border-radius: 24px 24px 12px 12px;
      padding-bottom: 20px;
    }

    .modal-top {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: white;
      border-bottom: 1px solid #e5ebe6;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 900;
    }

    .close {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      background: #edf1ee;
      font-size: 22px;
    }

    .analysis-hero {
      background: #079447;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    .analysis-league {
      opacity: .85;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .analysis-teams {
      display: grid;
      grid-template-columns: minmax(0,1fr) 70px minmax(0,1fr);
      align-items: center;
      gap: 10px;
    }

    .analysis-team {
      font-weight: 900;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .analysis-score {
      font-size: 25px;
      font-weight: 950;
    }

    .analysis-section {
      margin: 12px;
      background: white;
      border-radius: 17px;
      padding: 15px;
      border: 1px solid #e5ece7;
    }

    .analysis-section-title {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 13px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 100px 1fr;
      gap: 8px;
      align-items: center;
      margin: 9px 0;
    }

    .stat-value {
      font-weight: 850;
      font-size: 13px;
    }

    .stat-value.right {
      text-align: right;
    }

    .stat-name {
      text-align: center;
      color: #728078;
      font-size: 11px;
    }

    .analysis-loading {
      padding: 30px;
      text-align: center;
      color: #68766e;
    }

    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 430px) {

      .header {
        padding-left: 14px;
        padding-right: 14px;
      }

      .logo {
        font-size: 30px;
      }

      .status-pill {
        font-size: 12px;
        padding: 7px 10px;
      }

      .subtitle {
        font-size: 14px;
      }

      .container {
        padding-left: 9px;
        padding-right: 9px;
      }

      .match {
        grid-template-columns:
          minmax(0, 1fr)
          62px
          minmax(0, 1fr);

        min-height: 96px;
        padding-left: 9px;
        padding-right: 9px;
      }

      .team-logo {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
      }

      .team-name {
        font-size: 13px;
        line-height: 1.2;
      }

      .score-box {
        min-width: 62px;
      }

      .score {
        font-size: 18px;
      }

      .stat-row {
        grid-template-columns: 1fr 80px 1fr;
      }
    }

    @media (min-width: 700px) {

      .header {
        padding-left: calc((100% - 1080px) / 2);
        padding-right: calc((100% - 1080px) / 2);
      }

      .nav {
        padding-left: max(12px, calc((100% - 1080px) / 2));
        padding-right: max(12px, calc((100% - 1080px) / 2));
      }

      .container {
        padding-left: 0;
        padding-right: 0;
      }

      .modal.show {
        align-items: center;
      }

      .modal-card {
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div class="header-top">

      <div class="logo">
        L LIVE
      </div>

      <div class="status-pill">
        <span class="status-dot"></span>
        <span>World Football</span>
      </div>

    </div>

    <div class="subtitle">
      მსოფლიო ფეხბურთი • Live • Results • Match Analysis
    </div>

  </header>


  <!-- NAV -->

  <nav class="nav">

    <button class="nav-btn active" data-tab="live">
      🔴 Live
      <span class="count" id="liveCount"></span>
    </button>

    <button class="nav-btn" data-tab="today">
      📅 დღეს
      <span class="count" id="todayCount"></span>
    </button>

    <button class="nav-btn" data-tab="upcoming">
      ⏭ მომავალი
    </button>

    <button class="nav-btn" data-tab="finished">
      ✅ დასრულებული
    </button>

  </nav>


  <!-- MAIN -->

  <main class="container">

    <div class="toolbar">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="მოძებნე გუნდი ან ჩემპიონატი..."
      >

      <button
        id="refreshBtn"
        class="refresh-btn"
        title="განახლება"
      >
        ↻
      </button>

    </div>


    <div class="info-card">

      <div
        class="info-title"
        id="pageTitle"
      >
        🔴 Live მატჩები
      </div>

      <div
        class="info-text"
        id="pageDescription"
      >
        მიმდინარე საფეხბურთო მატჩები მსოფლიოს მასშტაბით.
      </div>

    </div>


    <div id="errorBox"></div>

    <div id="content">

      <div class="loading">

        <div class="spinner"></div>

        მონაცემები იტვირთება...

      </div>

    </div>

  </main>


  <!-- MATCH ANALYSIS MODAL -->

  <div
    id="modal"
    class="modal"
  >

    <div class="modal-card">

      <div class="modal-top">

        <div class="modal-title">
          Match Analysis
        </div>

        <button
          id="closeModal"
          class="close"
        >
          ×
        </button>

      </div>

      <div id="modalContent">

        <div class="analysis-loading">
          სტატისტიკა იტვირთება...
        </div>

      </div>

    </div>

  </div>


  <script>

    /*
    =========================================================
    L LIVE — WORLD FOOTBALL
    =========================================================

    DATA:
      /api/world-live
      /api/world-fixtures
      /api/world-analysis/:id

    API KEY:
      დარჩება მხოლოდ Vercel Environment Variables-ში.

    =========================================================
    */


    const state = {

      tab: "live",

      live: [],

      today: [],

      upcoming: [],

      finished: [],

      search: "",

      loading: false

    };


    const content =
      document.getElementById("content");

    const errorBox =
      document.getElementById("errorBox");

    const searchInput =
      document.getElementById("search");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const modal =
      document.getElementById("modal");

    const modalContent =
      document.getElementById("modalContent");

    const pageTitle =
      document.getElementById("pageTitle");

    const pageDescription =
      document.getElementById("pageDescription");

    const liveCount =
      document.getElementById("liveCount");

    const todayCount =
      document.getElementById("todayCount");


    /* =========================
       SAFE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================
       IMAGE
    ========================= */

    function imageUrl(url) {

      if (!url) {
        return "";
      }

      return String(url);

    }


    /* =========================
       DATE
    ========================= */

    function formatTime(dateString) {

      if (!dateString) {
        return "—";
      }

      const date =
        new Date(dateString);

      if (Number.isNaN(date.getTime())) {
        return "—";
      }

      return new Intl.DateTimeFormat(
        "ka-GE",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(date);

    }


    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }

      const date =
        new Date(dateString);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "ka-GE",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      ).format(date);

    }


    /* =========================
       STATUS
    ========================= */

    function isLive(match) {

      const status =
        String(
          match?.status?.short || ""
        ).toUpperCase();

      return [
        "1H",
        "2H",
        "HT",
        "ET",
        "BT",
        "P",
        "LIVE"
      ].includes(status);

    }


    function isFinished(match) {

      const status =
        String(
          match?.status?.short || ""
        ).toUpperCase();

      return [
        "FT",
        "AET",
        "PEN"
      ].includes(status);

    }


    function statusText(match) {

      const status =
        String(
          match?.status?.short || ""
        ).toUpperCase();


      if (isLive(match)) {

        if (status === "HT") {
          return "ტაიმი";
        }

        if (
          typeof match?.status?.elapsed ===
          "number"
        ) {

          return (
            match.status.elapsed + "'"
          );

        }

        return "LIVE";

      }


      if (isFinished(match)) {
        return "დასრულდა";
      }


      return formatTime(match?.date);

    }


    /* =========================
       MATCH NORMALIZATION
    ========================= */

    function normalizeMatches(data) {

      if (!data) {
        return [];
      }

      if (Array.isArray(data)) {
        return data;
      }

      if (Array.isArray(data.matches)) {
        return data.matches;
      }

      if (Array.isArray(data.response)) {
        return data.response;
      }

      return [];

    }


    /* =========================
       LEAGUE KEY
    ========================= */

    function leagueKey(match) {

      return [
        match?.league?.id,
        match?.league?.name,
        match?.league?.country
      ].join("|");

    }


    /* =========================
       API
    ========================= */

    async function apiGet(url) {

      const response =
        await fetch(
          url,
          {
            method: "GET",
            headers: {
              "Accept":
                "application/json"
            },
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }


      return response.json();

    }


    async function loadLive() {

      const data =
        await apiGet(
          "/api/world-live"
        );

      return normalizeMatches(data);

    }


    async function loadToday() {

      const data =
        await apiGet(
          "/api/world-fixtures"
        );

      return normalizeMatches(data);

    }


    async function loadAll() {

      state.loading = true;

      errorBox.innerHTML = "";

      refreshBtn.classList.add(
        "loading"
      );

      refreshBtn.textContent = "…";


      try {

        const [
          liveData,
          todayData
        ] =
          await Promise.all([
            loadLive(),
            loadToday()
          ]);


        state.live =
          liveData;

        state.today =
          todayData;


        state.finished =
          state.today.filter(
            isFinished
          );


        state.upcoming =
          state.today.filter(
            match =>
              !isLive(match) &&
              !isFinished(match)
          );


        liveCount.textContent =
          state.live.length
            ? `(${state.live.length})`
            : "";


        todayCount.textContent =
          state.today.length
            ? `(${state.today.length})`
            : "";


        render();

      }

      catch (error) {

        console.error(error);

        errorBox.innerHTML = `

          <div class="error">

            <strong>
              მონაცემების ჩატვირთვის შეცდომა
            </strong>

            <br><br>

            სერვერთან დაკავშირება ვერ მოხერხდა.

            <br><br>

            <small>
              ${escapeHtml(error.message)}
            </small>

          </div>

        `;

      }

      finally {

        state.loading = false;

        refreshBtn.classList.remove(
          "loading"
        );

        refreshBtn.textContent = "↻";

      }

    }


    /* =========================
       SEARCH
    ========================= */

    function filterMatches(matches) {

      const query =
        state.search
          .trim()
          .toLowerCase();


      if (!query) {
        return matches;
      }


      return matches.filter(match => {

        const text = [

          match?.league?.name,

          match?.league?.country,

          match?.teams?.home?.name,

          match?.teams?.away?.name

        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return text.includes(query);

      });

    }


    /* =========================
       RENDER
    ========================= */

    function render() {

      let matches = [];


      if (state.tab === "live") {

        matches =
          state.live;

        pageTitle.textContent =
          "🔴 Live მატჩები";

        pageDescription.textContent =
          "მიმდინარე საფეხბურთო მატჩები მსოფლიოს მასშტაბით.";

      }


      if (state.tab === "today") {

        matches =
          state.today;

        pageTitle.textContent =
          "📅 დღევანდელი მატჩები";

        pageDescription.textContent =
          "დღეს ჩატარებული, მიმდინარე და დაგეგმილი მატჩები.";

      }


      if (state.tab === "upcoming") {

        matches =
          state.upcoming;

        pageTitle.textContent =
          "⏭ მომავალი მატჩები";

        pageDescription.textContent =
          "დღეს დარჩენილი და დაგეგმილი მატჩები.";

      }


      if (state.tab === "finished") {

        matches =
          state.finished;

        pageTitle.textContent =
          "✅ დასრულებული მატჩები";

        pageDescription.textContent =
          "დღეს დასრულებული საფეხბურთო მატჩები.";

      }


      matches =
        filterMatches(matches);


      renderMatches(matches);

    }


    /* =========================
       MATCH LIST
    ========================= */

    function renderMatches(matches) {

      if (!matches.length) {

        if (state.tab === "live") {

          content.innerHTML = `

            <div class="empty">

              <div class="empty-icon">
                🔴
              </div>

              <div class="empty-title">
                ამ მომენტში Live მატჩი არ არის
              </div>

              <div>
                როგორც კი მიმდინარე მატჩი გამოჩნდება,
                L LIVE ავტომატურად განაახლებს ინფორმაციას.
              </div>

            </div>

          `;

        }

        else {

          content.innerHTML = `

            <div class="empty">

              <div class="empty-icon">
                ⚽
              </div>

              <div class="empty-title">
                მატჩები ვერ მოიძებნა
              </div>

              <div>
                ამ კატეგორიაში ამ მომენტისთვის მონაცემები არ არის.
              </div>

            </div>

          `;

        }

        return;

      }


      const groups =
        new Map();


      matches.forEach(match => {

        const key =
          leagueKey(match);


        if (!groups.has(key)) {

          groups.set(
            key,
            []
          );

        }


        groups
          .get(key)
          .push(match);

      });


      let html = "";


      if (
        state.tab === "live" &&
        state.live.length
      ) {

        html += `

          <div class="live-banner">

            <span class="live-pulse"></span>

            LIVE — მიმდინარე მატჩები

          </div>

        `;

      }


      for (
        const [
          ,
          leagueMatches
        ] of groups
      ) {

        html += renderLeague(
          leagueMatches[0]?.league,
          leagueMatches
        );

      }


      content.innerHTML =
        html;


      document
        .querySelectorAll(
          ".match-click"
        )
        .forEach(element => {

          element.addEventListener(
            "click",
            () => {

              const id =
                element.dataset.id;


              if (id) {

                openAnalysis(id);

              }

            }
          );

        });

    }


    /* =========================
       LEAGUE
    ========================= */

    function renderLeague(
      league,
      matches
    ) {

      const logo =
        imageUrl(
          league?.logo
        );


      const logoHtml =
        logo

          ? `

            <img
              class="league-logo"
              src="${escapeHtml(logo)}"
              alt=""
              loading="lazy"
              onerror="
                this.style.display='none'
              "
            >

          `

          : `

            <div class="league-logo">
              ⚽
            </div>

          `;


      return `

        <section class="league">

          <div class="league-header">

            ${logoHtml}

            <div class="league-info">

              <div class="league-name">
                ${escapeHtml(
                  league?.name ||
                  "Football"
                )}
              </div>

              <div class="league-country">
                ${escapeHtml(
                  league?.country ||
                  ""
                )}
              </div>

            </div>

          </div>

          ${matches
            .map(renderMatch)
            .join("")}

        </section>

      `;

    }


    /* =========================
       MATCH
    ========================= */

    function renderMatch(match) {

      const home =
        match?.teams?.home ||
        {};

      const away =
        match?.teams?.away ||
        {};


      const homeLogo =
        imageUrl(
          home.logo
        );

      const awayLogo =
        imageUrl(
          away.logo
        );


      const homeLogoHtml =
        homeLogo

          ? `

            <img
              class="team-logo"
              src="${escapeHtml(homeLogo)}"
              alt="${escapeHtml(home.name || "")}"
              loading="lazy"
              onerror="
                this.style.display='none'
              "
            >

          `

          : "";


      const awayLogoHtml =
        awayLogo

          ? `

            <img
              class="team-logo"
              src="${escapeHtml(awayLogo)}"
              alt="${escapeHtml(away.name || "")}"
              loading="lazy"
              onerror="
                this.style.display='none'
              "
            >

          `

          : "";


      const live =
        isLive(match);


      const status =
        statusText(match);


      const scoreHome =
        match?.score?.home;

      const scoreAway =
        match?.score?.away;


      let score = "vs";


      if (
        typeof scoreHome === "number" ||
        typeof scoreAway === "number"
      ) {

        score =
          `${scoreHome ?? 0} - ${scoreAway ?? 0}`;

      }


      const statusHtml =
        live

          ? `

            <div class="status live-badge">
              ${escapeHtml(status)}
            </div>

          `

          : `

            <div class="status">
              ${escapeHtml(status)}
            </div>

          `;


      /*
        IMPORTANT:
        We use the API's team.name directly.
        Nothing is shortened here.
      */


      const homeName =
        home.name ||
        "Home";

      const awayName =
        away.name ||
        "Away";


      return `

        <div
          class="match match-click"
          data-id="${escapeHtml(
            match?.id || ""
          )}"
        >

          <div class="team home">

            <div class="team-name">
              ${escapeHtml(homeName)}
            </div>

            ${homeLogoHtml}

          </div>


          <div class="score-box">

            <div class="score">
              ${escapeHtml(score)}
            </div>

            ${statusHtml}

          </div>


          <div class="team away">

            ${awayLogoHtml}

            <div class="team-name">
              ${escapeHtml(awayName)}
            </div>

          </div>

        </div>

      `;

    }


    /* =========================
       MATCH ANALYSIS
    ========================= */

    async function openAnalysis(id) {

      modal.classList.add(
        "show"
      );


      modalContent.innerHTML = `

        <div class="analysis-loading">

          <div class="spinner"></div>

          მატჩის სტატისტიკა იტვირთება...

        </div>

      `;


      try {

        const data =
          await apiGet(
            `/api/world-analysis/${encodeURIComponent(id)}`
          );


        renderAnalysis(data);

      }

      catch (error) {

        console.error(error);

        modalContent.innerHTML = `

          <div class="analysis-loading">

            <strong>
              სტატისტიკის ჩატვირთვა ვერ მოხერხდა.
            </strong>

            <br><br>

            <small>
              ${escapeHtml(
                error.message
              )}
            </small>

          </div>

        `;

      }

    }


    /* =========================
       ANALYSIS
    ========================= */

    function renderAnalysis(data) {

      const fixture =
        data?.fixture ||
        data?.match ||
        data?.response?.[0]?.fixture ||
        {};


      const teams =
        data?.teams ||
        data?.response?.[0]?.teams ||
        {};


      const league =
        data?.league ||
        data?.response?.[0]?.league ||
        {};


      const goals =
        data?.goals ||
        data?.response?.[0]?.goals ||
        {};


      const statistics =
        data?.statistics ||
        data?.response?.[0]?.statistics ||
        [];


      const home =
        teams?.home ||
        {};


      const away =
        teams?.away ||
        {};


      const homeName =
        home?.name ||
        "Home";


      const awayName =
        away?.name ||
        "Away";


      const scoreHome =
        goals?.home ??
        data?.score?.home ??
        "-";


      const scoreAway =
        goals?.away ??
        data?.score?.away ??
        "-";


      let statsHtml = "";


      if (
        Array.isArray(
          statistics
        )
      ) {

        let homeStats =
          null;

        let awayStats =
          null;


        if (
          statistics.length >= 2
        ) {

          homeStats =
            statistics[0];

          awayStats =
            statistics[1];

        }


        const statMap =
          new Map();


        if (
          homeStats?.statistics
        ) {

          homeStats.statistics
            .forEach(item => {

              statMap.set(
                item.type,
                {
                  home: item.value,
                  away: null
                }
              );

            });

        }


        if (
          awayStats?.statistics
        ) {

          awayStats.statistics
            .forEach(item => {

              const current =
                statMap.get(
                  item.type
                );


              if (current) {

                current.away =
                  item.value;

              }

            });

        }


        for (
          const [
            name,
            values
          ] of statMap
        ) {

          statsHtml += `

            <div class="stat-row">

              <div class="stat-value">
                ${escapeHtml(
                  values.home ?? "—"
                )}
              </div>

              <div class="stat-name">
                ${escapeHtml(name)}
              </div>

              <div class="stat-value right">
                ${escapeHtml(
                  values.away ?? "—"
                )}
              </div>

            </div>

          `;

        }

      }


      if (!statsHtml) {

        statsHtml = `

          <div
            style="
              text-align:center;
              color:#718078;
              padding:15px
            "
          >
            ამ მატჩისთვის დამატებითი
            სტატისტიკა ჯერ არ არის.
          </div>

        `;

      }


      modalContent.innerHTML = `

        <div class="analysis-hero">

          <div class="analysis-league">

            ${escapeHtml(
              league?.name ||
              "Football"
            )}

            ${
              league?.country
                ? " • " +
                  escapeHtml(
                    league.country
                  )
                : ""
            }

          </div>


          <div class="analysis-teams">

            <div class="analysis-team">
              ${escapeHtml(
                homeName
              )}
            </div>


            <div class="analysis-score">

              ${escapeHtml(
                scoreHome
              )}

              -

              ${escapeHtml(
                scoreAway
              )}

            </div>


            <div class="analysis-team">
              ${escapeHtml(
                awayName
              )}
            </div>

          </div>


          <div
            style="
              margin-top:12px;
              font-size:12px;
              opacity:.85
            "
          >

            ${escapeHtml(
              formatDate(
                fixture?.date
              )
            )}

            ${
              fixture?.date
                ? " • " +
                  escapeHtml(
                    formatTime(
                      fixture.date
                    )
                  )
                : ""
            }

          </div>

        </div>


        <div class="analysis-section">

          <div class="analysis-section-title">
            📊 მატჩის სტატისტიკა
          </div>

          ${statsHtml}

        </div>

      `;

    }


    /* =========================
       NAV EVENTS
    ========================= */

    document
      .querySelectorAll(
        ".nav-btn"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".nav-btn"
              )
              .forEach(btn => {

                btn.classList.remove(
                  "active"
                );

              });


            button.classList.add(
              "active"
            );


            state.tab =
              button.dataset.tab;


            render();

          }
        );

      });


    /* =========================
       SEARCH
    ========================= */

    searchInput.addEventListener(
      "input",
      event => {

        state.search =
          event.target.value;

        render();

      }
    );


    /* =========================
       REFRESH
    ========================= */

    refreshBtn.addEventListener(
      "click",
      () => {

        loadAll();

      }
    );


    /* =========================
       CLOSE MODAL
    ========================= */

    document
      .getElementById(
        "closeModal"
      )
      .addEventListener(
        "click",
        () => {

          modal.classList.remove(
            "show"
          );

        }
      );


    modal.addEventListener(
      "click",
      event => {

        if (
          event.target === modal
        ) {

          modal.classList.remove(
            "show"
          );

        }

      }
    );


    /* =========================
       AUTO REFRESH
    ========================= */

    setInterval(
      () => {

        loadAll();

      },
      30000
    );


    /* =========================
       START
    ========================= */

    loadAll();

  </script>

</body>
</html>
