<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L LIVE — საქართველო</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#061217;
  color:#f5f7f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button{
  font:inherit;
  color:inherit
}

.app{
  max-width:900px;
  margin:auto;
  min-height:100vh;
  padding-bottom:100px
}

header{
  padding:28px 18px 18px;
  position:sticky;
  top:0;
  background:#061217ee;
  backdrop-filter:blur(12px);
  z-index:5
}

.brand{
  font-size:44px;
  font-weight:900;
  letter-spacing:-2px
}

.brand b{
  color:#68e879
}

.sub{
  color:#aeb9bd;
  font-size:18px;
  margin-top:2px
}

.search{
  margin-top:20px;
  background:#10242a;
  border:1px solid #244149;
  border-radius:24px;
  padding:15px 18px;
  color:#aeb9bd;
  cursor:pointer
}

.dates{
  display:flex;
  overflow:auto;
  border-top:1px solid #183038;
  border-bottom:1px solid #183038
}

.date{
  min-width:92px;
  padding:15px 8px;
  text-align:center;
  background:none;
  border:0;
  cursor:pointer
}

.date.active{
  color:#68e879;
  border-bottom:4px solid #68e879;
  font-weight:800
}

.filters,
.sports{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:14px 16px
}

.pill{
  white-space:nowrap;
  border:1px solid #25424a;
  background:#10242a;
  border-radius:24px;
  padding:12px 18px;
  cursor:pointer
}

.pill.active{
  background:#68e879;
  color:#061217;
  border-color:#68e879;
  font-weight:800
}

.section{
  margin-top:4px
}

.section-title{
  padding:13px 18px;
  background:#102b31;
  color:#ffd84a;
  font-weight:800;
  font-size:19px
}

.match{
  padding:18px;
  border-bottom:1px solid #183038;
  cursor:pointer
}

.match:active{
  background:#10242a
}

.league{
  color:#aeb9bd;
  font-size:14px;
  margin-bottom:12px
}

.teams{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px
}

.team{
  font-size:19px;
  font-weight:750;
  line-height:1.35
}

.score{
  text-align:right;
  font-size:25px;
  font-weight:900
}

.live{
  color:#ff5268;
  font-weight:900
}

.time{
  color:#fff;
  font-weight:800
}

.empty{
  padding:40px 20px;
  text-align:center;
  color:#91a0a5
}

nav{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(94%,720px);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#18262bcc;
  border:1px solid #52656b;
  border-radius:35px;
  padding:8px;
  backdrop-filter:blur(16px);
  z-index:10
}

nav button{
  background:none;
  border:0;
  padding:10px 4px;
  font-size:13px;
  font-weight:700;
  cursor:pointer
}

nav button.active{
  color:#68e879
}

.modal{
  position:fixed;
  inset:0;
  background:#061217ee;
  z-index:20;
  display:none;
  padding:20px
}

.modal.show{
  display:block
}

.modal-card{
  max-width:700px;
  margin:70px auto;
  background:#10242a;
  border:1px solid #31515a;
  border-radius:24px;
  padding:24px
}

.close{
  float:right;
  background:#263e45;
  border:0;
  border-radius:50%;
  width:42px;
  height:42px;
  cursor:pointer
}

h2{
  margin-top:12px
}

.event{
  padding:12px;
  border-bottom:1px solid #29444b
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="brand">
<b>L</b> LIVE
</div>

<div class="sub">
საქართველოს სპორტი ერთ სივრცეში
</div>

<div class="search" id="searchBtn">
🔎 &nbsp; გუნდი, სპორტსმენი, ჩემპიონატი
</div>

</header>


<div class="dates" id="dates">

<button class="date">
გუშინ<br>18.09
</button>

<button class="date active">
დღეს<br>19.09
</button>

<button class="date">
ხვალ<br>20.09
</button>

<button class="date">
ორშ<br>21.09
</button>

<button class="date">
სამ<br>22.09
</button>

</div>


<div class="filters">

<button class="pill active" data-filter="all">
ყველა
</button>

<button class="pill" data-filter="live">
🔴 LIVE
</button>

<button class="pill" data-filter="finished">
მომავალი/დასრულებული
</button>

</div>


<div class="sports">

<button class="pill active" data-sport="all">
ყველა სპორტი
</button>

<button class="pill" data-sport="football">
⚽ ფეხბურთი
</button>

<button class="pill" data-sport="basketball">
🏀 კალათბურთი
</button>

<button class="pill" data-sport="rugby">
🏉 რაგბი
</button>

</div>


<main id="matches"></main>

</div>


<nav>

<button class="active" data-nav="home">
🏠<br>მთავარი
</button>

<button data-nav="live">
🔴<br>LIVE
</button>

<button data-nav="favorites">
⭐<br>ფავორიტები
</button>

<button data-nav="sports">
🏆<br>სპორტები
</button>

</nav>


<div class="modal" id="modal">

<div class="modal-card">

<button class="close" id="close">
×
</button>

<div id="modalBody"></div>

</div>

</div>


<script>

const matches = [

{
id:1,
sport:"football",
league:"🇬🇪 ეროვნული ლიგა",
home:"დინამო თბილისი",
away:"ტორპედო ქუთაისი",
status:"live",
hs:1,
as:0,
minute:"32'",
events:["⚽ გოლი — 32'"]
},

{
id:2,
sport:"football",
league:"⚽ GAFA • თბილისის ჩემპიონატი",
home:"ქომაგები",
away:"სეუ",
status:"upcoming",
time:"20:00"
},

{
id:3,
sport:"football",
league:"⚽ Betlive Master League",
home:"გუნდი A",
away:"გუნდი B",
status:"upcoming",
time:"21:00"
},

{
id:4,
sport:"basketball",
league:"🏀 საქართველოს ეროვნული ჩემპიონატი",
home:"გუნდი A",
away:"გუნდი B",
status:"live",
hs:31,
as:28,
minute:"Q2 • 04:21"
},

{
id:5,
sport:"rugby",
league:"🏉 დიდი 10",
home:"გუნდი A",
away:"გუნდი B",
status:"upcoming",
time:"18:00"
}

];


let filter = "all";
let sport = "all";
let currentNav = "home";


function render(){

let list = matches.filter(m => {

const a =
filter === "all" ||
m.status === filter;

const b =
sport === "all" ||
m.sport === sport;

const c =
currentNav === "live"
? m.status === "live"
: true;

return a && b && c;

});


const el = document.getElementById("matches");


if(!list.length){

el.innerHTML =
'<div class="empty">ამ ფილტრში მატჩები ჯერ არ არის.</div>';

return;

}


const groups = {};


list.forEach(m => {

if(!groups[m.league]){
groups[m.league] = [];
}

groups[m.league].push(m);

});


el.innerHTML = Object.entries(groups)
.map(([league,ms]) => `

<section class="section">

<div class="section-title">
${league}
</div>

${ms.map(m => `

<div class="match" data-id="${m.id}">

<div class="league">
${
m.sport==="football"
? "ფეხბურთი"
: m.sport==="basketball"
? "კალათბურთი"
: "რაგბი"
}
</div>

<div class="teams">

<div>

<div class="team">
${m.home}
</div>

<div class="team">
${m.away}
</div>

</div>


<div class="score">

${
m.status==="live"

? `

<div class="live">
${m.minute}
</div>

<div>
${m.hs ?? 0}
</div>

<div>
${m.as ?? 0}
</div>

`

:

`

<div class="time">
${m.time}
</div>

<div>–</div>

<div>–</div>

`

}

</div>

</div>

</div>

`).join("")}

</section>

`).join("");


document.querySelectorAll(".match")
.forEach(x => {

x.onclick = () =>
openMatch(+x.dataset.id);

});

}


document.querySelectorAll("[data-filter]")
.forEach(b => {

b.onclick = () => {

filter = b.dataset.filter;

document
.querySelectorAll("[data-filter]")
.forEach(x =>
x.classList.remove("active")
);

b.classList.add("active");

render();

};

});


document.querySelectorAll("[data-sport]")
.forEach(b => {

b.onclick = () => {

sport = b.dataset.sport;

document
.querySelectorAll("[data-sport]")
.forEach(x =>
x.classList.remove("active")
);

b.classList.add("active");

render();

};

});


document.querySelectorAll("[data-nav]")
.forEach(b => {

b.onclick = () => {

currentNav = b.dataset.nav;

document
.querySelectorAll("[data-nav]")
.forEach(x =>
x.classList.remove("active")
);

b.classList.add("active");


if(currentNav === "sports"){

sport = "all";

document
.querySelectorAll("[data-sport]")
.forEach(x =>
x.classList.toggle(
"active",
x.dataset.sport === "all"
));

}


if(currentNav !== "live"){
filter = "all";
}


render();

};

});


document.querySelectorAll(".date")
.forEach(b => {

b.onclick = () => {

document
.querySelectorAll(".date")
.forEach(x =>
x.classList.remove("active")
);

b.classList.add("active");

};

});


function openMatch(id){

const m =
matches.find(x => x.id === id);


document.getElementById("modalBody")
.innerHTML = `

<div class="sub">
${m.league}
</div>

<h2>
${m.home}
${m.hs ?? "–"}
:
${m.as ?? "–"}
${m.away}
</h2>

<p>

${
m.status === "live"

? `🔴 LIVE • ${m.minute}`

: `🕒 ${m.time}`

}

</p>

<div class="event">

${
m.events?.join("<br>")
||
"მატჩის მოვლენები ჯერ არ დამატებულა."
}

</div>

`;


document
.getElementById("modal")
.classList.add("show");

}


document
.getElementById("close")
.onclick = () => {

document
.getElementById("modal")
.classList.remove("show");

};


document
.getElementById("modal")
.onclick = e => {

if(e.target.id === "modal"){

e.currentTarget
.classList.remove("show");

}

};


document
.getElementById("searchBtn")
.onclick = () => {

alert(
"ძებნა მალე დაემატება — ამ ეტაპზე ფილტრებით შეგიძლია მოძებნო სპორტი და LIVE მატჩები."
);

};


render();

</script>

</body>
</html>
