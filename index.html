<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>L-LIVE 🇬🇪</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #17202a;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      color: #aeb8c7;
      font-size: 14px;
    }

    .sports {
      display: flex;
      gap: 8px;
      max-width: 1000px;
      margin: 12px auto 0;
      overflow-x: auto;
    }

    .sport-btn {
      border: 0;
      padding: 10px 16px;
      border-radius: 10px;
      background: #263244;
      color: white;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .sport-btn.active {
      background: #16a34a;
    }

    main {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 12px 80px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 18px;
    }

    .tab {
      border: 0;
      padding: 12px 5px;
      border-radius: 10px;
      background: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    .tab.active {
      background: #16a34a;
      color: white;
    }

    .status {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 15px;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    .status-title {
      font-size: 17px;
      font-weight: 800;
    }

    .updated {
      color: #6b7280;
      font-size: 12px;
      margin-top: 4px;
    }

    .competition {
      margin-top: 16px;
    }

    .competition-title {
      background: #e5e7eb;
      padding: 10px 12px;
      border-radius: 9px 9px 0 0;
      font-weight: 800;
    }

    .match {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 12px;
      display: grid;
      grid-template-columns: 70px 1fr 70px;
      align-items: center;
      gap: 10px;
    }

    .match:last-child {
      border-radius: 0 0 9px 9px;
    }

    .match-time {
      font-size: 12px;
      color: #6b7280;
    }

    .teams {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-weight: 700;
    }

    .score {
      text-align: right;
      font-size: 18px;
      font-weight: 800;
    }

    .live {
      color: #dc2626;
    }

    .empty {
      background: white;
      padding: 30px 15px;
      border-radius: 12px;
      text-align: center;
      color: #6b7280;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 14px;
      border-radius: 10px;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 24px;
      }

      .tabs {
        grid-template-columns: repeat(2, 1fr);
      }

      .match {
        grid-template-columns: 55px 1fr 55px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">L-LIVE 🇬🇪</div>
    <div class="subtitle">
      საქართველოს სპორტის LIVE შედეგები
    </div>

    <div class="sports">
      <button class="sport-btn active" data-sport="football">
        ⚽ ფეხბურთი
      </button>

      <button class="sport-btn" data-sport="basketball">
        🏀 კალათბურთი
      </button>

      <button class="sport-btn" data-sport="rugby">
        🏉 რაგბი
      </button>
    </div>
  </div>
</header>


<main>

  <div class="tabs">

    <button class="tab active" data-tab="live">
      🔴 LIVE
    </button>

    <button class="tab" data-tab="today">
      დღეს
    </button>

    <button class="tab" data-tab="upcoming">
      მომავალი
    </button>

    <button class="tab" data-tab="results">
      დასრულებული
    </button>

  </div>


  <div class="status">

    <div class="status-title" id="pageTitle">
      LIVE მატჩები
    </div>

    <div class="updated" id="updated">
      მონაცემები იტვირთება...
    </div>

  </div>


  <div id="content">
    <div class="loading">
      იტვირთება...
    </div>
  </div>

</main>


<script>

let currentSport = "football";
let currentTab = "live";


// ============================================================
// API
// ============================================================

async function api(url) {

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("API error");
  }

  return await response.json();
}


// ============================================================
// სათაური
// ============================================================

function updateTitle() {

  const sportNames = {
    football: "⚽ ფეხბურთი",
    basketball: "🏀 კალათბურთი",
    rugby: "🏉 რაგბი"
  };

  const tabNames = {
    live: "LIVE მატჩები",
    today: "დღევანდელი მატჩები",
    upcoming: "მომავალი მატჩები",
    results: "დასრულებული მატჩები"
  };

  document.getElementById("pageTitle").textContent =
    `${sportNames[currentSport]} — ${tabNames[currentTab]}`;
}


// ============================================================
// ფეხბურთის მატჩების დახატვა
// ============================================================

function renderFootball(matches) {

  if (!matches || matches.length === 0) {

    document.getElementById("content").innerHTML = `
      <div class="empty">
        ამ კატეგორიაში მატჩები ჯერ არ არის.
      </div>
    `;

    return;
  }

  let html = "";

  matches.forEach(match => {

    const home = match.homeTeam || "მასპინძელი";
    const away = match.awayTeam || "სტუმარი";

    const homeScore =
      match.homeScore !== undefined ? match.homeScore : "-";

    const awayScore =
      match.awayScore !== undefined ? match.awayScore : "-";

    const status =
      match.status === "live"
        ? `<span class="live">LIVE</span>`
        : "მატჩი";

    html += `
      <div class="competition">

        <div class="competition-title">
          ${status}
        </div>

        <div class="match">

          <div class="match-time">
            ${match.date || ""}
          </div>

          <div class="teams">
            <div>${home}</div>
            <div>${away}</div>
          </div>

          <div class="score">
            <div>${homeScore}</div>
            <div>${awayScore}</div>
          </div>

        </div>

      </div>
    `;
  });

  document.getElementById("content").innerHTML = html;
}


// ============================================================
// კალათბურთი / რაგბი
// ============================================================

function renderRawCompetitions(data) {

  if (!data || data.length === 0) {

    document.getElementById("content").innerHTML = `
      <div class="empty">
        ამ სპორტისთვის ამ მომენტში საჯარო მონაცემები ვერ მოიძებნა.
      </div>
    `;

    return;
  }

  let html = "";

  data.forEach(item => {

    html += `
      <div class="competition">

        <div class="competition-title">
          ${item.competition || "ჩემპიონატი"}
        </div>

        <div class="match">

          <div class="match-time">
            🇬🇪
          </div>

          <div class="teams">
            <div>მონაცემები მიღებულია წყაროდან</div>
            <div style="font-size:12px;color:#6b7280">
              ${item.source || ""}
            </div>
          </div>

          <div class="score">
            →
          </div>

        </div>

      </div>
    `;

  });

  document.getElementById("content").innerHTML = html;
}


// ============================================================
// მონაცემების ჩატვირთვა
// ============================================================

async function loadData() {

  updateTitle();

  document.getElementById("content").innerHTML = `
    <div class="loading">
      მონაცემები იტვირთება...
    </div>
  `;

  try {

    let data;

    // --------------------------------------------------------
    // ფეხბურთი
    // --------------------------------------------------------

    if (currentSport === "football") {

      if (currentTab === "live") {

        data = await api("/api/live");

        renderFootball(data.live);

      }

      else if (currentTab === "today") {

        data = await api("/api/matches/today");

        renderFootball(data.matches);

      }

      else if (currentTab === "upcoming") {

        data = await api("/api/matches/upcoming");

        renderFootball(data.matches);

      }

      else if (currentTab === "results") {

        data = await api("/api/matches/results");

        renderFootball(data.matches);

      }

    }

    // --------------------------------------------------------
    // კალათბურთი
    // --------------------------------------------------------

    else if (currentSport === "basketball") {

      data = await api("/api/basketball");

      renderRawCompetitions(data.competitions);

    }

    // --------------------------------------------------------
    // რაგბი
    // --------------------------------------------------------

    else if (currentSport === "rugby") {

      data = await api("/api/rugby");

      renderRawCompetitions(data.competitions);

    }

    document.getElementById("updated").textContent =
      "განახლდა: " +
      new Date().toLocaleTimeString("ka-GE");

  }

  catch (error) {

    console.error(error);

    document.getElementById("content").innerHTML = `
      <div class="error">
        მონაცემების ჩატვირთვა ვერ მოხერხდა.
        <br><br>
        სერვერი ან მონაცემთა წყარო ამ მომენტში მიუწვდომელია.
      </div>
    `;

    document.getElementById("updated").textContent =
      "განახლება ვერ მოხერხდა";

  }

}


// ============================================================
// სპორტის ღილაკები
// ============================================================

document.querySelectorAll(".sport-btn").forEach(button => {

  button.addEventListener("click", () => {

    document
      .querySelectorAll(".sport-btn")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    currentSport = button.dataset.sport;

    loadData();

  });

});


// ============================================================
// TAB ღილაკები
// ============================================================

document.querySelectorAll(".tab").forEach(button => {

  button.addEventListener("click", () => {

    document
      .querySelectorAll(".tab")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    currentTab = button.dataset.tab;

    loadData();

  });

});


// ============================================================
// პირველი ჩატვირთვა
// ============================================================

loadData();


// ============================================================
// ავტომატური განახლება
// ყოველ 60 წამში
// ============================================================

setInterval(() => {

  loadData();

}, 60000);

</script>

</body>
</html>
